<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Exhaust — Welding Exhaust</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4f5f7">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
/* =========================================================================
   DASHBOARD EXHAUST - TAHUNAN (Smart Narrative Redesign)
   Semua rule di bawah ini di-namespace di bawah ".dxy" supaya TIDAK PERNAH
   menyentuh style tab Bulanan/Harian/Kualitas yang sudah ada. Tidak ada
   query, RPC, atau logika data yang diubah di sini -- murni lapisan visual.
   ========================================================================= */
.dxy {
  --dxy-bg: #F5F7FB;
  --dxy-card: #FFFFFF;
  --dxy-border: #E5E7EB;
  --dxy-text: #1F2937;
  --dxy-muted: #6B7280;
  --dxy-blue: #2563EB;
  --dxy-green: #10B981;
  --dxy-orange: #F97316;
  --dxy-teal: #14B8A6;
  --dxy-purple: #8B5CF6;
  --dxy-red: #EF4444;
  --dxy-yellow: #F59E0B;
  --dxy-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.12);
  --dxy-shadow-hover: 0 4px 10px rgba(15,23,42,.06), 0 16px 32px -14px rgba(15,23,42,.18);
  background: var(--dxy-bg);
  color: var(--dxy-text);
  padding: 12px;
  border-radius: 20px;
  font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .dxy {
  --dxy-bg: #0f172a;
  --dxy-card: #1e293b;
  --dxy-border: #334155;
  --dxy-text: #f8fafc;
  --dxy-muted: #94a3b8;
  --dxy-shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.4);
  --dxy-shadow-hover: 0 4px 10px rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.5);
}

/* ---- Filter bar (Baris 1) ---- */
.dxy-filterbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.dxy-filterbar .dxy-spacer { flex: 1; }
.dxy-field {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.dxy-field label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--dxy-muted);
}
.dxy-select, .dxy-input {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  color: var(--dxy-text);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-family: inherit;
  min-height: 32px;
}
.dxy-select:disabled, .dxy-input:disabled { opacity: .45; cursor: not-allowed; }
.dxy-input { min-width: 160px; }
.dxy-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  color: var(--dxy-text);
  border-radius: 10px;
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.dxy-btn:hover { box-shadow: var(--dxy-shadow); transform: translateY(-1px); }
.dxy-btn-primary { background: var(--dxy-blue); border-color: var(--dxy-blue); color: #fff; }

/* ---- KPI row (Baris 2) ---- */
.dxy-kpi-row {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.dxy-kpi-card {
  grid-column: span 3;
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 14px 16px;
  min-height: 112px;
  box-shadow: var(--dxy-shadow);
  transition: transform 200ms ease, box-shadow 200ms ease;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  overflow: hidden;
}
.dxy-kpi-card:hover { transform: translateY(-2px); box-shadow: var(--dxy-shadow-hover); }
.dxy-kpi-top { display: flex; align-items: center; justify-content: space-between; }
.dxy-kpi-label { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--dxy-muted); text-transform: uppercase; }
.dxy-kpi-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dxy-kpi-mid { display: flex; align-items: baseline; gap: 8px; }
.dxy-kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
.dxy-kpi-delta { font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
.dxy-kpi-delta.up { color: var(--dxy-green); }
.dxy-kpi-delta.down { color: var(--dxy-red); }
.dxy-kpi-delta.flat { color: var(--dxy-muted); }
.dxy-kpi-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.dxy-kpi-target { font-size: 10.5px; color: var(--dxy-muted); }
.dxy-kpi-spark { width: 84px; height: 28px; }

/* ---- Smart Narrative (Baris 3) ---- */
.dxy-narrative {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 16px 20px;
  box-shadow: var(--dxy-shadow);
  min-width: 0;
}
.dxy-narrative-head { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dxy-muted); margin-bottom: 10px; }
.dxy-narrative-list { display: flex; flex-direction: column; gap: 9px; }
.dxy-narrative-item { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; line-height: 1.5; }
.dxy-narrative-icon { flex-shrink: 0; font-size: 13px; line-height: 1.5; }
.dxy-narrative-item b { font-weight: 700; }

/* ---- Chart grid (Baris 4) ---- */
.dxy-chart-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
.dxy-panel {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 14px 16px !important;
  box-shadow: var(--dxy-shadow);
  transition: box-shadow 200ms ease;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.dxy-panel:hover { box-shadow: var(--dxy-shadow-hover); }
.dxy-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px !important; }
.dxy-panel-bignum { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin: -6px 0 10px; color: var(--dxy-text); }
.dxy-panel-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.dxy-panel-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(16,185,129,.12); color: var(--dxy-green); }
.dxy-panel-sub { font-size: 10.5px; color: var(--dxy-muted); }
.dxy-span-3 { grid-column: span 3; }
.dxy-span-4 { grid-column: span 4; }
.dxy-span-6 { grid-column: span 6; }
.dxy-span-12 { grid-column: span 12; }
.dxy-chart-box { position: relative; flex: 1; min-height: 210px !important; max-height: 210px; }
.dxy-chart-box.tall { min-height: 190px !important; max-height: 190px; }

/* ---- Tabel Downtime Terbesar (redesign total) ---- */
.dxy-table-panel { grid-column: span 12; }
/* Varian tabel sejajar 3-kolom (Downtime / NG Inline / Repair Terbesar) */
.dxy-table-panel-sm .dxy-table-scroll { max-height: 300px !important; overflow-x: hidden; }
.dxy-table-panel-sm table.dxy-table { font-size: 11.5px; width: 100%; table-layout: fixed; }
.dxy-table-panel-sm table.dxy-table thead th { padding: 7px 6px; font-size: 9px; }
.dxy-table-panel-sm table.dxy-table tbody td { padding: 6px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dxy-table-scroll { max-height: 270px !important; overflow: auto; border-radius: 12px; border: 1px solid var(--dxy-border); }
table.dxy-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
table.dxy-table thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--dxy-card);
  border-bottom: 2px solid var(--dxy-border);
  text-align: left;
  padding: 8px 12px;
  font-size: 10px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--dxy-muted);
}
table.dxy-table tbody td { padding: 7px 12px; border-bottom: 1px solid var(--dxy-border); vertical-align: middle; }
table.dxy-table tbody tr:nth-child(even) { background: rgba(107,114,128,.045); }
table.dxy-table tbody tr:hover { background: rgba(37,99,235,.06); }
.dxy-rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  font-size: 10.5px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.dxy-pic-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--dxy-muted); }
.dxy-pic-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.dxy-minute-badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.dxy-empty-cell { color: var(--dxy-muted); font-style: italic; }

/* ---- Bulanan (harian 1-31): grid Weekly 5 kolom sejajar ---- */
.dxy-weekly-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
.dxy-weekly-grid .dxy-panel { min-width: 0; }
.dxy-weekly-grid .dxy-chart-box { min-height: 150px !important; max-height: 150px; }
@media (max-width: 1366px) { .dxy-weekly-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 720px) { .dxy-weekly-grid { grid-template-columns: repeat(2, 1fr); } }

/* ---- Bulanan (harian): tabel Downtime Terbesar per line, 7 kolom ---- */
.dxy-dt-terbesar-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
.dxy-dt-terbesar-grid .dxy-table-scroll { max-height: 260px !important; overflow: auto; }
.dxy-dt-terbesar-grid table.dxy-table { font-size: 10.5px; min-width: 560px; }
.dxy-dt-terbesar-grid table.dxy-table thead th { padding: 6px 6px; font-size: 8.5px; white-space: nowrap; }
.dxy-dt-terbesar-grid table.dxy-table tbody td { padding: 5px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
.dxy-status-chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 9.5px; font-weight: 700; }
.dxy-status-open { background: rgba(239,68,68,.14); color: #EF4444; }
.dxy-status-progress { background: rgba(245,158,11,.14); color: #F59E0B; }
.dxy-status-closed { background: rgba(16,185,129,.14); color: #10B981; }
@media (max-width: 1366px) { .dxy-dt-terbesar-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 720px) { .dxy-dt-terbesar-grid { grid-template-columns: 1fr; } }

/* ---- Skeleton loading ---- */
.dxy-skeleton-row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-bottom: 16px; }
.dxy-skeleton {
  grid-column: span 3;
  height: 112px;
  border-radius: 16px;
  background: linear-gradient(90deg, var(--dxy-border) 25%, rgba(255,255,255,.5) 37%, var(--dxy-border) 63%);
  background-size: 400% 100%;
  animation: dxy-shimmer 1.4s ease infinite;
}
@keyframes dxy-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* ---- Responsive ---- */
@media (max-width: 1366px) {
  .dxy-kpi-card { grid-column: span 6; }
  .dxy-skeleton { grid-column: span 6; }
  .dxy-span-4 { grid-column: span 6; }
  .dxy-span-3 { grid-column: span 6; }
}
@media (max-width: 1024px) {
  .dxy-span-6, .dxy-span-4, .dxy-span-3 { grid-column: span 12; }
  .dxy-filterbar { gap: 8px; }
}
@media (max-width: 640px) {
  .dxy-kpi-card, .dxy-skeleton { grid-column: span 12; }
}

/* ---- Rapatkan jarak di atas konten Tahunan (topbar & tab-nav) ----
   Ini di luar namespace .dxy karena topbar/tab-nav dipakai bersama oleh
   semua tab, tapi hanya memangkas whitespace kosong -- tidak mengubah
   logika atau tampilan konten tab lain. ---- */
.dash-topbar { margin-bottom: 4px !important; padding-bottom: 0 !important; }
.dash-title-block h1 { margin: 0 !important; }
.main { padding-top: 10px !important; }
</style>
<script>
  (function () {
    var t = localStorage.getItem("theme_v1") || "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="assets/supabaseClient.js"></script>
</head>
<body>

<div class="app-shell" x-data="dashboardExhaust()" x-init="init()">
  <div class="mobile-topbar">
    <button class="hamburger" @click="mobileNavOpen = true">☰</button>
    <span class="mobile-title">Dashboard Exhaust</span>
  </div>
  <div class="sidebar-overlay" x-show="mobileNavOpen" @click="mobileNavOpen = false" x-cloak></div>
  <aside class="sidebar" :class="[mobileNavOpen ? 'sidebar-open' : '', sidebarCollapsed ? 'sidebar-collapsed' : '']">
    <button class="sidebar-collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed">
      <span x-show="!sidebarCollapsed">‹</span><span x-show="sidebarCollapsed">›</span>
    </button>
    <div class="sidebar-brand" x-show="!sidebarCollapsed">WELDING EXHAUST<span>·</span>SYSTEM</div>
    <nav class="sidebar-nav" @click="mobileNavOpen = false">
      <a href="dashboard-exhaust.html" class="sidebar-link active" title="Dashboard Exhaust"><span>📊</span><span x-show="!sidebarCollapsed">Dashboard Exhaust</span></a>
      <a href="index.html" class="sidebar-link" title="Dashboard"><span>🏠</span><span x-show="!sidebarCollapsed">Dashboard</span></a>
      <a href="plan-produksi.html" class="sidebar-link" title="Plan Produksi"><span>📅</span><span x-show="!sidebarCollapsed">Plan Produksi</span></a>
      <a href="input-produksi.html" class="sidebar-link" title="Input Produksi"><span>⚙️</span><span x-show="!sidebarCollapsed">Input Produksi</span></a>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-attendance.html" class="sidebar-link" title="Input Attendance"><span>👥</span><span x-show="!sidebarCollapsed">Input Attendance</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-scrap.html" class="sidebar-link" title="Input Scrap"><span>♻️</span><span x-show="!sidebarCollapsed">Input Scrap</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-safety.html" class="sidebar-link" title="Input Safety"><span>⛑️</span><span x-show="!sidebarCollapsed">Input Safety</span></a>
      </template>
    </nav>
    <div class="sidebar-foot" x-show="!sidebarCollapsed">
      <div class="who" x-text="profile?.full_name || session?.user?.email || '...'"></div>
      <span class="badge" :class="profile?.role === 'admin' ? 'role-admin' : ''" x-text="profile?.jabatan || profile?.role || '...'"></span>
      <button class="btn-ghost btn-sm" @click="logout()">Keluar</button>
    </div>
    <button class="sidebar-logout-collapsed" x-show="sidebarCollapsed" @click="logout()" title="Keluar">⏻</button>
  </aside>

  <main class="main">
    <div class="dash-topbar">
      <div class="dash-title-block">
        <h1>DASHBOARD EXHAUST</h1>
      </div>
      <div class="dash-controls">
        <button class="theme-toggle" @click="toggleTheme()" :title="theme === 'dark' ? 'Ke mode terang' : 'Ke mode gelap'">
          <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
        </button>
      </div>
    </div>

    <!-- Switch Tahunan / Bulanan / Kontrol Kualitas -->
    <div class="dash-subtab-nav" style="display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
      <button class="btn-secondary btn-sm" :class="activeTab==='tahunan' ? 'btn-primary' : ''" @click="setTab('tahunan')">Tahunan</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='bulanan' ? 'btn-primary' : ''" @click="setTab('bulanan')">Bulanan</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='kualitas' ? 'btn-primary' : ''" @click="setTab('kualitas')">Kontrol Kualitas</button>
    </div>

    <!-- ===== TAB: BULANAN (harian, tanggal 1-31) ===== -->
    <template x-if="activeTab === 'bulanan'">
      <div class="dxy-fill">
        <template x-if="bulananLoading">
          <div class="dxy">
            <div class="dxy-skeleton-row">
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
            </div>
            <p class="empty-state">Memuat data bulanan...</p>
          </div>
        </template>
        <template x-if="!bulananLoading">
          <div class="dxy">

            <!-- ===== Baris 1: Filter bar (Bulan/Tahun + Line) ===== -->
            <div class="dxy-filterbar">
              <div class="dxy-field">
                <label>Bulan</label>
                <select class="dxy-select" x-model.number="bulananMonth" @change="onBulananPeriodChange()">
                  <template x-for="(nm, i) in BULAN_LABELS" :key="'bm-'+i">
                    <option :value="i+1" x-text="nm"></option>
                  </template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Tahun</label>
                <select class="dxy-select" x-model.number="bulananYear" @change="onBulananPeriodChange()">
                  <template x-for="y in tahunanYearOptions" :key="'by-'+y"><option :value="y" x-text="y"></option></template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Line</label>
                <select class="dxy-select" x-model="dxyLineFilter" @change="$nextTick(() => renderBulananCharts())">
                  <option value="ALL">Semua Line</option>
                  <template x-for="m in MACHINES_REF" :key="'bl-'+m.key"><option :value="m.key" x-text="m.key"></option></template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Tanggal</label>
                <input type="date" class="dxy-input" style="min-width:150px;"
                       x-model="bulananDate"
                       :min="bulananDateMin()" :max="bulananDateMax()"
                       :disabled="bulananLoading"
                       @change="onBulananDateChange()">
              </div>
              <div class="dxy-spacer"></div>
            </div>

            <!-- ===== Baris 2: Productivity & Availability, harian 1-31, dalam % ===== -->
            <div class="dxy-chart-grid">
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">📈 Productivity</span><span class="dxy-panel-sub" x-text="'Rata-rata ' + fmtNum(bulanan.productivity.avg) + '%'"></span></div>
                <div class="dxy-chart-box"><canvas id="dxbProductivity"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">✅ Availability</span><span class="dxy-panel-sub" x-text="'Rata-rata ' + fmtNum(bulanan.availability.avg) + '%'"></span></div>
                <div class="dxy-chart-box"><canvas id="dxbAvailability"></canvas></div>
              </div>
            </div>

            <!-- ===== Baris 3: Downtime harian 1-31 + Supporting (PIC) + Line ===== -->
            <div class="dxy-chart-grid">
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">⏱ Downtime Harian</span><span class="dxy-panel-sub" x-text="'Total ' + fmtNum(bulanan.downtimeHarian.total) + ' menit'"></span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeHarian"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🧑‍🔧 Downtime Supporting</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeSupporting"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🏭 Downtime Line</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeLine"></canvas></div>
              </div>
            </div>

            <!-- ===== Baris 4: Weekly (Week 1 - Week 5) ===== -->
            <div class="dxy-weekly-grid">
              <template x-for="(w, idx) in bulanan.weekly" :key="'bweek-'+idx">
                <div class="dxy-panel">
                  <div class="dxy-panel-head"><span class="dxy-panel-title" x-text="'WEEK ' + (idx + 1)"></span></div>
                  <div class="dxy-chart-box"><canvas :id="'dxbWeek' + (idx + 1)"></canvas></div>
                </div>
              </template>
            </div>

            <!-- ===== Baris 5: Downtime Terbesar per line — 3 grid kesamping, 2 grid kebawah ===== -->
            <div class="dxy-dt-terbesar-grid">
              <template x-for="line in bulanan.downtimeTerbesar" :key="'bdt-'+line.mesin">
                <div class="dxy-panel dxy-table-panel-sm">
                  <div class="dxy-panel-head">
                    <span class="dxy-panel-title" x-text="line.mesin"></span>
                  </div>
                  <div class="dxy-table-scroll">
                    <table class="dxy-table">
                      <thead>
                        <tr>
