<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Exhaust — Welding Exhaust</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4f5f7">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
/* =========================================================================
   DASHBOARD EXHAUST - TAHUNAN (Smart Narrative Redesign)
   Semua rule di bawah ini di-namespace di bawah ".dxy" supaya TIDAK PERNAH
   menyentuh style tab Bulanan/Harian/Kualitas yang sudah ada. Tidak ada
   query, RPC, atau logika data yang diubah di sini -- murni lapisan visual.
   ========================================================================= */
.dxy {
  --dxy-bg: #F5F7FB;
  --dxy-card: #FFFFFF;
  --dxy-border: #E5E7EB;
  --dxy-text: #1F2937;
  --dxy-muted: #6B7280;
  --dxy-blue: #2563EB;
  --dxy-green: #10B981;
  --dxy-orange: #F97316;
  --dxy-teal: #14B8A6;
  --dxy-purple: #8B5CF6;
  --dxy-red: #EF4444;
  --dxy-yellow: #F59E0B;
  --dxy-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.12);
  --dxy-shadow-hover: 0 4px 10px rgba(15,23,42,.06), 0 16px 32px -14px rgba(15,23,42,.18);
  background: var(--dxy-bg);
  color: var(--dxy-text);
  padding: 4px 6px 12px 6px;
  border-radius: 20px;
  font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .dxy {
  --dxy-bg: #0f172a;
  --dxy-card: #1e293b;
  --dxy-border: #334155;
  --dxy-text: #f8fafc;
  --dxy-muted: #94a3b8;
  --dxy-shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.4);
  --dxy-shadow-hover: 0 4px 10px rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.5);
}

/* ---- Filter bar (Baris 1) ---- */
.dxy-filterbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.dxy-filterbar .dxy-spacer { flex: 1; }
.dxy-field {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 6px;
}
.dxy-field label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--dxy-muted);
  white-space: nowrap;
}
.dxy-select, .dxy-input {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  color: var(--dxy-text);
  border-radius: 8px;
  padding: 4px 7px;
  font-size: 11.5px;
  font-family: inherit;
  min-height: 26px;
}
.dxy-select:disabled, .dxy-input:disabled { opacity: .45; cursor: not-allowed; }
.dxy-input { min-width: 120px; }
.dxy-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  color: var(--dxy-text);
  border-radius: 10px;
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.dxy-btn:hover { box-shadow: var(--dxy-shadow); transform: translateY(-1px); }
.dxy-btn-primary { background: var(--dxy-blue); border-color: var(--dxy-blue); color: #fff; }

/* ---- KPI row (Baris 2) ---- */
.dxy-kpi-row {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.dxy-kpi-card {
  grid-column: span 3;
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 14px 16px;
  min-height: 112px;
  box-shadow: var(--dxy-shadow);
  transition: transform 200ms ease, box-shadow 200ms ease;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  overflow: hidden;
}
.dxy-kpi-card:hover { transform: translateY(-2px); box-shadow: var(--dxy-shadow-hover); }
.dxy-kpi-top { display: flex; align-items: center; justify-content: space-between; }
.dxy-kpi-label { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--dxy-muted); text-transform: uppercase; }
.dxy-kpi-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dxy-kpi-mid { display: flex; align-items: baseline; gap: 8px; }
.dxy-kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
.dxy-kpi-delta { font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
.dxy-kpi-delta.up { color: var(--dxy-green); }
.dxy-kpi-delta.down { color: var(--dxy-red); }
.dxy-kpi-delta.flat { color: var(--dxy-muted); }
.dxy-kpi-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.dxy-kpi-target { font-size: 10.5px; color: var(--dxy-muted); }
.dxy-kpi-spark { width: 84px; height: 28px; }

/* ---- Smart Narrative (Baris 3) ---- */
.dxy-narrative {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 16px 20px;
  box-shadow: var(--dxy-shadow);
  min-width: 0;
}
.dxy-narrative-head { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dxy-muted); margin-bottom: 10px; }
.dxy-narrative-list { display: flex; flex-direction: column; gap: 9px; }
.dxy-narrative-item { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; line-height: 1.5; }
.dxy-narrative-icon { flex-shrink: 0; font-size: 13px; line-height: 1.5; }
.dxy-narrative-item b { font-weight: 700; }

/* ---- Chart grid (Baris 4) ---- */
.dxy-chart-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 6px;
  margin-bottom: 6px;
}
.dxy-panel {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 8px 10px !important;
  box-shadow: var(--dxy-shadow);
  transition: box-shadow 200ms ease;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.dxy-panel:hover { box-shadow: var(--dxy-shadow-hover); }
.dxy-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px !important; }
.dxy-panel-bignum { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin: -6px 0 10px; color: var(--dxy-text); }
.dxy-panel-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.dxy-panel-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(16,185,129,.12); color: var(--dxy-green); }
.dxy-panel-sub { font-size: 10.5px; color: var(--dxy-muted); }
.dxy-span-3 { grid-column: span 3; }
.dxy-span-4 { grid-column: span 4; }
.dxy-span-6 { grid-column: span 6; }
.dxy-span-12 { grid-column: span 12; }
.dxy-chart-box { position: relative; flex: 1; min-height: 185px !important; max-height: 185px; }
.dxy-chart-box.tall { min-height: 165px !important; max-height: 165px; }

/* ---- Tabel Downtime Terbesar (redesign total) ---- */
.dxy-table-panel { grid-column: span 12; }
/* Varian tabel sejajar 3-kolom (Downtime / NG Inline / Repair Terbesar) */
.dxy-table-panel-sm .dxy-table-scroll { max-height: 300px !important; overflow-x: hidden; }
.dxy-table-panel-sm table.dxy-table { font-size: 11.5px; width: 100%; table-layout: fixed; }
.dxy-table-panel-sm table.dxy-table thead th { padding: 5px 6px; font-size: 9px; }
.dxy-table-panel-sm table.dxy-table tbody td { padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 24px; }
/* Rekap NG Inline / NG Trial / Repair (qc-detail-table): samakan font sel data dengan font header (9px) */
.dxy-table-panel-sm table.qc-detail-table tbody td { font-size: 9px; }
/* Kotak Rekap Kontrol Kualitas: tinggi TETAP, pas menampung header + 5 baris data.
   Kotak TIDAK melebar ke bawah -- kalau data lebih dari 5 baris, scroll muncul
   DI DALAM kotak ini (kotaknya sendiri diam). Dipasang dengan spesifisitas tinggi
   supaya menang dari rule breakpoint layar besar (30vh) manapun urutannya. */
/* Kotak Rekap Kontrol Kualitas: tinggi TETAP/FIX -- TIDAK ikut mengecil atau
   membesar berapa pun jumlah baris datanya (sedikit maupun banyak). Kalau
   data melebihi tinggi ini, scroll muncul DI DALAM kotak; kotaknya sendiri
   tidak pernah berubah ukuran.
   CATATAN: dulu pakai max-height, tapi max-height masih ikut MENGECIL saat
   data < 5 baris dan pembungkus kartu (.dxy-panel) di luarnya sama sekali
   tidak dikunci, jadi kartu tetap "napas" ikut tinggi total isinya. Sekarang
   dipakai height TETAP (bukan max-height) supaya area tabel selalu persis
   198px, plus min-height/max-height pada kartu pembungkus supaya kartu itu
   sendiri juga terkunci -- baik saat data sedikit maupun banyak. */
.qc-rekap-scroll,
.dxy-table-panel-sm .qc-rekap-scroll,
.dxy-panel .qc-rekap-scroll,
.dxy-qc-col .dxy-table-panel-sm .qc-rekap-scroll,
.dxy-qc-grid .dxy-qc-col .dxy-panel .qc-rekap-scroll { height: 198px !important; max-height: 198px !important; overflow-y: auto !important; overflow-x: hidden !important; scrollbar-width: thin; scrollbar-color: #94A3B8 transparent; }
/* Kartu pembungkus "Rekap NG Inline/Trial/Repair" (kolom Kontrol Kualitas
   saja, lewat scope .dxy-qc-col) dikunci tinggi totalnya juga -- header
   (judul + input tanggal, ~30px) + area tabel (198px) + padding kartu
   (~16px) = konstan, tidak ikut membesar/mengecil sama sekali. */
.dxy-qc-col .dxy-panel.dxy-table-panel-sm {
  min-height: 246px !important;
  max-height: 246px !important;
  height: 246px !important;
  overflow: hidden;
}
/* ---- Toggle "Tanggal" / "Sebulan" di header panel Rekap (Kontrol Kualitas) ---- */
.qc-rekap-mode { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.qc-rekap-mode-btn {
  font-family: inherit;
  font-size: 9.5px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid var(--dxy-border);
  background: var(--dxy-card);
  color: var(--dxy-muted);
  cursor: pointer;
  transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
  white-space: nowrap;
}
.qc-rekap-mode-btn:hover { color: var(--dxy-text); }
.qc-rekap-mode-btn.active { background: var(--dxy-blue); border-color: var(--dxy-blue); color: #fff; }
.qc-rekap-mode .dxy-input { min-height: 24px; padding: 3px 6px; font-size: 10.5px; }
/* Scrollbar dibuat jelas kelihatan (default browser kadang terlalu tipis/transparan) */
.qc-rekap-scroll::-webkit-scrollbar { width: 8px; }
.qc-rekap-scroll::-webkit-scrollbar-track { background: transparent; }
.qc-rekap-scroll::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 8px; }
.qc-rekap-scroll::-webkit-scrollbar-thumb:hover { background: #64748B; }
.dxy-table-scroll { max-height: 210px !important; overflow: auto; border-radius: 12px; border: 1px solid var(--dxy-border); }
table.dxy-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
table.dxy-table thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--dxy-card);
  border-bottom: 2px solid var(--dxy-border);
  text-align: left;
  padding: 8px 12px;
  font-size: 10px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--dxy-muted);
}
table.dxy-table tbody td { padding: 5px 12px; border-bottom: 1px solid var(--dxy-border); vertical-align: middle; }
table.dxy-table tbody tr:nth-child(even) { background: rgba(107,114,128,.045); }
table.dxy-table tbody tr:hover { background: rgba(37,99,235,.06); }
.dxy-rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  font-size: 10.5px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.dxy-pic-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--dxy-muted); }
.dxy-pic-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.dxy-minute-badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: rgba(100,116,139,.12); color: var(--dxy-text); }
.dxy-empty-cell { color: var(--dxy-muted); font-style: italic; }

/* ---- Bulanan (harian 1-31): grid Weekly 5 kolom sejajar ---- */
.dxy-weekly-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 6px;
}
.dxy-weekly-grid .dxy-panel { min-width: 0; }
.dxy-weekly-grid .dxy-chart-box { min-height: 130px !important; max-height: 130px; }
@media (max-width: 1366px) { .dxy-weekly-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 720px) { .dxy-weekly-grid { grid-template-columns: repeat(2, 1fr); } }

/* ---- Bulanan (harian): tabel Downtime Terbesar per line, 7 kolom ---- */
.dxy-dt-terbesar-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
.dxy-dt-terbesar-grid .dxy-table-scroll { max-height: 165px !important; overflow: auto; }
.dxy-dt-terbesar-grid table.dxy-table { font-size: 10px; table-layout: fixed; width: 100%; }
.dxy-dt-terbesar-grid table.dxy-table thead th { padding: 4px 3px; font-size: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.dxy-dt-terbesar-grid table.dxy-table tbody td { padding: 3px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 18px; }
.dxy-status-chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 9.5px; font-weight: 700; }
.dxy-status-open { background: rgba(239,68,68,.14); color: #EF4444; }
.dxy-status-progress { background: rgba(245,158,11,.14); color: #F59E0B; }
.dxy-status-closed { background: rgba(16,185,129,.14); color: #10B981; }
@media (max-width: 1366px) { .dxy-dt-terbesar-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 720px) { .dxy-dt-terbesar-grid { grid-template-columns: 1fr; } }
.dxy-dt-merged-panel .dxy-table-scroll { max-height: none !important; overflow: visible !important; }
.dxy-dt-merged-panel table.dxy-table { font-size: 14.5px; table-layout: fixed; }
.dxy-dt-merged-panel table.dxy-table thead th { padding: 9px 12px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.dxy-dt-merged-panel table.dxy-table tbody td { padding: 9px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- Tab Kontrol Kualitas: 3 kolom (NG Inline / NG Inline Trial / Straightpass) ---- */
.dxy-qc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  align-items: start;
}
.dxy-qc-col {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.dxy-qc-header {
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  text-align: center;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,.25);
  box-shadow: 0 4px 14px -4px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25);
}
.dxy-qc-amber { background: linear-gradient(135deg, #92400e 0%, #f59e0b 55%, #fcd34d 100%); }
.dxy-qc-cyan  { background: linear-gradient(135deg, #075985 0%, #06b6d4 55%, #67e8f9 100%); }
.dxy-qc-green { background: linear-gradient(135deg, #14532d 0%, #22c55e 55%, #86efac 100%); }
.dxy-qc-subgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}
.qc-chart-month  { min-height: 200px !important; max-height: 200px; }
.qc-chart-sub    { min-height: 160px !important; max-height: 160px; }
.qc-chart-daily  { min-height: 170px !important; max-height: 170px; }
.qc-detail-table { font-size: 8px; table-layout: fixed; }
.qc-detail-table thead th { padding: 5px 4px; font-size: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center !important; text-transform: none !important; letter-spacing: normal !important; }
.qc-detail-table tbody td { padding: 4px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 20px; }
@media (max-width: 1366px) { .dxy-qc-grid { grid-template-columns: 1fr; } }
@media (max-width: 1366px) { .dxy-qc-subgrid { grid-template-columns: 1fr; } }

/* ---- Khusus tab Tahunan: tinggikan chart Productivity/Availability/NG Inline/
   Straight Pass & Downtime Exhaust/Supporting/Line. Discope pakai class
   .dxy-tahunan-main-grid supaya tidak ikut mengubah tab Bulanan. ---- */
.dxy-tahunan-main-grid .dxy-chart-box { min-height: 210px !important; max-height: 210px; }
.dxy-tahunan-main-grid .dxy-chart-box.tall { min-height: 195px !important; max-height: 195px; }
@media (min-width: 1400px) and (min-height: 700px) {
  .dxy-tahunan-main-grid .dxy-chart-box { min-height: 21vh !important; max-height: 21vh !important; }
  .dxy-tahunan-main-grid .dxy-chart-box.tall { min-height: 19vh !important; max-height: 19vh !important; }
}

/* ---- Auto-fit tinggi mengikuti viewport, HANYA untuk layar desktop penuh
   (lebar >=1400px & tinggi >=700px). Di layar sempit/mobile tetap pakai
   tinggi fixed (px) di atas supaya layout responsive tidak terganggu. ---- */
@media (min-width: 1400px) and (min-height: 700px) {
  .dxy-chart-box { min-height: 18vh !important; max-height: 18vh !important; }
  .dxy-chart-box.tall { min-height: 15.5vh !important; max-height: 15.5vh !important; }
  .dxy-weekly-grid .dxy-chart-box { min-height: 11.5vh !important; max-height: 11.5vh !important; }
  .dxy-table-panel-sm .dxy-table-scroll { max-height: 30vh !important; }
  .dxy-dt-merged-panel .dxy-table-scroll { max-height: none !important; overflow: visible !important; }
  .dxy-fill { display: flex; flex-direction: column; min-height: calc(100vh - 120px); }
  .dxy-fill > .dxy { display: flex; flex-direction: column; flex: 1; }
  .dxy-dt-merged-panel { flex: 1; }
  .dxy-dt-merged-panel .dxy-table-scroll { flex: 1; }
}

/* ---- Skeleton loading ---- */
.dxy-skeleton-row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-bottom: 16px; }
.dxy-skeleton {
  grid-column: span 3;
  height: 112px;
  border-radius: 16px;
  background: linear-gradient(90deg, var(--dxy-border) 25%, rgba(255,255,255,.5) 37%, var(--dxy-border) 63%);
  background-size: 400% 100%;
  animation: dxy-shimmer 1.4s ease infinite;
}
@keyframes dxy-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* ---- Responsive ---- */
@media (max-width: 1366px) {
  .dxy-kpi-card { grid-column: span 6; }
  .dxy-skeleton { grid-column: span 6; }
  .dxy-span-4 { grid-column: span 6; }
  .dxy-span-3 { grid-column: span 6; }
}
@media (max-width: 1024px) {
  .dxy-span-6, .dxy-span-4, .dxy-span-3 { grid-column: span 12; }
  .dxy-filterbar { gap: 8px; }
}
@media (max-width: 640px) {
  .dxy-kpi-card, .dxy-skeleton { grid-column: span 12; }
}

/* ---- Rapatkan jarak di atas konten Tahunan (topbar & tab-nav) ----
   Ini di luar namespace .dxy karena topbar/tab-nav dipakai bersama oleh
   semua tab, tapi hanya memangkas whitespace kosong -- tidak mengubah
   logika atau tampilan konten tab lain. ---- */
.dash-topbar { margin: 0 !important; padding: 0 !important; }
.dash-title-block { margin: 0 !important; padding: 0 !important; }
.dash-title-block h1 { margin: 0 !important; padding: 0 !important; line-height: 1.1 !important; }
.main { padding-top: 0 !important; padding-left: 14px !important; padding-right: 14px !important; gap: 4px !important; }
.dash-subtab-nav { margin: 0 !important; padding: 0 !important; }
.dash-subtab-nav button { margin: 0 !important; }
.dxy-fill { margin-top: 0 !important; padding-top: 0 !important; }
</style>
<script>
  (function () {
    var t = localStorage.getItem("theme_v1") || "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="assets/supabaseClient.js"></script>
</head>
<body>

<div class="app-shell" x-data="dashboardExhaust()" x-init="init()">
  <div class="mobile-topbar">
    <button class="hamburger" @click="mobileNavOpen = true">☰</button>
    <span class="mobile-title">Dashboard Exhaust</span>
  </div>
  <div class="sidebar-overlay" x-show="mobileNavOpen" @click="mobileNavOpen = false" x-cloak></div>
  <aside class="sidebar" :class="[mobileNavOpen ? 'sidebar-open' : '', sidebarCollapsed ? 'sidebar-collapsed' : '']">
    <button class="sidebar-collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed">
      <span x-show="!sidebarCollapsed">‹</span><span x-show="sidebarCollapsed">›</span>
    </button>
    <div class="sidebar-brand" x-show="!sidebarCollapsed">WELDING EXHAUST<span>·</span>SYSTEM</div>
    <nav class="sidebar-nav" @click="mobileNavOpen = false">
      <a href="dashboard-exhaust.html" class="sidebar-link active" title="Dashboard Exhaust"><span>📊</span><span x-show="!sidebarCollapsed">Dashboard Exhaust</span></a>
      <a href="index.html" class="sidebar-link" title="Dashboard"><span>🏠</span><span x-show="!sidebarCollapsed">Dashboard</span></a>
      <a href="plan-produksi.html" class="sidebar-link" title="Plan Produksi"><span>📅</span><span x-show="!sidebarCollapsed">Plan Produksi</span></a>
      <a href="input-produksi.html" class="sidebar-link" title="Input Produksi"><span>⚙️</span><span x-show="!sidebarCollapsed">Input Produksi</span></a>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-attendance.html" class="sidebar-link" title="Input Attendance"><span>👥</span><span x-show="!sidebarCollapsed">Input Attendance</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-scrap.html" class="sidebar-link" title="Input Scrap"><span>♻️</span><span x-show="!sidebarCollapsed">Input Scrap</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-safety.html" class="sidebar-link" title="Input Safety"><span>⛑️</span><span x-show="!sidebarCollapsed">Input Safety</span></a>
      </template>
    </nav>
    <div class="sidebar-foot" x-show="!sidebarCollapsed">
      <div class="who" x-text="profile?.full_name || session?.user?.email || '...'"></div>
      <span class="badge" :class="profile?.role === 'admin' ? 'role-admin' : ''" x-text="profile?.jabatan || profile?.role || '...'"></span>
      <button class="btn-ghost btn-sm" @click="logout()">Keluar</button>
    </div>
    <button class="sidebar-logout-collapsed" x-show="sidebarCollapsed" @click="logout()" title="Keluar">⏻</button>
  </aside>

  <main class="main">
    <div class="dash-topbar">
      <div class="dash-title-block">
        <h1>DASHBOARD EXHAUST</h1>
      </div>
      <div class="dash-controls">
        <button class="theme-toggle" @click="toggleTheme()" :title="theme === 'dark' ? 'Ke mode terang' : 'Ke mode gelap'">
          <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
        </button>
      </div>
    </div>

    <!-- Switch Tahunan / Bulanan / Kontrol Kualitas -->
    <div class="dash-subtab-nav" style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn-secondary btn-sm" :class="activeTab==='tahunan' ? 'btn-primary' : ''" @click="setTab('tahunan')">Tahunan</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='bulanan' ? 'btn-primary' : ''" @click="setTab('bulanan')">Bulanan</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='kualitas' ? 'btn-primary' : ''" @click="setTab('kualitas')">Kontrol Kualitas</button>
    </div>

    <!-- ===== TAB: BULANAN (harian, tanggal 1-31) ===== -->
    <template x-if="activeTab === 'bulanan'">
      <div class="dxy-fill">
        <template x-if="bulananLoading">
          <div class="dxy">
            <div class="dxy-skeleton-row">
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
            </div>
            <p class="empty-state">Memuat data bulanan...</p>
          </div>
        </template>
        <template x-if="!bulananLoading">
          <div class="dxy">

            <!-- ===== Baris 1: Filter bar (Bulan/Tahun + Line) ===== -->
            <div class="dxy-filterbar">
              <div class="dxy-field">
                <label>Bulan</label>
                <select class="dxy-select" x-model.number="bulananMonth" @change="onBulananPeriodChange()">
                  <template x-for="(nm, i) in BULAN_LABELS" :key="'bm-'+i">
                    <option :value="i+1" x-text="nm"></option>
                  </template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Tahun</label>
                <select class="dxy-select" x-model.number="bulananYear" @change="onBulananPeriodChange()">
                  <template x-for="y in tahunanYearOptions" :key="'by-'+y"><option :value="y" x-text="y"></option></template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Line</label>
                <select class="dxy-select" x-model="dxyLineFilter" @change="$nextTick(() => renderBulananCharts())">
                  <option value="ALL">Semua Line</option>
                  <template x-for="m in MACHINES_REF" :key="'bl-'+m.key"><option :value="m.key" x-text="m.key"></option></template>
                </select>
              </div>
              <div class="dxy-spacer"></div>
              <div class="dxy-field">
                <label>Tanggal</label>
                <input type="date" class="dxy-input" style="min-width:150px;"
                       x-model="bulananDate"
                       :min="bulananDateMin()" :max="bulananDateMax()"
                       :disabled="bulananLoading"
                       @change="onBulananDateChange()">
              </div>
            </div>

            <!-- ===== Baris 2: Productivity & Availability, harian 1-31, dalam % ===== -->
            <div class="dxy-chart-grid">
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">📈 Productivity</span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Rata-rata ' + fmtNum(bulanan.productivity.avg) + '%'"></span></div>
                <div class="dxy-chart-box"><canvas id="dxbProductivity"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">✅ Availability</span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Rata-rata ' + fmtNum(bulanan.availability.avg) + '%'"></span></div>
                <div class="dxy-chart-box"><canvas id="dxbAvailability"></canvas></div>
              </div>
            </div>

            <!-- ===== Baris 3: Downtime harian 1-31 + Supporting (PIC) + Line ===== -->
            <div class="dxy-chart-grid">
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">⏱ Downtime Harian</span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Total ' + fmtNum(bulanan.downtimeHarian.total) + ' menit'"></span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeHarian"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🧑‍🔧 Downtime Supporting</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeSupporting"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🏭 Downtime Line</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeLine"></canvas></div>
              </div>
            </div>

            <!-- ===== Baris 4: Weekly (Week 1 - Week 5) ===== -->
            <div class="dxy-weekly-grid">
              <template x-for="(w, idx) in bulanan.weekly" :key="'bweek-'+idx">
                <div class="dxy-panel">
                  <div class="dxy-panel-head"><span class="dxy-panel-title" x-text="'WEEK ' + (idx + 1)"></span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Total ' + fmtNum(w.values.reduce((a,v)=>a+v,0)) + ' menit'"></span></div>
                  <div class="dxy-chart-box"><canvas :id="'dxbWeek' + (idx + 1)"></canvas></div>
                </div>
              </template>
            </div>

            <!-- ===== Baris 5: Downtime Terbesar per line — digabung jadi 1 tabel (kolom Line) ===== -->
            <div class="dxy-panel dxy-table-panel-sm dxy-dt-merged-panel">
              <div class="dxy-panel-head">
                <span class="dxy-panel-title">⏱ Downtime Line</span>
              </div>
              <div class="dxy-table-scroll">
                <table class="dxy-table">
                  <thead>
                    <tr>
                      <th style="width:6%">Line</th>
                      <th style="width:7%">PIC</th>
                      <th style="width:18%">Problem</th>
                      <th style="width:11%">Area</th>
                      <th style="width:34%">Countermeasure</th>
                      <th style="width:8%">Status</th>
                      <th style="width:7%">Shift</th>
                      <th style="width:9%">Menit</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(row, i) in bulananDowntimeMergedRows()" :key="'bdt-merged-'+i">
                      <tr>
                        <td style="font-weight:700;" x-text="row.mesin"></td>
                        <td>
                          <template x-if="row.pic"><span class="dxy-pic-chip" :title="row.pic"><span class="dot" :style="'background:' + dxyPicColor(row.pic)"></span><span x-text="row.pic"></span></span></template>
                        </td>
                        <td :title="row.problem"><span x-show="row.problem" x-text="row.problem"></span></td>
                        <td :title="row.area"><span x-show="row.area" x-text="row.area"></span></td>
                        <td :title="row.countermeasure"><span x-show="row.countermeasure" x-text="row.countermeasure"></span></td>
                        <td>
                          <span x-show="row.status" class="dxy-status-chip" :class="dxyStatusClass(row.status)" x-text="row.status"></span>
                        </td>
                        <td><span x-show="row.shift" x-text="row.shift"></span></td>
                        <td style="text-align:right">
                          <span x-show="row.menit !== ''" class="dxy-minute-badge" x-text="row.menit"></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        </template>
      </div>
    </template>
    <template x-if="activeTab === 'tahunan'">
      <div class="dxy-fill">
        <template x-if="tahunanLoading">
          <div class="dxy">
            <div class="dxy-skeleton-row">
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
            </div>
            <p class="empty-state">Memuat data tahunan...</p>
          </div>
        </template>
        <template x-if="!tahunanLoading">
          <div class="dxy">

            <!-- ===== Baris 1: Filter bar ===== -->
            <div class="dxy-filterbar">
              <div class="dxy-field">
                <label>Tahun</label>
                <select class="dxy-select" x-model.number="tahunanYear" @change="onTahunanYearChange()">
                  <template x-for="y in tahunanYearOptions" :key="y"><option :value="y" x-text="'FY ' + y"></option></template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Line</label>
                <select class="dxy-select" x-model="dxyLineFilter" @change="$nextTick(() => renderTahunanCharts())">
                  <option value="ALL">Semua Line</option>
                  <template x-for="m in MACHINES_REF" :key="m.key"><option :value="m.key" x-text="m.key"></option></template>
                </select>
              </div>
            </div>

            <!-- ===== Grafik utama: Productivity, Availability, NG Inline, Straight Pass -- 4 kolom sejajar ===== -->
            <div class="dxy-chart-grid dxy-tahunan-main-grid">
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">📈 Productivity</span></div>
                <div class="dxy-chart-box"><canvas id="dxyBigProductivity"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">✅ Availability</span></div>
                <div class="dxy-chart-box"><canvas id="dxyBigAvailability"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🔶 NG Inline</span></div>
                <div class="dxy-chart-box"><canvas id="dxyBigNg"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🎯 Straight Pass</span></div>
                <div class="dxy-chart-box"><canvas id="dxyBigStraightpass"></canvas></div>
              </div>

              <!-- Downtime Exhaust, Supporting, Line -- tetap 1 baris, Exhaust lebih lebar -->
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">⏱ Downtime Exhaust</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxyDowntimeExhaust"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🧑‍🔧 Downtime Supporting</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxyDowntimeSupporting"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🏭 Downtime Line</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxyDowntimeLine"></canvas></div>
              </div>
            </div>

            <!-- ===== Baris 5: Tabel Terbesar (Downtime / NG Inline / Repair) — sejajar 3 kolom ===== -->
            <div class="dxy-chart-grid">
            <div class="dxy-panel dxy-span-4 dxy-table-panel-sm">
              <div class="dxy-panel-head">
                <span class="dxy-panel-title">🏆 Downtime Terbesar</span>
                
              </div>
              <div class="dxy-table-scroll">
                <table class="dxy-table">
                  <thead>
                    <tr><th style="width:46px">Line</th><th style="width:70px">PIC</th><th>Problem</th><th style="width:56px; text-align:right">Menit</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="(row, i) in dxyFilteredTerbesar()" :key="row.mesin + '-' + i">
                      <tr>
                        <td><b x-text="row.mesin"></b></td>
                        <td>
                          <template x-if="row.pic">
                            <span class="dxy-pic-chip"><span x-text="row.pic"></span></span>
                          </template>
                          <template x-if="!row.pic"><span class="dxy-empty-cell">-</span></template>
                        </td>
                        <td>
                          <span x-show="row.problem" x-text="row.problem"></span>
                          <span class="dxy-empty-cell" x-show="!row.problem">No Problem</span>
                        </td>
                        <td style="text-align:right">
                          <span x-show="row.value !== ''" class="dxy-minute-badge" :style="dxyMinuteBadgeStyle(row.value)" x-text="row.value"></span>
                          <span x-show="row.value === ''" class="dxy-empty-cell">-</span>
                        </td>
                      </tr>
                    </template>
                    <template x-if="dxyFilteredTerbesar().length === 0">
                      <tr><td colspan="4" class="dxy-empty-cell" style="text-align:center; padding:20px;">Tidak ada baris yang cocok dengan filter/pencarian.</td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- ===== Tabel NG Inline Terbesar (struktur sama seperti Downtime Terbesar) ===== -->
            <div class="dxy-panel dxy-span-4 dxy-table-panel-sm">
              <div class="dxy-panel-head">
                <span class="dxy-panel-title">⚠️ NG Inline Terbesar</span>
                
              </div>
              <div class="dxy-table-scroll">
                <table class="dxy-table">
                  <thead>
                    <tr><th>NG Kategori</th><th style="width:52px">Qty</th><th style="width:76px; text-align:right">Value</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="(row, i) in dxyFilteredNgTerbesar()" :key="row.mesin + '-' + i">
                      <tr>
                        <td>
                          <template x-if="row.kategori">
                            <span class="dxy-pic-chip"><span x-text="row.kategori"></span></span>
                          </template>
                        </td>
                        <td>
                          <span x-show="row.qty !== ''" x-text="row.qty"></span>
                        </td>
                        <td style="text-align:right">
                          <span x-show="row.value !== ''" class="dxy-minute-badge" :style="dxyMinuteBadgeStyle(row.value)" x-text="row.value"></span>
                        </td>
                      </tr>
                    </template>
                    <template x-if="dxyFilteredNgTerbesar().length === 0">
                      <tr><td colspan="3" class="dxy-empty-cell" style="text-align:center; padding:20px;">Tidak ada baris yang cocok dengan filter/pencarian.</td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- ===== Tabel Repair Terbesar (struktur sama, tanpa kolom Menit) ===== -->
            <div class="dxy-panel dxy-span-4 dxy-table-panel-sm">
              <div class="dxy-panel-head">
                <span class="dxy-panel-title">🔧 Repair Terbesar</span>
                
              </div>
              <div class="dxy-table-scroll">
                <table class="dxy-table">
                  <thead>
                    <tr><th style="width:130px">Repair Kategori</th><th>Qty</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="(row, i) in dxyFilteredRepairTerbesar()" :key="row.mesin + '-' + i">
                      <tr>
                        <td>
                          <template x-if="row.kategori">
                            <span class="dxy-pic-chip"><span x-text="row.kategori"></span></span>
                          </template>
                        </td>
                        <td style="text-align:right">
                          <span x-show="row.qty !== ''" x-text="row.qty"></span>
                        </td>
                      </tr>
                    </template>
                    <template x-if="dxyFilteredRepairTerbesar().length === 0">
                      <tr><td colspan="2" class="dxy-empty-cell" style="text-align:center; padding:20px;">Tidak ada baris yang cocok dengan filter/pencarian.</td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
            </div>

          </div>
        </template>
      </div>
    </template>
    <template x-if="activeTab === 'kualitas'">
      <div class="dxy-fill">
        <div class="dxy">

          <!-- ===== Baris 1: Filter bar (Bulan/Tahun) ===== -->
          <div class="dxy-filterbar">
            <div class="dxy-field">
              <label>Bulan</label>
              <select class="dxy-select" x-model.number="qcMonth" @change="onQcPeriodChange()">
                <template x-for="(nm, i) in BULAN_LABELS" :key="'qm-'+i">
                  <option :value="i+1" x-text="nm"></option>
                </template>
              </select>
            </div>
            <div class="dxy-field">
              <label>Tahun</label>
              <select class="dxy-select" x-model.number="qcYear" @change="onQcPeriodChange()">
                <template x-for="y in tahunanYearOptions" :key="'qy-'+y"><option :value="y" x-text="y"></option></template>
              </select>
            </div>
          </div>

          <div class="dxy-qc-grid">

            <!-- ===== KOLOM 1: NG INLINE ===== -->
            <div class="dxy-qc-col">
              <div class="dxy-panel">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🔶 NG Inline</span></div>
                <div class="dxy-chart-box qc-chart-month"><canvas id="qcNgInlineMonth"></canvas></div>
              </div>

              <div class="dxy-qc-subgrid">
                <div class="dxy-panel">
                  <div class="dxy-panel-head"><span class="dxy-panel-title">NG Inline Perline</span></div>
                  <div class="dxy-chart-box qc-chart-sub"><canvas id="qcNgInlinePerline"></canvas></div>
                </div>
                <div class="dxy-panel">
                  <div class="dxy-panel-head"><span class="dxy-panel-title">NG Inline Model</span></div>
                  <div class="dxy-chart-box qc-chart-sub"><canvas id="qcNgInlineModel"></canvas></div>
                </div>
              </div>

              <div class="dxy-panel">
                <div class="dxy-panel-head"><span class="dxy-panel-title">Daily</span></div>
                <div class="dxy-chart-box qc-chart-daily"><canvas id="qcNgInlineDaily"></canvas></div>
              </div>

              <div class="dxy-panel dxy-table-panel-sm">
                <div class="dxy-panel-head">
                  <span class="dxy-panel-title">Rekap NG Inline</span>
                  <div class="qc-rekap-mode">
                    <button type="button" class="qc-rekap-mode-btn" :class="{ active: qcNgInlineDetailMode === 'tanggal' }" @click="setQcRekapMode('qcNgInline', 'tanggal')">Tanggal</button>
                    <button type="button" class="qc-rekap-mode-btn" :class="{ active: qcNgInlineDetailMode === 'bulan' }" @click="setQcRekapMode('qcNgInline', 'bulan')">Sebulan</button>
                    <input type="date" class="dxy-input" style="min-width:120px;" x-show="qcNgInlineDetailMode === 'tanggal'" x-model="qcNgInlineDetailDate" @change="fetchQcNgInlineDetail()">
                  </div>
                </div>
                <div class="dxy-table-scroll qc-rekap-scroll">
                  <table class="dxy-table qc-detail-table">
                    <thead>
                      <tr>
                        <th style="width:52px" x-show="qcNgInlineDetailMode === 'bulan'">Tanggal</th>
                        <th style="width:48px">Model</th><th style="width:36px">Line</th><th style="width:13%">Part No</th><th style="width:13%">Area</th><th style="width:17%">NG Proses</th>
                        <th style="width:36px">Qty</th><th style="width:18%">NG Kategori</th><th style="width:15%">Value</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(row, i) in qcNgInlineRows()" :key="'qcng-'+i">
                        <tr>
                          <td x-show="qcNgInlineDetailMode === 'bulan'" x-text="row.tanggal"></td>
                          <td x-text="row.model"></td>
                          <td x-text="row.line"></td>
                          <td x-text="row.partNo"></td>
                          <td x-text="row.area"></td>
                          <td x-text="row.ngProses"></td>
                          <td x-text="row.qty"></td>
                          <td x-text="row.ngKategori"></td>
                          <td x-text="row.value"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>

            </div>

            <!-- ===== KOLOM 2: NG INLINE TRIAL ===== -->
            <div class="dxy-qc-col">
              <div class="dxy-panel">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🔷 NG Inline Trial</span></div>
                <div class="dxy-chart-box qc-chart-month"><canvas id="qcNgTrialMonth"></canvas></div>
              </div>

                        <th style="width:48px">Model</th><th style="width:36px">Line</th><th style="width:16%">Part No</th><th style="width:36px">Qty</th><th style="width:16%">Area</th><th style="width:12%">Point</th><th style="width:22%">Repair Kategori</th>
