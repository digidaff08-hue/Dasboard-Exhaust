<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Exhaust — Welding Exhaust</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4f5f7">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
/* =========================================================================
   DASHBOARD EXHAUST - TAHUNAN (Smart Narrative Redesign)
   Semua rule di bawah ini di-namespace di bawah ".dxy" supaya TIDAK PERNAH
   menyentuh style tab Bulanan/Harian/Kualitas yang sudah ada. Tidak ada
   query, RPC, atau logika data yang diubah di sini -- murni lapisan visual.
   ========================================================================= */
.dxy {
  --dxy-bg: #F5F7FB;
  --dxy-card: #FFFFFF;
  --dxy-border: #E5E7EB;
  --dxy-text: #000000;
  --dxy-muted: #1A1A1A;
  --dxy-blue: #2563EB;
  --dxy-green: #10B981;
  --dxy-orange: #F97316;
  --dxy-teal: #14B8A6;
  --dxy-purple: #8B5CF6;
  --dxy-red: #EF4444;
  --dxy-yellow: #F59E0B;
  --dxy-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.12);
  --dxy-shadow-hover: 0 4px 10px rgba(15,23,42,.06), 0 16px 32px -14px rgba(15,23,42,.18);
  background: var(--dxy-bg);
  color: var(--dxy-text);
  padding: 4px 6px 12px 6px;
  border-radius: 20px;
  font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .dxy {
  --dxy-bg: #0f172a;
  --dxy-card: #1e293b;
  --dxy-border: #334155;
  --dxy-text: #f8fafc;
  --dxy-muted: #94a3b8;
  --dxy-shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.4);
  --dxy-shadow-hover: 0 4px 10px rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.5);
}

/* ---- Filter bar (Baris 1) ---- */
.dxy-filterbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.dxy-filterbar .dxy-spacer { flex: 1; }
.dxy-field {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 6px;
}
.dxy-field label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--dxy-muted);
  white-space: nowrap;
}
.dxy-select, .dxy-input {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  color: var(--dxy-text);
  border-radius: 8px;
  padding: 4px 7px;
  font-size: 11.5px;
  font-family: inherit;
  min-height: 26px;
}
.dxy-select:disabled, .dxy-input:disabled { opacity: .45; cursor: not-allowed; }
.dxy-input { min-width: 120px; }
.dxy-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  color: var(--dxy-text);
  border-radius: 10px;
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.dxy-btn:hover { box-shadow: var(--dxy-shadow); transform: translateY(-1px); }
.dxy-btn-primary { background: var(--dxy-blue); border-color: var(--dxy-blue); color: #fff; }

/* ---- KPI row (Baris 2) ---- */
.dxy-kpi-row {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.dxy-kpi-card {
  grid-column: span 3;
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 14px 16px;
  min-height: 112px;
  box-shadow: var(--dxy-shadow);
  transition: transform 200ms ease, box-shadow 200ms ease;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  overflow: hidden;
}
.dxy-kpi-card:hover { transform: translateY(-2px); box-shadow: var(--dxy-shadow-hover); }
.dxy-kpi-top { display: flex; align-items: center; justify-content: space-between; }
.dxy-kpi-label { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--dxy-muted); text-transform: uppercase; }
.dxy-kpi-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dxy-kpi-mid { display: flex; align-items: baseline; gap: 8px; }
.dxy-kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
.dxy-kpi-delta { font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
.dxy-kpi-delta.up { color: var(--dxy-green); }
.dxy-kpi-delta.down { color: var(--dxy-red); }
.dxy-kpi-delta.flat { color: var(--dxy-muted); }
.dxy-kpi-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.dxy-kpi-target { font-size: 10.5px; color: var(--dxy-muted); }
.dxy-kpi-spark { width: 84px; height: 28px; }

/* ---- Smart Narrative (Baris 3) ---- */
.dxy-narrative {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 16px 20px;
  box-shadow: var(--dxy-shadow);
  min-width: 0;
}
.dxy-narrative-head { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dxy-muted); margin-bottom: 10px; }
.dxy-narrative-list { display: flex; flex-direction: column; gap: 9px; }
.dxy-narrative-item { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; line-height: 1.5; }
.dxy-narrative-icon { flex-shrink: 0; font-size: 13px; line-height: 1.5; }
.dxy-narrative-item b { font-weight: 700; }

/* ---- Chart grid (Baris 4) ---- */
.dxy-chart-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 6px;
  margin-bottom: 6px;
}
.dxy-panel {
  background: #F1F9FE;
  border: 1px solid #7DD3FC;
  border-top: 4px solid #0EA5E9;
  border-radius: 16px;
  padding: 8px 10px !important;
  box-shadow: 0 1px 3px rgba(14,165,233,.12), 0 8px 24px -12px rgba(14,165,233,.28);
  transition: box-shadow 200ms ease, border-color 200ms ease;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.dxy-panel:hover { box-shadow: 0 4px 12px rgba(14,165,233,.18), 0 16px 32px -14px rgba(14,165,233,.42); border-color: #38BDF8; }
[data-theme="dark"] .dxy-panel { background: #14273A; border-color: #0284C7; border-top-color: #38BDF8; }
[data-theme="dark"] .dxy-panel:hover { border-color: #7DD3FC; }
.dxy-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px !important; }
.dxy-panel-bignum { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin: -6px 0 10px; color: var(--dxy-text); }
.dxy-panel-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.dxy-panel-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(16,185,129,.12); color: var(--dxy-green); }
.dxy-panel-sub { font-size: 10.5px; color: var(--dxy-muted); }
.dxy-span-3 { grid-column: span 3; }
.dxy-span-4 { grid-column: span 4; }
.dxy-span-5 { grid-column: span 5; }
.dxy-span-2 { grid-column: span 2; }
.dxy-span-6 { grid-column: span 6; }
.dxy-span-8 { grid-column: span 8; }
.dxy-span-12 { grid-column: span 12; }
.dxy-chart-box { position: relative; flex: 1; min-height: 185px !important; max-height: 185px; }
/* Legend Chart.js (position:"bottom") nempel persis di tepi bawah kanvas --
   supaya kelihatan mepet ke garis bawah kartu (bukan ngambang di tengah),
   padding-bawah kartu yang isinya chart dipersempit di sini. Tidak
   menyentuh kartu tabel (Rekap NG Inline/Trial/Repair, dst) karena itu
   tidak punya .dxy-chart-box di dalamnya. */
.dxy-panel:has(> .dxy-chart-box) { padding-bottom: 2px !important; }
.dxy-chart-box.tall { min-height: 165px !important; max-height: 165px; }

/* ---- Tabel Downtime Terbesar (redesign total) ---- */
.dxy-table-panel { grid-column: span 12; }
/* Varian tabel sejajar 3-kolom (Downtime / NG Inline / Repair Terbesar) */
.dxy-table-panel-sm .dxy-table-scroll { max-height: 300px !important; overflow-x: hidden; }
.dxy-table-panel-sm table.dxy-table { font-size: 10px; width: 100%; table-layout: fixed; }
.dxy-table-panel-sm table.dxy-table thead th { padding: 5px 6px; font-size: 8px; }
.dxy-table-panel-sm table.dxy-table tbody td { padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: clip; height: 24px; }
/* Rekap NG Inline / NG Trial / Repair (qc-detail-table): samakan font sel data dengan font header (8px) */
.dxy-table-panel-sm table.qc-detail-table tbody td { font-size: 8px; }
/* Kotak Rekap Kontrol Kualitas: tinggi TETAP, pas menampung header + 5 baris data.
   Kotak TIDAK melebar ke bawah -- kalau data lebih dari 5 baris, scroll muncul
   DI DALAM kotak ini (kotaknya sendiri diam). Dipasang dengan spesifisitas tinggi
   supaya menang dari rule breakpoint layar besar (30vh) manapun urutannya. */
/* Kotak Rekap Kontrol Kualitas: tinggi TETAP/FIX -- TIDAK ikut mengecil atau
   membesar berapa pun jumlah baris datanya (sedikit maupun banyak). Kalau
   data melebihi tinggi ini, scroll muncul DI DALAM kotak; kotaknya sendiri
   tidak pernah berubah ukuran.
   CATATAN: dulu pakai max-height, tapi max-height masih ikut MENGECIL saat
   data < 5 baris dan pembungkus kartu (.dxy-panel) di luarnya sama sekali
   tidak dikunci, jadi kartu tetap "napas" ikut tinggi total isinya. Sekarang
   dipakai height TETAP (bukan max-height) supaya area tabel selalu persis
   198px, plus min-height/max-height pada kartu pembungkus supaya kartu itu
   sendiri juga terkunci -- baik saat data sedikit maupun banyak. */
.qc-rekap-scroll,
.dxy-table-panel-sm .qc-rekap-scroll,
.dxy-panel .qc-rekap-scroll,
.dxy-qc-col .dxy-table-panel-sm .qc-rekap-scroll,
.dxy-qc-grid .dxy-qc-col .dxy-panel .qc-rekap-scroll { height: 198px !important; max-height: 198px !important; overflow-y: auto !important; overflow-x: hidden !important; scrollbar-width: thin; scrollbar-color: #94A3B8 transparent; }
/* Kartu pembungkus "Rekap NG Inline/Trial/Repair" (kolom Kontrol Kualitas
   saja, lewat scope .dxy-qc-col) dikunci tinggi totalnya juga -- header
   (judul + input tanggal, ~30px) + area tabel (198px) + padding kartu
   (~16px) = konstan, tidak ikut membesar/mengecil sama sekali. */
.dxy-qc-col .dxy-panel.dxy-table-panel-sm {
  min-height: 246px !important;
  max-height: 246px !important;
  height: 246px !important;
  overflow: hidden;
}
/* ---- 3 tabel "Terbesar" di bottom tab Tahunan (Downtime / NG Inline /
   Repair) -- KHUSUS bagian ini, TIDAK menyentuh tabel Bulanan/Kualitas.
   Default SELALU 12 baris -- kalau data kurang dari 12, sisanya baris
   KOSONG POLOS (tidak ada teks "-"/"No Problem" apa pun, lihat template
   HTML-nya). Tinggi kotak dikunci PAS untuk 12 baris (header + 12 x
   tinggi baris), TANPA scroll selama baris <= 12. Kalau data asli > 12
   baris, baris TIDAK dipotong -- overflow:auto otomatis memunculkan
   scroll DI DALAM kotak yang ukurannya tetap sama (kotak tidak ikut
   membesar). Selector 3-class ini sengaja dibuat lebih spesifik
   daripada rule ".dxy-table-panel-sm .dxy-table-scroll" manapun
   (termasuk breakpoint layar besar), jadi selalu menang. */
.dxy-panel.dxy-table-panel-sm.dxy-tahunan-terbesar-panel {
  min-height: 356px !important;
  max-height: 356px !important;
  height: 356px !important;
  overflow: hidden;
}
.dxy-panel.dxy-table-panel-sm.dxy-tahunan-terbesar-panel .dxy-table-scroll {
  height: 310px !important;
  max-height: 310px !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  scrollbar-width: thin;
  scrollbar-color: #94A3B8 transparent;
}
/* Font sel data di 3 tabel ini SERAGAM 8px -- dulu .dxy-pic-chip (11px)
   & .dxy-minute-badge (11.5px) override lebih besar daripada teks polos
   lainnya (8px, dari rule "table.qc-detail-table tbody td" di atas),
   jadi kelihatan besar-kecil tidak rata dalam 1 tabel yang sama. */
.dxy-tahunan-terbesar-panel .dxy-pic-chip,
.dxy-tahunan-terbesar-panel .dxy-minute-badge {
  font-size: 8px !important;
}
/* ---- Toggle "Tanggal" / "Sebulan" di header panel Rekap (Kontrol Kualitas) ---- */
.qc-rekap-mode { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.qc-rekap-mode .dxy-input { min-height: 24px; padding: 3px 6px; font-size: 10.5px; }
/* Field tanggal ini diam-diam terisi (tanggal 1 bulan terpilih) supaya
   kalender bawaan browser terbuka di bulan yang benar -- tapi selama
   user belum benar-benar memilih tanggal (qcNgInlineUseDate masih false),
   teksnya disembunyikan (dibikin transparan) supaya tetap KELIHATAN
   kosong di layar, sesuai tampilan mode "sebulan". */
.qc-rekap-mode .dxy-input.qc-date-hidden { color: transparent; }
.qc-rekap-mode .dxy-input.qc-date-hidden::-webkit-datetime-edit-fields-wrapper { color: transparent; }
/* Wrapper input tanggal + overlay nama bulan di atasnya. Overlay disisakan
   ruang ~22px di kanan supaya ikon kalender bawaan browser tetap kelihatan
   & tetap bisa diklik (overlay pointer-events:none, klik tembus ke input
   di bawahnya, jadi kalender tetap kebuka walau overlay sedang tampil). */
/* ---- Diganti jadi SATU bingkai tunggal di WRAPPER (bukan lagi border
   terpisah di label vs border bawaan si <input>) -- pendekatan lama rawan
   ada garis yang kepotong/tertimpa/tidak presisi nyambung, apalagi saat
   browser di-zoom. Sekarang: wrapper yang gambar SATU border+radius utuh,
   input di dalamnya dibikin transparan tanpa border sendiri (border:none),
   background overlay ikut background wrapper -- jadi mustahil ada 2 garis
   yang beradu/numpuk lagi, di zoom level berapa pun. ---- */
.qc-date-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--dxy-border);
  border-radius: 8px;
  background: var(--dxy-card);
  overflow: hidden;
}
.qc-date-wrap input[type="date"] {
  border: none !important;
  border-radius: 0 !important;
  background: transparent !important;
}
.qc-date-month-label {
  position: absolute;
  left: 0; top: 0; bottom: 0; right: 22px;
  display: flex; align-items: center;
  padding-left: 7px;
  background: var(--dxy-card);
  color: var(--dxy-text);
  font-size: 10.5px;
  font-weight: 600;
  /* Klik-langsung-buka-kalender sempat dicoba (showPicker() di label ini)
     tapi ternyata browser tetap tidak mau buka popup-nya kecuali klik
     persis di ikon kalender asli -- jadi dikembalikan ke pointer-events:
     none (klik "numpang lewat" ke <input> di bawahnya, minimal tetap
     fokus normal ke field-nya). */
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
}
/* Ikon kalender bawaan browser (bagian ~22px kanan yang sengaja disisakan
   di atas) tadinya kelihatan "nempel"/tidak nyambung sama pil overlay di
   sebelah kirinya -- beda radius (6 vs 8), beda warna ikon tiap tema, dan
   ada "kotak putih" bawaan browser di sekeliling ikon yang kontras dengan
   background field. Diperhalus di sini: color-scheme disamakan sama tema
   dashboard (biar ikon & popup kalender ikut gelap saat dark mode, bukan
   selalu putih), ikon dibuat transparan+redup lalu nyala pas di-hover,
   dan alignment-nya dirapikan supaya menyatu jadi 1 pil utuh. */
.qc-rekap-mode input[type="date"] { color-scheme: light; }
[data-theme="dark"] .qc-rekap-mode input[type="date"] { color-scheme: dark; }
.qc-rekap-mode input[type="date"]::-webkit-calendar-picker-indicator {
  opacity: 0.55;
  cursor: pointer;
  padding: 3px;
  margin-right: 1px;
  border-radius: 5px;
  background-color: transparent;
  transition: opacity 150ms ease, background-color 150ms ease;
}
.qc-rekap-mode input[type="date"]::-webkit-calendar-picker-indicator:hover {
  opacity: 1;
  background-color: var(--dxy-border);
}
/* Outline fokus BAWAAN browser dimatikan khusus di sini -- karena outline
   digambar DI LUAR/DI ATAS semua elemen (termasuk overlay label kita),
   jadi kelihatan seperti "garis hitam" aneh yang nongol pas field diklik/
   fokus. Diganti highlight lebih halus (border + glow tipis) yang senada
   sama warna dashboard, bukan dihilangkan total (supaya tetap ada tanda
   fokus buat aksesibilitas). */
.qc-rekap-mode input[type="date"]:focus {
  outline: none;
}
/* Highlight fokus digambar di WRAPPER (bukan di si <input>, yang sekarang
   sudah tanpa border sendiri) lewat :focus-within -- supaya nyala nya
   ngikutin bentuk 1 pil utuh, bukan cuma sebagian dalemnya. */
.qc-date-wrap:focus-within {
  border-color: #38BDF8;
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
}
/* Tombol kecil "✕" -- muncul cuma saat tanggal terisi, dipakai untuk
   mengosongkan tanggal lagi supaya balik otomatis ke tampilan sebulan. */
.qc-rekap-clear-btn {
  width: 20px; height: 20px;
  border-radius: 999px;
  border: 1px solid var(--dxy-border);
  background: var(--dxy-card);
  color: var(--dxy-muted);
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
}
.qc-rekap-clear-btn:hover { background: #ef4444; border-color: #ef4444; color: #fff; }
/* Scrollbar dibuat jelas kelihatan (default browser kadang terlalu tipis/transparan) */
.qc-rekap-scroll::-webkit-scrollbar { width: 8px; }
.qc-rekap-scroll::-webkit-scrollbar-track { background: transparent; }
.qc-rekap-scroll::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 8px; }
.qc-rekap-scroll::-webkit-scrollbar-thumb:hover { background: #64748B; }
.dxy-table-scroll { max-height: 210px !important; overflow: auto; border-radius: 12px; border: 1px solid #BAE6FD; }
[data-theme="dark"] .dxy-table-scroll { border-color: #0369A1; }
table.dxy-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; }
table.dxy-table thead th {
  position: sticky; top: 0; z-index: 1;
  background: #E0F2FE;
  border-bottom: 2px solid #7DD3FC;
  text-align: left;
  padding: 8px 12px;
  font-size: 9px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: #0284C7;
}
[data-theme="dark"] table.dxy-table thead th { background: #082F49; border-color: #0369A1; color: #7DD3FC; }
[data-theme="dark"] table.dxy-table tbody tr { background: #0B1F32; }
[data-theme="dark"] table.dxy-table tbody tr:nth-child(even) { background: #0F2A40; }
table.dxy-table tbody td { padding: 5px 12px; border-bottom: 1px solid var(--dxy-border); vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: clip; }
table.dxy-table tbody tr { background: #F9FCFF; }
table.dxy-table tbody tr:nth-child(even) { background: #EDF7FE; }
table.dxy-table tbody tr:hover { background: rgba(14,165,233,.08); }
/* ---- Filter per-kolom di tabel Rekap NG Inline / NG Trial / Repair ---- */
table.qc-detail-table thead th { cursor: pointer; user-select: none; transition: background 120ms ease; }
table.qc-detail-table thead th:hover { background: rgba(14,165,233,.16); }
/* NOTE: warna di bawah ini SENGAJA di-hardcode (bukan var(--dxy-*)) karena
   dropdown-nya di-teleport ke <body>, keluar dari elemen ".dxy" tempat
   variabel --dxy-* itu didefinisikan -- kalau pakai var(--dxy-*) di sini,
   nilainya jadi kosong/transparan begitu dropdown pindah ke luar scope-nya. */
.qc-filter-dropdown {
  position: fixed;
  z-index: 999;
  width: 200px;
  max-width: 80vw;
  background: #F0F9FF;
  border: 1px solid #7DD3FC;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(14,165,233,.12), 0 16px 32px -14px rgba(14,165,233,.35);
  padding: 9px;
  font-size: 11px;
  text-transform: none;
  letter-spacing: normal;
  color: #0C4A6E;
  cursor: default;
}
[data-theme="dark"] .qc-filter-dropdown {
  background: #0C2A3D;
  border-color: #0369A1;
  color: #E0F2FE;
  box-shadow: 0 4px 10px rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.55);
}
.qc-filter-title { font-size: 10px; font-weight: 700; color: #0284C7; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
[data-theme="dark"] .qc-filter-title { color: #7DD3FC; }
.qc-filter-search {
  width: 100%;
  box-sizing: border-box;
  background: #E0F2FE;
  border: 1px solid #BAE6FD;
  color: #0C4A6E;
  border-radius: 6px;
  padding: 5px 7px;
  font-size: 11px;
  font-family: inherit;
  margin-bottom: 6px;
}
[data-theme="dark"] .qc-filter-search { background: #082F49; border-color: #0369A1; color: #E0F2FE; }
.qc-filter-actions { display: flex; gap: 6px; margin-bottom: 6px; }
.qc-filter-actions button {
  flex: 1;
  background: #E0F2FE;
  border: 1px solid #BAE6FD;
  color: #0C4A6E;
  border-radius: 6px;
  padding: 4px 6px;
  font-size: 10px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
[data-theme="dark"] .qc-filter-actions button { background: #082F49; border-color: #0369A1; color: #E0F2FE; }
.qc-filter-actions button:hover { border-color: #0EA5E9; color: #0EA5E9; }
.qc-filter-actions button.qc-filter-close-btn { flex: 0 0 auto; padding: 4px 8px; }
.qc-filter-list { max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.qc-filter-item {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 5px; border-radius: 6px; cursor: pointer; font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.qc-filter-item:hover { background: rgba(14,165,233,.14); }
.qc-filter-item input[type="checkbox"] { flex-shrink: 0; margin: 0; cursor: pointer; }
.qc-filter-item span { overflow: hidden; text-overflow: ellipsis; }
.qc-filter-empty { font-size: 10.5px; color: #0284C7; font-style: italic; padding: 6px 4px; }
[data-theme="dark"] .qc-filter-empty { color: #7DD3FC; }

/* ---- Chip ringkasan filter aktif (badge kecil di sebelah judul panel Rekap) ---- */
.qc-panel-title-group { display: flex; align-items: center; gap: 6px; min-width: 0; }
.qc-filter-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(37,99,235,.12);
  color: var(--dxy-blue);
  border: 1px solid rgba(37,99,235,.3);
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 9px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.qc-filter-badge:hover { background: var(--dxy-blue); color: #fff; }
/* Kolom yang lagi difilter: teks header-nya jadi biru -- ini SATU-SATUNYA
   penanda visual di header (tidak ada ikon tambahan), supaya header tetap
   bersih untuk kolom yang tidak difilter. */
table.qc-detail-table thead th.qc-th-active { color: #0369A1; font-weight: 800; }
[data-theme="dark"] table.qc-detail-table thead th.qc-th-active { color: #7DD3FC; }

.dxy-rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  font-size: 10.5px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.dxy-pic-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--dxy-muted); }
.dxy-pic-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.dxy-minute-badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: rgba(100,116,139,.12); color: var(--dxy-text); }
.dxy-empty-cell { color: var(--dxy-muted); font-style: italic; }

/* ---- Popup detail "Downtime Terbesar" (breakdown per Line) -- double-klik
   row di tabel bulananTopProblem. Bukan modal tengah layar -- ini POPUP
   KECIL yang nempel/floating di atas panel "Downtime Terbesar" (sama
   seperti pola .qc-filter-dropdown). Warna hardcode karena di-teleport
   ke <body>, keluar dari scope ".dxy". ---- */
.dxy-pd-modal {
  position: fixed;
  z-index: 1000;
  width: 260px;
  max-width: 88vw;
  max-height: 300px;
  background: #F0F9FF; color: #0C4A6E;
  border: 1px solid #7DD3FC; border-radius: 12px;
  box-shadow: 0 4px 10px rgba(14,165,233,.12), 0 16px 32px -14px rgba(14,165,233,.35);
  display: flex; flex-direction: column; overflow: hidden;
}
[data-theme="dark"] .dxy-pd-modal { background: #0C2A3D; color: #E0F2FE; border-color: #0369A1; }
.dxy-pd-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 9px 10px 7px 10px; border-bottom: 1px solid #BAE6FD; background: #E0F2FE; }
[data-theme="dark"] .dxy-pd-head { border-color: #0369A1; background: #082F49; }
.dxy-pd-title { font-size: 8.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #0284C7; margin-bottom: 2px; }
[data-theme="dark"] .dxy-pd-title { color: #7DD3FC; }
.dxy-pd-problem { font-size: 12px; font-weight: 800; line-height: 1.3; color: #0C4A6E; }
[data-theme="dark"] .dxy-pd-problem { color: #E0F2FE; }
.dxy-pd-close { flex-shrink: 0; background: transparent; border: none; font-size: 13px; line-height: 1; cursor: pointer; color: #0284C7; padding: 2px 4px; border-radius: 5px; }
.dxy-pd-close:hover { background: rgba(14,165,233,.18); color: #0C4A6E; }
[data-theme="dark"] .dxy-pd-close:hover { color: #E0F2FE; }
.dxy-pd-sub { padding: 6px 10px 0 10px; font-size: 9.5px; color: #0284C7; }
[data-theme="dark"] .dxy-pd-sub { color: #7DD3FC; }
.dxy-pd-body { padding: 5px 10px 8px 10px; overflow-y: auto; }
.dxy-pd-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.dxy-pd-table th { text-align: left; font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #0284C7; padding: 4px 5px; border-bottom: 1px solid #BAE6FD; }
[data-theme="dark"] .dxy-pd-table th { color: #7DD3FC; border-color: #0369A1; }
.dxy-pd-table td { padding: 5px 5px; border-bottom: 1px solid #BAE6FD; }
[data-theme="dark"] .dxy-pd-table td { border-color: #0369A1; }
.dxy-pd-table tr:last-child td { border-bottom: none; }
.dxy-pd-table td.dxy-pd-menit { text-align: right; font-weight: 700; color: #0369A1; }
[data-theme="dark"] .dxy-pd-table td.dxy-pd-menit { color: #7DD3FC; }
.dxy-pd-loading, .dxy-pd-empty { padding: 12px 4px; text-align: center; font-size: 11px; color: #0284C7; font-style: italic; }
[data-theme="dark"] .dxy-pd-loading, [data-theme="dark"] .dxy-pd-empty { color: #7DD3FC; }
.dxy-pd-total { padding: 6px 10px; border-top: 1px solid #BAE6FD; display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; background: #E0F2FE; color: #0369A1; }
[data-theme="dark"] .dxy-pd-total { border-color: #0369A1; background: #082F49; color: #7DD3FC; }
/* Baris tabel "Downtime Terbesar" bulanan jadi ada indikasi bisa di-klik */
table.qc-detail-table tbody tr.dxy-row-clickable { cursor: pointer; }
table.qc-detail-table tbody tr.dxy-row-clickable:hover { background: rgba(37,99,235,.1); }

/* ---- Bulanan (harian 1-31): grid Weekly 5 kolom sejajar ---- */
.dxy-weekly-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 6px;
}
.dxy-weekly-grid .dxy-panel { min-width: 0; }
.dxy-weekly-grid .dxy-chart-box { min-height: 130px !important; max-height: 130px; }
@media (max-width: 1366px) { .dxy-weekly-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 720px) { .dxy-weekly-grid { grid-template-columns: repeat(2, 1fr); } }

/* ---- Bulanan (harian): tabel Downtime Terbesar per line, 7 kolom ---- */
.dxy-dt-terbesar-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
.dxy-dt-terbesar-grid .dxy-table-scroll { max-height: 165px !important; overflow: auto; }
.dxy-dt-terbesar-grid table.dxy-table { font-size: 9px; table-layout: fixed; width: 100%; }
.dxy-dt-terbesar-grid table.dxy-table thead th { padding: 4px 3px; font-size: 7px; white-space: nowrap; overflow: hidden; text-overflow: clip; text-align: center; }
.dxy-dt-terbesar-grid table.dxy-table tbody td { padding: 3px 3px; white-space: nowrap; overflow: hidden; text-overflow: clip; height: 18px; }
.dxy-status-chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 9.5px; font-weight: 700; }
.dxy-status-open { background: rgba(239,68,68,.14); color: #000000; }
.dxy-status-progress { background: rgba(245,158,11,.14); color: #000000; }
.dxy-status-closed { background: rgba(16,185,129,.14); color: #000000; }
@media (max-width: 1366px) { .dxy-dt-terbesar-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 720px) { .dxy-dt-terbesar-grid { grid-template-columns: 1fr; } }
/* Panel "Downtime Line" TIDAK lagi ikut membesar mengikuti jumlah baris --
   dikunci ke tinggi yang sama dengan panel "Terbesar" lain (aturan umum
   .dxy-table-panel-sm .dxy-table-scroll { max-height:300px !important }
   di atas otomatis berlaku di sini juga, plus overflow:auto dari
   .dxy-table-scroll dasar), sehingga kalau data lebih banyak dari 300px,
   scroll muncul DI DALAM kotak, bukan kotaknya yang melar. */
.dxy-dt-merged-panel table.dxy-table { font-size: 11px; table-layout: fixed; }
.dxy-dt-merged-panel table.dxy-table thead th { padding: 6px 10px; font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: clip; text-align: center; }
/* Baris ada isinya (chip Status / badge Menit) vs baris kosong tingginya
   beda dikit karena chip/badge itu punya padding sendiri di luar padding
   td -- dikunci tetap 26px semua (lebih ramping dari sebelumnya) supaya
   rata, nggak peduli ada isinya atau kosong. */
.dxy-dt-merged-panel table.dxy-table tbody tr { height: 26px; }
.dxy-dt-merged-panel table.dxy-table tbody td { height: 26px; max-height: 26px; padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: clip; vertical-align: middle; box-sizing: border-box; line-height: 1; }
.dxy-dt-merged-panel .dxy-status-chip { padding: 1px 7px; font-size: 9px; line-height: 1.4; }
.dxy-dt-merged-panel .dxy-minute-badge { padding: 1px 7px; font-size: 10.5px; line-height: 1.4; }
/* ---- Panel "Downtime Terbesar" (sebulan) -- sejajar Downtime Line ---- */
.dxy-dt-summary-panel .dxy-table-scroll { max-height: 100%; overflow-y: auto; }
.dxy-dt-summary-panel table.dxy-table { font-size: 11px; table-layout: fixed; }
.dxy-dt-summary-panel table.dxy-table thead th { padding: 6px 8px; font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: clip; text-align: center; }
.dxy-dt-summary-panel table.dxy-table tbody tr { height: 26px; }
.dxy-dt-summary-panel table.dxy-table tbody td { height: 26px; max-height: 26px; padding: 2px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; box-sizing: border-box; line-height: 1; }
.dxy-dt-summary-panel .dxy-freq-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; background: rgba(37,99,235,.12); color: var(--dxy-blue); }

/* ---- Tab Kontrol Kualitas: 3 kolom (NG Inline / NG Inline Trial / Straightpass) ---- */
.dxy-qc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  align-items: start;
}
.dxy-qc-col {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.dxy-qc-header {
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  text-align: center;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,.25);
  box-shadow: 0 4px 14px -4px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25);
}
.dxy-qc-amber { background: linear-gradient(135deg, #92400e 0%, #f59e0b 55%, #fcd34d 100%); }
.dxy-qc-cyan  { background: linear-gradient(135deg, #075985 0%, #06b6d4 55%, #67e8f9 100%); }
.dxy-qc-green { background: linear-gradient(135deg, #14532d 0%, #22c55e 55%, #86efac 100%); }
.dxy-qc-subgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}
/* Panel-panel kecil (Perline/Model/dsb) dalam subgrid ini sengaja dibikin
   lebih tipis border & strip aksennya -- kalau samain kekuatannya dengan
   panel besar, banyaknya kotak kecil berdempetan bikin layar kerasa penuh
   garis biru. Warna tetap satu keluarga (biru langit), cuma dikurangi
   ketebalannya saja. */
.dxy-qc-subgrid .dxy-panel {
  border-width: 1px;
  border-top-width: 2px;
  border-color: #D3ECFA;
  border-top-color: #7DD3FC;
  box-shadow: none;
}
.dxy-qc-subgrid .dxy-panel:hover { border-color: #BAE6FD; box-shadow: 0 2px 6px rgba(14,165,233,.10); }
[data-theme="dark"] .dxy-qc-subgrid .dxy-panel { border-color: #163650; border-top-color: #0284C7; }
[data-theme="dark"] .dxy-qc-subgrid .dxy-panel:hover { border-color: #0369A1; }
.qc-chart-month  { min-height: 200px !important; max-height: 200px; }
.qc-chart-sub    { min-height: 160px !important; max-height: 160px; }
.qc-chart-daily  { min-height: 170px !important; max-height: 170px; }
.qc-detail-table { font-size: 7px; table-layout: fixed; }
.qc-detail-table thead th { padding: 5px 4px; font-size: 7px; white-space: nowrap; overflow: hidden; text-overflow: clip; text-align: center !important; text-transform: none !important; letter-spacing: normal !important; }
.qc-detail-table tbody td { padding: 4px 5px; white-space: nowrap; overflow: hidden; text-overflow: clip; height: 20px; color: #000000 !important; }
@media (max-width: 1366px) { .dxy-qc-grid { grid-template-columns: 1fr; } }
@media (max-width: 1366px) { .dxy-qc-subgrid { grid-template-columns: 1fr; } }

/* ---- Khusus tab Tahunan: tinggikan chart Productivity/Availability/NG Inline/
   Straight Pass & Downtime Exhaust/Supporting/Line. Discope pakai class
   .dxy-tahunan-main-grid supaya tidak ikut mengubah tab Bulanan. ---- */
.dxy-tahunan-main-grid .dxy-chart-box { min-height: 210px !important; max-height: 210px; }
.dxy-tahunan-main-grid .dxy-chart-box.tall { min-height: 195px !important; max-height: 195px; }
@media (min-width: 1400px) and (min-height: 700px) {
  .dxy-tahunan-main-grid .dxy-chart-box { min-height: 21vh !important; max-height: 21vh !important; }
  .dxy-tahunan-main-grid .dxy-chart-box.tall { min-height: 19vh !important; max-height: 19vh !important; }
}

/* ---- Auto-fit tinggi mengikuti viewport, HANYA untuk layar desktop penuh
   (lebar >=1400px & tinggi >=700px). Di layar sempit/mobile tetap pakai
   tinggi fixed (px) di atas supaya layout responsive tidak terganggu. ---- */
@media (min-width: 1400px) and (min-height: 700px) {
  .dxy-chart-box { min-height: 18vh !important; max-height: 18vh !important; }
  .dxy-chart-box.tall { min-height: 15.5vh !important; max-height: 15.5vh !important; }
  .dxy-weekly-grid .dxy-chart-box { min-height: 11.5vh !important; max-height: 11.5vh !important; }
  .dxy-table-panel-sm .dxy-table-scroll { max-height: 30vh !important; }
  .dxy-fill { display: flex; flex-direction: column; min-height: calc(100vh - 120px); }
  .dxy-fill > .dxy { display: flex; flex-direction: column; flex: 1; }
  /* Baris 4 kolom Izin/Sakit/Cuti/Mangkir di tab Kontrol Attendance:
     mekar mengisi SISA tinggi halaman (bukan cuma tinggi pendek lalu
     nyisain lahan kosong di bawahnya). Pembungkus kartu (.dxy-panel)
     ikut ditarik penuh, dan area scroll tabel di dalamnya (.dxy-attn-
     leave-scroll) yang menyerap sisa ruang itu (pakai flex, bukan
     max-height tetap). */
  .dxy-attn-leave-row { flex: 1; align-items: stretch; }
  .dxy-attn-leave-row .dxy-panel { height: 100%; }
  .dxy-attn-leave-row .dxy-attn-leave-scroll { flex: 1; max-height: none !important; }
}

/* ---- Skeleton loading ---- */
.dxy-skeleton-row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-bottom: 16px; }
.dxy-skeleton {
  grid-column: span 3;
  height: 112px;
  border-radius: 16px;
  background: linear-gradient(90deg, var(--dxy-border) 25%, rgba(255,255,255,.5) 37%, var(--dxy-border) 63%);
  background-size: 400% 100%;
  animation: dxy-shimmer 1.4s ease infinite;
}
@keyframes dxy-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* ---- Responsive ---- */
@media (max-width: 1366px) {
  .dxy-kpi-card { grid-column: span 6; }
  .dxy-skeleton { grid-column: span 6; }
  .dxy-span-4 { grid-column: span 6; }
  .dxy-span-3 { grid-column: span 6; }
  .dxy-span-8 { grid-column: span 8; }
}
@media (max-width: 1024px) {
  .dxy-span-6, .dxy-span-4, .dxy-span-3, .dxy-span-8, .dxy-span-2, .dxy-span-5 { grid-column: span 12; }
  .dxy-filterbar { gap: 8px; }
}
@media (max-width: 640px) {
  .dxy-kpi-card, .dxy-skeleton { grid-column: span 12; }
}

/* ---- Rapatkan jarak di atas konten Tahunan (topbar & tab-nav) ----
   Ini di luar namespace .dxy karena topbar/tab-nav dipakai bersama oleh
   semua tab, tapi hanya memangkas whitespace kosong -- tidak mengubah
   logika atau tampilan konten tab lain. ---- */
.dash-topbar { margin: 0 !important; padding: 0 !important; }
.dash-title-block { margin: 0 !important; padding: 0 !important; }
.dash-title-block h1 { margin: 0 !important; padding: 0 !important; line-height: 1.1 !important; }
.main { padding-top: 0 !important; padding-left: 14px !important; padding-right: 14px !important; gap: 4px !important; }
.dash-subtab-nav { margin: 0 !important; padding: 0 !important; }
.dash-subtab-nav button { margin: 0 !important; }
.dxy-fill { margin-top: 0 !important; padding-top: 0 !important; }

/* ---- Kontrol Attendance: kartu ringkas (Total/Hadir/Cuti/Absen/O.T +
   Shift 1/2). Namespace .dxy-attn supaya tidak menyentuh style tab lain.
   Masih placeholder (angka 0) -- belum ada fetch/RPC. ---- */
.dxy-attn-card {
  background: #F1F9FE;
  border: 1px solid #7DD3FC;
  border-top: 4px solid #0EA5E9;
  border-radius: 18px;
  padding: 18px 20px;
  box-shadow: 0 1px 3px rgba(14,165,233,.12), 0 8px 24px -12px rgba(14,165,233,.28);
  max-width: 440px;
}
[data-theme="dark"] .dxy-attn-card { background: #14273A; border-color: #0284C7; border-top-color: #38BDF8; }
.dxy-attn-card-fill { max-width: 100%; height: 100%; box-sizing: border-box; }
/* FIX: sebelumnya pakai height:100% di sini -- di kombinasi dengan Chart.js
   responsive resize observer, itu bikin infinite-grow loop (tinggi canvas
   terus membesar tanpa henti tiap resize). Pakai tinggi TETAP supaya
   Chart.js punya basis ukuran yang pasti, tidak ada feedback loop. */
.dxy-panel .dxy-chart-box.dxy-attn-trend-box { min-height: 400px !important; max-height: 400px !important; height: 400px !important; }
@media (max-width: 1024px) {
  .dxy-panel .dxy-chart-box.dxy-attn-trend-box { min-height: 260px !important; max-height: 260px !important; height: 260px !important; }
}
.dxy-attn-head { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--dxy-border); }
.dxy-attn-icon { width: 48px; height: 48px; border-radius: 12px; background: #EDE9FE; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
[data-theme="dark"] .dxy-attn-icon { background: #3b2f63; }
.dxy-attn-title { font-size: 19px; font-weight: 800; letter-spacing: -.01em; color: var(--dxy-text); line-height: 1.1; }
.dxy-attn-subtitle { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--dxy-muted); font-family: "IBM Plex Mono", monospace; text-transform: uppercase; margin-top: 2px; }
.dxy-attn-rate-label { font-size: 13px; color: var(--dxy-muted); margin-bottom: 4px; }
.dxy-attn-rate-value { font-size: 40px; font-weight: 800; color: var(--dxy-text); line-height: 1; letter-spacing: -.02em; margin-bottom: 12px; }
.dxy-attn-progress-track { height: 6px; border-radius: 4px; background: var(--dxy-border); overflow: hidden; margin-bottom: 18px; }
.dxy-attn-progress-fill { height: 100%; background: var(--dxy-blue); border-radius: 4px; transition: width 300ms ease; }
.dxy-attn-stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 12px; }
.dxy-attn-stat { border: 1px solid #BAE6FD; border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; background: #E0F2FE; }
.dxy-attn-stat.is-active { border-color: var(--dxy-green); background: rgba(16,185,129,.10); }
[data-theme="dark"] .dxy-attn-stat { background: #0C4A6E; border-color: #0369A1; }
[data-theme="dark"] .dxy-attn-stat.is-active { background: rgba(16,185,129,.14); }
.dxy-attn-stat-icon { font-size: 16px; }
.dxy-attn-stat-label { font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--dxy-muted); font-family: "IBM Plex Mono", monospace; }
.dxy-attn-stat-value { font-size: 20px; font-weight: 800; color: var(--dxy-text); line-height: 1; }
.dxy-attn-stat-value.green { color: var(--dxy-green); }
.dxy-attn-stat-unit { font-size: 9.5px; color: var(--dxy-muted); font-family: "IBM Plex Mono", monospace; }
.dxy-attn-shift-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.dxy-attn-shift-box { border: 1px solid #BAE6FD; border-radius: 12px; padding: 16px 10px; text-align: center; background: #E0F2FE; }
[data-theme="dark"] .dxy-attn-shift-box { background: #0C4A6E; border-color: #0369A1; }
.dxy-attn-shift-value { font-size: 26px; font-weight: 800; color: var(--dxy-purple); line-height: 1; margin-bottom: 6px; }
.dxy-attn-shift-label { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--dxy-muted); font-family: "IBM Plex Mono", monospace; }
.dxy-attn-jenis-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.dxy-attn-jenis-badge.cuti  { background: rgba(20,184,166,.12); color: var(--dxy-teal); }
.dxy-attn-jenis-badge.izin  { background: rgba(249,115,22,.12); color: var(--dxy-orange); }
.dxy-attn-jenis-badge.sakit { background: rgba(239,68,68,.12);  color: var(--dxy-red); }
.dxy-attn-leave-empty { padding: 18px 10px !important; text-align: center; font-size: 11px; color: var(--dxy-muted); white-space: normal !important; border-bottom: none !important; }
.dxy-attn-leave-footer { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--dxy-border); text-align: right; font-size: 10.5px; color: var(--dxy-muted); flex-shrink: 0; }
.dxy-attn-leave-footer b { color: var(--dxy-text); font-size: 12px; }
/* Panel Cuti/Izin/Sakit: TIDAK dipaksa min-height apa pun -- tinggi kotak
   selalu ngikutin isi tabel (header + baris yang ada). Kalau baris
   sedikit, kotaknya ikut pendek, tidak nyisain ruang kosong nganggur. */
.dxy-attn-leave-panel { min-height: 0; }
.dxy-attn-leave-scroll { max-height: 260px !important; }
.dxy-attn-leave-scroll table.dxy-table { table-layout: auto; }
.dxy-attn-leave-row th { text-align: center !important; }
/* Font tabel Izin/Sakit/Cuti/Mangkir dikecilin + warna beda dari
   default (biar nggak polos hitam/putih kayak tabel lain). */
.dxy-attn-leave-panel table.dxy-table thead th { font-size: 7px; color: #0369A1; }
.dxy-attn-leave-panel table.dxy-table tbody td { font-size: 9px; color: #475569; }
[data-theme="dark"] .dxy-attn-leave-panel table.dxy-table thead th { color: #7DD3FC; }
[data-theme="dark"] .dxy-attn-leave-panel table.dxy-table tbody td { color: #CBD5E1; }
/* Hapus garis pembatas antar baris & background putih/selang-seling --
   baris data biar transparan, nyatu sama background panel (bukan kotak
   putih terpisah tiap baris). */
.dxy-attn-leave-panel table.dxy-table tbody td { border-bottom: none; }
.dxy-attn-leave-panel table.dxy-table tbody tr,
.dxy-attn-leave-panel table.dxy-table tbody tr:nth-child(even) { background: transparent; }
.dxy-attn-leave-panel table.dxy-table tbody tr:hover { background: rgba(14,165,233,.08); }
@media (max-width: 640px) {
  .dxy-attn-card { max-width: 100%; }
  .dxy-attn-stat-row { grid-template-columns: repeat(3, 1fr); }
}
</style>
<script>
  (function () {
    var t = localStorage.getItem("theme_v1") || "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script>
  // Daftarkan plugin datalabels tapi MATIKAN secara default supaya chart
  // lain (yang jumlahnya banyak di dashboard ini) nggak tiba-tiba
  // kelebihan label. Cuma chart tertentu (mis. Trend Kehadiran Harian)
  // yang nyalain lewat opsi plugins.datalabels: { display: true, ... }.
  if (typeof Chart !== "undefined" && typeof ChartDataLabels !== "undefined") {
    Chart.register(ChartDataLabels);
    Chart.defaults.set("plugins.datalabels", { display: false });
  }
</script>
<script src="assets/supabaseClient.js"></script>
</head>
<body>

<div class="app-shell" x-data="dashboardExhaust()" x-init="init()">
  <div class="mobile-topbar">
    <button class="hamburger" @click="mobileNavOpen = true">☰</button>
    <span class="mobile-title">Dashboard Exhaust</span>
  </div>
  <div class="sidebar-overlay" x-show="mobileNavOpen" @click="mobileNavOpen = false" x-cloak></div>
  <aside class="sidebar" :class="[mobileNavOpen ? 'sidebar-open' : '', sidebarCollapsed ? 'sidebar-collapsed' : '']">
    <button class="sidebar-collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed">
      <span x-show="!sidebarCollapsed">‹</span><span x-show="sidebarCollapsed">›</span>
    </button>
    <div class="sidebar-brand" x-show="!sidebarCollapsed">WELDING EXHAUST<span>·</span>SYSTEM</div>
    <nav class="sidebar-nav" @click="mobileNavOpen = false">
      <a href="dashboard-exhaust.html" class="sidebar-link active" title="Dashboard Exhaust"><span>📊</span><span x-show="!sidebarCollapsed">Dashboard Exhaust</span></a>
      <a href="index.html" class="sidebar-link" title="Dashboard"><span>🏠</span><span x-show="!sidebarCollapsed">Dashboard</span></a>
      <a href="plan-produksi.html" class="sidebar-link" title="Plan Produksi"><span>📅</span><span x-show="!sidebarCollapsed">Plan Produksi</span></a>
      <a href="input-produksi.html" class="sidebar-link" title="Input Produksi"><span>⚙️</span><span x-show="!sidebarCollapsed">Input Produksi</span></a>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-attendance.html" class="sidebar-link" title="Input Attendance"><span>👥</span><span x-show="!sidebarCollapsed">Input Attendance</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-scrap.html" class="sidebar-link" title="Input Scrap"><span>♻️</span><span x-show="!sidebarCollapsed">Input Scrap</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-safety.html" class="sidebar-link" title="Input Safety"><span>⛑️</span><span x-show="!sidebarCollapsed">Input Safety</span></a>
      </template>
    </nav>
    <div class="sidebar-foot" x-show="!sidebarCollapsed">
      <div class="who" x-text="profile?.full_name || session?.user?.email || '...'"></div>
      <span class="badge" :class="profile?.role === 'admin' ? 'role-admin' : ''" x-text="profile?.jabatan || profile?.role || '...'"></span>
      <button class="btn-ghost btn-sm" @click="logout()">Keluar</button>
    </div>
    <button class="sidebar-logout-collapsed" x-show="sidebarCollapsed" @click="logout()" title="Keluar">⏻</button>
  </aside>

  <main class="main">
    <div class="dash-topbar">
      <div class="dash-title-block">
        <h1>DASHBOARD EXHAUST</h1>
      </div>
      <div class="dash-controls">
        <button class="theme-toggle" @click="toggleTheme()" :title="theme === 'dark' ? 'Ke mode terang' : 'Ke mode gelap'">
          <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
        </button>
      </div>
    </div>

    <!-- Switch Tahunan / Bulanan / Kontrol Kualitas -->
    <div class="dash-subtab-nav" style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn-secondary btn-sm" :class="activeTab==='tahunan' ? 'btn-primary' : ''" @click="setTab('tahunan')">Tahunan</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='bulanan' ? 'btn-primary' : ''" @click="setTab('bulanan')">Kontrol Downtime</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='kualitas' ? 'btn-primary' : ''" @click="setTab('kualitas')">Kontrol Kualitas</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='attendance' ? 'btn-primary' : ''" @click="setTab('attendance')">Kontrol Attendance</button>
    </div>

    <!-- ===== TAB: BULANAN (harian, tanggal 1-31) ===== -->
    <template x-if="activeTab === 'bulanan'">
      <div class="dxy-fill">
        <template x-if="bulananLoading">
          <div class="dxy">
            <div class="dxy-skeleton-row">
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
            </div>
            <p class="empty-state">Memuat data bulanan...</p>
          </div>
        </template>
        <template x-if="!bulananLoading">
          <div class="dxy">

            <!-- ===== Baris 1: Filter bar (Bulan/Tahun + Line) ===== -->
            <div class="dxy-filterbar">
              <div class="dxy-field">
                <label>Bulan</label>
                <select class="dxy-select" x-model.number="bulananMonth" @change="onBulananPeriodChange()">
                  <template x-for="(nm, i) in BULAN_LABELS" :key="'bm-'+i">
                    <option :value="i+1" x-text="nm"></option>
                  </template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Tahun</label>
                <select class="dxy-select" x-model.number="bulananYear" @change="onBulananPeriodChange()">
                  <template x-for="y in tahunanYearOptions" :key="'by-'+y"><option :value="y" x-text="y"></option></template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Line</label>
                <select class="dxy-select" x-model="dxyLineFilterBulanan" @change="onBulananLineFilterChange()">
                  <option value="ALL">Semua Line</option>
                  <template x-for="m in MACHINES_REF" :key="'bl-'+m.key"><option :value="m.key" x-text="m.key"></option></template>
                </select>
              </div>
              <div class="dxy-spacer"></div>
            </div>

            <!-- ===== Baris 2: Productivity & Availability, harian 1-31, dalam % ===== -->
            <div class="dxy-chart-grid">
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">📈 Productivity</span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Rata-rata ' + fmtNum(bulanan.productivity.avg) + '%'"></span></div>
                <div class="dxy-chart-box"><canvas id="dxbProductivity"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">✅ Availability</span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Rata-rata ' + fmtNum(bulanan.availability.avg) + '%'"></span></div>
                <div class="dxy-chart-box"><canvas id="dxbAvailability"></canvas></div>
              </div>
            </div>

            <!-- ===== Baris 3: Downtime Exhaust (FY, seperti di tab Tahunan) +
                 Downtime harian 1-31 + Supporting (PIC) + Line -- 4 chart
                 sejajar (span 4/4/2/2). Supporting & Line dikecilkan (dari
                 span-3 jadi span-2) dan Harian sedikit dikecilkan (dari
                 span-6 jadi span-4) supaya Downtime Exhaust muat masuk. ===== -->
            <div class="dxy-chart-grid">
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">⏱ Downtime Exhaust</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeExhaust"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-5">
                <div class="dxy-panel-head"><span class="dxy-panel-title">⏱ Downtime Harian</span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Total ' + fmtNum(bulanan.downtimeHarian.total) + ' menit'"></span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeHarian"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-2">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🧑‍🔧 Downtime Supporting</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeSupporting"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-2">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🏭 Downtime Line</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeLine"></canvas></div>
              </div>
            </div>

            <!-- ===== Baris 4: Weekly (Week 1 - Week 5) ===== -->
            <div class="dxy-weekly-grid">
              <template x-for="(w, idx) in bulanan.weekly" :key="'bweek-'+idx">
                <div class="dxy-panel">
                  <div class="dxy-panel-head"><span class="dxy-panel-title" x-text="'WEEK ' + (idx + 1)"></span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Total ' + fmtNum(w.values.reduce((a,v)=>a+v,0)) + ' menit'"></span></div>
                  <div class="dxy-chart-box"><canvas :id="'dxbWeek' + (idx + 1)"></canvas></div>
                </div>
              </template>
            </div>

            <!-- ===== Baris 5: Downtime Line (per hari, per line) sejajar dengan
                 Downtime Terbesar (rekap sebulan, per Problem) ===== -->
            <div class="dxy-chart-grid" style="align-items: stretch;">
            <div class="dxy-panel dxy-span-8 dxy-table-panel-sm dxy-dt-merged-panel">
              <div class="dxy-panel-head">
                <div class="qc-panel-title-group">
                  <span class="dxy-panel-title">⏱ Downtime Line</span>
                  <span class="qc-filter-badge" x-show="qcActiveFilterChips('bulananDowntime').length" :title="'Filter aktif: ' + qcActiveFilterChips('bulananDowntime').map(c => c.label).join(', ') + ' — klik untuk hapus semua'" @click="qcResetFilters('bulananDowntime')">
                    <span x-text="qcActiveFilterChips('bulananDowntime').length"></span> filter<span>✕</span>
                  </span>
                </div>
                <div class="qc-rekap-mode">
                  <div class="qc-date-wrap">
                    <input type="date" class="dxy-input" style="min-width:120px;" :class="{ 'qc-date-hidden': !bulananDowntimeUseDate }" x-model="bulananDate" :min="bulananDateMin()" :max="bulananDateMax()" @change="bulananDowntimeUseDate = true; onBulananDowntimeDateChange()">
                    <span class="qc-date-month-label" x-show="!bulananDowntimeUseDate" x-text="bulananMonthLabel"></span>
                  </div>
                  <button type="button" class="qc-rekap-clear-btn" title="Kembali ke tampilan sebulan" x-show="bulananDowntimeUseDate" @click="bulananDowntimeUseDate = false; onBulananDowntimeDateChange()">✕</button>
                </div>
              </div>
              <div class="dxy-table-scroll">
                <table class="dxy-table qc-detail-table">
                  <thead>
                    <tr>
                      <th style="width:6%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'mesin') }" @click="qcToggleFilterDropdown('bulananDowntime', 'mesin', $event)">Line</th>
                      <th style="width:7%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'pic') }" @click="qcToggleFilterDropdown('bulananDowntime', 'pic', $event)">PIC</th>
                      <th style="width:18%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'problem') }" @click="qcToggleFilterDropdown('bulananDowntime', 'problem', $event)">Problem</th>
                      <th style="width:11%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'area') }" @click="qcToggleFilterDropdown('bulananDowntime', 'area', $event)">Area</th>
                      <th style="width:34%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'countermeasure') }" @click="qcToggleFilterDropdown('bulananDowntime', 'countermeasure', $event)">Countermeasure</th>
                      <th style="width:11%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'status') }" @click="qcToggleFilterDropdown('bulananDowntime', 'status', $event)">Status</th>
                      <th style="width:6%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'shift') }" @click="qcToggleFilterDropdown('bulananDowntime', 'shift', $event)">Shift</th>
                      <th style="width:7%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'menit') }" @click="qcToggleFilterDropdown('bulananDowntime', 'menit', $event)">Menit</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(row, i) in bulananDowntimeMergedRows()" :key="'bdt-merged-'+i">
                      <tr>
                        <td style="font-weight:700;" x-text="row.mesin"></td>
                        <td :title="row.pic"><span x-show="row.pic" x-text="row.pic"></span></td>
                        <td :title="row.problem"><span x-show="row.problem" x-text="row.problem"></span></td>
                        <td :title="row.area"><span x-show="row.area" x-text="row.area"></span></td>
                        <td :title="row.countermeasure"><span x-show="row.countermeasure" x-text="row.countermeasure"></span></td>
                        <td>
                          <span x-show="row.status" class="dxy-status-chip" :class="dxyStatusClass(row.status)" x-text="row.status"></span>
                        </td>
                        <td><span x-show="row.shift" x-text="row.shift"></span></td>
                        <td style="text-align:right">
                          <span x-show="row.menit !== ''" class="dxy-minute-badge" x-text="row.menit"></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="dxy-panel dxy-span-4 dxy-table-panel-sm dxy-dt-summary-panel" x-ref="bulananTopProblemPanel">
              <div class="dxy-panel-head">
                <div class="qc-panel-title-group">
                  <span class="dxy-panel-title">🔥 Downtime Terbesar</span>
                  <span class="qc-filter-badge" x-show="qcActiveFilterChips('bulananTopProblem').length" :title="'Filter aktif: ' + qcActiveFilterChips('bulananTopProblem').map(c => c.label).join(', ') + ' — klik untuk hapus semua'" @click="qcResetFilters('bulananTopProblem')">
                    <span x-text="qcActiveFilterChips('bulananTopProblem').length"></span> filter<span>✕</span>
                  </span>
                </div>
                <span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="bulananMonthLabel"></span>
              </div>
              <div class="dxy-table-scroll">
                <table class="dxy-table qc-detail-table">
                  <thead>
                    <tr>
                      <th :class="{ 'qc-th-active': qcColFilterActive('bulananTopProblem', 'problem') }" @click="qcToggleFilterDropdown('bulananTopProblem', 'problem', $event)">Problem</th>
                      <th style="width:64px" :class="{ 'qc-th-active': qcColFilterActive('bulananTopProblem', 'menit') }" @click="qcToggleFilterDropdown('bulananTopProblem', 'menit', $event)">Menit</th>
                      <th style="width:70px" :class="{ 'qc-th-active': qcColFilterActive('bulananTopProblem', 'frekuensi') }" @click="qcToggleFilterDropdown('bulananTopProblem', 'frekuensi', $event)">Frekuensi</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(row, i) in bulananDowntimeTerbesarBulanRows()" :key="'bdt-summary-'+i">
                      <tr :class="{ 'dxy-row-clickable': row.problem }" :title="row.problem ? 'Double-klik untuk detail per line' : ''" @dblclick="row.problem && openProblemDetail(row.problem)">
                        <td :title="row.problem"><span x-show="row.problem" x-text="row.problem"></span></td>
                        <td style="text-align:right">
                          <span x-show="row.menit !== ''" class="dxy-minute-badge" x-text="row.menit"></span>
                        </td>
                        <td style="text-align:right">
                          <span x-show="row.frekuensi !== ''" class="dxy-freq-badge" x-text="row.frekuensi"></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
            </div>

          </div>
        </template>
      </div>
    </template>
    <template x-if="activeTab === 'tahunan'">
      <div class="dxy-fill">
        <template x-if="tahunanLoading">
          <div class="dxy">
            <div class="dxy-skeleton-row">
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
            </div>
            <p class="empty-state">Memuat data tahunan...</p>
          </div>
        </template>
        <template x-if="!tahunanLoading">
          <div class="dxy">

            <!-- ===== Baris 1: Filter bar ===== -->
            <div class="dxy-filterbar">
              <div class="dxy-field">
                <label>Tahun</label>
                <select class="dxy-select" x-model.number="tahunanYear" @change="onTahunanYearChange()">
                  <template x-for="y in tahunanYearOptions" :key="y"><option :value="y" x-text="'FY ' + y"></option></template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Line</label>
                <select class="dxy-select" x-model="dxyLineFilter" @change="dxyRebuildTahunanSeries(); computeTahunanInsights(); $nextTick(() => renderTahunanCharts())">
                  <option value="ALL">Semua Line</option>
                  <template x-for="m in MACHINES_REF" :key="m.key"><option :value="m.key" x-text="m.key"></option></template>
                </select>
              </div>
            </div>

            <!-- ===== Grafik utama: Productivity, Availability, NG Inline, Straight Pass -- 4 kolom sejajar ===== -->
            <div class="dxy-chart-grid dxy-tahunan-main-grid">
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">📈 Productivity</span></div>
                <div class="dxy-chart-box"><canvas id="dxyBigProductivity"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">✅ Availability</span></div>
                <div class="dxy-chart-box"><canvas id="dxyBigAvailability"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🔶 NG Inline</span></div>
                <div class="dxy-chart-box"><canvas id="dxyBigNg"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🎯 Straight Pass</span></div>
                <div class="dxy-chart-box"><canvas id="dxyBigStraightpass"></canvas></div>

  <!-- Dropdown filter per-kolom (Rekap NG Inline / NG Trial / Repair) --

       di tabel Problem untuk lihat breakdown per Line untuk bulan yang lagi

       panel "Downtime Terbesar" (posisi dihitung di positionProblemDetail()
       sama seperti pola dropdown filter kolom). Di-teleport ke <body>
       supaya tidak kepotong overflow tabel. -->
  <template x-teleport="body">
    <div class="dxy-pd-modal" x-ref="dxyProblemDetailBox" x-show="dxyProblemDetail.open" x-cloak :style="'top:'+dxyProblemDetailPos.top+'px; left:'+dxyProblemDetailPos.left+'px;'" @click.outside="closeProblemDetail()" @keydown.escape.window="closeProblemDetail()">
        <div class="dxy-pd-head">
          <div>
            <div class="dxy-pd-title">Detail Downtime per Line</div>
            <div class="dxy-pd-problem" x-text="dxyProblemDetail.problem"></div>
          </div>
          <button type="button" class="dxy-pd-close" @click="closeProblemDetail()" title="Tutup">✕</button>
        </div>
        <div class="dxy-pd-sub" x-text="bulananMonthLabel + ' ' + bulananYear"></div>
        <div class="dxy-pd-body">
          <div class="dxy-pd-loading" x-show="dxyProblemDetail.loading">Memuat detail...</div>
          <template x-if="!dxyProblemDetail.loading">
            <div>
              <table class="dxy-pd-table" x-show="dxyProblemDetail.rows.length">
                <thead>
                  <tr><th>Line</th><th style="text-align:right">Frek.</th><th style="text-align:right">Menit</th></tr>
                </thead>
                <tbody>
                  <template x-for="(r, i) in dxyProblemDetail.rows" :key="'pd-'+i">
                    <tr>
                      <td style="font-weight:700;" x-text="r.mesin"></td>
                      <td style="text-align:right" x-text="r.frekuensi"></td>
                      <td class="dxy-pd-menit" x-text="fmtNum(r.menit)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="dxy-pd-empty" x-show="!dxyProblemDetail.rows.length">Tidak ada detail per line untuk problem ini.</div>
            </div>
          </template>
        </div>
        <div class="dxy-pd-total" x-show="dxyProblemDetail.rows.length">
          <span>Total</span>
          <span x-text="fmtNum(dxyProblemDetail.rows.reduce((a,r)=>a+r.menit,0)) + ' menit'"></span>
        </div>
    </div>
  </template>

<script>
const MACHINES = [
  { key: "E-02", label: "E-02", href: "machines/e-02.html" },
  { key: "E-03", label: "E-03", href: "machines/e-03.html" },
  { key: "E-04", label: "E-04", href: "machines/e-04.html" },
  { key: "E-05", label: "E-05", href: "machines/e-05.html" },
  { key: "E-06", label: "E-06", href: "machines/e-06.html" },
  { key: "E-07", label: "E-07", href: "machines/e-07.html" },
];

const BULAN_LABELS = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
// Daftar tetap Line & Model untuk chart Perline/Model di tab Kontrol Kualitas
const QC_LINES = ["E-02", "E-03", "E-04", "E-05", "E-06", "E-07"];
const QC_MODELS = ["YR9", "YHA", "K15B", "K15C", "D98E", "889F", "D13", "D73F", "D40"];
// Jumlah hari dalam bulan tertentu (menangani tahun kabisat)
function daysInMonth(year, month1to12) {
  return new Date(year, month1to12, 0).getDate();
}

function fmtNum(n) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return "-";
  return Number(n).toLocaleString("en-US", { maximumFractionDigits: 1 });
}
// Format tanggal 'YYYY-MM-DD' -> 'DD/MM/YYYY' (dipakai kolom "Tanggal
// Cuti" di tabel Cuti tab Kontrol Attendance).
function fmtTglID(s) {
  if (!s) return "-";
  const [y, m, d] = s.split("-");
  return `${d}/${m}/${y}`;
}
// Gabungkan tanggal mulai & selesai cuti jadi 1 label -- tidak dipakai
// lagi di tabel Cuti (sekarang tabel Cuti nampilin tanggal yang lagi
// dibuka di date picker, bukan rentangnya), tapi disimpan di sini kalau
// suatu saat perlu lagi (mis. laporan cetak/export).
function fmtCutiTanggal(row) {
  const mulai = row.tanggal;
  const selesai = row.tanggalSelesai || row.tanggal;
  if (!mulai) return "-";
  if (selesai === mulai) return fmtTglID(mulai);
  return `${fmtTglID(mulai)} - ${fmtTglID(selesai)}`;
}
// Angka utuh (TIDAK dibagi 1000) tapi dikasih titik pemisah ribuan --
// dipakai buat kolom Value NG Inline/NG Trial di tabel Rekap & NG Terbesar.
function fmtRibuan(n) {
  if (n === null || n === undefined || n === "" || Number.isNaN(Number(n))) return n ?? "";
  return Number(n).toLocaleString("id-ID", { maximumFractionDigits: 0 });
}
function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// Default hover/tooltip GLOBAL untuk semua chart Chart.js di dashboard ini.
// Tooltip HARUS muncul cuma kalau kursor tepat di atas batang atau tepat di
// garis/titik (intersect: true) -- ini perilaku standar/umum, bukan "muncul
// begitu kursor ada di kolom yang sama". Supaya titik garis yang radius
// visualnya kecil (1-3px) tetap gampang "kena" walau kursor tidak persis
// 100% di pixel titiknya, area sentuh (hitRadius) diperbesar -- ini TIDAK
// mengubah tampilan visual titik (radius gambar tetap sama persis seperti
// yang sudah di-set tiap chart), cuma memperbesar area tak-kasat-mata yang
// dianggap "menyentuh" titik itu.
if (typeof Chart !== "undefined") {
  Chart.defaults.interaction = { mode: "nearest", intersect: true };
  Chart.defaults.elements.point.hitRadius = 8;
}

function dashboardExhaust() {
  return {
    session: null, profile: null, mobileNavOpen: false, sidebarCollapsed: true,
    loading: true,
    activeTab: "bulanan", // bulanan | tahunan | kualitas | attendance
    theme: localStorage.getItem("theme_v1") || "light",
    fmtNum,
    isLeaderOrAdmin() { return this.profile && ["admin", "leader"].includes(this.profile.role); },
    destroyBulananCharts() {
      Object.keys(this.bulananCharts).forEach((id) => {
        try { this.bulananCharts[id].destroy(); } catch (e) { /* noop */ }
        delete this.bulananCharts[id];
      });
    },
    destroyTahunanCharts() {
      Object.keys(this.tahunanCharts).forEach((id) => {
        try { this.tahunanCharts[id].destroy(); } catch (e) { /* noop */ }
        delete this.tahunanCharts[id];
      });
    },
    destroyKualitasCharts() {
      Object.keys(this.qcCharts).forEach((id) => {
        try { this.qcCharts[id].destroy(); } catch (e) { /* noop */ }
        delete this.qcCharts[id];
      });
    },
    destroyAttendanceCharts() {
      Object.keys(this.attendanceCharts).forEach((id) => {
        try { this.attendanceCharts[id].destroy(); } catch (e) { /* noop */ }
        delete this.attendanceCharts[id];
      });
    },
    async setTab(tab) {
      if (this.activeTab === "bulanan" && tab !== "bulanan") this.destroyBulananCharts();
      if (this.activeTab === "tahunan" && tab !== "tahunan") this.destroyTahunanCharts();
      if (this.activeTab === "kualitas" && tab !== "kualitas") this.destroyKualitasCharts();
      if (this.activeTab === "attendance" && tab !== "attendance") this.destroyAttendanceCharts();
      this.activeTab = tab;
      if (tab === "bulanan") {
        await this.fetchBulanan();
        this.$nextTick(() => this.renderBulananCharts());
      }
      if (tab === "tahunan") {
        await this.fetchTahunan();
        this.$nextTick(() => this.renderTahunanCharts());
      }
      if (tab === "kualitas") {
        await this.fetchTahunan();
        await this.fetchQcNgInline();
        await this.fetchQcNgTrial();
        await this.fetchQcRepairDetail();
        await this.fetchQcRepairPerlineModel();
        await this.fetchQcStraightpassBreakdown();
        await this.fetchQcLineModelMap();
        this.$nextTick(() => this.renderKualitasCharts());
      }
      if (tab === "attendance") {
        await this.fetchAttendance();
        await this.fetchAttendanceLeave();
        this.$nextTick(() => this.renderAttendanceCharts());
      }
    },
    async onTahunanYearChange() {
      this.destroyTahunanCharts();
      this.tahunanLoaded = false;
      await this.fetchTahunan();
      this.qcColFilters = { ...this.qcColFilters, tahunanDowntime: {}, tahunanNg: {}, tahunanRepair: {} };
      this.$nextTick(() => this.renderTahunanCharts());
    },
    toggleTheme() {
      this.theme = this.theme === "dark" ? "light" : "dark";
      localStorage.setItem("theme_v1", this.theme);
      document.documentElement.setAttribute("data-theme", this.theme);
      if (this.activeTab === "bulanan") this.$nextTick(() => this.renderBulananCharts());
      if (this.activeTab === "tahunan") this.$nextTick(() => this.renderTahunanCharts());
      if (this.activeTab === "attendance") this.$nextTick(() => this.renderAttendanceCharts());
    },
    // ---------------------------------------------------------------
    // DATA DUMMY "Bulanan" -- sementara statis, tinggal diganti hasil
    // query Supabase (RPC / view rollup bulanan) begitu tabelnya siap.
    // ---------------------------------------------------------------
    // ---------------------------------------------------------------
    // Data "Bulanan" -- diisi dari fetchBulanan() (RPC Supabase, lihat
    // migration_dashboard_bulanan.sql). Skeleton kosong dulu supaya
    // template tidak error sebelum data datang.
    // ---------------------------------------------------------------
    bulananLoading: true,
    bulananLoaded: false,
    // Line (dxyLineFilterBulanan) yang dipakai waktu fetchBulanan()
    // terakhir sukses -- disimpan supaya bulananLoaded=true tidak cukup
    // jadi penanda "data masih relevan" kalau user ganti Line di dropdown
    // Bulanan (lihat fetchBulanan()). dxyLineFilterBulanan TERPISAH dari
    // dxyLineFilter (punya tab Tahunan) -- ganti Line di 1 tab TIDAK
    // mempengaruhi Line di tab satunya.
    _bulananLoadedLine: null,
    // Periode yang lagi dipilih di tab Bulanan (bulan + tahun berjalan default)
    bulananMonth: new Date().getMonth() + 1,
    bulananYear: new Date().getFullYear(),
    // Periode yang lagi dipilih di tab Kontrol Attendance.
    attendanceMonth: new Date().getMonth() + 1,
    attendanceYear: new Date().getFullYear(),
    // Tanggal yang lagi dipilih untuk daftar Izin/Sakit/Cuti/Mangkir (4
    // kolom di bawah). Default = HARI INI (format YYYY-MM-DD, dipakai
    // langsung oleh <input type="date">).
    attendanceDate: new Date().toISOString().slice(0, 10),
    attendance: {
      rate: 0, total: 0, hadir: 0, cuti: 0, absen: 0, ot: 0, shift1: 0, shift2: 0,
      // Trend kehadiran harian (tanggal 1-31), diisi oleh fetchAttendance().
      // hadir = dari attendance_log. izin/sakit/cuti/mangkir = jumlah ORANG
      // per hari dari attendance_leave (cuti dihitung "nyala" tiap hari di
      // antara tanggal mulai-selesai). Dipakai di chart batang bertumpuk
      // "Trend Kehadiran Harian" -- tiap array warnanya beda.
      dailyTrend: {
        hadir: Array.from({ length: 31 }, () => null),
        izin: Array.from({ length: 31 }, () => null),
        sakit: Array.from({ length: 31 }, () => null),
        cuti: Array.from({ length: 31 }, () => null),
        mangkir: Array.from({ length: 31 }, () => null),
        persen: Array.from({ length: 31 }, () => null),
      },
      // 4 daftar terpisah -- Izin / Sakit / Cuti / Mangkir. Diisi oleh
      // fetchAttendanceLeave() dari tabel attendance_leave (lihat
      // migration_attendance_leave.sql), difilter per this.attendanceDate.
      // Bentuk tiap baris:
      // izin/sakit:  { nik, nama, tanggal, alasan }
      // cuti:        { nik, nama, tanggal, tanggalSelesai, jumlahHari, jenisCuti, keterangan }
      // mangkir:     { nik, nama, tanggal, keterangan }
      izinList: [],
      sakitList: [],
      cutiList: [],
      mangkirList: [],
    },
    qcMonth: new Date().getMonth() + 1,
    qcYear: new Date().getFullYear(),
    // Filter Line (picker) KHUSUS tab Kontrol Kualitas -- "ALL" = tampilkan
    // semua line (perilaku lama, tidak berubah). Kalau diganti ke salah
    // satu line: chart *Perline (NG Inline/NG Trial/Straightpass) tetap
    // menampilkan SEMUA line, cuma line yang dipilih di-highlight (line
    // lain dipudarkan) -- datanya TIDAK difilter/dihilangkan. Sedangkan
    // chart *Model (NG Inline/NG Trial/Straightpass) beneran DISARING:
    // cuma model yang ada di line itu yang ditampilkan. Lihat
    // fetchQcLineModelMap() & renderKualitasCharts() untuk detail
    // mekanismenya, termasuk catatan keterbatasan data Straightpass Model.
    qcLineFilter: "ALL",
    // Filter tanggal untuk tabel "Downtime Terbesar per Line" -- tabel ini
    // SELALU per-tanggal (default hari ini, bisa diganti lewat date picker).
    bulananDate: localDateStr(new Date()),
    // Mode tabel "Downtime Line": FALSE (default) = tampil SEBULAN PENUH,
    // TRUE = tampil 1 tanggal spesifik (bulananDate) -- persis pola
    // qcNgInlineUseDate di tab Kontrol Kualitas.
    bulananDowntimeUseDate: false,
    bulananDtLoading: false,
    // ---------------------------------------------------------------
    // Tab "Kontrol Kualitas" -- kolom NG Inline sudah disambungkan ke
    // RPC asli (dashboard_qc_ng_*, lihat migration_dashboard_kualitas.sql).
    // Kolom NG Trial & Straightpass masih placeholder kosong.
    // ---------------------------------------------------------------
    // Default: field tanggal diisi DIAM-DIAM dengan tanggal 1 di bulan yang
    // lagi dipilih -- ini SEMATA-MATA supaya saat kalender bawaan browser
    // dibuka, dia terbuka pas di bulan yang benar (Juli misalnya), bukan
    // di bulan hari-ini-beneran (browser defaultnya begitu kalau field
    // kosong total). Tampilan tetap terlihat kosong di layar (lihat CSS

      if (activeCols.length === 0) return rows;
      return rows.filter((row) => activeCols.every((col) => (filters[col] || []).includes(String(row[col] ?? ""))));

    // Buka/tutup dropdown filter untuk kolom tertentu. Posisi dropdown
    // dihitung dari posisi header (<th>) yang diklik supaya dropdown
    // muncul persis di bawahnya, walau tabelnya ada di dalam box yang
    // discroll (dropdown sendiri di-teleport ke <body> jadi tidak
    // kepotong overflow:hidden/auto box tabel).
    qcToggleFilterDropdown(table, col, evt) {
      const key = table + ":" + col;
      if (this.qcFilterOpen === key) {
        this.qcFilterOpen = null;
        return;
      }
      this.qcFilterSearch = "";
      this.qcFilterOpen = key;
      const th = evt.currentTarget || (evt.target && evt.target.closest("th"));
      this.$nextTick(() => {
        if (!th) return;
        const rect = th.getBoundingClientRect();
        const box = this.$refs.qcFilterBox;
        const boxHeight = box ? box.offsetHeight : 260;
        const boxWidth = box ? box.offsetWidth : 200;
        // Selalu muncul di ATAS header. Kalau ruang di atas nggak cukup
        // (header-nya deket banget ke ujung atas layar), baru turun
        // sedikit supaya tetap kelihatan penuh, bukan kepotong.
        let top = rect.top - boxHeight - 6;
        if (top < 8) top = 8;
        let left = rect.left;
        if (left + boxWidth > window.innerWidth - 8) left = window.innerWidth - boxWidth - 8;
        if (left < 8) left = 8;
        this.qcFilterPos = { top, left };
      });
    },
    qcColFilterActive(table, col) {
      return Object.prototype.hasOwnProperty.call(this.qcColFilters[table] || {}, col);
    },
    // Label kolom yang dropdown-nya lagi kebuka -- ditampilkan sebagai
    // judul kecil di dalam dropdown (mis. "Filter: Part No") supaya tetap
    // jelas ini filter kolom apa, walau header sendiri tidak dikasih ikon.
    qcFilterColLabel() {
      if (!this.qcFilterOpen) return "";
      const [table, col] = this.qcFilterOpen.split(":");
      const colDef = this.qcColsFor(table).find((c) => c.key === col);
      return colDef ? colDef.label : col;
