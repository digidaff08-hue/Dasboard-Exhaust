<!DOCTYPE html>

<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/dashboard-exhaust.css">
<script>
  (function () {
    var t = "light";   // mode gelap dinonaktifkan -- tombolnya sudah dihapus
    try { localStorage.removeItem("theme_v1"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script>
  // Daftarkan plugin datalabels tapi MATIKAN secara default supaya chart
  // lain (yang jumlahnya banyak di dashboard ini) nggak tiba-tiba
  // kelebihan label. Cuma chart tertentu (mis. Trend Kehadiran Harian)
  // yang nyalain lewat opsi plugins.datalabels: { display: true, ... }.
  if (typeof Chart !== "undefined" && typeof ChartDataLabels !== "undefined") {
    Chart.register(ChartDataLabels);
    Chart.defaults.set("plugins.datalabels", { display: false });

    // Semua GARIS (dataset tipe line, termasuk garis Target & area) di
    // seluruh dashboard dibuat lebih tipis + marker lebih kecil, dari SATU
    // tempat ini -- jadi tidak perlu ubah puluhan dataset satu per satu.
    // Ubah angka di LINE_STYLE kalau mau diatur lagi:
    //   widthScale : pengali tebal garis   (1.5 -> 1, 2 -> 1.3)
    //   minWidth   : tebal garis paling tipis
    //   pointScale : pengali ukuran marker (1 -> 0.6, 3 -> 1.8)
    //   hoverRadius: ukuran marker saat disorot mouse
    const LINE_STYLE = { widthScale: 0.67, minWidth: 0.75, pointScale: 0.6, hoverRadius: 3 };
    const scaleNum = (v, k, min) => (typeof v === "number" ? Math.max(min, Math.round(v * k * 100) / 100) : v);
    // BEVEL untuk SEMUA grafik batang di dashboard (termasuk batang
    // bertumpuk & batang horizontal). Tiap batang diberi 4 sisi miring:
    //   atas & kiri  -> kilap terang (kesan kena cahaya)
    //   bawah & kanan -> bayangan gelap
    // jadi batang terlihat timbul/bervolume. Diatur dari BEVEL_STYLE:
    //   size  : lebar sisi bevel (px), otomatis mengecil di batang tipis
    //   light : kekuatan kilap sisi atas/kiri
    //   dark  : kekuatan bayangan sisi bawah/kanan
    // Matikan untuk chart tertentu dengan
    //   options.plugins.dxBarBevel = { enabled: false }
    const BEVEL_STYLE = { size: 3, lightTop: 0.45, lightLeft: 0.30, darkRight: 0.22, darkBottom: 0.30 };
    const bevelPoly = (ctx, pts, color) => {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    };
    Chart.register({
      id: "dxBarBevel",
      afterDatasetsDraw(chart, args, opts) {
        if (opts && opts.enabled === false) return;
        const horizontal = chart.options.indexAxis === "y";
        const { ctx } = chart;
        (chart.data.datasets || []).forEach((ds, i) => {
          const meta = chart.getDatasetMeta(i);
          if (!meta || meta.type !== "bar" || !meta.data || !chart.isDatasetVisible(i)) return;
          meta.data.forEach((bar) => {
            const p = bar.getProps(["x", "y", "base", "width", "height"], true);
            let L, T, W, H;
            if (horizontal) { L = Math.min(p.x, p.base); W = Math.abs(p.x - p.base); T = p.y - p.height / 2; H = p.height; }
            else { T = Math.min(p.y, p.base); H = Math.abs(p.y - p.base); L = p.x - p.width / 2; W = p.width; }
            if (!(W > 2) || !(H > 2)) return;
            const b = Math.min(BEVEL_STYLE.size, W / 4, H / 4);
            const R = L + W, B = T + H;
            ctx.save();
            bevelPoly(ctx, [[L, T], [R, T], [R - b, T + b], [L + b, T + b]], `rgba(255,255,255,${BEVEL_STYLE.lightTop})`);
            bevelPoly(ctx, [[L, T], [L + b, T + b], [L + b, B - b], [L, B]], `rgba(255,255,255,${BEVEL_STYLE.lightLeft})`);
            bevelPoly(ctx, [[R, T], [R, B], [R - b, B - b], [R - b, T + b]], `rgba(0,0,0,${BEVEL_STYLE.darkRight})`);
            bevelPoly(ctx, [[L, B], [R, B], [R - b, B - b], [L + b, B - b]], `rgba(0,0,0,${BEVEL_STYLE.darkBottom})`);
            ctx.restore();
          });
        });
      },
    });

    Chart.register({
      id: "dxThinLines",
      beforeUpdate(chart) {
        const chartType = chart.config.type;
        (chart.data.datasets || []).forEach((ds) => {
          if (!ds || ds.__dxThin) return;
          const isLine = (ds.type || chartType) === "line";
          if (!isLine) return;
          ds.__dxThin = true;
          ds.borderWidth = scaleNum(ds.borderWidth ?? 1.5, LINE_STYLE.widthScale, LINE_STYLE.minWidth);
          const r = ds.pointRadius ?? 3;
          ds.pointRadius = Array.isArray(r) ? r.map((x) => scaleNum(x, LINE_STYLE.pointScale, 0)) : scaleNum(r, LINE_STYLE.pointScale, 0);
          if (ds.pointBorderWidth !== undefined) ds.pointBorderWidth = scaleNum(ds.pointBorderWidth, LINE_STYLE.pointScale, 0);
          ds.pointHoverRadius = LINE_STYLE.hoverRadius;
        });
      },
    });
  }
</script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/realtime.js"></script>
</head>
<body>

<div class="app-shell" x-data="dashboardExhaust()">
  <div class="mobile-topbar">
    <button class="hamburger" @click="mobileNavOpen = true"><svg class="sb-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
  </div>

  <div class="sidebar-overlay" x-show="mobileNavOpen" @click="mobileNavOpen = false" x-cloak></div>
  <aside class="sidebar" :class="[mobileNavOpen ? 'sidebar-open' : '', sidebarCollapsed ? 'sidebar-collapsed' : '']">
    <button class="sidebar-collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed">
      <span x-show="!sidebarCollapsed">‹</span><span x-show="sidebarCollapsed">›</span>
    </button>
    <div class="sidebar-brand" x-show="!sidebarCollapsed"><span class="sb-brand-title">WELDING EXHAUST</span><span class="sb-brand-sub">PT Futaba Industrial Indonesia</span></div>
    <nav class="sidebar-nav" @click="mobileNavOpen = false">
      <a href="dashboard-exhaust.html" class="sidebar-link active" title="Dashboard Exhaust"><span class="sb-ico"><svg class="sb-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 8h4v13h-4z"/></svg></span><span x-show="!sidebarCollapsed">Dashboard Exhaust</span></a>
      <a href="input-produksi.html" class="sidebar-link" title="Input Produksi" x-show="!isGuest() && !isViewer()"><span class="sb-ico"><svg class="sb-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></span><span x-show="!sidebarCollapsed">Input Produksi</span></a>
      <a href="input-attendance.html" class="sidebar-link" title="Attendance" x-show="isLeaderOrAdmin() || isViewer()"><span class="sb-ico"><svg class="sb-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></span><span x-show="!sidebarCollapsed">Attendance</span></a>
      <a href="andon.html" class="sidebar-link" title="Andon" x-show="!isGuest()"><span class="sb-ico"><svg class="sb-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C8.63 5.36 7 7.92 7 11v5l-2 2v1h14v-1l-2-2z"/></svg></span><span x-show="!sidebarCollapsed">Andon</span></a>
            <a href="data-mentah.html" class="sidebar-link" title="Data Mentah" x-show="isAdmin()"><span class="sb-ico"><svg class="sb-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 7.6V12c0 1.66 3.58 3 8 3s8-1.34 8-3V7.6C18.4 8.9 15.3 9.6 12 9.6S5.6 8.9 4 7.6z"/><path d="M4 14.6V19c0 1.66 3.58 3 8 3s8-1.34 8-3v-4.4c-1.6 1.3-4.7 2-8 2s-6.4-.7-8-2z"/></svg></span><span x-show="!sidebarCollapsed">Data Mentah</span></a>
<a href="master-data.html" class="sidebar-link" title="Master Data" x-show="isAdmin()"><span class="sb-ico"><svg class="sb-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg></span><span x-show="!sidebarCollapsed">Master Data</span></a>
    </nav>
    <div class="sidebar-foot" x-show="!sidebarCollapsed">
      <div class="sb-av" x-text="((profile?.full_name || session?.user?.email || '?').trim().charAt(0) || '?').toUpperCase()"></div>
      <div class="sb-user"><div class="who" x-text="profile?.full_name || session?.user?.email || '...'"></div>
      <span class="badge" :class="profile?.role === 'admin' ? 'role-admin' : ''" x-text="profile?.jabatan || profile?.role || '...'"></span></div>
      <button class="btn-ghost btn-sm" @click="logout()">Keluar</button>
    </div>
    <button class="sidebar-logout-collapsed" x-show="sidebarCollapsed" @click="logout()" title="Keluar"><svg class="sb-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M13 3h-2v10h2V3zm4.83 2.17-1.42 1.42A6.92 6.92 0 0 1 19 12a7 7 0 1 1-11.42-5.42L6.17 5.17A8.93 8.93 0 0 0 3 12a9 9 0 0 0 18 0c0-2.74-1.23-5.18-3.17-6.83z"/></svg></button>
  </aside>

  <main class="main">
    <div class="dash-topbar">
      <div class="dash-title-block">
        <h1>DASHBOARD EXHAUST</h1>
      </div>
      <div class="dash-controls">
        <div class="dxy-live-clock" x-data="{
          now: new Date(),
          init() { setInterval(() => { this.now = new Date() }, 1000) },
          timeStr() {
            const d = this.now;
            const p = (n) => String(n).padStart(2, '0');
            return p(d.getHours()) + '.' + p(d.getMinutes()) + '.' + p(d.getSeconds());
          },
          dateStr() {
            const hari = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
            const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
            const d = this.now;
            return hari[d.getDay()] + ', ' + String(d.getDate()).padStart(2, '0') + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
          }
        }">
          <div class="dxy-clock-time" x-text="timeStr()"></div>
          <div class="dxy-clock-date" x-text="dateStr()"></div>
        </div>
      </div>
    </div>

    <!-- Switch Tahunan / Bulanan / Kontrol Kualitas -->
    <div class="dash-subtab-nav" style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn-secondary btn-sm" :class="activeTab==='tahunan' ? 'btn-primary' : ''" @click="setTab('tahunan')">Tahunan</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='bulanan' ? 'btn-primary' : ''" @click="setTab('bulanan')">Kontrol Downtime</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='kualitas' ? 'btn-primary' : ''" @click="setTab('kualitas')">Kontrol Kualitas</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='attendance' ? 'btn-primary' : ''" @click="setTab('attendance')">Kontrol Attendance</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='performance' ? 'btn-primary' : ''" @click="setTab('performance')">Performance</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='plan_harian' ? 'btn-primary' : ''" @click="setTab('plan_harian')">Plan Harian</button>
    </div>

    <!-- ===== TAB: BULANAN (harian, tanggal 1-31) ===== -->
    <template x-if="activeTab === 'bulanan'">
      <div class="dxy-fill">
        <template x-if="bulananLoading">
          <div class="dxy">
            <div class="dxy-skeleton-row">
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
              <div class="dxy-skeleton"></div><div class="dxy-skeleton"></div>
            </div>
            <p class="empty-state">Memuat data bulanan...</p>
          </div>
        </template>
        <template x-if="!bulananLoading">
          <div class="dxy">

            <!-- ===== Baris 1: Filter bar (Bulan/Tahun + Line) ===== -->
            <div class="dxy-filterbar">
              <div class="dxy-field">
                <label>Bulan</label>
                <select class="dxy-select" x-model.number="bulananMonth" @change="onBulananPeriodChange()">
                  <template x-for="b in BULAN_FY" :key="'bm-'+b.n">
                    <option :value="b.n" x-text="b.nm"></option>
                  </template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Tahun</label>
                <select class="dxy-select" x-model.number="bulananYear" @change="onBulananPeriodChange()">
                  <template x-for="y in tahunanYearOptions" :key="'by-'+y"><option :value="y" x-text="y"></option></template>
                </select>
              </div>
              <div class="dxy-field">
                <label>Line</label>
                <select class="dxy-select" x-model="dxyLineFilterBulanan" @change="onBulananLineFilterChange()">
                  <option value="ALL">Semua Line</option>
                  <template x-for="m in MACHINES_REF" :key="'bl-'+m.key"><option :value="m.key" x-text="m.key"></option></template>
                </select>
              </div>
              <div class="dxy-spacer"></div>
            </div>

            <!-- ===== Baris 2: Productivity & Availability, harian 1-31, dalam % ===== -->
            <div class="dxy-chart-grid">
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head">
                  <span class="dxy-panel-title">📈 Productivity</span>
                  <span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text); text-align:right; line-height:1.3;">
                    <span style="display:block;" :style="{ color: dxyAvgVsTargetColor(bulanan.productivity.avg, bulanan.productivity.target) }" x-text="dxyAvgVsTargetText(bulanan.productivity.avg, bulanan.productivity.target)"></span>
                    <!-- Target ikut bulan yang dipilih; kalau bulan itu belum
                         diisi di Master Data, otomatis jadi 100% -->
                    <!-- Warna Target dibuat abu-abu netral (dulu merah) supaya tidak
                         tertukar dengan Rata-rata yang merah saat di bawah target. -->
                    <span style="display:block; font-weight:600; color:#475569;" x-text="'Target : ' + fmtNum(bulanan.productivity.target) + ' %'"></span>
                  </span>
                </div>
                <div class="dxy-chart-box"><canvas id="dxbProductivity"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-6">
                <div class="dxy-panel-head"><span class="dxy-panel-title">✅ Availability</span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Rata-rata ' + fmtNum(bulanan.availability.avg) + '%'"></span></div>
                <div class="dxy-chart-box"><canvas id="dxbAvailability"></canvas></div>
              </div>
            </div>

            <!-- ===== Baris 3: Downtime Exhaust (FY, seperti di tab Tahunan) +
                 Downtime harian 1-31 + Supporting (PIC) + Line -- 4 chart
                 sejajar (span 4/4/2/2). Supporting & Line dikecilkan (dari
                 span-3 jadi span-2) dan Harian sedikit dikecilkan (dari
                 span-6 jadi span-4) supaya Downtime Exhaust muat masuk. ===== -->
            <div class="dxy-chart-grid">
              <div class="dxy-panel dxy-span-3">
                <div class="dxy-panel-head"><span class="dxy-panel-title">⏱ Downtime Exhaust</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeExhaust"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-5">
                <div class="dxy-panel-head"><span class="dxy-panel-title">⏱ Downtime Harian</span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Total ' + fmtNum(bulanan.downtimeHarian.total) + ' menit'"></span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeHarian"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-2">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🧑‍🔧 Downtime Supporting</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeSupporting"></canvas></div>
              </div>
              <div class="dxy-panel dxy-span-2">
                <div class="dxy-panel-head"><span class="dxy-panel-title">🏭 Downtime Line</span></div>
                <div class="dxy-chart-box tall"><canvas id="dxbDowntimeLine"></canvas></div>
              </div>
            </div>

            <!-- ===== Baris 4: Weekly (Week 1 - Week 5) ===== -->
            <div class="dxy-weekly-grid">
              <template x-for="(w, idx) in bulanan.weekly" :key="'bweek-'+idx">
                <div class="dxy-panel">
                  <div class="dxy-panel-head"><span class="dxy-panel-title" x-text="'WEEK ' + (idx + 1)"></span><span class="dxy-panel-sub" style="font-weight:700; color:var(--dxy-text);" x-text="'Total ' + fmtNum(w.values.reduce((a,v)=>a+v,0)) + ' menit'"></span></div>
                  <div class="dxy-chart-box"><canvas :id="'dxbWeek' + (idx + 1)"></canvas></div>
                </div>
              </template>
            </div>

            <!-- ===== Baris 5: Downtime Line (per hari, per line) sejajar dengan
                 Downtime Terbesar (rekap sebulan, per Problem) ===== -->
            <div class="dxy-chart-grid" style="align-items: stretch;">
            <div class="dxy-panel dxy-span-8 dxy-table-panel-sm dxy-dt-merged-panel">
              <div class="dxy-panel-head">
                <div class="qc-panel-title-group">
                  <span class="dxy-panel-title">⏱ Downtime Line</span>
                  <span class="qc-filter-badge" x-show="qcActiveFilterChips('bulananDowntime').length" :title="'Filter aktif: ' + qcActiveFilterChips('bulananDowntime').map(c => c.label).join(', ') + ' — klik untuk hapus semua'" @click="qcResetFilters('bulananDowntime')">
                    <span x-text="qcActiveFilterChips('bulananDowntime').length"></span> filter<span>✕</span>
                  </span>
                </div>
                <div class="qc-rekap-mode">
                  <div class="qc-date-wrap">
                    <input type="date" class="dxy-input" style="min-width:120px;" :class="{ 'qc-date-hidden': !bulananDowntimeUseDate }" x-model="bulananDate" :min="bulananDateMin()" :max="bulananDateMax()" @input="bulananDate = $event.target.value; bulananDowntimeUseDate = true; onBulananDowntimeDateChange()" @change="bulananDate = $event.target.value; bulananDowntimeUseDate = true; onBulananDowntimeDateChange()">
                    <span class="qc-date-month-label" x-show="!bulananDowntimeUseDate" x-text="bulananMonthLabel"></span>
                  </div>
                  <button type="button" class="qc-rekap-clear-btn" title="Kembali ke tampilan sebulan" x-show="bulananDowntimeUseDate" @click="bulananDowntimeUseDate = false; onBulananDowntimeDateChange()">✕</button>
                </div>
              </div>
              <div class="dxy-table-scroll">
                <table class="dxy-table qc-detail-table">
                  <thead>
                    <tr>
                      <th style="width:6%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'mesin') }" @click="qcToggleFilterDropdown('bulananDowntime', 'mesin', $event)">Line</th>
                      <th style="width:7%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'pic') }" @click="qcToggleFilterDropdown('bulananDowntime', 'pic', $event)">PIC</th>
                      <th style="width:18%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'problem') }" @click="qcToggleFilterDropdown('bulananDowntime', 'problem', $event)">Problem</th>
                      <th style="width:11%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'area') }" @click="qcToggleFilterDropdown('bulananDowntime', 'area', $event)">Area</th>
                      <th style="width:34%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'countermeasure') }" @click="qcToggleFilterDropdown('bulananDowntime', 'countermeasure', $event)">Countermeasure</th>
                      <th style="width:11%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'status') }" @click="qcToggleFilterDropdown('bulananDowntime', 'status', $event)">Status</th>
                      <th style="width:6%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'shift') }" @click="qcToggleFilterDropdown('bulananDowntime', 'shift', $event)">Shift</th>
                      <th style="width:7%" :class="{ 'qc-th-active': qcColFilterActive('bulananDowntime', 'menit') }" @click="qcToggleFilterDropdown('bulananDowntime', 'menit', $event)">Menit</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="(row, i) in bulananDowntimeMergedRows()" :key="'bdt-merged-'+i">

    <!-- ===== TAB: PERFORMANCE -- nampilin tab "Performance" halaman tiap

         machines/e-0X.html?tab=performance, BUKAN ditulis ulang di sini.
         Sengaja begitu: logika OEE/chart Performance sudah kompleks &
         sudah benar di halaman line masing-masing (assets/machine-page.js)
         -- kalau diduplikat ke sini, 2 tempat harus selalu dijaga sinkron
         & gampang beda hasil. Dengan iframe, datanya DIJAMIN identik
         persis sama yang operator lihat di halaman line-nya sendiri.
         iframe cuma dibuat (x-if) saat tab ini aktif, dan cuma utk LINE
         yang lagi dipilih -- supaya tidak sekaligus memuat 6 halaman
         mesin yang berat. ===== -->
    <template x-if="activeTab === 'performance'">
      <div class="dxy-fill" x-init="$nextTick(() => perfComputeIframeHeight())">
        <div class="dash-subtab-nav" id="perfSubNav" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
          <template x-for="ln in ['E-02','E-03','E-04','E-05','E-06','E-07']" :key="ln">
            <button class="btn-secondary btn-sm" :class="perfLine===ln ? 'btn-primary' : ''" @click="perfLine = ln">
              <span x-text="ln"></span>
            </button>
          </template>
        </div>
        <!-- Tombol "Lihat Dekidaka" SENGAJA TIDAK di sini -- dipindah ke
             dalam halaman line-nya sendiri (card Performance Harian,
             sebelum field tanggal), lihat machines/e-0X.html + assets/
             machine-page.js. Supaya tombolnya tampil di lokasi yang sama
             persis walau tab Performance ini dibuka LANGSUNG di halaman
             line (bukan cuma lewat iframe dashboard). -->
        <iframe :src="'machines/' + perfLine.toLowerCase() + '.html?tab=performance'"
                :style="'width:100%; height:' + perfIframeHeight + 'px; min-height:560px; border:1px solid var(--dxy-border, #ddd); border-radius:8px; background:#fff; display:block;'"
                title="Performance"></iframe>
      </div>
    </template>

    <!-- ===== TAB: PLAN HARIAN ===== -->
    <template x-if="activeTab === 'plan_harian'">
      <div style="padding:16px 0;">

        <!-- Header + filter tanggal -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
          <div>
            <p style="margin:0;font-weight:700;font-size:1rem;">Rencana Produksi Harian per Part Number</p>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <input type="date" x-model="planTanggal" @input="planTanggal = $event.target.value; fetchPlanHarian()" @change="planTanggal = $event.target.value; fetchPlanHarian()"
              style="padding:6px 10px;border:1px solid var(--field-border);border-radius:var(--radius-sm);background:var(--panel);color:var(--text);font-size:.85rem;">
            <template x-if="isAdmin()">
              <a href="plan-produksi.html" class="btn-secondary btn-sm" style="text-decoration:none;">✏️ Edit Plan</a>
            </template>
          </div>
        </div>

        <template x-if="planLoading">
          <p style="text-align:center;padding:32px;color:var(--muted);">Memuat data...</p>
        </template>

        <template x-if="!planLoading">
          <div class="dash-body">

            <!-- Baris atas: tabel Plan Harian + chart Kapasitas Harian.
                 Tata letaknya disamakan dengan plan-produksi.html: tabel di
                 kiri, grafik di kanan. Kelas .plan-grid-top sudah ada di
                 assets/style.css (otomatis bertumpuk di layar sempit). -->
            <div class="plan-grid-top">
            <div class="dash-panel" style="overflow-x:auto;">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
                <p class="dash-panel-title" style="margin:0;">Plan Harian</p>
                <span class="plan-date-badge" x-text="'Plan Date: ' + planTanggal.slice(8,10)"></span>
              </div>
              <div class="table-wrap">
                <table class="plan-table">
                  <thead>
                    <tr>
                      <th>Item</th>
                      <template x-for="mk in ['E-02','E-03','E-04','E-05','E-06','E-07']" :key="mk"><th x-text="mk"></th></template>
                      <th>Backlog</th>
                      <th>Plan Awal</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="part in planPartList" :key="part">
                      <tr>
                        <td x-text="part"></td>
                        <template x-for="mk in ['E-02','E-03','E-04','E-05','E-06','E-07']" :key="mk">
                          <td x-text="planCell(part, mk) || ''"></td>
                        </template>
                        <td x-text="planBacklog(part) || ''"></td>
                        <td><b x-text="planRowTotal(part)"></b></td>
                      </tr>
                    </template>
                    <tr x-show="planPartList.length === 0">
                      <td colspan="10" class="empty-state">Belum ada plan untuk tanggal ini.</td>
                    </tr>
                    <tr class="plan-total-row" x-show="planPartList.length > 0">
                      <td>TOTAL PLAN HARIAN</td>
                      <template x-for="mk in ['E-02','E-03','E-04','E-05','E-06','E-07']" :key="mk">
                        <td x-text="planColTotal(mk)"></td>
                      </template>
                      <td x-text="planBacklogTotal()"></td>
                      <td x-text="planGrandTotal()"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="dash-panel dash-panel-chart">
              <p class="dash-panel-title">Kapasitas Harian (Plan per Part × Line)</p>
              <div class="dash-chart-sm" style="min-height:280px;"><canvas id="dxPlanKapasitas"></canvas></div>
            </div>
            </div>

            <!-- Shift 1 & Shift 2 -->
            <div class="plan-shift-grid">
              <!-- shift dikirim sebagai ANGKA (bukan '1'/'2'), karena kolom shift di
                   database bertipe angka dan perbandingannya sekarang ketat (===),
                   sama seperti di plan-produksi.html -->
              <template x-for="shift in [1, 2]" :key="shift">
                <div class="dash-panel">
                  <p class="dash-panel-title" x-text="'Shift ' + shift"></p>
                  <div class="table-wrap">
                    <table class="plan-shift-table">
                      <thead>
                        <tr>
                          <th rowspan="2">Item</th>
                          <template x-for="mk in ['E-02','E-03','E-04','E-05','E-06','E-07']" :key="mk">
                            <th colspan="2" x-text="mk"></th>
                          </template>
                          <th rowspan="2">Balance</th>
                        </tr>
                        <tr>
                          <template x-for="col in ['E-02','E-03','E-04','E-05','E-06','E-07'].flatMap((mk) => [{ mk, kind: 'plan' }, { mk, kind: 'act' }])" :key="col.mk + col.kind">
                            <th x-text="col.kind === 'plan' ? 'Plan' : 'Act'"></th>
                          </template>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="part in planShiftParts(shift)" :key="part">
                          <tr>
                            <td x-text="part"></td>
                            <template x-for="col in ['E-02','E-03','E-04','E-05','E-06','E-07'].flatMap((mk) => [{ mk, kind: 'plan' }, { mk, kind: 'act' }])" :key="col.mk + col.kind">
                              <td x-text="(col.kind === 'plan' ? planShiftCell(part, col.mk, shift) : planActCell(part, col.mk, shift)) || ''"></td>
                            </template>
                            <td :class="planBalanceClass(part, shift)" x-text="planBalance(part, shift)"></td>
                          </tr>
                        </template>
                        <tr x-show="planShiftParts(shift).length === 0">
                          <td :colspan="['E-02','E-03','E-04','E-05','E-06','E-07'].length * 2 + 2" class="empty-state"
                            x-text="'Belum ada plan Shift ' + shift + '.'"></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
            </div>

          </div>
        </template>
      </div>
    </template>

  </main>

  <!-- Dropdown filter per-kolom (Rekap NG Inline / NG Trial / Repair) --
       satu elemen dipakai bersama untuk semua kolom/tabel (isinya
       reaktif mengikuti qcFilterOpen). Di-teleport ke <body> supaya
       tidak terpotong overflow:hidden/auto milik box tabel yang di
       atasnya (.qc-rekap-scroll). -->
  <template x-teleport="body">
    <div class="qc-filter-dropdown" x-ref="qcFilterBox" x-show="qcFilterOpen" x-cloak :style="'top:'+qcFilterPos.top+'px; left:'+qcFilterPos.left+'px;'" @click.outside="qcFilterOpen = null" @keydown.escape.window="qcFilterOpen = null">
      <div class="qc-filter-title" x-text="'Filter: ' + qcFilterColLabel()"></div>
      <input type="text" class="qc-filter-search" x-model="qcFilterSearch" placeholder="Cari nilai...">
      <div class="qc-filter-actions">
        <button type="button" @click="qcSelectAllFilter()">Pilih Semua</button>
        <button type="button" @click="qcClearAllFilter()">Kosongkan</button>
        <button type="button" class="qc-filter-close-btn" @click="qcFilterOpen = null" title="Tutup">✕</button>
      </div>
      <div class="qc-filter-list">
        <template x-for="val in qcFilterValues()" :key="val">
          <label class="qc-filter-item">
            <input type="checkbox" :checked="qcIsValueChecked(val)" @change="qcToggleFilterValue(val)">
            <span x-text="val === '' ? '(kosong)' : val"></span>
          </label>
        </template>
        <div class="qc-filter-empty" x-show="qcFilterValues().length === 0">Tidak ada nilai</div>
      </div>
    </div>
  </template>

  <!-- Popup detail "Downtime Terbesar" (bottom Bulanan) -- double-klik row
       di tabel Problem untuk lihat breakdown per Line untuk bulan yang lagi
       aktif. Bukan modal tengah layar -- popup ini nempel/floating di ATAS
       panel "Downtime Terbesar" (posisi dihitung di positionProblemDetail()
       sama seperti pola dropdown filter kolom). Di-teleport ke <body>
       supaya tidak kepotong overflow tabel. -->
  <template x-teleport="body">
    <div class="dxy-pd-modal" x-ref="dxyProblemDetailBox" x-show="dxyProblemDetail.open" x-cloak :style="'top:'+dxyProblemDetailPos.top+'px; left:'+dxyProblemDetailPos.left+'px;'" @click.outside="closeProblemDetail()" @keydown.escape.window="closeProblemDetail()">
        <div class="dxy-pd-head">
          <div>
            <div class="dxy-pd-title">Detail Downtime per Line</div>
            <div class="dxy-pd-problem" x-text="dxyProblemDetail.problem"></div>
          </div>
          <button type="button" class="dxy-pd-close" @click="closeProblemDetail()" title="Tutup">✕</button>
        </div>
        <div class="dxy-pd-sub" x-text="bulananMonthLabel + ' ' + bulananYear"></div>
        <div class="dxy-pd-body">
          <div class="dxy-pd-loading" x-show="dxyProblemDetail.loading">Memuat detail...</div>
          <template x-if="!dxyProblemDetail.loading">
            <div>
              <table class="dxy-pd-table" x-show="dxyProblemDetail.rows.length">
                <thead>
                  <tr><th>Line</th><th style="text-align:right">Frek.</th><th style="text-align:right">Menit</th></tr>
                </thead>
                <tbody>
                  <template x-for="(r, i) in dxyProblemDetail.rows" :key="'pd-'+i">
                    <tr>
                      <td style="font-weight:700;" x-text="r.mesin"></td>
                      <td style="text-align:right" x-text="r.frekuensi"></td>
                      <td class="dxy-pd-menit" x-text="fmtNum(r.menit)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="dxy-pd-empty" x-show="!dxyProblemDetail.rows.length">Tidak ada detail per line untuk problem ini.</div>
            </div>
          </template>
        </div>
        <div class="dxy-pd-total" x-show="dxyProblemDetail.rows.length">
          <span>Total</span>
          <span x-text="fmtNum(dxyProblemDetail.rows.reduce((a,r)=>a+r.menit,0)) + ' menit'"></span>
        </div>
    </div>
  </template>
</div>

<script src="assets/utils.js"></script>
<script src="assets/dashboard-exhaust.js"></script>
</body>
</html>
