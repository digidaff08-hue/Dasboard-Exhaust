<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Exhaust — Welding Exhaust</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4f5f7">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>
  (function () {
    var t = localStorage.getItem("theme_v1") || "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="assets/supabaseClient.js"></script>
</head>
<body>

<div class="app-shell" x-data="dashboardExhaust()" x-init="init()">
  <div class="mobile-topbar">
    <button class="hamburger" @click="mobileNavOpen = true">☰</button>
    <span class="mobile-title">Dashboard Exhaust</span>
  </div>
  <div class="sidebar-overlay" x-show="mobileNavOpen" @click="mobileNavOpen = false" x-cloak></div>
  <aside class="sidebar" :class="[mobileNavOpen ? 'sidebar-open' : '', sidebarCollapsed ? 'sidebar-collapsed' : '']">
    <button class="sidebar-collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed">
      <span x-show="!sidebarCollapsed">‹</span><span x-show="sidebarCollapsed">›</span>
    </button>
    <div class="sidebar-brand" x-show="!sidebarCollapsed">PRESS SHOP<span>·</span>SYSTEM</div>
    <nav class="sidebar-nav" @click="mobileNavOpen = false">
      <a href="dashboard-exhaust.html" class="sidebar-link active" title="Dashboard Exhaust"><span>📊</span><span x-show="!sidebarCollapsed">Dashboard Exhaust</span></a>
      <a href="index.html" class="sidebar-link" title="Dashboard"><span>🏠</span><span x-show="!sidebarCollapsed">Dashboard</span></a>
      <a href="plan-produksi.html" class="sidebar-link" title="Plan Produksi"><span>📅</span><span x-show="!sidebarCollapsed">Plan Produksi</span></a>
      <a href="input-produksi.html" class="sidebar-link" title="Input Produksi"><span>⚙️</span><span x-show="!sidebarCollapsed">Input Produksi</span></a>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-attendance.html" class="sidebar-link" title="Input Attendance"><span>👥</span><span x-show="!sidebarCollapsed">Input Attendance</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-scrap.html" class="sidebar-link" title="Input Scrap"><span>♻️</span><span x-show="!sidebarCollapsed">Input Scrap</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-safety.html" class="sidebar-link" title="Input Safety"><span>⛑️</span><span x-show="!sidebarCollapsed">Input Safety</span></a>
      </template>
    </nav>
    <div class="sidebar-foot" x-show="!sidebarCollapsed">
      <div class="who" x-text="profile?.full_name || session?.user?.email || '...'"></div>
      <span class="badge" :class="profile?.role === 'admin' ? 'role-admin' : ''" x-text="profile?.jabatan || profile?.role || '...'"></span>
      <button class="btn-ghost btn-sm" @click="logout()">Keluar</button>
    </div>
    <button class="sidebar-logout-collapsed" x-show="sidebarCollapsed" @click="logout()" title="Keluar">⏻</button>
  </aside>

  <main class="main">
    <div class="dash-topbar">
      <div class="dash-title-block">
        <h1>DASHBOARD EXHAUST</h1>
      </div>
      <div class="dash-controls">
        <template x-if="activeTab === 'harian'">
          <input type="date" x-model="tanggal" @change="fetchAll()">
        </template>
        <template x-if="activeTab === 'harian'">
          <select x-model="shiftFilter" @change="fetchAll()">
            <option value="all">Semua Shift</option>
            <option value="1">Shift 1 (07:00–19:30)</option>
            <option value="2">Shift 2 (19:30–07:00)</option>
          </select>
        </template>
        <button class="theme-toggle" @click="toggleTheme()" :title="theme === 'dark' ? 'Ke mode terang' : 'Ke mode gelap'">
          <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
        </button>
      </div>
    </div>

    <!-- Switch Harian / Bulanan / Kontrol Kualitas -->
    <div class="dash-subtab-nav" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <button class="btn-secondary btn-sm" :class="activeTab==='bulanan' ? 'btn-primary' : ''" @click="setTab('bulanan')">Bulanan</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='harian' ? 'btn-primary' : ''" @click="setTab('harian')">Harian</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='kualitas' ? 'btn-primary' : ''" @click="setTab('kualitas')">Kontrol Kualitas</button>
    </div>

    <!-- ===== TAB: HARIAN ===== -->
    <template x-if="activeTab === 'harian'">
      <div>
        <template x-if="loading"><p class="empty-state">Memuat data...</p></template>

        <template x-if="!loading">
          <div class="dash-body">
            <!-- Ringkasan total gabungan kecil di atas -->
            <div class="fleet-summary-grid">
              <div class="perf-card">
                <span class="hint">Line Aktif</span>
                <b class="mono" x-text="lineAktif + ' / 6'"></b>
              </div>
              <div class="perf-card">
                <span class="hint">Total Output (Stroke)</span>
                <b class="mono" x-text="fmtNum(totals.stroke)"></b>
              </div>
              <div class="perf-card">
                <span class="hint">Total NG</span>
                <b class="mono" x-text="fmtNum(totals.ng)"></b>
              </div>
              <div class="perf-card">
                <span class="hint">Total Downtime (menit)</span>
                <b class="mono" x-text="fmtNum(totals.downtimeMenit)"></b>
              </div>
              <div class="perf-card">
                <span class="hint">Rata-rata OEE</span>
                <b class="mono" x-text="fmtNum(totals.avgOee) + '%'"></b>
              </div>
            </div>

            <!-- Kartu per Line -->
            <div class="machine-cards-grid">
              <template x-for="m in machines" :key="m.key">
                <a :href="m.href" class="machine-card" :class="'machine-card-' + statusClass(m)">
                  <div class="machine-card-top">
                    <span class="machine-card-name" x-text="m.label"></span>
                    <span class="status-badge" :class="'status-' + statusBadge(m)" x-text="statusLabel(m)"></span>
                  </div>
                  <div class="machine-card-oee" x-text="fmtNum(m.data.oee) + '% OEE'"></div>
                  <p class="hint" style="margin:2px 0 10px;">
                    Part terakhir: <b x-text="m.data.lastPart || '-'"></b>
                  </p>
                  <div class="machine-card-stats" style="flex-wrap:wrap; row-gap:8px;">
                    <div><span class="hint">Output</span><br><b x-text="fmtNum(m.data.stroke)"></b></div>
                    <div><span class="hint">NG</span><br><b x-text="fmtNum(m.data.ng)"></b></div>
                    <div><span class="hint">Downtime</span><br><b x-text="fmtNum(m.data.downtimeMenit) + ' m'"></b></div>
                  </div>
                  <div class="machine-card-stats" style="flex-wrap:wrap; row-gap:8px; margin-top:8px;">
                    <div><span class="hint">GSPH</span><br><b x-text="fmtNum(m.data.gsph)"></b></div>
                    <div><span class="hint">Target</span><br><b x-text="fmtNum(m.data.targetGsph)"></b></div>
                    <div><span class="hint">Perf</span><br><b x-text="fmtNum(m.data.performanceFactor) + '%'"></b></div>
                  </div>
                  <div class="sqcpm-bar" style="margin-top:12px;">
                    <div class="sqcpm-bar-fill" :style="'width:' + Math.max(0, Math.min(100, m.data.oee)) + '%'"></div>
                  </div>
                </a>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ===== TAB: BULANAN ===== -->
    <template x-if="activeTab === 'bulanan'">
      <div>
        <template x-if="bulananLoading"><p class="empty-state">Memuat data bulanan...</p></template>
        <template x-if="!bulananLoading">
          <div class="dash-body bulanan-body">

        <!-- Baris 1: 4 KPI utama -->
        <div class="bulanan-kpi-grid">
          <div class="kpi-card">
            <div class="kpi-head"><span class="kpi-dot kpi-dot-blue"></span>PRODUCTIVITY</div>
            <div class="kpi-value" x-text="bulanan.productivity.value + '%'"></div>
            <div class="kpi-sub">BULAN BERJALAN</div>
            <div class="kpi-chart"><canvas id="kpiProductivityChart"></canvas></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-head"><span class="kpi-dot kpi-dot-teal"></span>AVAILABILITY</div>
            <div class="kpi-value" x-text="bulanan.availability.value + '%'"></div>
            <div class="kpi-sub">BULAN BERJALAN</div>
            <div class="kpi-chart"><canvas id="kpiAvailabilityChart"></canvas></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-head"><span class="kpi-dot kpi-dot-red"></span>NG INLINE</div>
            <div class="kpi-head-row">
              <div><span class="kpi-value" x-text="bulanan.ngInline.qty"></span><span class="kpi-sub"> pcs</span><div class="kpi-sub">QTY BULAN BERJALAN</div></div>
              <div class="kpi-head-right"><span class="kpi-value" x-text="fmtNum(bulanan.ngInline.value)"></span><div class="kpi-sub">VALUE BULAN BERJALAN</div></div>
            </div>
            <div class="kpi-chart"><canvas id="kpiNgInlineChart"></canvas></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-head"><span class="kpi-dot kpi-dot-teal"></span>STRAIGHTPASS</div>
            <div class="kpi-value" x-text="bulanan.straightpass.value + '%'"></div>
            <div class="kpi-sub">BULAN BERJALAN</div>
            <div class="kpi-chart"><canvas id="kpiStraightpassChart"></canvas></div>
          </div>
        </div>

        <!-- Baris 2: Downtime Exhaust / Supporting / Line -->
        <div class="dash-main-grid bulanan-row2">
          <div class="dash-panel dt-exhaust-panel">
            <p class="dash-panel-title">Downtime Exhaust</p>
            <div class="dash-chart-sm"><canvas id="dtExhaustChart"></canvas></div>
          </div>
          <div class="dash-panel">
            <p class="dash-panel-title">Downtime Supporting</p>
            <div class="dash-chart-sm"><canvas id="dtSupportingChart"></canvas></div>
          </div>
          <div class="dash-panel">
            <p class="dash-panel-title">Downtime Line</p>
            <div class="dash-chart-sm"><canvas id="dtLineChart"></canvas></div>
          </div>
        </div>

        <!-- Baris 3: Weekly Breakdown -->
        <div class="dash-panel-title" style="margin-top:4px;">Weekly Breakdown</div>
        <div class="weekly-grid">
          <template x-for="(w, idx) in bulanan.weekly" :key="'week-'+idx">
            <div class="dash-panel">
              <p class="dash-panel-title" x-text="'WEEK ' + (idx + 1)" style="text-align:center;"></p>
              <div class="dash-chart-sm"><canvas :id="'weekChart' + (idx + 1)"></canvas></div>
            </div>
          </template>
        </div>

        <!-- Baris 4: Downtime Terbesar -->
        <div class="dash-panel-title" style="margin-top:4px;">Downtime Terbesar</div>
        <div class="downtime-terbesar-grid">
          <template x-for="line in bulanan.downtimeTerbesar" :key="line.mesin">
            <div class="dt-terbesar-outer">
              <div class="dash-panel dt-terbesar-panel">
                <span class="badge dt-terbesar-badge" x-text="line.mesin"></span>
                <table class="table-compact dt-terbesar-table">
                  <tbody>
                    <template x-for="(row, i) in line.rows" :key="line.mesin + '-' + i">
                      <tr>
                        <td class="dt-terbesar-pic" x-text="row.pic"></td>
                        <td class="dt-terbesar-problem" x-text="row.problem"></td>
                        <td class="mono dt-terbesar-value" x-text="row.value"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
        </div>
        </div>
        </template>
      </div>
    </template>
    <template x-if="activeTab === 'kualitas'">
      <div class="dash-body">
        <p class="empty-state">Tab Kontrol Kualitas belum diisi — menunggu spesifikasi/data dari kamu.</p>
      </div>
    </template>
  </main>
</div>

<script>
const MACHINES = [
  { key: "E-02", label: "E-02", href: "machines/e-02.html" },
  { key: "E-03", label: "E-03", href: "machines/e-03.html" },
  { key: "E-04", label: "E-04", href: "machines/e-04.html" },
  { key: "E-05", label: "E-05", href: "machines/e-05.html" },
  { key: "E-06", label: "E-06", href: "machines/e-06.html" },
  { key: "E-07", label: "E-07", href: "machines/e-07.html" },
];

function fmtNum(n) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return "-";
  return Number(n).toLocaleString("en-US", { maximumFractionDigits: 1 });
}
function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function dashboardExhaust() {
  return {
    session: null, profile: null, mobileNavOpen: false, sidebarCollapsed: true,
    loading: true,
    activeTab: "bulanan", // bulanan | harian | kualitas
    theme: localStorage.getItem("theme_v1") || "light",
    tanggal: localDateStr(new Date()),
    shiftFilter: "all",
    machines: [],
    totals: { stroke: 0, ng: 0, downtimeMenit: 0, avgOee: 0 },
    lineAktif: 0,
    fmtNum,
    isLeaderOrAdmin() { return this.profile && ["admin", "leader"].includes(this.profile.role); },
    destroyBulananCharts() {
      Object.keys(this.bulananCharts).forEach((id) => {
        try { this.bulananCharts[id].destroy(); } catch (e) { /* noop */ }
        delete this.bulananCharts[id];
      });
    },
    async setTab(tab) {
      if (this.activeTab === "bulanan" && tab !== "bulanan") this.destroyBulananCharts();
      this.activeTab = tab;
      if (tab === "bulanan") {
        await this.fetchBulanan();
        this.$nextTick(() => this.renderBulananCharts());
      }
    },
    toggleTheme() {
      this.theme = this.theme === "dark" ? "light" : "dark";
      localStorage.setItem("theme_v1", this.theme);
      document.documentElement.setAttribute("data-theme", this.theme);
      if (this.activeTab === "bulanan") this.$nextTick(() => this.renderBulananCharts());
    },
    bounds() {
      const d = new Date(this.tanggal + "T00:00:00");
      if (this.shiftFilter === "1") {
        return { start: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 7, 0), end: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 19, 30) };
      }
      if (this.shiftFilter === "2") {
        return { start: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 19, 30), end: new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 7, 0) };
      }
      return { start: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0), end: new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0) };
    },
    statusClass(m) {
      if (!m.data || m.data.stroke === 0) return "warn"; // idle -> abu2, dianggap warn utk border
      const oee = m.data.oee || 0;
      if (oee >= 75) return "good";
      if (oee >= 50) return "warn";
      return "bad";
    },
    statusBadge(m) {
      if (!m.data || m.data.stroke === 0) return "idle";
      const oee = m.data.oee || 0;
      if (oee >= 75) return "running";
      if (oee >= 50) return "warn";
      return "stop";
    },
    statusLabel(m) {
      if (!m.data || m.data.stroke === 0) return "OFF";
      const oee = m.data.oee || 0;
      if (oee >= 75) return "GOOD";
      if (oee >= 50) return "FAIR";
      return "POOR";
    },
    // ---------------------------------------------------------------
    // DATA DUMMY "Bulanan" -- sementara statis, tinggal diganti hasil
    // query Supabase (RPC / view rollup bulanan) begitu tabelnya siap.
    // ---------------------------------------------------------------
    // ---------------------------------------------------------------
    // Data "Bulanan" -- diisi dari fetchBulanan() (RPC Supabase, lihat
    // migration_dashboard_bulanan.sql). Skeleton kosong dulu supaya
    // template tidak error sebelum data datang.
    // ---------------------------------------------------------------
    bulananLoading: true,
    bulananLoaded: false,
    bulanan: {
      monthLabels: [],
      productivity: { value: 0, actual: [], target: 100 },
      availability: { value: 0, actual: [], target: 100 },
      ngInline: { qty: 0, value: 0, qtyByMonth: [], valueByMonth: [] },
      straightpass: { value: 0, actual: [], qty: [], target: 100 },
      downtimeExhaust: { labels: [], values: [] },
      downtimeSupporting: { labels: [], plan: [], act: [] },
      downtimeLine: { labels: [], plan: [], act: [] },
      weekly: [],
      downtimeTerbesar: [],
    },
    bulananCharts: {},
    async init() {
      this.session = await requireAuth();
      if (!this.session) return;
      const { data } = await supabaseClient.from("profiles").select("*").eq("id", this.session.user.id).maybeSingle();
      this.profile = data;
      await this.fetchAll();
      if (this.activeTab === "bulanan") await this.setTab("bulanan");
    },
    // ---- Ambil data Bulanan dari Supabase (sekali saja, di-cache) ----
    async fetchBulanan() {
      if (this.bulananLoaded) return;
      this.bulananLoading = true;
      try {
        const now = new Date();
        // Fiscal year: April -> Maret. Tahun mulai FY berjalan:
        const fyStartYear = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1; // getMonth() 3 = April
        const fyStart = new Date(fyStartYear, 3, 1);
        const fyEnd = new Date(fyStartYear + 1, 3, 1);
        const prevFyStart = new Date(fyStartYear - 1, 3, 1);
        const bulanIni = new Date(now.getFullYear(), now.getMonth(), 1);
        const bulanDepan = new Date(now.getFullYear(), now.getMonth() + 1, 1);

        const [prodRes, ngRes, picRes, lineRes, weeklyRes] = await Promise.all([
          supabaseClient.rpc("dashboard_bulanan_produksi", { p_start: prevFyStart.toISOString(), p_end: fyEnd.toISOString() }),
          supabaseClient.rpc("dashboard_bulanan_ng_inline", { p_start: prevFyStart.toISOString(), p_end: fyEnd.toISOString() }),
          supabaseClient.rpc("dashboard_bulanan_downtime_by_pic", { p_start: bulanIni.toISOString(), p_end: bulanDepan.toISOString() }),
          supabaseClient.rpc("dashboard_bulanan_downtime_by_line", { p_start: bulanIni.toISOString(), p_end: bulanDepan.toISOString() }),
          supabaseClient.rpc("dashboard_bulanan_weekly", { p_start: bulanIni.toISOString(), p_end: bulanDepan.toISOString() }),
        ]);
        const topRes = await Promise.all(MACHINES.map((m) =>
          supabaseClient.rpc("dashboard_bulanan_top_problems", { p_mesin: m.key, p_start: bulanIni.toISOString(), p_end: bulanDepan.toISOString(), p_limit: 5 })
        ));

        const prodRows = prodRes.data || [];
        const ngRows = ngRes.data || [];
        const monthKeyStr = (d) => localDateStr(d);

        // 12 bulan FY berjalan (Apr..Mar)
        const fyMonths = [];
        for (let i = 0; i < 12; i++) fyMonths.push(new Date(fyStartYear, 3 + i, 1));
        const monthLabelId = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

        const findRow = (rows, d) => rows.find((r) => r.bulan === monthKeyStr(d));
        const sumInRange = (rows, start, end, field) =>
          rows.filter((r) => { const rd = new Date(r.bulan + "T00:00:00"); return rd >= start && rd < end; })
              .reduce((a, r) => a + (Number(r[field]) || 0), 0);

        // Productivity & Availability & Straightpass per bulan (FY berjalan)
        const productivityActual = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          if (!row || !row.wh_menit) return null;
          return Number(((row.target_std_menit / row.wh_menit) * 100).toFixed(1));
        });
        const availabilityActual = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          if (!row || !row.wh_menit) return null;
          return Number((((row.wh_menit - row.downtime_menit) / row.wh_menit) * 100).toFixed(1));
        });
        const straightpassActual = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          const ngRow = findRow(ngRows, d);
          if (!row || !row.stroke) return null;
          const ngTotal = (Number(row.ng) || 0) + (ngRow ? Number(ngRow.qty) || 0 : 0);
          return Number((((row.stroke - ngTotal) / row.stroke) * 100).toFixed(1));
        });
        const straightpassQty = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          return row ? Number(row.stroke) : null;
        });

        // Bulan berjalan (bulan terakhir yang ada datanya)
        const lastRow = [...prodRows].reverse().find((r) => r.wh_menit > 0) || null;
        const lastNgRow = ngRows.length ? ngRows[ngRows.length - 1] : null;
        const productivityValue = lastRow ? Number(((lastRow.target_std_menit / lastRow.wh_menit) * 100).toFixed(1)) : 0;
        const availabilityValue = lastRow ? Number((((lastRow.wh_menit - lastRow.downtime_menit) / lastRow.wh_menit) * 100).toFixed(1)) : 0;
        const straightpassValue = lastRow && lastRow.stroke
          ? Number((((lastRow.stroke - ((Number(lastRow.ng) || 0) + (lastNgRow ? Number(lastNgRow.qty) || 0 : 0))) / lastRow.stroke) * 100).toFixed(1))
          : 0;

        // Downtime Exhaust: FY-1, FY, lalu 12 bulan Apr..Mar
        const dtExhaustLabels = ["FY " + fyStartYear, "FY " + (fyStartYear + 1), ...fyMonths.map((d) => monthLabelId[d.getMonth()])];
        const dtExhaustValues = [
          Math.round(sumInRange(prodRows, prevFyStart, fyStart, "downtime_menit")),
          Math.round(sumInRange(prodRows, fyStart, fyEnd, "downtime_menit")),
          ...fyMonths.map((d) => { const r = findRow(prodRows, d); return r ? Math.round(Number(r.downtime_menit)) : 0; }),
        ];

        // Downtime Supporting / Line (bulan berjalan)
        const picRows = picRes.data || [];
        const lineRows = lineRes.data || [];
        const PIC_ORDER = ["PE", "MESIN", "QC", "PC-SUPP", "PROD", "PRESS"];
        const downtimeSupporting = {
          labels: PIC_ORDER,
          plan: PIC_ORDER.map((p) => { const r = picRows.find((x) => x.pic === p); return r ? Math.round(Number(r.plan_menit)) : 0; }),
          act: PIC_ORDER.map((p) => { const r = picRows.find((x) => x.pic === p); return r ? Math.round(Number(r.act_menit)) : 0; }),
        };
        const downtimeLine = {
          labels: MACHINES.map((m) => m.key),
          plan: MACHINES.map((m) => { const r = lineRows.find((x) => x.mesin === m.key); return r ? Math.round(Number(r.plan_menit)) : 0; }),
          act: MACHINES.map((m) => { const r = lineRows.find((x) => x.mesin === m.key); return r ? Math.round(Number(r.act_menit)) : 0; }),
        };

        // Weekly Breakdown (ISO week, Senin-Minggu) -- bulan berjalan
        const weeklyRows = weeklyRes.data || [];
        const weekStarts = Array.from(new Set(weeklyRows.map((r) => r.minggu_mulai))).sort();
        const weekly = weekStarts.map((ws) => ({
          labels: MACHINES.map((m) => m.key),
          values: MACHINES.map((m) => {
            const r = weeklyRows.find((x) => x.minggu_mulai === ws && x.mesin === m.key);
            return r ? Math.round(Number(r.downtime_menit)) : 0;
          }),
        }));

        // Downtime Terbesar per line
        const downtimeTerbesar = MACHINES.map((m, idx) => ({
          mesin: m.key,
          rows: ((topRes[idx] && topRes[idx].data) || []).map((r) => ({ pic: r.pic, problem: r.problem, value: Math.round(Number(r.total_menit)) })),
        }));

        this.bulanan = {
          monthLabels: dtExhaustLabels,
          productivity: { value: productivityValue, actual: [null, null, ...productivityActual], target: 100 },
          availability: { value: availabilityValue, actual: [null, null, ...availabilityActual], target: 100 },
          ngInline: {
            qty: lastNgRow ? Number(lastNgRow.qty) : 0,
            value: lastNgRow ? Number(lastNgRow.value) : 0,
            qtyByMonth: [null, null, ...fyMonths.map((d) => { const r = findRow(ngRows, d); return r ? Number(r.qty) : null; })],
            valueByMonth: [null, null, ...fyMonths.map((d) => { const r = findRow(ngRows, d); return r ? Number(r.value) : null; })],
          },
          straightpass: { value: straightpassValue, actual: [null, null, ...straightpassActual], qty: [null, null, ...straightpassQty], target: 100 },
          downtimeExhaust: { labels: dtExhaustLabels, values: dtExhaustValues },
          downtimeSupporting,
          downtimeLine,
          weekly,
          downtimeTerbesar,
        };
        this.bulananLoaded = true;
      } catch (e) {
        console.error("Gagal mengambil data Bulanan:", e);
      } finally {
        this.bulananLoading = false;
      }
    },
    // ---- Chart Bulanan ----
    renderBulananCharts() {
      if (typeof Chart === "undefined") return;
      const b = this.bulanan;
      const destroy = (id) => { if (this.bulananCharts[id]) { this.bulananCharts[id].destroy(); delete this.bulananCharts[id]; } };
      const baseScales = () => ({
        x: { ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: false } },
        y: { ticks: { color: cssVar("--chart-tick"), font: { size: 9 }, maxTicksLimit: 5 }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: false }, beginAtZero: true },
      });
      const legend = (show) => ({ display: show, position: "bottom", labels: { color: cssVar("--muted"), boxWidth: 8, boxHeight: 8, usePointStyle: true, pointStyle: "circle", font: { size: 9 }, padding: 8 } });
      const tooltip = () => ({ backgroundColor: cssVar("--panel"), titleColor: cssVar("--text"), bodyColor: cssVar("--text"), borderColor: cssVar("--border"), borderWidth: 1, padding: 8 });
      const safe = (fn, label) => { try { fn(); } catch (e) { console.error("Gagal render chart Bulanan:", label, e); } };
      // Animasi dimatikan: dashboard statis, dan mencegah error "Cannot read
      // properties of null (reading 'save')" saat chart di-destroy/diganti
      // sebelum animasinya selesai (leftover animation frame di Chart.js).
      const noAnim = { duration: 0 };

      // --- 4 kartu KPI (bar Actual + line Target) ---
      const kpiCombo = (canvasId, labels, actual, target, barColor) => {
        destroy(canvasId);
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        this.bulananCharts[canvasId] = new Chart(canvas, {
          data: {
            labels,
            datasets: [
              { type: "bar", label: "Actual", data: actual, backgroundColor: barColor, borderRadius: 3, barPercentage: 0.55, categoryPercentage: 0.7 },
              { type: "line", label: "Target", data: labels.map(() => target), borderColor: cssVar("--red"), borderDash: [5, 4], borderWidth: 2, pointRadius: 0, tension: 0 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            plugins: { legend: legend(true), tooltip: tooltip() },
            scales: baseScales(),
          },
        });
      };
      safe(() => kpiCombo("kpiProductivityChart", b.monthLabels, b.productivity.actual, b.productivity.target, cssVar("--series-4")), "productivity");
      safe(() => kpiCombo("kpiAvailabilityChart", b.monthLabels, b.availability.actual, b.availability.target, cssVar("--series-4")), "availability");
      safe(() => kpiCombo("kpiStraightpassChart", b.monthLabels, b.straightpass.actual, b.straightpass.target, cssVar("--series-4")), "straightpass");

      // --- NG Inline: bar Value (kiri) + line Qty (kanan) ---
      safe(() => {
        destroy("kpiNgInlineChart");
        const ngCanvas = document.getElementById("kpiNgInlineChart");
        if (ngCanvas) {
          this.bulananCharts.kpiNgInlineChart = new Chart(ngCanvas, {
            data: {
              labels: b.monthLabels,
              datasets: [
                { type: "bar", label: "Value", data: b.ngInline.valueByMonth, backgroundColor: cssVar("--category-other"), yAxisID: "y", borderRadius: 3, barPercentage: 0.55, categoryPercentage: 0.7 },
                { type: "line", label: "Qty", data: b.ngInline.qtyByMonth, borderColor: cssVar("--series-4"), yAxisID: "y1", pointRadius: 3, tension: 0.3 },
              ],
            },
            options: {
              responsive: true, maintainAspectRatio: false, animation: noAnim,
              plugins: { legend: legend(true), tooltip: tooltip() },
              scales: {
                x: baseScales().x,
                y: { position: "left", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: false }, beginAtZero: true },
                y1: { position: "right", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: false }, beginAtZero: true },
              },
            },
          });
        }
      }, "ngInline");

      // --- Downtime Exhaust: bar + line trend ---
      safe(() => {
        destroy("dtExhaustChart");
        const dtEx = document.getElementById("dtExhaustChart");
        if (dtEx) {
          this.bulananCharts.dtExhaustChart = new Chart(dtEx, {
            data: {
              labels: b.downtimeExhaust.labels,
              datasets: [
                { type: "bar", label: "Downtime", data: b.downtimeExhaust.values, backgroundColor: cssVar("--category-other"), borderRadius: 3, barPercentage: 0.6, categoryPercentage: 0.7 },
                { type: "line", label: "Trend", data: b.downtimeExhaust.values, borderColor: cssVar("--red"), pointRadius: 3, tension: 0.3 },
              ],
            },
            options: { responsive: true, maintainAspectRatio: false, animation: noAnim, plugins: { legend: legend(true), tooltip: tooltip() }, scales: baseScales() },
          });
        }
      }, "downtimeExhaust");

      // --- Downtime Supporting & Downtime Line: grouped bar Plan/Act ---
      const groupedBar = (canvasId, labels, plan, act) => {
        destroy(canvasId);
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        this.bulananCharts[canvasId] = new Chart(canvas, {
          type: "bar",
          data: {
            labels,
            datasets: [
              { label: "Plan", data: plan, backgroundColor: cssVar("--category-other"), borderRadius: 3, barPercentage: 0.7, categoryPercentage: 0.7 },
              { label: "Act", data: act, backgroundColor: cssVar("--series-5"), borderRadius: 3, barPercentage: 0.7, categoryPercentage: 0.7 },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false, animation: noAnim, plugins: { legend: legend(true), tooltip: tooltip() }, scales: baseScales() },
        });
      };
      safe(() => groupedBar("dtSupportingChart", b.downtimeSupporting.labels, b.downtimeSupporting.plan, b.downtimeSupporting.act), "downtimeSupporting");
      safe(() => groupedBar("dtLineChart", b.downtimeLine.labels, b.downtimeLine.plan, b.downtimeLine.act), "downtimeLine");

      // --- Weekly Breakdown: bar per line + Total ---
      b.weekly.forEach((w, idx) => {
        safe(() => {
          const canvasId = "weekChart" + (idx + 1);
          destroy(canvasId);
          const canvas = document.getElementById(canvasId);
          if (!canvas) return;
          const total = w.values.reduce((a, v) => a + v, 0);
          const labels = [...w.labels, "Total"];
          const values = [...w.values, total];
          const colors = [...w.labels.map(() => cssVar("--series-1")), cssVar("--navy")];
          this.bulananCharts[canvasId] = new Chart(canvas, {
            type: "bar",
            data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 3, barPercentage: 0.6, categoryPercentage: 0.7 }] },
            options: {
              responsive: true, maintainAspectRatio: false, animation: noAnim,
              plugins: { legend: legend(false), tooltip: tooltip() },
              scales: baseScales(),
            },
          });
        }, "week" + (idx + 1));
      });
    },
    async fetchAll() {
      this.loading = true;
      const { start, end } = this.bounds();

      const results = await Promise.all(MACHINES.map(async (m) => {
        const [aggRes, settingsRes, statusRes] = await Promise.all([
          supabaseClient.rpc("performance_aggregate", { p_mesin: m.key, p_stasiun_list: null, p_start: start.toISOString(), p_end: end.toISOString() }),
          supabaseClient.from("mesin_settings").select("*").eq("mesin", m.key).maybeSingle(),
          supabaseClient.from("production_log").select("part_number, waktu_akhir").eq("mesin", m.key)
            .gte("waktu_awal", start.toISOString()).lt("waktu_awal", end.toISOString())
            .order("waktu_awal", { ascending: false }).limit(1),
        ]);
        const row = (aggRes.data && aggRes.data[0]) || {};
        const settings = settingsRes.data || { gsph_target_mode: "fixed", gsph_target_fixed: 0 };
        const whJam = (Number(row.wh_menit) || 0) / 60;
        const stroke = Number(row.stroke) || 0;
        const ng = Number(row.ng) || 0;
        const downtimeMenit = Math.round(Number(row.downtime_menit) || 0);
        const targetStdMenit = Number(row.target_std_menit) || 0;
        let targetGsph = Number(settings.gsph_target_fixed) || 0;
        if (settings.gsph_target_mode === "per_part" && targetStdMenit > 0) targetGsph = stroke / (targetStdMenit / 60);
        const gsph = whJam > 0 ? stroke / whJam : 0;
        const availability = whJam > 0 ? Math.max(0, (whJam * 60 - downtimeMenit) / (whJam * 60)) * 100 : 0;
        const performanceFactor = targetGsph > 0 ? Math.min(gsph / targetGsph, 1) * 100 : 0;
        const quality = stroke > 0 ? Math.max(0, (stroke - ng) / stroke) * 100 : 100;
        const oee = (availability / 100) * (performanceFactor / 100) * (quality / 100) * 100;
        const last = (statusRes.data && statusRes.data[0]) || null;
        return { mesin: m.key, data: { stroke, ng, downtimeMenit, gsph, targetGsph, performanceFactor, oee, lastPart: last ? last.part_number : null } };
      }));

      this.machines = MACHINES.map((m) => ({ ...m, data: results.find((r) => r.mesin === m.key).data }));

      const t = results.reduce((acc, r) => ({
        stroke: acc.stroke + r.data.stroke,
        ng: acc.ng + r.data.ng,
        downtimeMenit: acc.downtimeMenit + r.data.downtimeMenit,
        oeeSum: acc.oeeSum + r.data.oee,
      }), { stroke: 0, ng: 0, downtimeMenit: 0, oeeSum: 0 });
      this.totals = { stroke: t.stroke, ng: t.ng, downtimeMenit: t.downtimeMenit, avgOee: t.oeeSum / MACHINES.length };
      this.lineAktif = results.filter((r) => r.data.stroke > 0).length;

      this.loading = false;
    },
    logout,
  };
}
</script>
