          meta.data.forEach((arc, i) => {
            const val = Number(dataset.data[i]) || 0;
            if (!val) return;
            const { x: cx, y: cy, innerRadius, outerRadius, startAngle, endAngle } = arc.getProps(
              ["x", "y", "innerRadius", "outerRadius", "startAngle", "endAngle"],
              true
            );
            const angle = (startAngle + endAngle) / 2;
            const r = (innerRadius + outerRadius) / 2;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;
            const sweep = endAngle - startAngle;
            // Irisan sempit -> font lebih kecil supaya tetap muat, tapi angka tetap ditampilkan
            const fontSize = sweep < 0.12 ? 8 : sweep < 0.22 ? 9.5 : 11;

            ctx.save();
            ctx.font = `700 ${fontSize}px Inter, sans-serif`;
            // Kontras teks: putih + outline gelap tipis, supaya terbaca di warna apa pun
            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(0,0,0,.45)";
            ctx.strokeText(formatter(val), x, y);
            ctx.fillStyle = "#fff";
            ctx.fillText(formatter(val), x, y);
            ctx.restore();
          });
        },
      });

      // --- Plugin: label angka DI ATAS setiap batang (untuk semua bar chart) ---
      // Anti-tabrakan: kalau beberapa batang berdekatan dan labelnya lebar,
      // label otomatis ditumpuk ke "baris" berikutnya (sebanyak yang diperlukan)
      // supaya SEMUA angka tetap terlihat tanpa saling menimpa.
      const barValueLabels = (formatter, datasetIndex = 0) => ({
        id: "dxyBarValueLabels",
        afterDatasetsDraw(chart) {
          const { ctx, chartArea } = chart;
          const meta = chart.getDatasetMeta(datasetIndex);
          const dataset = chart.data.datasets[datasetIndex];
          if (!meta || !dataset || meta.type !== "bar" || !meta.data) return;
          const textColor = cssVar("--dxy-text") || "#1F2937";
          const n = meta.data.length;
          const slotWidth = chartArea && n ? chartArea.width / n : 30;
          const fontSize = slotWidth < 24 ? 7.5 : slotWidth < 34 ? 8.5 : slotWidth < 46 ? 9.5 : 10.5;
          const rowStep = fontSize + 3;

          ctx.save();
          ctx.font = `700 ${fontSize}px Inter, sans-serif`;
          ctx.textAlign = "center";
          ctx.fillStyle = textColor;

          const rowsUp = [];   // batas kanan label terakhir per baris, untuk batang positif (menumpuk ke atas)
          const rowsDown = []; // idem untuk batang negatif (menumpuk ke bawah)
          meta.data.forEach((bar, i) => {
            const raw = dataset.data[i];
            if (raw === null || raw === undefined) return;
            const val = Number(raw);
            if (Number.isNaN(val)) return;
            const { x, y, base } = bar.getProps(["x", "y", "base"], true);
            const label = formatter(val);
            const halfW = ctx.measureText(label).width / 2 + 4;
            const isUp = y <= base; // batang positif -> tip di atas; batang negatif -> tip di bawah
            const rows = isUp ? rowsUp : rowsDown;

            let row = 0;
            while (row < rows.length && x - halfW < rows[row]) row++;
            rows[row] = x + halfW;

            const rowGap = row * rowStep;
            const labelY = isUp ? Math.max(chartArea.top + fontSize, y - 6 - rowGap) : y + 14 + rowGap;
            ctx.textBaseline = isUp ? "bottom" : "top";
            ctx.fillText(label, x, labelY);
          });
          ctx.restore();
        },
      });

      // --- Sparkline mini (di kartu KPI) ---
      const sparkline = (canvasId, data, hex) => {
        destroy(canvasId);
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const vals = data.filter((v) => v !== null && v !== undefined);
        this.tahunanCharts[canvasId] = new Chart(canvas, {
          type: "line",
          data: {
            labels: data.map((_, i) => i),
            datasets: [{ data, borderColor: hex, borderWidth: 2, pointRadius: 0, tension: 0.35, fill: true, backgroundColor: grad(canvas, hex, 0.28, 0), spanGaps: true }],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: { x: { display: false }, y: { display: false, beginAtZero: vals.length ? Math.min(...vals) >= 0 : true } },
            elements: { point: { radius: 0 } },
          },
        });
      };
      safe(() => sparkline("dxySparkProductivity", b.productivity.actual, "#2563EB"), "spark-productivity");
      safe(() => sparkline("dxySparkAvailability", b.availability.actual, "#10B981"), "spark-availability");
      safe(() => sparkline("dxySparkNg", b.ngInline.qtyByMonth, "#F97316"), "spark-ng");
      safe(() => sparkline("dxySparkStraightpass", b.straightpass.actual, "#14B8A6"), "spark-straightpass");

      // --- Grafik utama KPI (bar gradient + target garis putus-putus merah) ---
      const kpiBig = (canvasId, labels, actual, target, hex) => {
        destroy(canvasId);
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        this.tahunanCharts[canvasId] = new Chart(canvas, {
          data: {
            labels,
            datasets: [
              { type: "bar", label: "Actual", data: actual, backgroundColor: barBg(canvas, hex, actual.length), borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7, borderSkipped: false },
              { type: "line", label: "Target", data: labels.map(() => target), borderColor: "#EF4444", borderDash: [6, 4], borderWidth: 2, pointRadius: 0, tension: 0 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            layout: { padding: { top: 34 } },
            plugins: { legend: legend(true), tooltip: tooltip() },
            scales: baseScales(),
          },
          plugins: [barValueLabels((v) => fmtNum(v))],
        });
      };
      // Catatan: dua kolom pertama di b.monthLabels adalah ringkasan
      // "FY 2026" & "FY 2027" (dipakai Downtime Exhaust untuk total per
      // tahun fiskal). Untuk grafik-grafik lain kita buang 2 kolom ini,
      // cukup tampilkan 12 bulan (Apr..Mar). Ini murni di layer render,
      // data asli di this.tahunan tidak diubah.
      safe(() => kpiBig("dxyBigProductivity", b.monthLabels.slice(2), b.productivity.actual.slice(2), b.productivity.target, "#2563EB"), "big-productivity");
      safe(() => kpiBig("dxyBigAvailability", b.monthLabels.slice(2), b.availability.actual.slice(2), b.availability.target, "#10B981"), "big-availability");
      safe(() => kpiBig("dxyBigStraightpass", b.monthLabels.slice(2), b.straightpass.actual.slice(2), b.straightpass.target, "#14B8A6"), "big-straightpass");

      // --- NG Inline dual axis: Qty (bar oranye) + Value (garis ungu) ---
      safe(() => {
        destroy("dxyBigNg");
        const canvas = document.getElementById("dxyBigNg");
        if (!canvas) return;
        this.tahunanCharts.dxyBigNg = new Chart(canvas, {
          data: {
            labels: b.monthLabels.slice(2),
            datasets: [
              { type: "bar", label: "Qty", data: b.ngInline.qtyByMonth.slice(2), backgroundColor: barBg(canvas, "#F97316", b.ngInline.qtyByMonth.length - 2), yAxisID: "y", borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7 },
              { type: "line", label: "Value", data: b.ngInline.valueByMonth.slice(2), borderColor: "#8B5CF6", backgroundColor: "#8B5CF6", yAxisID: "y1", pointRadius: 3, tension: 0.3 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            layout: { padding: { top: 34 } },
            plugins: { legend: legend(true), tooltip: tooltip() },
            scales: {
              x: baseScales().x,
              y: { position: "left", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
              y1: { position: "right", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
            },
          },
          plugins: [barValueLabels((v) => fmtNum(v), 0)],
        });
      }, "ngInline");

      // --- Downtime Exhaust: bar gradient + tren + marker puncak + rata-rata ---
      safe(() => {
        destroy("dxyDowntimeExhaust");
        const canvas = document.getElementById("dxyDowntimeExhaust");
        if (!canvas) return;
        // Dua kolom pertama (FY 2026 & FY 2027) berisi angka ringkasan
        // total per tahun fiskal -- sesuai instruksi, kolom ini dibuang
        // dari SEMUA grafik, termasuk di sini. Chart sekarang murni
        // menampilkan 12 bulan (Apr..Mar).
        const vals = b.downtimeExhaust.values.slice(2);
        const labels = b.downtimeExhaust.labels.slice(2);
        const validMonthly = vals.filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
        const avg = validMonthly.length ? validMonthly.reduce((a, c) => a + c, 0) / validMonthly.length : 0;
        const peakIdx = validMonthly.length ? vals.indexOf(Math.max(...validMonthly)) : -1;
        const peakPoints = vals.map((v, i) => (i === peakIdx ? v : null));
        this.tahunanCharts.dxyDowntimeExhaust = new Chart(canvas, {
          data: {
            labels: labels,
            datasets: [
              { type: "bar", label: "Downtime (menit)", data: vals, backgroundColor: barBg(canvas, "#F97316", vals.length), borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7 },
              { type: "line", label: "Tren", data: vals, borderColor: "#EF4444", pointRadius: 0, tension: 0.35, borderWidth: 2 },
              { type: "line", label: "Rata-rata", data: vals.map(() => avg), borderColor: cssVar("--muted"), borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, tension: 0 },
              { type: "line", label: "Puncak", data: peakPoints, borderColor: "#EF4444", backgroundColor: "#EF4444", pointRadius: 6, pointStyle: "rectRot", showLine: false, spanGaps: false },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false, animation: noAnim, layout: { padding: { top: 34 } }, plugins: { legend: legend(true), tooltip: tooltip() }, scales: baseScales() },
          plugins: [barValueLabels((v) => fmtNum(v), 0)],
        });
      }, "downtimeExhaust");

      // --- Downtime Supporting: pie per-PIC (proporsi Act menit) ---
      safe(() => {
        destroy("dxyDowntimeSupporting");
        const canvas = document.getElementById("dxyDowntimeSupporting");
        if (!canvas) return;
        const colors = b.downtimeSupporting.labels.map((pic) => this.dxyPicColor(pic));
        this.tahunanCharts.dxyDowntimeSupporting = new Chart(canvas, {
          type: "doughnut",
          data: {
            labels: b.downtimeSupporting.labels,
            datasets: [{ data: b.downtimeSupporting.act, backgroundColor: colors, borderColor: cssVar("--panel"), borderWidth: 2 }],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            layout: { padding: { left: 8, right: 8, top: 8, bottom: 8 } },
            cutout: "62%",
            plugins: { legend: legend(true), tooltip: tooltip() },
          },
          plugins: [donutLeaderLabels((v) => fmtNum(v))],
        });
      }, "downtimeSupporting");

      // --- Downtime Line: pie diurutkan besar->kecil, warna berdasarkan ranking ---
      safe(() => {
        destroy("dxyDowntimeLine");
        const canvas = document.getElementById("dxyDowntimeLine");
        if (!canvas) return;
        const idx = b.downtimeLine.labels.map((_, i) => i);
        idx.sort((a, c) => (b.downtimeLine.act[c] || 0) - (b.downtimeLine.act[a] || 0));
        const labels = idx.map((i) => b.downtimeLine.labels[i]);
        const act = idx.map((i) => b.downtimeLine.act[i]);
        const rankColors = ["#EF4444", "#F97316", "#F59E0B"];
        const colors = idx.map((_, rank) => {
          const base = rankColors[rank] || "#2563EB";
          if (this.dxyLineFilter !== "ALL" && labels[rank] !== this.dxyLineFilter) return base + "40";
          return base;
        });
        this.tahunanCharts.dxyDowntimeLine = new Chart(canvas, {
          type: "doughnut",
          data: {
            labels,
            datasets: [{ data: act, backgroundColor: colors, borderColor: cssVar("--panel"), borderWidth: 2 }],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            layout: { padding: { left: 8, right: 8, top: 8, bottom: 8 } },
            cutout: "62%",
            plugins: { legend: legend(true), tooltip: tooltip() },
          },
          plugins: [donutLeaderLabels((v) => fmtNum(v))],
        });
      }, "downtimeLine");
    },
    // Chart "Month" di tab Kontrol Kualitas (kolom NG Inline & Straightpass)
    // sengaja diisi data yang SAMA dengan grafik di tab Tahunan (NG Inline
    // & Straight Pass), bukan sumber data baru. Style & gradasi warna juga
    // disamakan supaya konsisten.
    renderKualitasCharts() {
      if (typeof Chart === "undefined") return;
      const b = this.tahunan;
      if (!b || !b.monthLabels) return;
      const destroy = (id) => { if (this.qcCharts[id]) { this.qcCharts[id].destroy(); delete this.qcCharts[id]; } };
      const noAnim = { duration: 0 };
      const safe = (fn, label) => { try { fn(); } catch (e) { console.error("Gagal render chart Kualitas:", label, e); } };

      const baseScales = () => ({
        x: { ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: true, color: cssVar("--border") } },
        y: { ticks: { color: cssVar("--chart-tick"), font: { size: 9 }, maxTicksLimit: 5 }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
      });
      const legend = (show) => ({ display: show, position: "bottom", labels: { color: cssVar("--muted"), boxWidth: 8, boxHeight: 8, usePointStyle: true, pointStyle: "circle", font: { size: 9 }, padding: 6 } });
      const tooltip = () => ({ backgroundColor: cssVar("--panel"), titleColor: cssVar("--text"), bodyColor: cssVar("--text"), borderColor: cssVar("--border"), borderWidth: 1, padding: 10, cornerRadius: 8, displayColors: true, usePointStyle: true });
      const grad = (canvas, hex, alphaTop = 0.85, alphaBottom = 0.05) => {
        const ctx = canvas.getContext("2d");
        const h = canvas.height || 200;
        const g = ctx.createLinearGradient(0, 0, 0, h);
        const toRgba = (a) => {
          const n = parseInt(hex.replace("#", ""), 16);
          const r = (n >> 16) & 255, gg = (n >> 8) & 255, bl = n & 255;
          return `rgba(${r},${gg},${bl},${a})`;
        };
        g.addColorStop(0, toRgba(alphaTop));
        g.addColorStop(1, toRgba(alphaBottom));
        return g;
      };
      const barBg = (canvas, hex, len) => {
        const full = grad(canvas, hex);
        return Array.from({ length: len }, () => full);
      };
      const barValueLabels = (formatter, datasetIndex = 0) => ({
        id: "dxyQcBarValueLabels_" + datasetIndex + "_" + Math.random(),
        afterDatasetsDraw(chart) {
          const { ctx, chartArea } = chart;
          const meta = chart.getDatasetMeta(datasetIndex);
          const dataset = chart.data.datasets[datasetIndex];
          if (!meta || !dataset || meta.type !== "bar" || !meta.data) return;
          const textColor = cssVar("--dxy-text") || "#1F2937";
          const n = meta.data.length;
          const slotWidth = chartArea && n ? chartArea.width / n : 30;
          const fontSize = slotWidth < 24 ? 7.5 : slotWidth < 34 ? 8.5 : slotWidth < 46 ? 9.5 : 10.5;
          ctx.save();
          ctx.font = `700 ${fontSize}px Inter, sans-serif`;
          ctx.textAlign = "center";
          ctx.fillStyle = textColor;
          meta.data.forEach((bar, i) => {
            const raw = dataset.data[i];
            if (raw === null || raw === undefined) return;
            const val = Number(raw);
            if (Number.isNaN(val)) return;
            const { x, y, base } = bar.getProps(["x", "y", "base"], true);
            const isUp = y <= base;
            ctx.textBaseline = isUp ? "bottom" : "top";
            ctx.fillText(formatter(val), x, isUp ? y - 6 : y + 14);
          });
          ctx.restore();
        },
      });

      // --- Month · NG Inline: sekarang pakai data ASLI dari RPC
      // dashboard_qc_ng_month (type_ng = 'NG PRODUKSI'), bukan lagi
      // numpang data gabungan dari tab Tahunan. ---
      safe(() => {
        destroy("qcNgInlineMonth");
        const canvas = document.getElementById("qcNgInlineMonth");
        if (!canvas) return;
        const ngi = this.qcNgInline;
        this.qcCharts.qcNgInlineMonth = new Chart(canvas, {
          data: {
            labels: ngi.monthLabels,
            datasets: [
              { type: "bar", label: "Qty", data: ngi.qtyByMonth, backgroundColor: barBg(canvas, "#F97316", ngi.qtyByMonth.length), yAxisID: "y", borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7 },
              { type: "line", label: "Value", data: ngi.valueByMonth, borderColor: "#8B5CF6", backgroundColor: "#8B5CF6", yAxisID: "y1", pointRadius: 3, tension: 0.3 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            layout: { padding: { top: 28 } },
            plugins: { legend: legend(true), tooltip: tooltip() },
            scales: {
              x: baseScales().x,
              y: { position: "left", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
              y1: { position: "right", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
            },
          },
          plugins: [barValueLabels((v) => fmtNum(v), 0)],
        });
      }, "qcNgInlineMonth");

      // --- Month · NG Trial: STRUKTUR/STYLE sama persis dengan NG Inline
      // (Qty bar oranye + Value garis ungu, dual axis) -- data sengaja
      // dikosongkan dulu (belum ada sumber data NG Trial). ---
      safe(() => {
        destroy("qcNgTrialMonth");
        const canvas = document.getElementById("qcNgTrialMonth");
        if (!canvas) return;
        const labels = b.monthLabels.slice(2);
        const emptyQty = labels.map(() => null);
        const emptyValue = labels.map(() => null);
        this.qcCharts.qcNgTrialMonth = new Chart(canvas, {
          data: {
            labels,
            datasets: [
              { type: "bar", label: "Qty", data: emptyQty, backgroundColor: barBg(canvas, "#F97316", emptyQty.length), yAxisID: "y", borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7 },
              { type: "line", label: "Value", data: emptyValue, borderColor: "#8B5CF6", backgroundColor: "#8B5CF6", yAxisID: "y1", pointRadius: 3, tension: 0.3 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            layout: { padding: { top: 28 } },
            plugins: { legend: legend(true), tooltip: tooltip() },
            scales: {
              x: baseScales().x,
              y: { position: "left", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
              y1: { position: "right", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
            },
          },
          plugins: [barValueLabels((v) => fmtNum(v), 0)],
        });
      }, "qcNgTrialMonth");

      // --- Month · Straightpass: sama dengan grafik "Straight Pass" di tab
      // Tahunan (bar gradient + garis target putus-putus) ---
      safe(() => {
        destroy("qcStraightpassMonth");
        const canvas = document.getElementById("qcStraightpassMonth");
        if (!canvas) return;
        const labels = b.monthLabels.slice(2);
        const actual = b.straightpass.actual.slice(2);
        this.qcCharts.qcStraightpassMonth = new Chart(canvas, {
          data: {
            labels,
            datasets: [
              { type: "bar", label: "Actual", data: actual, backgroundColor: barBg(canvas, "#14B8A6", actual.length), borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7, borderSkipped: false },
              { type: "line", label: "Target", data: labels.map(() => b.straightpass.target), borderColor: "#EF4444", borderDash: [6, 4], borderWidth: 2, pointRadius: 0, tension: 0 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            layout: { padding: { top: 28 } },
            plugins: { legend: legend(true), tooltip: tooltip() },
            scales: baseScales(),
          },
          plugins: [barValueLabels((v) => fmtNum(v), 0)],
        });
      }, "qcStraightpassMonth");

      // --- Perline & Model: 6 chart bar sederhana (E-02..E-07 / daftar
      // model) untuk 3 kolom. NG Inline sudah pakai data asli; NG Trial &
      // Straightpass masih dikosongkan dulu (belum ada RPC-nya). ---
      const qcSimpleBar = (canvasId, categories, hex, dataQty) => {
        safe(() => {
          destroy(canvasId);
          const canvas = document.getElementById(canvasId);
          if (!canvas) return;
          const values = dataQty || categories.map(() => null);
          this.qcCharts[canvasId] = new Chart(canvas, {
            type: "bar",
            data: {
              labels: categories,
              datasets: [{ label: "Qty", data: values, backgroundColor: barBg(canvas, hex, categories.length), borderRadius: 6, barPercentage: 0.6, categoryPercentage: 0.7 }],
            },
            options: {
              responsive: true, maintainAspectRatio: false, animation: noAnim,
              layout: { padding: { top: 22 } },
              plugins: { legend: legend(false), tooltip: tooltip() },
              scales: baseScales(),
            },
            plugins: [barValueLabels((v) => fmtNum(v), 0)],
          });
        }, canvasId);
      };
      const ngi = this.qcNgInline;
      qcSimpleBar("qcNgInlinePerline", QC_LINES, "#F97316", ngi.perlineQty);
      qcSimpleBar("qcNgInlineModel", QC_MODELS, "#F97316", ngi.permodelQty);
      qcSimpleBar("qcNgTrialPerline", QC_LINES, "#06B6D4");
      qcSimpleBar("qcNgTrialModel", QC_MODELS, "#06B6D4");
      qcSimpleBar("qcStraightpassPerline", QC_LINES, "#22C55E");
      qcSimpleBar("qcStraightpassModel", QC_MODELS, "#22C55E");

      // --- Daily: tanggal 1-31, dual axis. NG Inline & NG Trial pakai
      // Qty (bar) + Value (garis); Straightpass pakai Qty (bar) + % (garis).
      // NG Inline sudah pakai data asli; NG Trial & Straightpass masih
      // dikosongkan dulu (belum ada RPC-nya). ---
      const QC_DAYS = Array.from({ length: 31 }, (_, i) => String(i + 1));
      const qcDualAxisDaily = (canvasId, hexBar, hexLine, barLabel, lineLabel, lineIsPercent, dataBar, dataLine) => {
        safe(() => {
          destroy(canvasId);
          const canvas = document.getElementById(canvasId);
          if (!canvas) return;
          const barData = dataBar || QC_DAYS.map(() => null);
          const lineData = dataLine || QC_DAYS.map(() => null);
          this.qcCharts[canvasId] = new Chart(canvas, {
            data: {
              labels: QC_DAYS,
              datasets: [
                { type: "bar", label: barLabel, data: barData, backgroundColor: barBg(canvas, hexBar, QC_DAYS.length), yAxisID: "y", borderRadius: 4, barPercentage: 0.6, categoryPercentage: 0.75 },
                { type: "line", label: lineLabel, data: lineData, borderColor: hexLine, backgroundColor: hexLine, yAxisID: "y1", pointRadius: 2, tension: 0.3 },
              ],
            },
            options: {
              responsive: true, maintainAspectRatio: false, animation: noAnim,
              layout: { padding: { top: 22 } },
              plugins: { legend: legend(true), tooltip: tooltip() },
              scales: {
                x: { ticks: { color: cssVar("--chart-tick"), font: { size: 8 }, autoSkip: false, maxRotation: 0, minRotation: 0 }, grid: { display: false }, border: { display: true, color: cssVar("--border") } },
                y: { position: "left", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
                y1: { position: "right", ticks: { color: cssVar("--chart-tick"), font: { size: 9 }, callback: (v) => (lineIsPercent ? v + "%" : v) }, grid: { display: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true, ...(lineIsPercent ? { max: 100 } : {}) },
              },
            },
            plugins: [barValueLabels((v) => fmtNum(v), 0)],
          });
        }, canvasId);
      };
      qcDualAxisDaily("qcNgInlineDaily", "#F97316", "#8B5CF6", "Qty", "Value", false, ngi.dailyQty, ngi.dailyValue);
      qcDualAxisDaily("qcNgTrialDaily", "#06B6D4", "#8B5CF6", "Qty", "Value", false);
      qcDualAxisDaily("qcStraightpassDaily", "#22C55E", "#EF4444", "Qty", "%", true);
    },
    logout,
  };
}
</script>
</body>
