<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Exhaust — Welding Exhaust</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4f5f7">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
/* =========================================================================
   DASHBOARD EXHAUST - TAHUNAN (Smart Narrative Redesign)
   Semua rule di bawah ini di-namespace di bawah ".dxy" supaya TIDAK PERNAH
   menyentuh style tab Bulanan/Harian/Kualitas yang sudah ada. Tidak ada
   query, RPC, atau logika data yang diubah di sini -- murni lapisan visual.
   ========================================================================= */
.dxy {
  --dxy-bg: #F5F7FB;
  --dxy-card: #FFFFFF;
  --dxy-border: #E5E7EB;
  --dxy-text: #1F2937;
  --dxy-muted: #6B7280;
  --dxy-blue: #2563EB;
  --dxy-green: #10B981;
  --dxy-orange: #F97316;
  --dxy-teal: #14B8A6;
  --dxy-purple: #8B5CF6;
  --dxy-red: #EF4444;
  --dxy-yellow: #F59E0B;
  --dxy-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.12);
  --dxy-shadow-hover: 0 4px 10px rgba(15,23,42,.06), 0 16px 32px -14px rgba(15,23,42,.18);
  background: var(--dxy-bg);
  color: var(--dxy-text);
  padding: 18px;
  border-radius: 20px;
  font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .dxy {
  --dxy-bg: #0f172a;
  --dxy-card: #1e293b;
  --dxy-border: #334155;
  --dxy-text: #f8fafc;
  --dxy-muted: #94a3b8;
  --dxy-shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.4);
  --dxy-shadow-hover: 0 4px 10px rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.5);
}

/* ---- Filter bar (Baris 1) ---- */
.dxy-filterbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.dxy-filterbar .dxy-spacer { flex: 1; }
.dxy-field {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.dxy-field label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--dxy-muted);
}
.dxy-select, .dxy-input {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  color: var(--dxy-text);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-family: inherit;
  min-height: 32px;
}
.dxy-select:disabled, .dxy-input:disabled { opacity: .45; cursor: not-allowed; }
.dxy-input { min-width: 160px; }
.dxy-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  color: var(--dxy-text);
  border-radius: 10px;
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.dxy-btn:hover { box-shadow: var(--dxy-shadow); transform: translateY(-1px); }
.dxy-btn-primary { background: var(--dxy-blue); border-color: var(--dxy-blue); color: #fff; }

/* ---- KPI row (Baris 2) ---- */
.dxy-kpi-row {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.dxy-kpi-card {
  grid-column: span 3;
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 14px 16px;
  min-height: 112px;
  box-shadow: var(--dxy-shadow);
  transition: transform 200ms ease, box-shadow 200ms ease;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  overflow: hidden;
}
.dxy-kpi-card:hover { transform: translateY(-2px); box-shadow: var(--dxy-shadow-hover); }
.dxy-kpi-top { display: flex; align-items: center; justify-content: space-between; }
.dxy-kpi-label { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--dxy-muted); text-transform: uppercase; }
.dxy-kpi-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dxy-kpi-mid { display: flex; align-items: baseline; gap: 8px; }
.dxy-kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
.dxy-kpi-delta { font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
.dxy-kpi-delta.up { color: var(--dxy-green); }
.dxy-kpi-delta.down { color: var(--dxy-red); }
.dxy-kpi-delta.flat { color: var(--dxy-muted); }
.dxy-kpi-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.dxy-kpi-target { font-size: 10.5px; color: var(--dxy-muted); }
.dxy-kpi-spark { width: 84px; height: 28px; }

/* ---- Smart Narrative (Baris 3) ---- */
.dxy-narrative {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 16px;
  box-shadow: var(--dxy-shadow);
}
.dxy-narrative-head { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dxy-muted); margin-bottom: 10px; }
.dxy-narrative-list { display: flex; flex-direction: column; gap: 9px; }
.dxy-narrative-item { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; line-height: 1.5; }
.dxy-narrative-icon { flex-shrink: 0; font-size: 13px; line-height: 1.5; }
.dxy-narrative-item b { font-weight: 700; }

/* ---- Chart grid (Baris 4) ---- */
.dxy-chart-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.dxy-panel {
  background: var(--dxy-card);
  border: 1px solid var(--dxy-border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--dxy-shadow);
  transition: box-shadow 200ms ease;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.dxy-panel:hover { box-shadow: var(--dxy-shadow-hover); }
.dxy-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.dxy-panel-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.dxy-panel-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(16,185,129,.12); color: var(--dxy-green); }
.dxy-panel-sub { font-size: 10.5px; color: var(--dxy-muted); }
.dxy-span-6 { grid-column: span 6; }
.dxy-span-12 { grid-column: span 12; }
.dxy-chart-box { position: relative; flex: 1; min-height: 230px; }
.dxy-chart-box.tall { min-height: 280px; }

/* ---- Tabel Downtime Terbesar (redesign total) ---- */
.dxy-table-panel { grid-column: span 12; }
.dxy-table-scroll { max-height: 420px; overflow: auto; border-radius: 12px; border: 1px solid var(--dxy-border); }
table.dxy-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
table.dxy-table thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--dxy-card);
  border-bottom: 2px solid var(--dxy-border);
  text-align: left;
  padding: 10px 12px;
  font-size: 10px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--dxy-muted);
}
table.dxy-table tbody td { padding: 9px 12px; border-bottom: 1px solid var(--dxy-border); vertical-align: middle; }
table.dxy-table tbody tr:nth-child(even) { background: rgba(107,114,128,.045); }
table.dxy-table tbody tr:hover { background: rgba(37,99,235,.06); }
.dxy-rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  font-size: 10.5px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.dxy-pic-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--dxy-muted); }
.dxy-pic-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.dxy-minute-badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.dxy-empty-cell { color: var(--dxy-muted); font-style: italic; }

/* ---- Skeleton loading ---- */
.dxy-skeleton-row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-bottom: 16px; }
.dxy-skeleton {
  grid-column: span 3;
  height: 112px;
  border-radius: 16px;
  background: linear-gradient(90deg, var(--dxy-border) 25%, rgba(255,255,255,.5) 37%, var(--dxy-border) 63%);
  background-size: 400% 100%;
  animation: dxy-shimmer 1.4s ease infinite;
}
@keyframes dxy-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* ---- Responsive ---- */
@media (max-width: 1366px) {
  .dxy-kpi-card { grid-column: span 6; }
  .dxy-skeleton { grid-column: span 6; }
}
@media (max-width: 1024px) {
  .dxy-span-6 { grid-column: span 12; }
  .dxy-filterbar { gap: 8px; }
}
@media (max-width: 640px) {
  .dxy-kpi-card, .dxy-skeleton { grid-column: span 12; }
}
</style>
<script>
  (function () {
    var t = localStorage.getItem("theme_v1") || "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="assets/supabaseClient.js"></script>
</head>
<body>

<div class="app-shell" x-data="dashboardExhaust()" x-init="init()">
  <div class="mobile-topbar">
    <button class="hamburger" @click="mobileNavOpen = true">☰</button>
    <span class="mobile-title">Dashboard Exhaust</span>
  </div>
  <div class="sidebar-overlay" x-show="mobileNavOpen" @click="mobileNavOpen = false" x-cloak></div>
  <aside class="sidebar" :class="[mobileNavOpen ? 'sidebar-open' : '', sidebarCollapsed ? 'sidebar-collapsed' : '']">
    <button class="sidebar-collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed">
      <span x-show="!sidebarCollapsed">‹</span><span x-show="sidebarCollapsed">›</span>
    </button>
    <div class="sidebar-brand" x-show="!sidebarCollapsed">PRESS SHOP<span>·</span>SYSTEM</div>
    <nav class="sidebar-nav" @click="mobileNavOpen = false">
      <a href="dashboard-exhaust.html" class="sidebar-link active" title="Dashboard Exhaust"><span>📊</span><span x-show="!sidebarCollapsed">Dashboard Exhaust</span></a>
      <a href="index.html" class="sidebar-link" title="Dashboard"><span>🏠</span><span x-show="!sidebarCollapsed">Dashboard</span></a>
      <a href="plan-produksi.html" class="sidebar-link" title="Plan Produksi"><span>📅</span><span x-show="!sidebarCollapsed">Plan Produksi</span></a>
      <a href="input-produksi.html" class="sidebar-link" title="Input Produksi"><span>⚙️</span><span x-show="!sidebarCollapsed">Input Produksi</span></a>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-attendance.html" class="sidebar-link" title="Input Attendance"><span>👥</span><span x-show="!sidebarCollapsed">Input Attendance</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-scrap.html" class="sidebar-link" title="Input Scrap"><span>♻️</span><span x-show="!sidebarCollapsed">Input Scrap</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="input-safety.html" class="sidebar-link" title="Input Safety"><span>⛑️</span><span x-show="!sidebarCollapsed">Input Safety</span></a>
      </template>
    </nav>
    <div class="sidebar-foot" x-show="!sidebarCollapsed">
      <div class="who" x-text="profile?.full_name || session?.user?.email || '...'"></div>
      <span class="badge" :class="profile?.role === 'admin' ? 'role-admin' : ''" x-text="profile?.jabatan || profile?.role || '...'"></span>
      <button class="btn-ghost btn-sm" @click="logout()">Keluar</button>
    </div>
    <button class="sidebar-logout-collapsed" x-show="sidebarCollapsed" @click="logout()" title="Keluar">⏻</button>
  </aside>

  <main class="main">
    <div class="dash-topbar">
      <div class="dash-title-block">
        <h1>DASHBOARD EXHAUST</h1>
      </div>
      <div class="dash-controls">
        <template x-if="activeTab === 'harian'">
          <input type="date" x-model="tanggal" @change="fetchAll()">
        </template>
        <template x-if="activeTab === 'harian'">
          <select x-model="shiftFilter" @change="fetchAll()">
            <option value="all">Semua Shift</option>
            <option value="1">Shift 1 (07:00–19:30)</option>
            <option value="2">Shift 2 (19:30–07:00)</option>
          </select>
        </template>
        <button class="theme-toggle" @click="toggleTheme()" :title="theme === 'dark' ? 'Ke mode terang' : 'Ke mode gelap'">
          <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
        </button>
      </div>
    </div>

    <!-- Switch Harian / Bulanan / Kontrol Kualitas -->
    <div class="dash-subtab-nav" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <button class="btn-secondary btn-sm" :class="activeTab==='tahunan' ? 'btn-primary' : ''" @click="setTab('tahunan')">Tahunan</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='bulanan' ? 'btn-primary' : ''" @click="setTab('bulanan')">Bulanan</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='harian' ? 'btn-primary' : ''" @click="setTab('harian')">Harian</button>
      <button class="btn-secondary btn-sm" :class="activeTab==='kualitas' ? 'btn-primary' : ''" @click="setTab('kualitas')">Kontrol Kualitas</button>
    </div>

    <!-- ===== TAB: HARIAN ===== -->
    <template x-if="activeTab === 'harian'">
      <div>
        <template x-if="loading"><p class="empty-state">Memuat data...</p></template>

        <template x-if="!loading">
          <div class="dash-body">
            <!-- Ringkasan total gabungan kecil di atas -->
            <div class="fleet-summary-grid">
              <div class="perf-card">
                <span class="hint">Line Aktif</span>
                <b class="mono" x-text="lineAktif + ' / 6'"></b>
              </div>
              <div class="perf-card">
                <span class="hint">Total Output (Stroke)</span>
                <b class="mono" x-text="fmtNum(totals.stroke)"></b>
              </div>
              <div class="perf-card">
                <span class="hint">Total NG</span>
                <b class="mono" x-text="fmtNum(totals.ng)"></b>
              </div>
              <div class="perf-card">
                <span class="hint">Total Downtime (menit)</span>
                <b class="mono" x-text="fmtNum(totals.downtimeMenit)"></b>
              </div>
              <div class="perf-card">
                <span class="hint">Rata-rata OEE</span>
                <b class="mono" x-text="fmtNum(totals.avgOee) + '%'"></b>
              </div>
            </div>

            <!-- Kartu per Line -->
            <div class="machine-cards-grid">
              <template x-for="m in machines" :key="m.key">
                <a :href="m.href" class="machine-card" :class="'machine-card-' + statusClass(m)">
                  <div class="machine-card-top">
                    <span class="machine-card-name" x-text="m.label"></span>
                    <span class="status-badge" :class="'status-' + statusBadge(m)" x-text="statusLabel(m)"></span>
                  </div>
                  <div class="machine-card-oee" x-text="fmtNum(m.data.oee) + '% OEE'"></div>
                  <p class="hint" style="margin:2px 0 10px;">
                    Part terakhir: <b x-text="m.data.lastPart || '-'"></b>
                  </p>
                  <div class="machine-card-stats" style="flex-wrap:wrap; row-gap:8px;">
                    <div><span class="hint">Output</span><br><b x-text="fmtNum(m.data.stroke)"></b></div>
                    <div><span class="hint">NG</span><br><b x-text="fmtNum(m.data.ng)"></b></div>
                    <div><span class="hint">Downtime</span><br><b x-text="fmtNum(m.data.downtimeMenit) + ' m'"></b></div>
                  </div>
                  <div class="machine-card-stats" style="flex-wrap:wrap; row-gap:8px; margin-top:8px;">
                    <div><span class="hint">GSPH</span><br><b x-text="fmtNum(m.data.gsph)"></b></div>
                    <div><span class="hint">Target</span><br><b x-text="fmtNum(m.data.targetGsph)"></b></div>
                    <div><span class="hint">Perf</span><br><b x-text="fmtNum(m.data.performanceFactor) + '%'"></b></div>
                  </div>
                  <div class="sqcpm-bar" style="margin-top:12px;">
                    <div class="sqcpm-bar-fill" :style="'width:' + Math.max(0, Math.min(100, m.data.oee)) + '%'"></div>
                  </div>
                </a>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ===== TAB: BULANAN ===== -->
    <template x-if="activeTab === 'bulanan'">
      <div class="bulanan-fill">
        <template x-if="bulananLoading"><p class="empty-state">Memuat data bulanan...</p></template>
        <template x-if="!bulananLoading">
          <div class="dash-body bulanan-body">

        <!-- Baris 1: 4 KPI utama -->
        <div class="bulanan-kpi-grid">
          <div class="kpi-card">
            <div class="kpi-head"><span class="kpi-dot kpi-dot-blue"></span>PRODUCTIVITY</div>
            <div class="kpi-value" x-text="bulanan.productivity.value + '%'"></div>
            <div class="kpi-sub">BULAN BERJALAN</div>
            <div class="kpi-chart"><canvas id="kpiProductivityChart"></canvas></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-head"><span class="kpi-dot kpi-dot-teal"></span>AVAILABILITY</div>
            <div class="kpi-value" x-text="bulanan.availability.value + '%'"></div>
            <div class="kpi-sub">BULAN BERJALAN</div>
            <div class="kpi-chart"><canvas id="kpiAvailabilityChart"></canvas></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-head"><span class="kpi-dot kpi-dot-red"></span>NG INLINE</div>
            <div class="kpi-head-row">
              <div><span class="kpi-value" x-text="bulanan.ngInline.qty"></span><span class="kpi-sub"> pcs</span><div class="kpi-sub">QTY BULAN BERJALAN</div></div>
              <div class="kpi-head-right"><span class="kpi-value" x-text="fmtNum(bulanan.ngInline.value)"></span><div class="kpi-sub">VALUE BULAN BERJALAN</div></div>
            </div>
            <div class="kpi-chart"><canvas id="kpiNgInlineChart"></canvas></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-head"><span class="kpi-dot kpi-dot-teal"></span>STRAIGHTPASS</div>
            <div class="kpi-value" x-text="bulanan.straightpass.value + '%'"></div>
            <div class="kpi-sub">BULAN BERJALAN</div>
            <div class="kpi-chart"><canvas id="kpiStraightpassChart"></canvas></div>
          </div>
        </div>

        <!-- Baris 2: Downtime Exhaust / Supporting / Line -->
        <div class="dash-main-grid bulanan-row2">
          <div class="dash-panel dash-panel-chart dt-exhaust-panel">
            <p class="dash-panel-title">Downtime Exhaust</p>
            <div class="dash-chart-sm"><canvas id="dtExhaustChart"></canvas></div>
          </div>
          <div class="dash-panel dash-panel-chart">
            <p class="dash-panel-title">Downtime Supporting</p>
            <div class="dash-chart-sm"><canvas id="dtSupportingChart"></canvas></div>
          </div>
          <div class="dash-panel dash-panel-chart">
            <p class="dash-panel-title">Downtime Line</p>
            <div class="dash-chart-sm"><canvas id="dtLineChart"></canvas></div>
          </div>
        </div>

        <!-- Baris 3: Weekly Breakdown -->
        <div class="weekly-grid">
          <template x-for="(w, idx) in bulanan.weekly" :key="'week-'+idx">
            <div class="dash-panel dash-panel-chart">
              <p class="dash-panel-title" x-text="'WEEK ' + (idx + 1)" style="text-align:center;"></p>
              <div class="dash-chart-sm week-chart-sm"><canvas :id="'weekChart' + (idx + 1)"></canvas></div>
            </div>
          </template>
        </div>

        <!-- Baris 4: Downtime Terbesar -->
        <div class="downtime-terbesar-outer">
          <div class="dash-panel-title">Downtime Terbesar</div>
          <div class="downtime-terbesar-grid">
            <template x-for="line in bulanan.downtimeTerbesar" :key="line.mesin">
              <div class="dash-panel dt-terbesar-panel">
                <span class="badge dt-terbesar-badge" x-text="line.mesin"></span>
                <div class="table-wrap">
                  <table class="table-compact dt-terbesar-table">
                    <thead>
                      <tr>
                        <th>PIC</th>
                        <th>Problem</th>
                        <th class="dt-terbesar-value">Menit</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(row, i) in line.rowsPadded" :key="line.mesin + '-' + i">
                        <tr>
                          <td class="dt-terbesar-pic" x-text="row.pic"></td>
                          <td class="dt-terbesar-problem" x-text="row.problem"></td>
                          <td class="mono dt-terbesar-value" x-text="row.value"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>
          </div>
        </div>
        </div>
        </template>
      </div>
    </template>
    <template x-if="activeTab === 'tahunan'">
      <div class="dxy-fill">
        <template x-if="tahunanLoading">
          <div class="dxy">

<script>
const MACHINES = [
  { key: "E-02", label: "E-02", href: "machines/e-02.html" },
  { key: "E-03", label: "E-03", href: "machines/e-03.html" },
  { key: "E-04", label: "E-04", href: "machines/e-04.html" },
  { key: "E-05", label: "E-05", href: "machines/e-05.html" },
  { key: "E-06", label: "E-06", href: "machines/e-06.html" },
  { key: "E-07", label: "E-07", href: "machines/e-07.html" },
];

function fmtNum(n) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return "-";
  return Number(n).toLocaleString("en-US", { maximumFractionDigits: 1 });
}
function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function dashboardExhaust() {
  return {
    session: null, profile: null, mobileNavOpen: false, sidebarCollapsed: true,
    loading: true,
    activeTab: "bulanan", // bulanan | harian | kualitas
    theme: localStorage.getItem("theme_v1") || "light",
    tanggal: localDateStr(new Date()),
    shiftFilter: "all",
    machines: [],
    totals: { stroke: 0, ng: 0, downtimeMenit: 0, avgOee: 0 },
    lineAktif: 0,
    fmtNum,
    isLeaderOrAdmin() { return this.profile && ["admin", "leader"].includes(this.profile.role); },
    destroyBulananCharts() {
      Object.keys(this.bulananCharts).forEach((id) => {
        try { this.bulananCharts[id].destroy(); } catch (e) { /* noop */ }
        delete this.bulananCharts[id];
      });
    },
    destroyTahunanCharts() {
      Object.keys(this.tahunanCharts).forEach((id) => {
        try { this.tahunanCharts[id].destroy(); } catch (e) { /* noop */ }
        delete this.tahunanCharts[id];
      });
    },
    async setTab(tab) {
      if (this.activeTab === "bulanan" && tab !== "bulanan") this.destroyBulananCharts();
      if (this.activeTab === "tahunan" && tab !== "tahunan") this.destroyTahunanCharts();
      this.activeTab = tab;
      if (tab === "bulanan") {
        await this.fetchBulanan();
        this.$nextTick(() => this.renderBulananCharts());
      }
      if (tab === "tahunan") {
        await this.fetchTahunan();
        this.$nextTick(() => this.renderTahunanCharts());
      }
    },
    async onTahunanYearChange() {
      this.destroyTahunanCharts();
      this.tahunanLoaded = false;
      this.dxyMonthFilter = "ALL";
      await this.fetchTahunan();
      this.$nextTick(() => this.renderTahunanCharts());
    },
    toggleTheme() {
      this.theme = this.theme === "dark" ? "light" : "dark";
      localStorage.setItem("theme_v1", this.theme);
      document.documentElement.setAttribute("data-theme", this.theme);
      if (this.activeTab === "bulanan") this.$nextTick(() => this.renderBulananCharts());
      if (this.activeTab === "tahunan") this.$nextTick(() => this.renderTahunanCharts());
    },
    bounds() {
      const d = new Date(this.tanggal + "T00:00:00");
      if (this.shiftFilter === "1") {
        return { start: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 7, 0), end: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 19, 30) };
      }
      if (this.shiftFilter === "2") {
        return { start: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 19, 30), end: new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 7, 0) };
      }
      return { start: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0), end: new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0) };
    },
    statusClass(m) {
      if (!m.data || m.data.stroke === 0) return "warn"; // idle -> abu2, dianggap warn utk border
      const oee = m.data.oee || 0;
      if (oee >= 75) return "good";
      if (oee >= 50) return "warn";
      return "bad";
    },
    statusBadge(m) {
      if (!m.data || m.data.stroke === 0) return "idle";
      const oee = m.data.oee || 0;
      if (oee >= 75) return "running";
      if (oee >= 50) return "warn";
      return "stop";
    },
    statusLabel(m) {
      if (!m.data || m.data.stroke === 0) return "OFF";
      const oee = m.data.oee || 0;
      if (oee >= 75) return "GOOD";
      if (oee >= 50) return "FAIR";
      return "POOR";
    },
    // ---------------------------------------------------------------
    // DATA DUMMY "Bulanan" -- sementara statis, tinggal diganti hasil
    // query Supabase (RPC / view rollup bulanan) begitu tabelnya siap.
    // ---------------------------------------------------------------
    // ---------------------------------------------------------------
    // Data "Bulanan" -- diisi dari fetchBulanan() (RPC Supabase, lihat
    // migration_dashboard_bulanan.sql). Skeleton kosong dulu supaya
    // template tidak error sebelum data datang.
    // ---------------------------------------------------------------
    bulananLoading: true,
    bulananLoaded: false,
    bulanan: {
      monthLabels: [],
      productivity: { value: 0, actual: [], target: 100 },
      availability: { value: 0, actual: [], target: 100 },
      ngInline: { qty: 0, value: 0, qtyByMonth: [], valueByMonth: [] },
      straightpass: { value: 0, actual: [], qty: [], target: 100 },
      downtimeExhaust: { labels: [], values: [] },
      downtimeSupporting: { labels: [], plan: [], act: [] },
      downtimeLine: { labels: [], plan: [], act: [] },
      weekly: [],
      downtimeTerbesar: [],
    },
    bulananCharts: {},
    tahunanYear: new Date().getFullYear(),
    tahunanYearOptions: [2025, 2026, 2027],
    tahunanLoading: true,
    tahunanLoaded: false,
    tahunan: {
      monthLabels: [],
      productivity: { value: 0, actual: [], target: 100 },
      availability: { value: 0, actual: [], target: 100 },
      ngInline: { qty: 0, value: 0, qtyByMonth: [], valueByMonth: [] },
      straightpass: { value: 0, actual: [], qty: [], target: 100 },
      downtimeExhaust: { labels: [], values: [] },
      downtimeSupporting: { labels: [], plan: [], act: [] },
      downtimeLine: { labels: [], plan: [], act: [] },
      downtimeTerbesar: [],
    },
    tahunanCharts: {},
    tahunanInsights: [],
    dxyLineFilter: "ALL",
    dxyMonthFilter: "ALL",
    dxySearch: "",
    MACHINES_REF: MACHINES,
    async init() {
      this.session = await requireAuth();
      if (!this.session) return;
      const { data } = await supabaseClient.from("profiles").select("*").eq("id", this.session.user.id).maybeSingle();
      this.profile = data;
      await this.fetchAll();
      if (this.activeTab === "bulanan") await this.setTab("bulanan");
    },
    // ---- Ambil data Bulanan dari Supabase (sekali saja, di-cache) ----
    async fetchBulanan() {
      if (this.bulananLoaded) return;
      this.bulananLoading = true;
      try {
        const now = new Date();
        // Fiscal year: April -> Maret. Tahun mulai FY berjalan:
        const fyStartYear = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1; // getMonth() 3 = April
        const fyStart = new Date(fyStartYear, 3, 1);
        const fyEnd = new Date(fyStartYear + 1, 3, 1);
        const prevFyStart = new Date(fyStartYear - 1, 3, 1);
        const bulanIni = new Date(now.getFullYear(), now.getMonth(), 1);
        const bulanDepan = new Date(now.getFullYear(), now.getMonth() + 1, 1);

        const [prodRes, ngRes, picRes, lineRes, weeklyRes] = await Promise.all([
          supabaseClient.rpc("dashboard_bulanan_produksi", { p_start: prevFyStart.toISOString(), p_end: fyEnd.toISOString() }),
          supabaseClient.rpc("dashboard_bulanan_ng_inline", { p_start: prevFyStart.toISOString(), p_end: fyEnd.toISOString() }),
          // Downtime Supporting & Line: total dari awal tahun fiskal (April) s/d bulan berjalan
          supabaseClient.rpc("dashboard_bulanan_downtime_by_pic", { p_start: fyStart.toISOString(), p_end: bulanDepan.toISOString() }),
          supabaseClient.rpc("dashboard_bulanan_downtime_by_line", { p_start: fyStart.toISOString(), p_end: bulanDepan.toISOString() }),
          supabaseClient.rpc("dashboard_bulanan_weekly", { p_start: bulanIni.toISOString(), p_end: bulanDepan.toISOString() }),
        ]);
        const topRes = await Promise.all(MACHINES.map((m) =>
          supabaseClient.rpc("dashboard_bulanan_top_problems", { p_mesin: m.key, p_start: bulanIni.toISOString(), p_end: bulanDepan.toISOString(), p_limit: 5 })
        ));

        const prodRows = prodRes.data || [];
        const ngRows = ngRes.data || [];
        const monthKeyStr = (d) => localDateStr(d);

        // 12 bulan FY berjalan (Apr..Mar)
        const fyMonths = [];
        for (let i = 0; i < 12; i++) fyMonths.push(new Date(fyStartYear, 3 + i, 1));
        const monthLabelId = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

        const findRow = (rows, d) => rows.find((r) => r.bulan === monthKeyStr(d));
        const sumInRange = (rows, start, end, field) =>
          rows.filter((r) => { const rd = new Date(r.bulan + "T00:00:00"); return rd >= start && rd < end; })
              .reduce((a, r) => a + (Number(r[field]) || 0), 0);

        // Productivity & Availability & Straightpass per bulan (FY berjalan)
        const productivityActual = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          if (!row || !row.wh_menit) return null;
          return Number(((row.target_std_menit / row.wh_menit) * 100).toFixed(1));
        });
        const availabilityActual = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          if (!row || !row.wh_menit) return null;
          return Number((((row.wh_menit - row.downtime_menit) / row.wh_menit) * 100).toFixed(1));
        });
        const straightpassActual = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          const ngRow = findRow(ngRows, d);
          if (!row || !row.stroke) return null;
          const ngTotal = (Number(row.ng) || 0) + (ngRow ? Number(ngRow.qty) || 0 : 0);
          return Number((((row.stroke - ngTotal) / row.stroke) * 100).toFixed(1));
        });
        const straightpassQty = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          return row ? Number(row.stroke) : null;
        });

        // Bulan berjalan (bulan terakhir yang ada datanya)
        const lastRow = [...prodRows].reverse().find((r) => r.wh_menit > 0) || null;
        const lastNgRow = ngRows.length ? ngRows[ngRows.length - 1] : null;
        const productivityValue = lastRow ? Number(((lastRow.target_std_menit / lastRow.wh_menit) * 100).toFixed(1)) : 0;
        const availabilityValue = lastRow ? Number((((lastRow.wh_menit - lastRow.downtime_menit) / lastRow.wh_menit) * 100).toFixed(1)) : 0;
        const straightpassValue = lastRow && lastRow.stroke
          ? Number((((lastRow.stroke - ((Number(lastRow.ng) || 0) + (lastNgRow ? Number(lastNgRow.qty) || 0 : 0))) / lastRow.stroke) * 100).toFixed(1))
          : 0;

        // Downtime Exhaust: FY-1, FY, lalu 12 bulan Apr..Mar
        const dtExhaustLabels = ["FY " + fyStartYear, "FY " + (fyStartYear + 1), ...fyMonths.map((d) => monthLabelId[d.getMonth()])];
        const dtExhaustValues = [
          Math.round(sumInRange(prodRows, prevFyStart, fyStart, "downtime_menit")),
          Math.round(sumInRange(prodRows, fyStart, fyEnd, "downtime_menit")),
          ...fyMonths.map((d) => { const r = findRow(prodRows, d); return r ? Math.round(Number(r.downtime_menit)) : 0; }),
        ];

        // Downtime Supporting / Line (total FY berjalan: April s/d bulan ini)
        const picRows = picRes.data || [];
        const lineRows = lineRes.data || [];
        const PIC_ORDER = ["PE", "MESIN", "QC", "PC-SUPP", "PROD", "PRESS"];
        const downtimeSupporting = {
          labels: PIC_ORDER,
          plan: PIC_ORDER.map((p) => { const r = picRows.find((x) => x.pic === p); return r ? Math.round(Number(r.plan_menit)) : 0; }),
          act: PIC_ORDER.map((p) => { const r = picRows.find((x) => x.pic === p); return r ? Math.round(Number(r.act_menit)) : 0; }),
        };
        const downtimeLine = {
          labels: MACHINES.map((m) => m.key),
          plan: MACHINES.map((m) => { const r = lineRows.find((x) => x.mesin === m.key); return r ? Math.round(Number(r.plan_menit)) : 0; }),
          act: MACHINES.map((m) => { const r = lineRows.find((x) => x.mesin === m.key); return r ? Math.round(Number(r.act_menit)) : 0; }),
        };

        // Weekly Breakdown (ISO week, Senin-Minggu) -- bulan berjalan.
        // Selalu tampilkan semua minggu kalender di bulan ini (walau kosong),
        // bukan cuma minggu yang kebetulan ada data downtime-nya.
        const weeklyRows = weeklyRes.data || [];
        const isoWeekStart = (d) => {
          const day = d.getDay(); // 0=Minggu .. 6=Sabtu
          const diffToMonday = (day + 6) % 7; // Senin = 0
          const ws = new Date(d);
          ws.setDate(d.getDate() - diffToMonday);
          ws.setHours(0, 0, 0, 0);
          return ws;
        };
        const weekStartSet = new Set();
        for (let d = new Date(bulanIni); d < bulanDepan; d.setDate(d.getDate() + 1)) {
          weekStartSet.add(localDateStr(isoWeekStart(d)));
        }
        const weekStarts = Array.from(weekStartSet).sort();
        const weekly = weekStarts.map((ws) => ({
          labels: MACHINES.map((m) => m.key),
          values: MACHINES.map((m) => {
            const r = weeklyRows.find((x) => x.minggu_mulai === ws && x.mesin === m.key);
            return r ? Math.round(Number(r.downtime_menit)) : 0;
          }),
        }));
        // Selalu tampilkan sampai Week 5 (beberapa bulan memang punya 5 minggu
        // kalender) supaya layoutnya konsisten -- diisi 0 kalau minggunya
        // tidak ada di bulan ini.
        while (weekly.length < 5) weekly.push({ labels: MACHINES.map((m) => m.key), values: MACHINES.map(() => 0) });

        // Downtime Terbesar per line -- selalu tampilkan 5 baris ke bawah,
        // baris kosong jadi placeholder kalau datanya belum sampai 5.
        const downtimeTerbesar = MACHINES.map((m, idx) => {
          const rows = ((topRes[idx] && topRes[idx].data) || []).map((r) => ({ pic: r.pic, problem: r.problem, value: Math.round(Number(r.total_menit)) }));
          const rowsPadded = [...rows];
          while (rowsPadded.length < 5) rowsPadded.push({ pic: "", problem: "", value: "" });
          return { mesin: m.key, rows, rowsPadded };
        });

        this.bulanan = {
          monthLabels: dtExhaustLabels,
          productivity: { value: productivityValue, actual: [null, null, ...productivityActual], target: 100 },
          availability: { value: availabilityValue, actual: [null, null, ...availabilityActual], target: 100 },
          ngInline: {
            qty: lastNgRow ? Number(lastNgRow.qty) : 0,
            value: lastNgRow ? Number(lastNgRow.value) : 0,
            qtyByMonth: [null, null, ...fyMonths.map((d) => { const r = findRow(ngRows, d); return r ? Number(r.qty) : null; })],
            valueByMonth: [null, null, ...fyMonths.map((d) => { const r = findRow(ngRows, d); return r ? Number(r.value) : null; })],
          },
          straightpass: { value: straightpassValue, actual: [null, null, ...straightpassActual], qty: [null, null, ...straightpassQty], target: 100 },
          downtimeExhaust: { labels: dtExhaustLabels, values: dtExhaustValues },
          downtimeSupporting,
          downtimeLine,
          weekly,
          downtimeTerbesar,
        };
        this.bulananLoaded = true;
      } catch (e) {
        console.error("Gagal mengambil data Bulanan:", e);
      } finally {
        this.bulananLoading = false;
      }
    },
    async fetchTahunan() {
      if (this.tahunanLoaded) return;
      this.tahunanLoading = true;
      try {
        const now = new Date();
        // Fiscal year: April -> Maret. Tahun mulai FY dipilih dari dropdown Tahunan.
        const fyStartYear = this.tahunanYear;
        const fyStart = new Date(fyStartYear, 3, 1);
        const fyEnd = new Date(fyStartYear + 1, 3, 1);
        const prevFyStart = new Date(fyStartYear - 1, 3, 1);
        const bulanIni = new Date(now.getFullYear(), now.getMonth(), 1);
        const bulanDepan = new Date(now.getFullYear(), now.getMonth() + 1, 1);

        const [prodRes, ngRes, picRes, lineRes] = await Promise.all([
          supabaseClient.rpc("dashboard_bulanan_produksi", { p_start: prevFyStart.toISOString(), p_end: fyEnd.toISOString() }),
          supabaseClient.rpc("dashboard_bulanan_ng_inline", { p_start: prevFyStart.toISOString(), p_end: fyEnd.toISOString() }),
          // Downtime Supporting & Line: total dari awal tahun fiskal (April) s/d bulan berjalan
          supabaseClient.rpc("dashboard_bulanan_downtime_by_pic", { p_start: fyStart.toISOString(), p_end: bulanDepan.toISOString() }),
          supabaseClient.rpc("dashboard_bulanan_downtime_by_line", { p_start: fyStart.toISOString(), p_end: bulanDepan.toISOString() }),
        ]);
        const topRes = await Promise.all(MACHINES.map((m) =>
          supabaseClient.rpc("dashboard_bulanan_top_problems", { p_mesin: m.key, p_start: bulanIni.toISOString(), p_end: bulanDepan.toISOString(), p_limit: 5 })
        ));

        const prodRows = prodRes.data || [];
        const ngRows = ngRes.data || [];
        const monthKeyStr = (d) => localDateStr(d);

        // 12 bulan FY berjalan (Apr..Mar)
        const fyMonths = [];
        for (let i = 0; i < 12; i++) fyMonths.push(new Date(fyStartYear, 3 + i, 1));
        const monthLabelId = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

        const findRow = (rows, d) => rows.find((r) => r.bulan === monthKeyStr(d));
        const sumInRange = (rows, start, end, field) =>
          rows.filter((r) => { const rd = new Date(r.bulan + "T00:00:00"); return rd >= start && rd < end; })
              .reduce((a, r) => a + (Number(r[field]) || 0), 0);

        // Productivity & Availability & Straightpass per bulan (FY berjalan)
        const productivityActual = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          if (!row || !row.wh_menit) return null;
          return Number(((row.target_std_menit / row.wh_menit) * 100).toFixed(1));
        });
        const availabilityActual = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          if (!row || !row.wh_menit) return null;
          return Number((((row.wh_menit - row.downtime_menit) / row.wh_menit) * 100).toFixed(1));
        });
        const straightpassActual = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          const ngRow = findRow(ngRows, d);
          if (!row || !row.stroke) return null;
          const ngTotal = (Number(row.ng) || 0) + (ngRow ? Number(ngRow.qty) || 0 : 0);
          return Number((((row.stroke - ngTotal) / row.stroke) * 100).toFixed(1));
        });
        const straightpassQty = fyMonths.map((d) => {
          const row = findRow(prodRows, d);
          return row ? Number(row.stroke) : null;
        });

        // Bulan berjalan (bulan terakhir yang ada datanya)
        const lastRow = [...prodRows].reverse().find((r) => r.wh_menit > 0) || null;
        const lastNgRow = ngRows.length ? ngRows[ngRows.length - 1] : null;
        const productivityValue = lastRow ? Number(((lastRow.target_std_menit / lastRow.wh_menit) * 100).toFixed(1)) : 0;
        const availabilityValue = lastRow ? Number((((lastRow.wh_menit - lastRow.downtime_menit) / lastRow.wh_menit) * 100).toFixed(1)) : 0;
        const straightpassValue = lastRow && lastRow.stroke
          ? Number((((lastRow.stroke - ((Number(lastRow.ng) || 0) + (lastNgRow ? Number(lastNgRow.qty) || 0 : 0))) / lastRow.stroke) * 100).toFixed(1))
          : 0;

        // Downtime Exhaust: FY-1, FY, lalu 12 bulan Apr..Mar
        const dtExhaustLabels = ["FY " + fyStartYear, "FY " + (fyStartYear + 1), ...fyMonths.map((d) => monthLabelId[d.getMonth()])];
        const dtExhaustValues = [
          Math.round(sumInRange(prodRows, prevFyStart, fyStart, "downtime_menit")),
          Math.round(sumInRange(prodRows, fyStart, fyEnd, "downtime_menit")),
          ...fyMonths.map((d) => { const r = findRow(prodRows, d); return r ? Math.round(Number(r.downtime_menit)) : 0; }),
        ];

        // Downtime Supporting / Line (total FY berjalan: April s/d bulan ini)
        const picRows = picRes.data || [];
        const lineRows = lineRes.data || [];
        const PIC_ORDER = ["PE", "MESIN", "QC", "PC-SUPP", "PROD", "PRESS"];
        const downtimeSupporting = {
          labels: PIC_ORDER,
          plan: PIC_ORDER.map((p) => { const r = picRows.find((x) => x.pic === p); return r ? Math.round(Number(r.plan_menit)) : 0; }),
          act: PIC_ORDER.map((p) => { const r = picRows.find((x) => x.pic === p); return r ? Math.round(Number(r.act_menit)) : 0; }),
        };
        const downtimeLine = {
          labels: MACHINES.map((m) => m.key),
          plan: MACHINES.map((m) => { const r = lineRows.find((x) => x.mesin === m.key); return r ? Math.round(Number(r.plan_menit)) : 0; }),
          act: MACHINES.map((m) => { const r = lineRows.find((x) => x.mesin === m.key); return r ? Math.round(Number(r.act_menit)) : 0; }),
        };

        // Downtime Terbesar per line -- selalu tampilkan 5 baris ke bawah,
        // baris kosong jadi placeholder kalau datanya belum sampai 5.
        const downtimeTerbesar = MACHINES.map((m, idx) => {
          const rows = ((topRes[idx] && topRes[idx].data) || []).map((r) => ({ pic: r.pic, problem: r.problem, value: Math.round(Number(r.total_menit)) }));
          const rowsPadded = [...rows];
          while (rowsPadded.length < 5) rowsPadded.push({ pic: "", problem: "", value: "" });
          return { mesin: m.key, rows, rowsPadded };
        });

        this.tahunan = {
          monthLabels: dtExhaustLabels,
          productivity: { value: productivityValue, actual: [null, null, ...productivityActual], target: 100 },
          availability: { value: availabilityValue, actual: [null, null, ...availabilityActual], target: 100 },
          ngInline: {
            qty: lastNgRow ? Number(lastNgRow.qty) : 0,
            value: lastNgRow ? Number(lastNgRow.value) : 0,
            qtyByMonth: [null, null, ...fyMonths.map((d) => { const r = findRow(ngRows, d); return r ? Number(r.qty) : null; })],
            valueByMonth: [null, null, ...fyMonths.map((d) => { const r = findRow(ngRows, d); return r ? Number(r.value) : null; })],
          },
          straightpass: { value: straightpassValue, actual: [null, null, ...straightpassActual], qty: [null, null, ...straightpassQty], target: 100 },
          downtimeExhaust: { labels: dtExhaustLabels, values: dtExhaustValues },
          downtimeSupporting,
          downtimeLine,
          downtimeTerbesar,
        };
        this.tahunanLoaded = true;
        this.computeTahunanInsights();
      } catch (e) {
        console.error("Gagal mengambil data Tahunan:", e);
      } finally {
        this.tahunanLoading = false;
      }
    },
    // ---- Helper baru khusus redesign Tahunan (Smart Narrative) ----
    // Semua fungsi di bawah ini murni presentasi: membaca this.tahunan yang
    // sudah di-fetch, tidak melakukan query/RPC baru sama sekali.
    dxyDelta(arr, isCount) {
      const valid = (arr || []).filter((v) => v !== null && v !== undefined && !Number.isNaN(Number(v))).map(Number);
      if (valid.length < 2) return { dir: "flat", text: "–" };
      const last = valid[valid.length - 1];
      const prev = valid[valid.length - 2];
      if (isCount) {
        const pct = prev === 0 ? (last > 0 ? 100 : 0) : ((last - prev) / prev) * 100;
        const dir = pct > 1 ? "up" : pct < -1 ? "down" : "flat";
        return { dir, text: (pct >= 0 ? "▲ +" : "▼ ") + Math.abs(Math.round(pct)) + "%" };
      }
      const diff = last - prev;
      const dir = diff > 0.05 ? "up" : diff < -0.05 ? "down" : "flat";
      return { dir, text: (diff >= 0 ? "▲ +" : "▼ ") + Math.abs(diff).toFixed(1) + "%" };
    },
    dxyPicColor(pic) {
      const map = { PE: "#2563EB", MESIN: "#F97316", QC: "#8B5CF6", PROD: "#10B981", PRESS: "#EF4444", "PC-SUPP": "#14B8A6" };
      return map[pic] || "#6B7280";
    },
    dxyRankBadgeColor(i) {
      return ["#EF4444", "#F97316", "#F59E0B"][i] || "#2563EB";
    },
    dxyMinuteBadgeStyle(value) {
      const v = Number(value) || 0;
      if (v >= 60) return "background:rgba(239,68,68,.14); color:#EF4444";
      if (v >= 30) return "background:rgba(249,115,22,.14); color:#F97316";
      return "background:rgba(16,185,129,.14); color:#10B981";
    },
    dxyFilteredTerbesar() {
      let flat = [];
      (this.tahunan.downtimeTerbesar || []).forEach((line) => {
        const real = (line.rows || []).filter((r) => r.pic || r.problem || r.value !== "");
        if (real.length === 0) {
          flat.push({ mesin: line.mesin, pic: "", problem: "", value: "" });
        } else {
          real.forEach((r) => flat.push({ mesin: line.mesin, pic: r.pic, problem: r.problem, value: r.value }));
        }
      });
      if (this.dxyLineFilter !== "ALL") flat = flat.filter((r) => r.mesin === this.dxyLineFilter);
      const q = (this.dxySearch || "").trim().toLowerCase();
      if (q) flat = flat.filter((r) => (r.pic || "").toLowerCase().includes(q) || (r.problem || "").toLowerCase().includes(q));
      flat.sort((a, c) => (Number(c.value) || 0) - (Number(a.value) || 0));
      return flat.slice(0, 20);
    },
    dxyExportCsv() {
      const b = this.tahunan;
      const months = b.monthLabels.slice(2);
      const header = ["Bulan", "Productivity(%)", "Availability(%)", "NG Qty", "NG Value", "Straight Pass(%)", "Downtime(menit)"];
      const rows = [header];
      months.forEach((lbl, i) => {
        const idx = i + 2;
        rows.push([
          lbl,
          b.productivity.actual[idx] ?? "",
          b.availability.actual[idx] ?? "",
          b.ngInline.qtyByMonth[idx] ?? "",
          b.ngInline.valueByMonth[idx] ?? "",
          b.straightpass.actual[idx] ?? "",
          b.downtimeExhaust.values[idx] ?? "",
        ]);
      });
      const csv = rows.map((r) => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `dashboard-exhaust-tahunan-FY${this.tahunanYear}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },
    computeTahunanInsights() {
      const b = this.tahunan;
      const insights = [];
      const monthName = (i) => (b.monthLabels[i + 2] || "");

      // 1) Availability trend
      const availValid = b.availability.actual.map((v, i) => ({ v, i })).filter((x) => x.v !== null && x.v !== undefined);
      if (availValid.length >= 2) {
        const diff = availValid[availValid.length - 1].v - availValid[availValid.length - 2].v;
        if (Math.abs(diff) < 0.5) insights.push({ icon: "🟢", text: `Availability tetap <b>stabil</b> di angka ${b.availability.value}% sepanjang FY ${this.tahunanYear}.` });
        else if (diff > 0) insights.push({ icon: "🟢", text: `Availability <b>membaik</b> ${diff.toFixed(1)} poin di bulan ${monthName(availValid[availValid.length - 1].i)}.` });
        else insights.push({ icon: "🔴", text: `Availability <b>menurun</b> ${Math.abs(diff).toFixed(1)} poin di bulan ${monthName(availValid[availValid.length - 1].i)}.` });
      }

      // 2) Downtime Exhaust peak month
      const monthly = b.downtimeExhaust.values.slice(2);
      const validMonthly = monthly.map((v, i) => ({ v, i })).filter((x) => x.v !== null && x.v !== undefined && !Number.isNaN(x.v));
      if (validMonthly.length) {
        const peak = validMonthly.reduce((a, c) => (c.v > a.v ? c : a));
        insights.push({ icon: "🔴", text: `Downtime mencapai puncak pada bulan <b>${monthName(peak.i)}</b> (${fmtNum(peak.v)} menit).` });
      }

      // 3) Line dengan downtime terbesar
      const lineAct = (b.downtimeLine.labels || []).map((l, i) => ({ l, v: b.downtimeLine.act[i] || 0 }));
      if (lineAct.length) {
        const topLine = lineAct.reduce((a, c) => (c.v > a.v ? c : a));
        if (topLine.v > 0) insights.push({ icon: "🟡", text: `Line <b>${topLine.l}</b> menjadi penyumbang downtime terbesar (${fmtNum(topLine.v)} menit).` });
      }

      // 4) NG Inline perubahan bulan terakhir
      const ngValid = b.ngInline.qtyByMonth.map((v, i) => ({ v, i })).filter((x) => x.v !== null && x.v !== undefined);
      if (ngValid.length >= 2) {
        const last = ngValid[ngValid.length - 1].v, prev = ngValid[ngValid.length - 2].v;
        const pct = prev === 0 ? (last > 0 ? 100 : 0) : Math.round(((last - prev) / prev) * 100);
        if (pct > 5) insights.push({ icon: "🔵", text: `NG Inline <b>meningkat ${pct}%</b> dibanding bulan sebelumnya (${monthName(ngValid[ngValid.length - 1].i)}).` });
        else if (pct < -5) insights.push({ icon: "🔵", text: `NG Inline <b>menurun ${Math.abs(pct)}%</b> dibanding bulan sebelumnya (${monthName(ngValid[ngValid.length - 1].i)}).` });
      }

      // 5) Problem terbesar (catatan: snapshot bulan berjalan, bukan tahun terpilih)
      const flat = this.dxyFilteredTerbesarAll();
      if (flat.length) {
        const top = flat[0];
        insights.push({ icon: "🟠", text: `<b>${top.problem}</b> di line ${top.mesin} (PIC ${top.pic || "-"}) menjadi penyebab downtime terbesar bulan berjalan.` });
      }

      // 6) Prioritas improvement
      if (lineAct.length && flat.length) {
        const topLine = lineAct.reduce((a, c) => (c.v > a.v ? c : a));
        insights.push({ icon: "⚡", text: `Prioritas improvement berikutnya: <b>${topLine.l}</b> &mdash; ${flat[0].problem}.` });
      }

      this.tahunanInsights = insights;
    },
    dxyFilteredTerbesarAll() {
      let flat = [];
      (this.tahunan.downtimeTerbesar || []).forEach((line) => {
        (line.rows || []).filter((r) => r.pic || r.problem).forEach((r) => flat.push({ mesin: line.mesin, pic: r.pic, problem: r.problem, value: r.value }));
      });
      flat.sort((a, c) => (Number(c.value) || 0) - (Number(a.value) || 0));
      return flat;
    },
    // ---- Chart Bulanan ----
    renderBulananCharts() {
      if (typeof Chart === "undefined") return;
      const b = this.bulanan;
      const destroy = (id) => { if (this.bulananCharts[id]) { this.bulananCharts[id].destroy(); delete this.bulananCharts[id]; } };
      const baseScales = () => ({
        x: { ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: true, color: cssVar("--border") } },
        y: { ticks: { color: cssVar("--chart-tick"), font: { size: 9 }, maxTicksLimit: 5 }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
      });
      const legend = (show) => ({ display: show, position: "bottom", labels: { color: cssVar("--muted"), boxWidth: 8, boxHeight: 8, usePointStyle: true, pointStyle: "circle", font: { size: 9 }, padding: 8 } });
      const tooltip = () => ({ backgroundColor: cssVar("--panel"), titleColor: cssVar("--text"), bodyColor: cssVar("--text"), borderColor: cssVar("--border"), borderWidth: 1, padding: 8 });
      const safe = (fn, label) => { try { fn(); } catch (e) { console.error("Gagal render chart Bulanan:", label, e); } };
      // Animasi dimatikan: dashboard statis, dan mencegah error "Cannot read
      // properties of null (reading 'save')" saat chart di-destroy/diganti
      // sebelum animasinya selesai (leftover animation frame di Chart.js).
      const noAnim = { duration: 0 };

      // --- 4 kartu KPI (bar Actual + line Target) ---
      const kpiCombo = (canvasId, labels, actual, target, barColor) => {
        destroy(canvasId);
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        this.bulananCharts[canvasId] = new Chart(canvas, {
          data: {
            labels,
            datasets: [
              { type: "bar", label: "Actual", data: actual, backgroundColor: barColor, borderRadius: 3, barPercentage: 0.55, categoryPercentage: 0.7 },
              { type: "line", label: "Target", data: labels.map(() => target), borderColor: cssVar("--red"), borderDash: [5, 4], borderWidth: 2, pointRadius: 0, tension: 0 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            plugins: { legend: legend(true), tooltip: tooltip() },
            scales: baseScales(),
          },
        });
      };
      safe(() => kpiCombo("kpiProductivityChart", b.monthLabels, b.productivity.actual, b.productivity.target, cssVar("--series-4")), "productivity");
      safe(() => kpiCombo("kpiAvailabilityChart", b.monthLabels, b.availability.actual, b.availability.target, cssVar("--series-4")), "availability");
      safe(() => kpiCombo("kpiStraightpassChart", b.monthLabels, b.straightpass.actual, b.straightpass.target, cssVar("--series-4")), "straightpass");

      // --- NG Inline: bar Value (kiri) + line Qty (kanan) ---
      safe(() => {
        destroy("kpiNgInlineChart");
        const ngCanvas = document.getElementById("kpiNgInlineChart");
        if (ngCanvas) {
          this.bulananCharts.kpiNgInlineChart = new Chart(ngCanvas, {
            data: {
              labels: b.monthLabels,
              datasets: [
                { type: "bar", label: "Value", data: b.ngInline.valueByMonth, backgroundColor: cssVar("--category-other"), yAxisID: "y", borderRadius: 3, barPercentage: 0.55, categoryPercentage: 0.7 },
                { type: "line", label: "Qty", data: b.ngInline.qtyByMonth, borderColor: cssVar("--series-4"), yAxisID: "y1", pointRadius: 3, tension: 0.3 },
              ],
            },
            options: {
              responsive: true, maintainAspectRatio: false, animation: noAnim,
              plugins: { legend: legend(true), tooltip: tooltip() },
              scales: {
                x: baseScales().x,
                y: { position: "left", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
                y1: { position: "right", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
              },
            },
          });
        }
      }, "ngInline");

      // --- Downtime Exhaust: bar + line trend ---
      safe(() => {
        destroy("dtExhaustChart");
        const dtEx = document.getElementById("dtExhaustChart");
        if (dtEx) {
          this.bulananCharts.dtExhaustChart = new Chart(dtEx, {
            data: {
              labels: b.downtimeExhaust.labels,
              datasets: [
                { type: "bar", label: "Downtime", data: b.downtimeExhaust.values, backgroundColor: cssVar("--category-other"), borderRadius: 3, barPercentage: 0.6, categoryPercentage: 0.7 },
                { type: "line", label: "Trend", data: b.downtimeExhaust.values, borderColor: cssVar("--red"), pointRadius: 3, tension: 0.3 },
              ],
            },
            options: { responsive: true, maintainAspectRatio: false, animation: noAnim, plugins: { legend: legend(true), tooltip: tooltip() }, scales: baseScales() },
          });
        }
      }, "downtimeExhaust");

      // --- Downtime Supporting & Downtime Line: grouped bar Plan/Act ---
      const groupedBar = (canvasId, labels, plan, act) => {
        destroy(canvasId);
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        this.bulananCharts[canvasId] = new Chart(canvas, {
          type: "bar",
          data: {
            labels,
            datasets: [
              { label: "Plan", data: plan, backgroundColor: cssVar("--category-other"), borderRadius: 3, barPercentage: 0.7, categoryPercentage: 0.7 },
              { label: "Act", data: act, backgroundColor: cssVar("--series-5"), borderRadius: 3, barPercentage: 0.7, categoryPercentage: 0.7 },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false, animation: noAnim, plugins: { legend: legend(true), tooltip: tooltip() }, scales: baseScales() },
        });
      };
      safe(() => groupedBar("dtSupportingChart", b.downtimeSupporting.labels, b.downtimeSupporting.plan, b.downtimeSupporting.act), "downtimeSupporting");
      safe(() => groupedBar("dtLineChart", b.downtimeLine.labels, b.downtimeLine.plan, b.downtimeLine.act), "downtimeLine");

      // --- Weekly Breakdown: bar per line + Total ---
      b.weekly.forEach((w, idx) => {
        safe(() => {
          const canvasId = "weekChart" + (idx + 1);
          destroy(canvasId);
          const canvas = document.getElementById(canvasId);
          if (!canvas) return;
          const total = w.values.reduce((a, v) => a + v, 0);
          const labels = [...w.labels, "Total"];
          const values = [...w.values, total];
          const colors = [...w.labels.map(() => cssVar("--series-1")), cssVar("--navy")];
          this.bulananCharts[canvasId] = new Chart(canvas, {
            type: "bar",
            data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 3, barPercentage: 0.6, categoryPercentage: 0.7 }] },
            options: {
              responsive: true, maintainAspectRatio: false, animation: noAnim,
              plugins: { legend: legend(false), tooltip: tooltip() },
              scales: baseScales(),
            },
          });
        }, "week" + (idx + 1));
      });
    },
    renderTahunanCharts() {
      if (typeof Chart === "undefined") return;
      const b = this.tahunan;
      const destroy = (id) => { if (this.tahunanCharts[id]) { this.tahunanCharts[id].destroy(); delete this.tahunanCharts[id]; } };
      const noAnim = { duration: 0 };
      const safe = (fn, label) => { try { fn(); } catch (e) { console.error("Gagal render chart Tahunan:", label, e); } };

      const baseScales = () => ({
        x: { ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: true, color: cssVar("--border") } },
        y: { ticks: { color: cssVar("--chart-tick"), font: { size: 9 }, maxTicksLimit: 5 }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
      });
      const legend = (show) => ({ display: show, position: "bottom", labels: { color: cssVar("--muted"), boxWidth: 8, boxHeight: 8, usePointStyle: true, pointStyle: "circle", font: { size: 9 }, padding: 8 } });
      const tooltip = () => ({ backgroundColor: cssVar("--panel"), titleColor: cssVar("--text"), bodyColor: cssVar("--text"), borderColor: cssVar("--border"), borderWidth: 1, padding: 10, cornerRadius: 8, displayColors: true, usePointStyle: true });

      const grad = (canvas, hex, alphaTop = 0.85, alphaBottom = 0.05) => {
        const ctx = canvas.getContext("2d");
        const h = canvas.height || 240;
        const g = ctx.createLinearGradient(0, 0, 0, h);
        const toRgba = (a) => {
          const n = parseInt(hex.replace("#", ""), 16);
          const r = (n >> 16) & 255, gg = (n >> 8) & 255, bl = n & 255;
          return `rgba(${r},${gg},${bl},${a})`;
        };
        g.addColorStop(0, toRgba(alphaTop));
        g.addColorStop(1, toRgba(alphaBottom));
        return g;
      };

      // Highlight bulan terpilih (dxyMonthFilter): tiap bar full-gradient kalau
      // "Semua Bulan" / kalau itu bulan yg dipilih, selainnya jadi warna pudar.
      // Indeks +2 karena 2 slot pertama label adalah "FY x" / "FY x+1".
      const barBg = (canvas, hex, len, offset = 2) => {
        const full = grad(canvas, hex);
        const mutedAlpha = hex + "33";
        const sel = this.dxyMonthFilter;
        if (sel === "ALL" || sel === "") return Array.from({ length: len }, () => full);
        return Array.from({ length: len }, (_, i) => ((i - offset) === Number(sel) ? full : mutedAlpha));
      };

      // --- Sparkline mini (di kartu KPI) ---
      const sparkline = (canvasId, data, hex) => {
        destroy(canvasId);
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const vals = data.filter((v) => v !== null && v !== undefined);
        this.tahunanCharts[canvasId] = new Chart(canvas, {
          type: "line",
          data: {
            labels: data.map((_, i) => i),
            datasets: [{ data, borderColor: hex, borderWidth: 2, pointRadius: 0, tension: 0.35, fill: true, backgroundColor: grad(canvas, hex, 0.28, 0), spanGaps: true }],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: { x: { display: false }, y: { display: false, beginAtZero: vals.length ? Math.min(...vals) >= 0 : true } },
            elements: { point: { radius: 0 } },
          },
        });
      };
      safe(() => sparkline("dxySparkProductivity", b.productivity.actual, "#2563EB"), "spark-productivity");
      safe(() => sparkline("dxySparkAvailability", b.availability.actual, "#10B981"), "spark-availability");
      safe(() => sparkline("dxySparkNg", b.ngInline.qtyByMonth, "#F97316"), "spark-ng");
      safe(() => sparkline("dxySparkStraightpass", b.straightpass.actual, "#14B8A6"), "spark-straightpass");

      // --- Grafik utama KPI (bar gradient + target garis putus-putus merah) ---
      const kpiBig = (canvasId, labels, actual, target, hex) => {
        destroy(canvasId);
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        this.tahunanCharts[canvasId] = new Chart(canvas, {
          data: {
            labels,
            datasets: [
              { type: "bar", label: "Actual", data: actual, backgroundColor: barBg(canvas, hex, actual.length), borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7, borderSkipped: false },
              { type: "line", label: "Target", data: labels.map(() => target), borderColor: "#EF4444", borderDash: [6, 4], borderWidth: 2, pointRadius: 0, tension: 0 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            plugins: { legend: legend(true), tooltip: tooltip() },
            scales: baseScales(),
          },
        });
      };
      safe(() => kpiBig("dxyBigProductivity", b.monthLabels, b.productivity.actual, b.productivity.target, "#2563EB"), "big-productivity");
      safe(() => kpiBig("dxyBigAvailability", b.monthLabels, b.availability.actual, b.availability.target, "#10B981"), "big-availability");
      safe(() => kpiBig("dxyBigStraightpass", b.monthLabels, b.straightpass.actual, b.straightpass.target, "#14B8A6"), "big-straightpass");

      // --- NG Inline dual axis: Qty (bar oranye) + Value (garis ungu) ---
      safe(() => {
        destroy("dxyBigNg");
        const canvas = document.getElementById("dxyBigNg");
        if (!canvas) return;
        this.tahunanCharts.dxyBigNg = new Chart(canvas, {
          data: {
            labels: b.monthLabels,
            datasets: [
              { type: "bar", label: "Qty", data: b.ngInline.qtyByMonth, backgroundColor: barBg(canvas, "#F97316", b.ngInline.qtyByMonth.length), yAxisID: "y", borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7 },
              { type: "line", label: "Value", data: b.ngInline.valueByMonth, borderColor: "#8B5CF6", backgroundColor: "#8B5CF6", yAxisID: "y1", pointRadius: 3, tension: 0.3 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: noAnim,
            plugins: { legend: legend(true), tooltip: tooltip() },
            scales: {
              x: baseScales().x,
              y: { position: "left", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { color: cssVar("--chart-grid"), drawTicks: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
              y1: { position: "right", ticks: { color: cssVar("--chart-tick"), font: { size: 9 } }, grid: { display: false }, border: { display: true, color: cssVar("--border") }, beginAtZero: true },
            },
          },
        });
      }, "ngInline");

      // --- Downtime Exhaust: bar gradient + tren + marker puncak + rata-rata ---
      safe(() => {
        destroy("dxyDowntimeExhaust");
        const canvas = document.getElementById("dxyDowntimeExhaust");
        if (!canvas) return;
        const vals = b.downtimeExhaust.values;
        const monthly = vals.slice(2); // 12 bulan asli, tanpa 2 kolom ringkasan FY
        const validMonthly = monthly.filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
        const avg = validMonthly.length ? validMonthly.reduce((a, c) => a + c, 0) / validMonthly.length : 0;
        const peakIdxMonthly = validMonthly.length ? monthly.indexOf(Math.max(...validMonthly)) : -1;
        const peakIdx = peakIdxMonthly >= 0 ? peakIdxMonthly + 2 : -1;
        const peakPoints = vals.map((v, i) => (i === peakIdx ? v : null));
        this.tahunanCharts.dxyDowntimeExhaust = new Chart(canvas, {
          data: {
            labels: b.downtimeExhaust.labels,
            datasets: [
              { type: "bar", label: "Downtime (menit)", data: vals, backgroundColor: barBg(canvas, "#F97316", vals.length), borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7 },
              { type: "line", label: "Tren", data: vals, borderColor: "#EF4444", pointRadius: 0, tension: 0.35, borderWidth: 2 },
              { type: "line", label: "Rata-rata", data: vals.map(() => avg), borderColor: cssVar("--muted"), borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, tension: 0 },
              { type: "line", label: "Puncak", data: peakPoints, borderColor: "#EF4444", backgroundColor: "#EF4444", pointRadius: 6, pointStyle: "rectRot", showLine: false, spanGaps: false },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false, animation: noAnim, plugins: { legend: legend(true), tooltip: tooltip() }, scales: baseScales() },
        });
      }, "downtimeExhaust");

      // --- Downtime Supporting: bar Act warna per-PIC + garis Plan (target) ---
      safe(() => {
        destroy("dxyDowntimeSupporting");
        const canvas = document.getElementById("dxyDowntimeSupporting");
        if (!canvas) return;
        const colors = b.downtimeSupporting.labels.map((pic) => this.dxyPicColor(pic));
        this.tahunanCharts.dxyDowntimeSupporting = new Chart(canvas, {
          data: {
            labels: b.downtimeSupporting.labels,
            datasets: [
              { type: "bar", label: "Act", data: b.downtimeSupporting.act, backgroundColor: colors, borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7 },
              { type: "line", label: "Plan", data: b.downtimeSupporting.plan, borderColor: "#EF4444", borderDash: [6, 4], borderWidth: 2, pointRadius: 2, tension: 0 },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false, animation: noAnim, plugins: { legend: legend(true), tooltip: tooltip() }, scales: baseScales() },
        });
      }, "downtimeSupporting");

      // --- Downtime Line: diurutkan besar->kecil, warna berdasarkan ranking ---
      safe(() => {
        destroy("dxyDowntimeLine");
        const canvas = document.getElementById("dxyDowntimeLine");
        if (!canvas) return;
        const idx = b.downtimeLine.labels.map((_, i) => i);
        idx.sort((a, c) => (b.downtimeLine.act[c] || 0) - (b.downtimeLine.act[a] || 0));
        const labels = idx.map((i) => b.downtimeLine.labels[i]);
        const act = idx.map((i) => b.downtimeLine.act[i]);
        const plan = idx.map((i) => b.downtimeLine.plan[i]);
        const rankColors = ["#EF4444", "#F97316", "#F59E0B"];
        const colors = idx.map((_, rank) => {
          if (this.dxyLineFilter !== "ALL" && labels[rank] !== this.dxyLineFilter) return (rankColors[rank] || "#2563EB") + "40";
          return rankColors[rank] || "#2563EB";
        });
        this.tahunanCharts.dxyDowntimeLine = new Chart(canvas, {
          data: {
            labels,
            datasets: [
              { type: "bar", label: "Act", data: act, backgroundColor: colors, borderRadius: 8, barPercentage: 0.6, categoryPercentage: 0.7 },
              { type: "line", label: "Plan", data: plan, borderColor: "#EF4444", borderDash: [6, 4], borderWidth: 2, pointRadius: 2, tension: 0 },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false, animation: noAnim, plugins: { legend: legend(true), tooltip: tooltip() }, scales: baseScales() },
        });
      }, "downtimeLine");
    },
    async fetchAll() {
      this.loading = true;
      const { start, end } = this.bounds();

      const results = await Promise.all(MACHINES.map(async (m) => {
        const [aggRes, settingsRes, statusRes] = await Promise.all([
          supabaseClient.rpc("performance_aggregate", { p_mesin: m.key, p_stasiun_list: null, p_start: start.toISOString(), p_end: end.toISOString() }),
          supabaseClient.from("mesin_settings").select("*").eq("mesin", m.key).maybeSingle(),
          supabaseClient.from("production_log").select("part_number, waktu_akhir").eq("mesin", m.key)
            .gte("waktu_awal", start.toISOString()).lt("waktu_awal", end.toISOString())
            .order("waktu_awal", { ascending: false }).limit(1),
        ]);
        const row = (aggRes.data && aggRes.data[0]) || {};
        const settings = settingsRes.data || { gsph_target_mode: "fixed", gsph_target_fixed: 0 };
        const whJam = (Number(row.wh_menit) || 0) / 60;
        const stroke = Number(row.stroke) || 0;
        const ng = Number(row.ng) || 0;
        const downtimeMenit = Math.round(Number(row.downtime_menit) || 0);
        const targetStdMenit = Number(row.target_std_menit) || 0;
        let targetGsph = Number(settings.gsph_target_fixed) || 0;
        if (settings.gsph_target_mode === "per_part" && targetStdMenit > 0) targetGsph = stroke / (targetStdMenit / 60);
        const gsph = whJam > 0 ? stroke / whJam : 0;
        const availability = whJam > 0 ? Math.max(0, (whJam * 60 - downtimeMenit) / (whJam * 60)) * 100 : 0;
        const performanceFactor = targetGsph > 0 ? Math.min(gsph / targetGsph, 1) * 100 : 0;
        const quality = stroke > 0 ? Math.max(0, (stroke - ng) / stroke) * 100 : 100;
        const oee = (availability / 100) * (performanceFactor / 100) * (quality / 100) * 100;
        const last = (statusRes.data && statusRes.data[0]) || null;
        return { mesin: m.key, data: { stroke, ng, downtimeMenit, gsph, targetGsph, performanceFactor, oee, lastPart: last ? last.part_number : null } };
      }));

      this.machines = MACHINES.map((m) => ({ ...m, data: results.find((r) => r.mesin === m.key).data }));

      const t = results.reduce((acc, r) => ({
        stroke: acc.stroke + r.data.stroke,
        ng: acc.ng + r.data.ng,
        downtimeMenit: acc.downtimeMenit + r.data.downtimeMenit,
        oeeSum: acc.oeeSum + r.data.oee,
      }), { stroke: 0, ng: 0, downtimeMenit: 0, oeeSum: 0 });
      this.totals = { stroke: t.stroke, ng: t.ng, downtimeMenit: t.downtimeMenit, avgOee: t.oeeSum / MACHINES.length };
      this.lineAktif = results.filter((r) => r.data.stroke > 0).length;

      this.loading = false;
    },
    logout,
  };
}
</script>
