<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganti Password — SISTEM PRODUKSI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1e24">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabaseClient.js"></script>
</head>
<body>

<div class="login-shell" x-data="resetPage()" x-init="init()">
  <div class="login-card">

    <div class="login-logo">
      <img src="assets/icons/logo-futaba.png" alt="PT Futaba Industrial Indonesia">
    </div>

    <h1>Ganti Password</h1>
    <p class="sub">Masukkan password baru untuk akun kamu.</p>

    <template x-if="errorMsg">
      <div class="error-msg" x-text="errorMsg"></div>
    </template>
    <template x-if="infoMsg">
      <div class="success-msg" x-text="infoMsg"></div>
    </template>

    <div class="login-form-area">
      <template x-if="ready && !infoMsg">
        <form @submit.prevent="save">
          <div class="field">
            <label>Password Baru</label>
            <div class="password-wrap">
              <input :type="showPassword ? 'text' : 'password'" x-model="password" required minlength="6" autocomplete="new-password">
              <button type="button" class="password-toggle" @click="showPassword = !showPassword" tabindex="-1">
                <span x-text="showPassword ? '🙈' : '👁️'"></span>
              </button>
            </div>
            <p class="hint">Minimal 6 karakter.</p>
          </div>
          <div class="field">
            <label>Ulangi Password Baru</label>
            <input :type="showPassword ? 'text' : 'password'" x-model="password2" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn-primary" :disabled="busy">
            <span x-show="!busy">Simpan Password</span>
            <span x-show="busy">Memproses…</span>
          </button>
        </form>
      </template>

      <template x-if="!ready && !errorMsg">
        <p class="hint" style="text-align:center;">Memeriksa link…</p>
      </template>
    </div>

    <p class="login-signup-foot" x-show="infoMsg">
      <a href="login.html">← Kembali ke halaman Masuk</a>
    </p>
    <p class="login-signup-foot" x-show="errorMsg && !ready">
      <a href="login.html">← Kembali ke halaman Masuk</a>
    </p>

  </div>
</div>

<script>
function resetPage() {
  return {
    ready: false, busy: false,
    password: "", password2: "",
    errorMsg: "", infoMsg: "",

    async init() {
      // Link dari email otomatis bikin sesi sementara "recovery" lewat
      // token di URL. Kalau sesinya nggak ada berarti link salah/kedaluwarsa.
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        this.ready = true;
      } else {
        this.errorMsg = "Link ganti password tidak valid atau sudah kedaluwarsa. Minta link baru lewat halaman Masuk.";
      }
    },

    async save() {
      this.errorMsg = "";
      if (this.password !== this.password2) {
        this.errorMsg = "Konfirmasi password tidak sama.";
        return;
      }
      this.busy = true;
      const { error } = await supabaseClient.auth.updateUser({ password: this.password });
      this.busy = false;
      if (error) { this.errorMsg = "Gagal menyimpan password: " + error.message; return; }
      this.infoMsg = "Password berhasil diganti. Silakan masuk lagi pakai password baru.";
      await supabaseClient.auth.signOut();
    }
  };
}
</script>
</body>
</html>
