<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-06 — Sistem Produksi &amp; Downtime</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1e24">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script>
  (function () {
    var t = localStorage.getItem("theme_v1") || "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="../assets/supabaseClient.js"></script>
<script src="../assets/machine-page.js"></script>
</head>
<body>

<div class="app-shell"
     x-data='machinePage("E-06", "E-06", [], 0, ["MACHINE", "MATERIAL", "METHODE", "MAN"], {"mode": "none"})'
     x-init="init()">
  <div class="mobile-topbar">
    <button class="hamburger" @click="mobileNavOpen = true">☰</button>
    <span class="mobile-title">E-06</span>
  </div>
  <div class="sidebar-overlay" x-show="mobileNavOpen" @click="mobileNavOpen = false" x-cloak></div>
  <aside class="sidebar" :class="[mobileNavOpen ? 'sidebar-open' : '', sidebarCollapsed ? 'sidebar-collapsed' : '']">
    <button class="sidebar-collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed" :title="sidebarCollapsed ? 'Buka menu' : 'Ciutkan menu'">
      <span x-show="!sidebarCollapsed">‹</span><span x-show="sidebarCollapsed">›</span>
    </button>
    <div class="sidebar-brand" x-show="!sidebarCollapsed">PRODUKSI<span>&amp;</span>DOWNTIME</div>
    <nav class="sidebar-nav" @click="mobileNavOpen = false">
      <a href="../dashboard-exhaust.html" class="sidebar-link" title="Dashboard Exhaust"><span>📊</span><span x-show="!sidebarCollapsed">Dashboard Exhaust</span></a>
      <a href="../index.html" class="sidebar-link" title="Dashboard"><span>🏠</span><span x-show="!sidebarCollapsed">Dashboard</span></a>
      <a href="../plan-produksi.html" class="sidebar-link" title="Plan Produksi"><span>📅</span><span x-show="!sidebarCollapsed">Plan Produksi</span></a>
      <a href="../input-produksi.html" class="sidebar-link active" title="Input Produksi"><span>⚙️</span><span x-show="!sidebarCollapsed">Input Produksi</span></a>
      <template x-if="isLeaderOrAdmin()">
        <a href="../input-attendance.html" class="sidebar-link" title="Input Attendance"><span>👥</span><span x-show="!sidebarCollapsed">Input Attendance</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="../input-scrap.html" class="sidebar-link" title="Input Scrap"><span>♻️</span><span x-show="!sidebarCollapsed">Input Scrap</span></a>
      </template>
      <template x-if="isLeaderOrAdmin()">
        <a href="../input-safety.html" class="sidebar-link" title="Input Safety"><span>⛑️</span><span x-show="!sidebarCollapsed">Input Safety</span></a>
      </template>
    </nav>
    <div class="sidebar-foot" x-show="!sidebarCollapsed">
      <div class="who" x-text="profile?.full_name || session?.user?.email || '...'"></div>
      <span class="badge" :class="profile?.role === 'admin' ? 'role-admin' : ''" x-text="profile?.jabatan || profile?.role || '...'"></span>
      <div class="net-status" :class="isOnline ? 'net-online' : 'net-offline'">
        <span x-text="isOnline ? '🟢 Online' : '🔴 Offline'"></span>
        <span x-show="pendingCount > 0" x-text="'· ' + pendingCount + ' menunggu sinkron'"></span>
      </div>
      <button class="btn-ghost btn-sm" @click="logout()">Keluar</button>
    </div>
    <button class="sidebar-logout-collapsed" x-show="sidebarCollapsed" @click="logout()" title="Keluar">⏻</button>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1 class="page-title"><span class="eyebrow">Mesin</span>E-06</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-secondary btn-sm" :class="tab==='produksi_new' ? 'btn-primary' : ''" @click="tab='produksi_new'">Input Produksi</button>
        <button class="btn-secondary btn-sm" :class="tab==='downtime' ? 'btn-primary' : ''" @click="tab='downtime'">Downtime</button>
        <button class="btn-secondary btn-sm" :class="tab==='ng_inline' ? 'btn-primary' : ''" @click="tab='ng_inline'">NG Inline</button>
        <button class="btn-secondary btn-sm" :class="tab==='repair' ? 'btn-primary' : ''" @click="tab='repair'">Repair</button>
        <button class="btn-secondary btn-sm" :class="tab==='produksi' ? 'btn-primary' : ''" @click="tab='produksi'">Input Produksi NEW</button>
        <button class="btn-secondary btn-sm" :class="tab==='riwayat' ? 'btn-primary' : ''" @click="tab='riwayat'">Riwayat Produksi</button>
        <button class="btn-secondary btn-sm" :class="tab==='performance' ? 'btn-primary' : ''" @click="openPerformanceTab()">Performance</button>
        <template x-if="isLeaderOrAdmin()">
          <button class="btn-secondary btn-sm" :class="tab==='master' ? 'btn-primary' : ''" @click="tab='master'">Master Data</button>
        </template>
        <button class="theme-toggle" @click="toggleTheme()" :title="theme === 'dark' ? 'Ke mode terang' : 'Ke mode gelap'">
          <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
        </button>
      </div>
    </div>

    <template x-if="errorMsg"><div class="error-msg" x-text="errorMsg"></div></template>
    <template x-if="successMsg"><div class="success-msg" x-text="successMsg"></div></template>
    <template x-if="!isOnline">
      <div class="offline-banner">📴 Tidak ada jaringan — data baru akan disimpan di HP dan disinkron otomatis begitu online lagi.</div>
    </template>
    <template x-if="loading"><div class="empty-state">Memuat data...</div></template>

    <template x-if="!loading">
      <div>
        <!-- ===================== TAB INPUT PRODUKSI (BARU) ===================== -->
        <div x-show="tab === 'produksi_new'">
          <div class="panel">
            <p class="panel-title" x-text="produksiNewEditingId ? 'Edit Input Produksi' : 'Input Produksi'"></p>
            <form @submit.prevent="saveProduksiNew">
              <p class="hint" x-show="isNonProduksiSelected(produksiNewForm.part_number)" style="margin-bottom:10px;">Jenis Non-Produksi dipilih — Qty, Break, Dandori, Total Repair boleh dikosongkan.</p>
              <div class="form-grid">
                <div class="field"><label>Waktu Awal *</label><input type="datetime-local" x-model="produksiNewForm.waktu_awal"></div>
                <div class="field"><label>Waktu Akhir *</label><input type="datetime-local" x-model="produksiNewForm.waktu_akhir"></div>
                <div class="field">
                  <label>Part Number *</label>
                  <select x-model="produksiNewForm.part_number">
                    <option value="">-- pilih --</option>
                    <template x-for="pn in produksiNewPartOptions" :key="pn"><option :value="pn" x-text="pn"></option></template>
                    <template x-for="n in nonProduksiTypeList" :key="n.id"><option :value="n.nama" x-text="n.nama"></option></template>
                  </select>
                </div>
                <div class="field"><label x-text="isNonProduksiSelected(produksiNewForm.part_number) ? 'Qty' : 'Qty *'"></label><input type="text" inputmode="numeric" pattern="[0-9]*" x-model.number="produksiNewForm.qty" @input='$event.target.value = $event.target.value.replace(/[^0-9]/g, ""); produksiNewForm.qty = $event.target.value === "" ? "" : Number($event.target.value)' placeholder="0"></div>
                <div class="field"><label>Break (menit)</label><input type="text" inputmode="numeric" pattern="[0-9]*" x-model.number="produksiNewForm.break_menit" @input='$event.target.value = $event.target.value.replace(/[^0-9]/g, ""); produksiNewForm.break_menit = $event.target.value === "" ? "" : Number($event.target.value)' placeholder="0"></div>
                <div class="field"><label>Dandori (menit)</label><input type="text" inputmode="numeric" pattern="[0-9]*" x-model.number="produksiNewForm.dandori_menit" @input='$event.target.value = $event.target.value.replace(/[^0-9]/g, ""); produksiNewForm.dandori_menit = $event.target.value === "" ? "" : Number($event.target.value)' placeholder="0"></div>
                <div class="field"><label>Waktu Problem (menit)</label><input type="text" disabled :value="fmtNum(produksiNewForm.waktu_problem_menit || 0)"><p class="hint" style="margin-top:4px;">Terisi otomatis setelah data ini disimpan lalu di-link dari tab Downtime.</p></div>
                <div class="field"><label>Total Repair</label><input type="text" inputmode="numeric" pattern="[0-9]*" x-model.number="produksiNewForm.total_repair_menit" @input='$event.target.value = $event.target.value.replace(/[^0-9]/g, ""); produksiNewForm.total_repair_menit = $event.target.value === "" ? "" : Number($event.target.value)' placeholder="0"></div>
              </div>

              <div class="panel" style="margin-top:14px;">
                <p class="panel-title" style="font-size:14px;">Hasil Kalkulasi Otomatis</p>
                <div class="form-grid">
                  <div class="field"><label>Earned (Qty × CT)</label><input type="text" disabled :value="produksiNewEarned(produksiNewForm) !== null ? fmtNum(produksiNewEarned(produksiNewForm)) + ' mnt' : '-'"></div>
                  <div class="field"><label>Operation Min</label><input type="text" disabled :value="produksiNewOperationMin(produksiNewForm) !== null ? fmtNum(produksiNewOperationMin(produksiNewForm)) + ' mnt' : '-'"></div>
                  <div class="field"><label>Workmin</label><input type="text" disabled :value="produksiNewWorkmin(produksiNewForm) !== null ? fmtNum(produksiNewWorkmin(produksiNewForm)) + ' mnt' : '-'"></div>
                  <div class="field"><label>P.Eff</label><input type="text" disabled :value="produksiNewPeff(produksiNewForm) !== null ? fmtDecimal(produksiNewPeff(produksiNewForm), 3) : '-'"></div>
                  <div class="field"><label>P.Eff Seharusnya</label><input type="text" disabled :value="produksiNewPeffSeharusnya(produksiNewForm) !== null ? fmtDecimal(produksiNewPeffSeharusnya(produksiNewForm), 3) : '-'"></div>
                  <div class="field"><label>Straightpass</label><input type="text" disabled :value="produksiNewStraightpass(produksiNewForm) !== null ? fmtNum(produksiNewStraightpass(produksiNewForm)) + '%' : '-'"></div>
                </div>
                <p class="hint" style="margin-top:6px;">Earned & Operation Min butuh Std CT dan Std MP yang diisi lewat Master Data Part Number.</p>
                <div class="qty-warn-msg" x-show="produksiNewQtyIssue(produksiNewForm)" x-cloak>
                  <span>⚠️</span>
                  <span x-text="produksiNewQtyIssue(produksiNewForm)"></span>
                </div>
              </div>

              <div class="form-actions">
                <button type="button" class="btn-ghost" x-show="produksiNewEditingId" @click="cancelEditProduksiNew()">Batal Edit</button>
                <button type="submit" class="btn-primary" :disabled="produksiNewSaving" x-text="produksiNewSaving ? 'Menyimpan...' : (produksiNewEditingId ? 'Update Data' : 'Simpan Data')"></button>
              </div>
            </form>
          </div>

          <div class="panel">
            <p class="panel-title">Riwayat Input Produksi <span class="count" x-text="produksiNewRows.length + ' baris'"></span></p>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Kode</th><th>Waktu Awal</th><th>Waktu Akhir</th><th>Part Number</th><th>Qty</th>
                    <th>Break</th><th>Dandori</th><th>Wkt Problem</th><th>Total Repair</th>
                    <th>Earned</th><th>Operation</th><th>Workmin</th><th>P.Eff</th><th>P.Eff Seharusnya</th><th>Straightpass</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in produksiNewRows" :key="row.id">
                    <tr :class="produksiNewQtyIssue(row) ? 'row-qty-warn' : ''">
                      <td class="mono" x-text="row.kode || '-'"></td>
                      <td class="mono" x-text="fmt(row.waktu_awal)"></td>
                      <td class="mono" x-text="fmt(row.waktu_akhir)"></td>
                      <td x-text="row.part_number"></td>
                      <td>
                        <span x-text="fmtNum(row.qty)"></span>
                        <span class="qty-warn-badge" x-show="produksiNewQtyIssue(row)" x-cloak :title="produksiNewQtyIssue(row)">⚠️</span>
                      </td>
                      <td class="mono" x-text="fmtNum(row.break_menit) + ' mnt'"></td>
                      <td class="mono" x-text="fmtNum(row.dandori_menit) + ' mnt'"></td>
                      <td class="mono" x-text="fmtNum(row.waktu_problem_menit) + ' mnt'"></td>
                      <td class="mono" x-text="fmtNum(row.total_repair_menit)"></td>
                      <td class="mono" x-text="produksiNewEarned(row) !== null ? fmtNum(produksiNewEarned(row)) + ' mnt' : '-'"></td>
                      <td class="mono" x-text="produksiNewOperationMin(row) !== null ? fmtNum(produksiNewOperationMin(row)) + ' mnt' : '-'"></td>
                      <td class="mono" x-text="produksiNewWorkmin(row) !== null ? fmtNum(produksiNewWorkmin(row)) + ' mnt' : '-'"></td>
                      <td class="mono" x-text="produksiNewPeff(row) !== null ? fmtDecimal(produksiNewPeff(row), 3) : '-'"></td>
                      <td class="mono" x-text="produksiNewPeffSeharusnya(row) !== null ? fmtDecimal(produksiNewPeffSeharusnya(row), 3) : '-'"></td>
                      <td class="mono" x-text="produksiNewStraightpass(row) !== null ? fmtNum(produksiNewStraightpass(row)) + '%' : '-'"></td>
                      <td>
                        <div class="row-actions">
                          <button class="btn-secondary btn-sm" @click="editProduksiNew(row)">Edit</button>
                          <button class="btn-danger btn-sm" @click="deleteProduksiNew(row.id)">Hapus</button>
                        </div>
                      </td>
                    </tr>
                  </template>
                  <tr x-show="produksiNewRows.length === 0">
                    <td colspan="16" class="empty-state">Belum ada data.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- ===================== TAB PRODUKSI ===================== -->
        <div x-show="tab === 'produksi'">

          <div class="panel" x-show="editingNonProduksiId" x-cloak>
            <p class="panel-title">Edit Data Non-Produksi</p>
            <div class="form-grid">
              <div class="field"><label>Waktu Awal</label><input type="datetime-local" x-model="nonProduksiEditForm.waktu_awal"></div>
              <div class="field"><label>Waktu Akhir</label><input type="datetime-local" x-model="nonProduksiEditForm.waktu_akhir"></div>
              <div class="field" style="grid-column: span 2;">
                <label>Jenis Non-Produksi</label>
                <input type="text" list="nonProduksiTypeListNewTab-E-06" x-model="nonProduksiEditForm.nama">
                <datalist id="nonProduksiTypeListNewTab-E-06">
                  <template x-for="t in nonProduksiTypeList" :key="t.id"><option :value="t.nama"></option></template>
                </datalist>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn-ghost" @click="cancelEditNonProduksi()">Batal</button>
              <button type="button" class="btn-primary" @click="saveNonProduksiEdit()">Simpan</button>
            </div>
          </div>

          <template x-for="st in stationList()" :key="st.id">
            <div class="panel station-card">
              <p class="panel-title" x-show="st.label"><span x-text="st.label"></span></p>

              <!-- IDLE -->
              <div x-show="lines[st.id].state === 'idle'">
                <button type="button" class="btn-primary" @click="clickMulai(st.id)">▶ Mulai Produksi</button>
              </div>

              <!-- AWAITING_GAP: klasifikasi jeda sebelum mulai (boleh lebih dari satu jenis berurutan) -->
              <div class="classification-box" x-show="lines[st.id].state === 'awaiting_gap'" x-cloak>
                <p class="classification-title">⏱ Ada jeda sebelum ini — jenis non-produksi apa?</p>
                <p class="hint" x-text="'Jeda: ' + fmtClock(lines[st.id].gapInfo?.gapStart) + ' → ' + fmtClock(new Date(nowTick).toISOString())"></p>
                <div class="chip-row" x-show="lines[st.id].gapAddedList && lines[st.id].gapAddedList.length > 0" style="margin:8px 0;">
                  <span class="hint">Sudah ditambahkan:</span>
                  <template x-for="(nm, idx) in lines[st.id].gapAddedList" :key="idx">
                    <span class="chip chip-active" x-text="nm"></span>
                  </template>
                </div>
                <div class="form-grid">
                  <div class="field">
                    <label>Jenis Non-Produksi</label>
                    <select x-model="lines[st.id].gapForm.nonproduksi_nama">
                      <option value="">- pilih -</option>
                      <template x-for="t in nonProduksiTypeList" :key="t.id">
                        <option :value="t.nama" x-text="t.nama"></option>
                      </template>
                    </select>
                  </div>
                </div>
                <div class="form-actions">
                  <button type="button" class="btn-secondary" @click="cancelGapNonProduksi(st.id)">Batal</button>
                  <button type="button" class="btn-secondary" @click="addAnotherGapNonProduksi(st.id)">+ Tambah Non-Produksi Lagi</button>
                  <button type="button" class="btn-primary" @click="confirmGapNonProduksi(st.id)">Lanjut ke Produksi</button>
                </div>
              </div>

              <!-- AWAITING_ACTUAL_START: fase dandori, pilih part -->
              <div x-show="lines[st.id].state === 'awaiting_actual_start'" x-cloak>
                <div class="timer-badge" style="margin-bottom:14px;">
                  <span class="timer-dot timer-dot-live"></span>
                  <span>Dandori sejak <b x-text="fmtClock(lines[st.id].entryStart)"></b></span>
                  <button type="button" class="btn-ghost btn-sm" @click="cancelLine(st.id)">Batal</button>
                </div>
                <p class="hint" style="margin-bottom:10px;">Pilih dari Planning kalau ada, atau pilih Part Number dari dropdown.</p>
                <div class="chip-row" style="margin-bottom:14px;" x-show="planningForStation(st.id).filter(p => p.status==='pending').length > 0">
                  <template x-for="p in planningForStation(st.id).filter(p => p.status==='pending')" :key="p.id">
                    <button type="button" class="chip" @click="choosePlannedPart(st.id, p)"
                            x-text="p.part_number + (p.qty_rencana ? (' · ' + p.qty_rencana + 'pcs') : '')"></button>
                  </template>
                </div>
                <div class="form-grid">
                  <div class="field">
                    <label>Part Number</label>
                    <select x-model="lines[st.id].form.part_number" @change="autofillManpower(st.id, lines[st.id].form.part_number)">
                      <option value="">-- pilih --</option>
                      <template x-for="p in partNumberList" :key="p.value">
                        <option :value="p.value" x-text="p.value"></option>
                      </template>
                    </select>
                  </div>
                  <div class="field"><label>Qty</label><input type="number" x-model="lines[st.id].form.qty"></div>
                  <!-- Jumlah MP SELALU disembunyikan dari form input, data auto-terisi dari Std MP Master Data Part Number lewat autofillManpower() -->
                  <div class="field" style="display:none;"><label>Jumlah MP</label><input type="number" x-model="lines[st.id].form.manpower"></div>

                </div>
                <div class="field" x-show="routingMax > 0" style="margin-bottom:16px;">
                  <label>Routing</label>
                  <div class="chip-row">
                    <button type="button" class="chip" :class="lines[st.id].routingType==='WIP' ? 'chip-active' : ''" @click="setRoutingType(st.id, 'WIP')">WIP</button>
                    <button type="button" class="chip" :class="lines[st.id].routingType==='FG' ? 'chip-active' : ''" @click="setRoutingType(st.id, 'FG')">FG</button>
                  </div>
                  <div class="chip-row" x-show="lines[st.id].routingType" style="margin-top:8px;">
                    <template x-for="n in routingRange()" :key="n">
                      <button type="button" class="chip chip-num" :class="lines[st.id].routingNumbers.includes(n) ? 'chip-active' : ''" @click="toggleRoutingNumber(st.id, n)" x-text="n"></button>
                    </template>
                  </div>
                </div>
                <div class="form-actions">
                  <button type="button" class="btn-primary" @click="confirmActualStart(st.id)">✅ Konfirmasi Produksi Mulai</button>
                </div>
              </div>

              <!-- RUNNING -->
              <div x-show="lines[st.id].state === 'running'" x-cloak>
                <div class="timer-badge">
                  <span class="timer-dot timer-dot-live"></span>
                  <span>Produksi <b x-text="lines[st.id].form.part_number"></b> — mulai aktual <b x-text="fmtClock(lines[st.id].actualStartConfirmedAt)"></b></span>
                  <button type="button" class="btn-danger btn-finish" @click="stopProduksi(st.id)">⏹ Selesai Produksi</button>
                </div>
              </div>

              <!-- FINISHED: konfirmasi Qty Aktual, baru pilih Setup atau Non-Produksi -->
              <div class="classification-box" x-show="lines[st.id].afterFinishChoice" x-cloak>
                <p class="classification-title">Selesai jam <span x-text="fmtClock(lines[st.id].entryEnd)"></span> — <span x-text="lines[st.id].form.part_number"></span></p>
                <div class="field" style="max-width:240px;margin-bottom:6px;">
                  <label>Qty Aktual *</label>
                  <input type="number" x-model="lines[st.id].form.qty">
                </div>
                <div class="field" style="max-width:240px;margin-bottom:6px;">
                  <label>Repair</label>
                  <input type="number" x-model="lines[st.id].form.repair">
                </div>
                <p class="hint" style="margin-bottom:14px;">Qty ini terisi dari yang diketik sebelum mulai produksi. Kalau selama produksi tadi ada problem mesin / downtime yang bikin hasil aktualnya beda, sesuaikan dulu angkanya di sini sebelum lanjut. Isi Repair kalau ada hasil yang perlu diperbaiki ulang.</p>
                <div class="form-actions" style="justify-content:flex-start;">
                  <button type="button" class="btn-primary" @click="chooseSetupNext(st.id)">🔧 Setup (ganti part)</button>
                  <button type="button" class="btn-secondary" @click="chooseNonProduksiNext(st.id)">Non-Produksi</button>
                </div>
              </div>

              <!-- NONPRODUKSI_RUNNING -->
              <div class="classification-box" x-show="lines[st.id].state === 'nonproduksi_running'" x-cloak>
                <p class="classification-title">⏱ Non-Produksi sejak <span x-text="fmtClock(lines[st.id].nonProdActiveStart)"></span></p>
                <div class="form-grid">
                  <div class="field">
                    <label>Jenis</label>
                    <select x-model="lines[st.id].nonProdForm.nama">
                      <option value="">- pilih -</option>
                      <template x-for="t in nonProduksiTypeList" :key="t.id">
                        <option :value="t.nama" x-text="t.nama"></option>
                      </template>
                    </select>
                  </div>
                </div>
                <p class="hint">"Mulai Produksi" kalau part berikutnya mau dikerjakan sekarang (otomatis menutup non-produksi ini). "Selesai (Tutup Shift)" kalau mesin memang berhenti beroperasi sampai shift berikutnya.</p>

            <div class="master-list">
              <template x-for="k in repairKategoriOptions" :key="k.id">
                <div class="master-list-row">
                  <span class="master-value" x-text="k.value"></span>
                  <div class="master-row-actions">
                    <button type="button" class="btn-danger btn-sm" @click="deleteMasterRepairKategori(k.id)">Hapus</button>
                  </div>
                </div>
              </template>
              <p class="empty-state" x-show="repairKategoriOptions.length === 0">Belum ada data.</p>
            </div>
          </div>
        </div>
      </div>
    </template>
  </main>
</div>

</body>
</html>
