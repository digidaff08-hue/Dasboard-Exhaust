<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Data — Welding Exhaust System</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* =========================================================
     TAMPILAN HALAMAN MASTER DATA
     Semua aturan di sini SENGAJA dibatasi ke halaman ini saja
     (lewat kelas ber-prefix .md- / .pv-, atau selektor di dalam
     .md-page). assets/style.css TIDAK disentuh supaya halaman
     lain -- dashboard, input produksi, dll -- tidak ikut berubah.

     Masalah yang dibereskan: halaman ini punya 14 panel yang
     menumpuk lurus ke bawah, masing-masing dengan bayangan tebal.
     Perbaikannya dua: (1) form dipasangkan berdampingan dengan
     tabel riwayatnya, (2) bayangan tebal diganti garis tipis.
     ========================================================= */

  /* ---------- Grid Absensi (gaya rekap tercetak: bergaris penuh,
     header tebal, baris ringkasan HADIR/CUTI/dst di bawah) ----------
     Kolom tanggal (ke-4 dst) dipaksa SEMPIT, dan grid ini scroll di
     dalam kotaknya sendiri (lihat .absensi-wrap di bawah) dengan
     header (baris tanggal) yang tetap kelihatan (sticky) selama
     digulir -- soalnya style umum di assets/style.css bikin tiap <td>
     lebar minimum besar & kotak scrollnya cuma menampilkan +-7 baris,
     padahal grid ini butuh banyak kolom sempit + banyak baris. */
  /* Supaya tanggal (header) TETAP KELIHATAN saat scroll ke bawah, grid
     ini dibuat scroll SENDIRI di dalam kotak (bukan ikut scroll
     halaman) dengan tinggi yang cukup besar (hampir sepenuh layar).
     CATATAN PENTING: overflow-x DAN overflow-y harus SAMA-SAMA "auto"
     di sini -- kalau salah satu "visible" (kombinasi tidak konsisten),
     browser otomatis mengubah keduanya jadi scroll versi elemen ITU
     SENDIRI, tapi karena scroll itu tidak pernah benar-benar terjadi
     (elemen tinggi pas dengan isinya, ngikut scroll HALAMAN), akibatnya
     header sticky rusak total (ini yang terjadi di versi sebelumnya). */
  .absensi-wrap { max-height: calc(100vh - 350px) !important; overflow: auto !important; }
  .absensi-grid { border-collapse: collapse; table-layout: fixed; }
  .absensi-grid th, .absensi-grid td {
    border: 1px solid var(--border, #94A3B8);
    padding: 1px !important;
    min-width: 0 !important;
    overflow: hidden;
  }
  /* 3 kolom kiri (NIK/NAMA/STATUS) dipadatkan -- style.css bawaan
     memberi min-width besar ke SEMUA <th>/<td>, jadi dipaksa di sini
     supaya sisa lebar bisa dipakai kolom tanggal. */
  .absensi-grid th:nth-child(1), .absensi-grid td:nth-child(1) {
    width: 40px !important; min-width: 40px !important; max-width: 40px !important;
  }
  .absensi-grid th:nth-child(2), .absensi-grid td:nth-child(2) {
    width: 92px !important; min-width: 92px !important; max-width: 92px !important;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap !important;
  }
  .absensi-grid th:nth-child(3), .absensi-grid td:nth-child(3) {
    width: 48px !important; min-width: 48px !important; max-width: 48px !important;
  }
  /* Kolom tanggal (ke-4 dst) DILEBARKAN dari versi sebelumnya (26px)
     supaya baris RASIO KEHADIRAN (mis. "92%") tidak terpotong/tumpang
     tindih -- 34px cukup untuk 3-4 karakter di font 10.5px. */
  .absensi-grid th:nth-child(n+4), .absensi-grid td:nth-child(n+4) {
    width: 34px !important; min-width: 34px !important; max-width: 34px !important;
  }
  .absensi-grid thead th {
    background: #EEF2F7 !important; font-weight: 700; text-align: center;
    padding: 2px 1px !important; font-size: 10.5px; line-height: 1.1;
    /* Nempel di ATAS KOTAK SCROLL grid ini (bukan ke atas halaman --
       lihat catatan di .absensi-wrap) supaya baris TANGGAL tetap
       kelihatan terus sepanjang grid ini digulir ke bawah. */
    position: sticky !important; top: 0px !important; z-index: 4 !important;
    box-shadow: 0 1px 0 var(--border, #94A3B8);
  }
  /* Teks NIK/NAMA (bukan lewat <input>/<select>) ikut style.css bawaan
     (font 13px, dan NIK lewat class .mono bisa punya ukurannya sendiri)
     kalau tidak dipaksa di sini -- itu sebab baris masih terasa
     tinggi/renggang & ukurannya beda dari kolom STATUS. Disamakan
     persis dengan ukuran select STATUS (9.5px) pakai !important supaya
     menang dari class .mono / aturan umum tabel. */
  .absensi-grid tbody td, .absensi-grid tbody th {
    font-size: 9.5px !important; line-height: 1.1; height: auto;
  }
  .absensi-grid td input[type="text"] {
    width: 100%; min-width: 0; padding: 0; margin: 0;
    border: none; background: transparent; text-align: center;
    font-size: 9.5px !important; line-height: 1.1; height: 14px;
  }
  .absensi-grid td select {
    font-size: 9.5px !important; padding: 0 1px; margin: 0; width: 100%;
    min-width: 0; text-overflow: ellipsis; height: 15px; line-height: 1.1;
  }
  .absensi-grid tfoot td {
    font-weight: 600; background: #F8FAFC; font-size: 10px; text-align: center;
    white-space: nowrap; padding: 1px !important; line-height: 1.1;
  }
  .absensi-grid tfoot td:first-child {
    text-align: left; padding-left: 6px !important; font-size: 10px;
    white-space: nowrap; overflow: visible;
  }

  /* ---------- Ruang di atas grid dipadatkan juga ----------
     Supaya sebisa mungkin 1 layar penuh: panel/hint/form-grid di
     panel Absensi dibuat lebih rapat daripada panel lain di halaman
     ini (yang isinya cuma form pendek, jadi jarak longgar tidak masalah). */
  .panel-absensi { padding: 12px 14px !important; }
  .panel-absensi .panel-title { margin-bottom: 8px !important; padding-bottom: 6px !important; }
  .panel-absensi .hint { font-size: 11px !important; line-height: 1.35 !important; }
  .panel-absensi .form-grid { margin-bottom: 0 !important; gap: 8px !important; }

  /* ---------- Jarak judul halaman ke bar kategori ---------- */
  /* Ada gap kosong bawaan (dari assets/style.css) antara judul "Data"
     dan bar tombol kategori (Attendance/Scrap/dst) di bawahnya --
     dirapatkan supaya lebih banyak tersisa untuk tabel Absensi. */
  .md-page .page-header { margin-bottom: 10px !important; }

  /* ---------- Bar kategori ---------- */
  /* Nempel di atas saat digulir -- di halaman sepanjang ini, tab
     yang ikut hilang ke atas bikin orang kehilangan konteks. */
  .md-subtab-nav {
    margin: 0 0 12px !important; padding: 4px !important;
    display: flex; gap: 4px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 20;
    background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 12px;
  }
  .md-subtab-nav button {
    margin: 0 !important; border: 0 !important; background: transparent !important;
    box-shadow: none !important; color: var(--muted) !important;
    padding: 8px 16px !important; border-radius: 9px !important;
    font-weight: 600; transition: color .12s, background .12s;
  }
  .md-subtab-nav button:hover { color: var(--text) !important; background: var(--border) !important; }
  .md-subtab-nav button.md-tab-on {
    background: var(--primary) !important; color: #fff !important;
  }

  /* ---------- Panel ---------- */
  /* Bayangan tebal bawaan (0 10px 26px) dihapus di halaman ini:
     bagus untuk 2-3 kartu, tapi jadi berisik untuk 14 kartu. */
  .md-page .panel {
    box-shadow: none;
    background: var(--panel);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  /* Judul panel dapat garis rambut sebagai pemisah, bukan sekadar jarak */
  .md-page .panel-title {
    font-size: 14px; letter-spacing: -0.01em;
    padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .md-page .hint { font-size: 12px; line-height: 1.55; color: var(--muted); }

  /* ---------- Form berdampingan dengan riwayatnya ---------- */
  /* Form (kiri) lebih sempit dari tabel (kanan): tabel butuh lebar,
     form tidak. Di layar sempit otomatis bertumpuk lagi. */
  .md-pair { display: grid; grid-template-columns: minmax(300px, 5fr) 7fr; gap: 18px; align-items: start; }
  .md-pair > .panel { margin-bottom: 18px; }
  @media (max-width: 1180px) { .md-pair { grid-template-columns: 1fr; gap: 0; } }

  /* ---------- Tabel riwayat ---------- */
  /* Dibatasi tingginya: riwayat yang panjang tidak boleh mendorong
     panel di bawahnya jauh ke bawah. Judul kolom ikut menempel. */
  .md-page .table-wrap { max-height: 340px; overflow: auto; }
  .md-page .table-wrap thead th {
    position: sticky; top: 0; z-index: 2;
    font-size: 11px; letter-spacing: 0.03em; color: var(--muted);
  }
  .md-page .table-wrap tbody tr:nth-child(even) { background: var(--panel-2); }
  .md-page .table-wrap tbody tr:hover { background: color-mix(in srgb, var(--primary) 8%, var(--panel)); }
  .md-page .table-wrap td { font-size: 13px; }
  .md-page .empty-state { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

  /* ---------- Grid input Productivity ----------
     Matrix 6 baris x 31 kolom tanggal, meniru format Excel "Daily Peff".
     Semua di-prefix .pv- supaya tidak menimpa tabel lain di halaman ini. */
  .pv-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; max-height: none; }
  .pv-table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 12px; }
  .pv-table th, .pv-table td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 0; text-align: center; white-space: nowrap; }
  .pv-table thead th { background: var(--panel-2); font-weight: 600; padding: 6px 4px; position: sticky; top: 0; z-index: 3; }
  /* 2 kolom kiri (Grup + Baris) & kolom Total dibikin nempel saat digeser */
  .pv-table .pv-sticky-1 { position: sticky; left: 0; z-index: 2; background: var(--panel); min-width: 76px; padding: 6px 8px; text-align: left; font-weight: 600; }
  .pv-table .pv-sticky-2 { position: sticky; left: 76px; z-index: 2; background: var(--panel); min-width: 112px; padding: 6px 8px; text-align: left; }
  .pv-table thead .pv-sticky-1, .pv-table thead .pv-sticky-2 { z-index: 4; background: var(--panel-2); }
  .pv-table .pv-total { position: sticky; right: 0; z-index: 2; background: var(--panel-2); min-width: 80px; padding: 6px 8px; text-align: right; font-weight: 600; }
  .pv-table thead .pv-total { z-index: 4; }
  /* 46px: teks terpanjang "207,25" (6 karakter x +-6,6px di font mono 11px
     = +-40px) + padding, supaya tidak terpotong. 31 kolom x 46px + 268px
     kolom tetap (Grup/Baris/Total) = +-1694px, masih muat di layar desktop. */
  .pv-day { min-width: 46px; width: 46px; }
  /* Kolom tanggal yang jatuh di hari Minggu ditandai tipis */
  .pv-table th.pv-sunday { color: var(--danger, #DC2626); }
  .pv-table thead th.pv-day { padding: 6px 2px; font-size: 11px; }
  /* Input di dalam sel: tanpa border sendiri, biar kelihatan seperti sel Excel. */
  .pv-cell-input { width: 100%; border: 0 !important; background: transparent; padding: 4px 3px !important; text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 11px; border-radius: 0 !important; box-shadow: none !important; height: auto !important; min-height: 0 !important; }
  .pv-cell-input:focus { outline: 2px solid var(--primary); outline-offset: -2px; background: var(--panel-2); }
  .pv-cell-input:disabled { color: var(--muted); }
  .pv-grup-earned td.pv-sticky-1, .pv-grup-earned td.pv-sticky-2 { background: color-mix(in srgb, var(--primary) 7%, var(--panel)); }
  .pv-grup-operation td.pv-sticky-1, .pv-grup-operation td.pv-sticky-2 { background: color-mix(in srgb, var(--teal, #0EA5E9) 7%, var(--panel)); }
  .pv-row-sep td { border-top: 2px solid var(--border); }
  /* Sel yang lagi ke-blok (klik-tahan-geser / shift+klik) */
  .pv-table td.pv-sel { background: color-mix(in srgb, var(--primary) 22%, var(--panel)); outline: 1px solid var(--primary); outline-offset: -1px; }
  /* 4 baris hasil hitung -- dibedakan supaya jelas ini bukan kolom isian */
  .pv-calc-row td { background: var(--panel-2); font-weight: 600; font-family: "IBM Plex Mono", monospace; font-size: 10px; padding: 5px 3px; }
  .pv-calc-row td.pv-sticky-1, .pv-calc-row td.pv-sticky-2 { font-family: inherit; font-size: 12px; }

  /* Tabel Jatah Cuti: semua rata tengah supaya angka sejajar dengan
     judul kolomnya. NIK & Nama tetap rata kiri karena itu teks. */
  .ct-tbl th, .ct-tbl td { text-align: center; vertical-align: middle; }
  .ct-tbl th:nth-child(1), .ct-tbl td:nth-child(1),
  .ct-tbl th:nth-child(2), .ct-tbl td:nth-child(2) { text-align: left; }

  /* Kolom Jatah di tab Cuti */
  .ct-jatah {
    width: 84px; padding: 5px 8px; text-align: center; margin: 0 auto; display: block;
    font-family: "IBM Plex Mono", monospace; font-size: 13px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel); color: var(--text);
  }
  .ct-jatah:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

  /* Baris tombol: dipisah garis tipis supaya jelas ini akhir form */
  .md-page .form-actions {
    border-top: 1px solid var(--border);
    padding-top: 14px; margin-top: 16px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
</style>

<script>
  (function () {
    var t = "light";   // mode gelap dinonaktifkan -- tombolnya sudah dihapus
    try { localStorage.removeItem("theme_v1"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/supabaseClient.js"></script>
</head>
<body>

<div class="app-shell" x-data="masterDataPage()">
  <div class="mobile-topbar">
    <button class="hamburger" @click="mobileNavOpen = true">☰</button>
  </div>

  <div class="sidebar-overlay" x-show="mobileNavOpen" @click="mobileNavOpen = false" x-cloak></div>
  <aside class="sidebar" :class="[mobileNavOpen ? 'sidebar-open' : '', sidebarCollapsed ? 'sidebar-collapsed' : '']">
    <button class="sidebar-collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed">
      <span x-show="!sidebarCollapsed">‹</span><span x-show="sidebarCollapsed">›</span>
    </button>
    <div class="sidebar-brand" x-show="!sidebarCollapsed">WELDING EXHAUST<span>·</span>SYSTEM</div>
    <nav class="sidebar-nav" @click="mobileNavOpen = false">
      <a href="dashboard-exhaust.html" class="sidebar-link" title="Dashboard Exhaust"><span>📊</span><span x-show="!sidebarCollapsed">Dashboard Exhaust</span></a>
      <a href="input-produksi.html" class="sidebar-link" title="Input Produksi"><span>⚙️</span><span x-show="!sidebarCollapsed">Input Produksi</span></a>
      <a href="input-attendance.html" class="sidebar-link" title="Attendance" x-show="isLeaderOrAdmin()"><span>👥</span><span x-show="!sidebarCollapsed">Attendance</span></a>
            <a href="data-mentah.html" class="sidebar-link" title="Data Mentah" x-show="isAdmin()"><span>🗃️</span><span x-show="!sidebarCollapsed">Data Mentah</span></a>
<a href="master-data.html" class="sidebar-link active" title="Master Data" x-show="isLeaderOrAdmin()"><span>🗂️</span><span x-show="!sidebarCollapsed">Master Data</span></a>
    </nav>
    <div class="sidebar-foot" x-show="!sidebarCollapsed">
      <div class="who" x-text="profile?.full_name || session?.user?.email || '...'"></div>
      <span class="badge" :class="profile?.role === 'admin' ? 'role-admin' : ''" x-text="profile?.jabatan || profile?.role || '...'"></span>
      <button class="btn-ghost btn-sm" @click="logout()">Keluar</button>
    </div>
    <button class="sidebar-logout-collapsed" x-show="sidebarCollapsed" @click="logout()" title="Keluar">⏻</button>
  </aside>

  <main class="main md-page">
    <div class="page-header">
      <h1 class="page-title"><span class="eyebrow">Master</span>Data</h1>
    </div>
    <template x-if="!isLeaderOrAdmin() && profile">
      <div class="error-msg">Halaman ini khusus admin/leader.</div>
    </template>
    <template x-if="msg"><div :class="msgError ? 'error-msg' : 'success-msg'" x-text="msg"></div></template>

    <template x-if="isLeaderOrAdmin()">
      <div>
        <!-- ===== Tombol kategori Master Data =====
             Saat ini baru ada "Attendance" (Total Orang / OT harian,
             Kehadiran Shift Mingguan, Hari Libur/Tanggal Merah) --
             kategori lain bisa ditambah di sini nanti pakai pola yang
             sama (tambah tombol + activeTab baru). -->
        <div class="md-subtab-nav">
          <button class="btn-secondary btn-sm" :class="activeTab === 'attendance' ? 'md-tab-on' : ''" @click="setTab('attendance')">Attendance</button>
          <button class="btn-secondary btn-sm" :class="activeTab === 'scrap' ? 'md-tab-on' : ''" @click="setTab('scrap')">Scrap</button>
          <button class="btn-secondary btn-sm" :class="activeTab === 'safety' ? 'md-tab-on' : ''" @click="setTab('safety')">Safety</button>
          <button class="btn-secondary btn-sm" :class="activeTab === 'productivity' ? 'md-tab-on' : ''" @click="setTab('productivity')">Productivity</button>
          <button class="btn-secondary btn-sm" :class="activeTab === 'cuti' ? 'md-tab-on' : ''" @click="setTab('cuti')">Cuti</button>
        </div>

        <!-- ===== TAB: ATTENDANCE ===== -->
        <template x-if="activeTab === 'attendance'">
          <div>
            <!-- Sub-tombol di dalam tab Attendance -- tiap grup panel
                 (termasuk riwayatnya) disembunyikan/ditampilkan lewat
                 atSub, pola yang sama dengan ctSub di tab Cuti. -->
            <div class="md-subtab-nav" style="position:static;">
              <button class="btn-secondary btn-sm" :class="atSub === 'mp' ? 'md-tab-on' : ''" @click="atSub = 'mp'">Total MP</button>
              <button class="btn-secondary btn-sm" :class="atSub === 'overtime' ? 'md-tab-on' : ''" @click="atSub = 'overtime'">Overtime</button>
              <button class="btn-secondary btn-sm" :class="atSub === 'shift2' ? 'md-tab-on' : ''" @click="atSub = 'shift2'">Data Shift 2</button>
              <button class="btn-secondary btn-sm" :class="atSub === 'libur' ? 'md-tab-on' : ''" @click="atSub = 'libur'">Hari Libur</button>
              <button class="btn-secondary btn-sm" :class="atSub === 'ganti' ? 'md-tab-on' : ''" @click="atSub = 'ganti'">Ganti Hari</button>
              <button class="btn-secondary btn-sm" :class="atSub === 'absensi' ? 'md-tab-on' : ''" @click="atSub = 'absensi'; fetchAbsensiIfNeeded()">Absensi</button>
            </div>

            <template x-if="atSub === 'mp'">
            <div>
            <!-- ===== Total Orang (Bulanan) =====
                 Total Orang cukup diinput SEKALI per bulan (pilih Bulan +
                 Tahun) -- nilainya disimpan di attendance_log dengan
                 tanggal = tanggal 1 bulan itu, lalu ikut carry-forward
                 dipakai untuk SEMUA tanggal di bulan itu di dashboard.
                 Riwayat diletakkan di BAWAH form (bukan berdampingan)
                 supaya lebih enak dilihat. -->
            <div class="panel">
              <p class="panel-title">Total Orang (Bulanan)</p>
              <div class="form-grid">
                <div class="field">
                  <label>Bulan</label>
                  <select x-model.number="mpForm.bulan">
                    <template x-for="(nm, i) in BULAN_LABELS" :key="'mp-bln-'+i">
                      <option :value="i+1" x-text="nm"></option>
                    </template>
                  </select>
                </div>
                <div class="field">
                  <label>Tahun</label>
                  <select x-model.number="mpForm.tahun">
                    <template x-for="y in tahunOptions" :key="'mp-thn-'+y"><option :value="y" x-text="y"></option></template>
                  </select>
                </div>
                <div class="field"><label>Total Orang</label><input type="number" x-model="mpForm.total_orang"></div>
              </div>
              <div class="form-actions">
                <button type="button" class="btn-primary" @click="saveMp()">Simpan Total Orang</button>
              </div>
            </div>

            <div class="panel">
              <p class="panel-title">Riwayat Total Orang (Bulanan) <span class="count" x-text="mpRows.length + ' baris'"></span></p>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Bulan</th><th>Total Orang</th><th>Aksi</th></tr></thead>
                  <tbody>
                    <template x-for="r in mpRows" :key="r.tanggal">
                      <tr>
                        <td class="mono" x-text="fmtBulanTahun(r.tanggal)"></td>
                        <td class="mono" x-text="fmtNum(r.total_orang)"></td>
                        <td><button class="btn-secondary btn-sm" @click="editMp(r)">Edit</button></td>
                      </tr>
                    </template>
                    <tr x-show="mpRows.length === 0"><td colspan="3" class="empty-state">Belum ada data.</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
            </div>
            </template>

            <template x-if="atSub === 'overtime'">
            <div>
            <!-- ===== Overtime Harian =====
                 Beda dari Total Orang -- OT memang berubah tiap hari,
                 jadi tetap diinput per tanggal. Menyimpan OT TIDAK ikut
                 menimpa Total Orang di tanggal yang sama (lihat saveOt()).
                 Riwayat diletakkan di BAWAH form, bukan berdampingan. -->
            <div class="panel">
              <p class="panel-title">Overtime Harian</p>
              <div class="form-grid">
                <div class="field"><label>Tanggal</label><input type="date" x-model="otForm.tanggal"></div>

                  <!-- Satu <tbody> per periode (baris utama + baris Detail

                  <template x-for="p in shift2Periodes" :key="p.id">
                    <tbody>
                      <tr>
                        <td class="mono" x-text="p.tanggal_mulai"></td>
                        <td class="mono" x-text="p.tanggal_selesai"></td>

                          <button class="btn-secondary btn-sm" @click="exportShift2Periode(p)">Export</button>
                          <button class="btn-secondary btn-sm" @click="deleteShift2Periode(p)">Hapus</button>
                        </td>
                      </tr>
                      <tr x-show="shift2DetailOpenId === p.id">
                        <td colspan="4" style="background:#fafafa;">
                          <div style="max-height:220px; overflow-y:auto;">
                            <table>
                              <thead><tr><th>NIK</th><th>Nama</th></tr></thead>
                              <tbody>
                                <template x-for="d in p.details" :key="p.id + '-' + d.nik">
                                  <tr><td class="mono" x-text="d.nik"></td><td x-text="d.nama"></td></tr>
                                </template>
                              </tbody>
                            </table>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </template>
                  <tbody>
                    <tr x-show="shift2Periodes.length === 0"><td colspan="4" class="empty-state">Belum ada data Shift 2 diupload.</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
            </div>
            </div>
            </template>

              <div class="table-wrap">
                <table>
                  <thead><tr><th>Periode</th><th>Scrap (K IDR)</th><th>Total (K IDR)</th><th>Rasio</th><th>Target</th><th>Aksi</th></tr></thead>
                  <tbody>
                    <template x-for="r in scrapRows" :key="r.id">
                      <tr>
                        <td class="mono" x-text="r.tahun + '-' + String(r.bulan).padStart(2,'0')"></td>
                        <td class="mono" x-text="fmtNum(r.scrap_value_kidr)"></td>
                        <td class="mono" x-text="fmtNum(r.total_value_kidr)"></td>
                        <td class="mono" x-text="r.total_value_kidr > 0 ? fmtNum(r.scrap_value_kidr / r.total_value_kidr * 100) + '%' : '-'"></td>
                        <td class="mono" x-text="r.target_rasio ? fmtNum(r.target_rasio * 100) + '%' : '-'"></td>
                        <td><button class="btn-secondary btn-sm" @click="editScrap(r)">Edit</button></td>
                      </tr>
                    </template>
                    <tr x-show="scrapRows.length === 0"><td colspan="6" class="empty-state">Belum ada data.</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
            </div>
          </div>
        </template>

        <!-- ===== TAB: SAFETY ===== -->
        <template x-if="activeTab === 'safety'">
          <div>
            <div class="md-pair">
            <div class="panel">
              <p class="panel-title">Catat Insiden</p>
              <p class="hint" style="margin-bottom:12px;">Kalau tidak ada insiden, tidak perlu diisi — dashboard otomatis menghitung "hari tanpa kecelakaan".</p>
              <div class="form-grid">
                <div class="field"><label>Tanggal</label><input type="date" x-model="safetyForm.tanggal"></div>
                <div class="field"><label>Kategori</label>
                  <select x-model="safetyForm.kategori">
                    <option value="ACCIDENT">Accident (kecelakaan kerja)</option>
                    <option value="NEAR_MISS">Near Miss (hampir celaka)</option>
                    <option value="OTHER">Lainnya</option>
                  </select>
                </div>
                <div class="field" style="grid-column: 1 / -1;"><label>Keterangan</label><input type="text" x-model="safetyForm.keterangan" placeholder="Kronologi singkat..."></div>
              </div>
              <div class="form-actions">
                <button type="button" class="btn-primary" @click="saveSafety()">Simpan Insiden</button>
              </div>
            </div>

            <div class="panel">
              <p class="panel-title">Riwayat Insiden <span class="count" x-text="safetyRows.length + ' baris'"></span></p>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th>Aksi</th></tr></thead>
                  <tbody>
                    <template x-for="r in safetyRows" :key="r.id">
                      <tr>
                        <td class="mono" x-text="r.tanggal"></td>
                        <td><span class="badge" x-text="r.kategori"></span></td>
                        <td x-text="r.keterangan || '-'"></td>
                        <td><button class="btn-danger btn-sm" @click="hapusSafety(r.id)">Hapus</button></td>
                      </tr>
                    </template>
                    <tr x-show="safetyRows.length === 0"><td colspan="4" class="empty-state">Tidak ada insiden tercatat. 👍</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
            </div>
          </div>
        </template>

        <!-- ===== TAB: PRODUCTIVITY (harian, gabungan semua line) =====
             Format mengikuti laporan Excel "Daily Peff": 6 baris
             (Earned x3, Operation x3) x tanggal 1-31. SEMUA DIISI
             MANUAL -- tidak ada rumus, tidak diambil dari data
             produksi. Angka ini gabungan semua line, bukan per line. -->
        <template x-if="activeTab === 'productivity'">
          <div>
            <div class="panel">
              <p class="panel-title">Input Productivity Harian</p>
              <p class="hint" style="margin-bottom:12px;">
                Semua angka diisi manual (satuan menit), gabungan semua line.
                Tanggal yang memang kosong / libur biarkan saja kosong — tidak
                perlu diisi 0. Kolom <b>Total</b> di kanan hanya penjumlahan
                tampilan, tidak ikut disimpan.
                <br>
                <b>Bisa copy-paste langsung dari Excel:</b> blok selnya di Excel,
                copy, lalu klik satu sel di sini dan tempel (Ctrl+V) — sel yang
                kamu klik jadi titik awal, sisanya terisi sendiri ke bawah dan ke
                kanan. Blok yang lewat dari 6 baris atau lewat tanggal terakhir
                bulan ini diabaikan.
                <br>
                Yang diambil adalah <b>angka asli di dalam sel Excel</b>, bukan
                versi bulat yang tampil di layar — jadi kalau sel Excel isinya
                <span class="mono">21,9931428571429</span> tapi tampil
                <span class="mono">22,0</span>, yang masuk tetap angka penuhnya.
                Di tabel ini sel ditampilkan ringkas 2 desimal; klik selnya untuk
                melihat angka penuh.
                <br>
                <b>Hapus banyak sel sekaligus:</b> klik-tahan lalu geser untuk
                memblok (bisa juga klik sel awal, lalu Shift+klik sel akhir),
                kemudian tekan <span class="mono">Delete</span> atau klik tombol
                <b>Hapus sel terpilih</b>. Untuk mengosongkan satu bulan penuh,
                pakai tombol <b>Kosongkan Bulan Ini</b>. Perubahan baru masuk ke
                server setelah <b>Simpan</b> ditekan.
              </p>

              <div class="form-grid">
                <div class="field"><label>Bulan</label>
                  <select x-model.number="pvMonth" @change="fetchProductivity()">
                    <template x-for="(nm, i) in BULAN_LABELS" :key="'pv-bln-'+i">
                      <option :value="i+1" x-text="nm"></option>
                    </template>
                  </select>
                </div>
                <div class="field"><label>Tahun</label>
                  <select x-model.number="pvYear" @change="fetchProductivity()">
                    <template x-for="y in tahunOptions" :key="'pv-thn-'+y"><option :value="y" x-text="y"></option></template>
                  </select>
                </div>
                <!-- Ikut tahun yang dipilih di sebelah kiri. Cuma tampilan
                     (3 desimal), diisinya di panel Koefisien di bawah. -->
                <div class="field"><label>Koefisien</label>
                  <input type="text" class="mono" disabled
                         :value="kwForYear(pvYear) === null ? 'Belum diisi' : kwDisplay(kwForYear(pvYear))">
                </div>
              </div>

              <template x-if="pvLoading">
                <p class="empty-state">Memuat data productivity...</p>
              </template>

              <template x-if="!pvLoading">
                <div class="pv-wrap" @mouseup.window="pvSelEnd()" @keydown.window="pvSelKey($event)">
                  <table class="pv-table">
                    <thead>
                      <tr>
                        <th class="pv-sticky-1">Grup</th>
                        <th class="pv-sticky-2">Baris</th>
                        <template x-for="d in pvDays" :key="'pv-h-'+d">
                          <th class="pv-day" :class="pvIsSunday(d) ? 'pv-sunday' : ''" x-text="d"></th>
                        </template>
                        <th class="pv-total">Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(r, i) in PV_ROWS" :key="'pv-r-'+r.key">
                        <tr :class="(r.grup === 'Earned' ? 'pv-grup-earned' : 'pv-grup-operation') + (i === 3 ? ' pv-row-sep' : '')">
                          <td class="pv-sticky-1" x-text="(i === 0 || i === 3) ? r.grup : ''"></td>
                          <td class="pv-sticky-2" x-text="r.label"></td>
                          <template x-for="d in pvDays" :key="'pv-c-'+r.key+'-'+d">
                            <td :class="pvSelHas(i, d) ? 'pv-sel' : ''"
                                @mousedown="pvSelStart(i, d, $event)"
                                @mouseenter="pvSelEnter(i, d)">
                              <input type="text" inputmode="decimal" class="pv-cell-input"
                                     :disabled="!isLeaderOrAdmin()"
                                     :value="pvCellValue(r.key, d)"
                                     @focus="pvFocusKey = r.key + '-' + d"
                                     @blur="pvFocusKey = ''"
                                     @input="pvGrid[r.key][d] = pvSanitize($event.target.value); $event.target.value = pvGrid[r.key][d]"
                                     @paste="pvPaste($event, i, d)">
                            </td>
                          </template>
                          <td class="pv-total mono" x-text="pvRowTotal(r.key)"></td>
                        </tr>
                      </template>

                      <!-- ===== 4 baris hasil hitung (otomatis, tidak disimpan) =====
                           Total Earned    = Massprod + Semi massprod + Non massprod
                           Total Operation = Masspro  + Semi masspro  + Non masspro
                           Efficiency      = Total Earned / Total Operation
                           Productivity    = Efficiency / Koefisien (tahun terpilih)
                           Kolom TOTAL di kanan: Earned & Operation = jumlah sebulan;
                           Efficiency & Productivity dihitung ulang dari total
                           sebulan itu (bukan rata-rata angka harian). -->
                      <tr class="pv-calc-row pv-row-sep">
                        <td class="pv-sticky-1">Hasil</td>
                        <td class="pv-sticky-2">Total Earned</td>
                        <template x-for="d in pvDays" :key="'pv-te-'+d">
                          <td class="mono" x-text="pvFmt(pvEarnedDay(d), 2)"></td>
                        </template>
                        <td class="pv-total mono" x-text="pvFmt(pvEarnedMonth(), 2)"></td>
                      </tr>
                      <tr class="pv-calc-row">
                        <td class="pv-sticky-1"></td>
                        <td class="pv-sticky-2">Total Operation</td>
                        <template x-for="d in pvDays" :key="'pv-to-'+d">
                          <td class="mono" x-text="pvFmt(pvOperationDay(d), 2)"></td>
                        </template>
                        <td class="pv-total mono" x-text="pvFmt(pvOperationMonth(), 2)"></td>
                      </tr>
                      <tr class="pv-calc-row">
                        <td class="pv-sticky-1"></td>
                        <td class="pv-sticky-2">Efficiency</td>
                        <template x-for="d in pvDays" :key="'pv-ef-'+d">
                          <td class="mono" x-text="pvFmt(pvEffDay(d), 3)"></td>
                        </template>
                        <td class="pv-total mono" x-text="pvFmt(pvEffMonth(), 3)"></td>
                      </tr>
                      <tr class="pv-calc-row">
                        <td class="pv-sticky-1"></td>
                        <td class="pv-sticky-2">Productivity</td>
                        <template x-for="d in pvDays" :key="'pv-pr-'+d">
                          <td class="mono" x-text="pvFmtPct(pvProdDay(d))"></td>
                        </template>
                        <td class="pv-total mono" x-text="pvFmtPct(pvProdMonth())"></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </template>

              <div class="form-actions" x-show="isLeaderOrAdmin()">
                <button type="button" class="btn-primary" @click="saveProductivity()" :disabled="pvSaving"
                        x-text="pvSaving ? 'Menyimpan...' : 'Simpan Productivity'"></button>
                <button type="button" class="btn-secondary" @click="pvSelDelete()" :disabled="pvSaving || pvSelCount() < 1"
                        x-text="pvSelCount() > 1 ? ('Hapus ' + pvSelCount() + ' sel terpilih') : 'Hapus sel terpilih'"></button>
                <button type="button" class="btn-danger" @click="pvClearMonth()" :disabled="pvSaving">Kosongkan Bulan Ini</button>
                <button type="button" class="btn-secondary" @click="fetchProductivity()" :disabled="pvSaving">Muat Ulang</button>
              </div>
              <p class="hint" x-show="!isLeaderOrAdmin()" style="margin-top:12px;">
                Hanya admin / leader yang bisa mengisi. Kamu tetap bisa melihat datanya.
              </p>
            </div>

            <div class="md-pair">
            <div class="panel">
              <p class="panel-title">Koefisien</p>
              <p class="hint" style="margin-bottom:12px;">
                Nilainya berubah tiap tahun — pilih tahun, isi angkanya, lalu simpan.
                Ketik angka penuhnya saja (mis. <span class="mono">0,441702442879684</span>);
                yang ditampilkan di layar dibulatkan <b>3 angka di belakang koma</b>,
                tapi yang tersimpan tetap angka penuh.
              </p>

              <div class="form-grid">
                <div class="field"><label>Tahun</label>
                  <select x-model.number="kwYear" @change="onKwYearChange()">
                    <template x-for="y in kwYearOptions" :key="'kw-thn-'+y"><option :value="y" x-text="y"></option></template>
                  </select>
                </div>
                <div class="field"><label>Koefisien</label>
                  <input type="text" inputmode="decimal" class="mono"
                         :disabled="!isLeaderOrAdmin()"
                         :value="kwValue"
                         @input="kwValue = pvSanitize($event.target.value); $event.target.value = kwValue"
                         placeholder="0,441702442879684">
                </div>
                <div class="field"><label>Tampil di layar</label>
                  <input type="text" class="mono" disabled :value="kwDisplay(kwValue)">
                </div>
              </div>

              <div class="form-actions" x-show="isLeaderOrAdmin()">
                <button type="button" class="btn-primary" @click="saveKoefisien()" :disabled="kwSaving"
                        x-text="kwSaving ? 'Menyimpan...' : 'Simpan Koefisien'"></button>
              </div>

              <p class="hint" x-show="kwError" style="margin-top:10px; color:var(--danger, #DC2626); font-weight:600;" x-text="kwError"></p>

              <div class="table-wrap" style="margin-top:14px;">
                <table>
                  <thead><tr><th>Tahun</th><th>Koefisien (3 desimal)</th><th>Nilai tersimpan</th><th x-show="isLeaderOrAdmin()">Aksi</th></tr></thead>
                  <tbody>
                    <template x-for="r in kwRows" :key="'kw-'+r.tahun">
                      <tr>
                        <td class="mono" x-text="r.tahun"></td>
                        <td class="mono" x-text="kwDisplay(r.nilai)"></td>
                        <td class="mono" style="color:var(--muted)" x-text="r.nilai"></td>
                        <td x-show="isLeaderOrAdmin()"><button class="btn-secondary btn-sm" @click="editKoefisien(r)">Edit</button></td>
                      </tr>
                    </template>
                    <tr x-show="kwRows.length === 0"><td colspan="4" class="empty-state">Belum ada koefisien tersimpan.</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="panel">
              <p class="panel-title">Target Productivity Bulanan</p>
              <p class="hint" style="margin-bottom:12px;">
                Ini angka garis merah putus-putus "Target" di grafik Productivity
                (Dashboard Exhaust — tab Kontrol Downtime & Tahunan). Isi dalam
                persen apa adanya, mis. <span class="mono">106,2</span> untuk 106,2%.
                Bulan yang belum diisi memakai target <span class="mono">100</span>.
              </p>

              <div class="form-grid">
                <div class="field"><label>Bulan</label>
                  <select x-model.number="tgMonth" @change="onTgPeriodChange()">
                    <template x-for="(nm, i) in BULAN_LABELS" :key="'tg-bln-'+i">
                      <option :value="i+1" x-text="nm"></option>
                    </template>
                  </select>
                </div>
                <div class="field"><label>Tahun</label>
                  <select x-model.number="tgYear" @change="onTgPeriodChange()">
                    <template x-for="y in kwYearOptions" :key="'tg-thn-'+y"><option :value="y" x-text="y"></option></template>
                  </select>
                </div>
                <div class="field"><label>Target (%)</label>
                  <input type="text" inputmode="decimal" class="mono"
                         :disabled="!isLeaderOrAdmin()"
                         :value="tgValue"
                         @input="tgValue = pvSanitize($event.target.value); $event.target.value = tgValue"
                         placeholder="106,2">
                </div>
              </div>

              <div class="form-actions" x-show="isLeaderOrAdmin()">
                <button type="button" class="btn-primary" @click="saveTarget()" :disabled="tgSaving"
                        x-text="tgSaving ? 'Menyimpan...' : 'Simpan Target'"></button>
                <button type="button" class="btn-secondary" @click="hapusTarget()" :disabled="tgSaving || !tgAda()">Hapus Target Bulan Ini</button>
              </div>

              <p class="hint" x-show="tgError" style="margin-top:10px; color:var(--danger, #DC2626); font-weight:600;" x-text="tgError"></p>

              <div class="table-wrap" style="margin-top:14px;">
                <table>
                  <thead><tr><th>Periode</th><th>Target</th><th x-show="isLeaderOrAdmin()">Aksi</th></tr></thead>
                  <tbody>
                    <template x-for="r in tgRows" :key="'tg-'+r.tahun+'-'+r.bulan">
                      <tr>
                        <td class="mono" x-text="BULAN_LABELS[r.bulan - 1] + ' ' + r.tahun"></td>
                        <td class="mono" x-text="fmtNum(r.target) + '%'"></td>
                        <td x-show="isLeaderOrAdmin()"><button class="btn-secondary btn-sm" @click="editTarget(r)">Edit</button></td>
                      </tr>
                    </template>
                    <tr x-show="tgRows.length === 0"><td colspan="3" class="empty-state">Belum ada target tersimpan.</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
            </div>
          </div>
        </template>

        <!-- ===== TAB: CUTI =====
             Mengatur JATAH cuti tahunan tiap karyawan. Sisa cutinya
             dilihat di input-attendance.html > tab Sisa Cuti; di sana
             cuma tampilan, angkanya dihitung dari jatah yang diatur
             di sini dikurangi cuti yang sudah terpakai. -->
        <template x-if="activeTab === 'cuti'">
          <div>
            <!-- Dua sub-tombol di dalam tab Cuti -->
            <div class="md-subtab-nav" style="position:static;">
              <button class="btn-secondary btn-sm" :class="ctSub === 'jatah' ? 'md-tab-on' : ''" @click="ctSub = 'jatah'">Jatah Cuti Tahunan</button>
              <button class="btn-secondary btn-sm" :class="ctSub === 'rekap' ? 'md-tab-on' : ''" @click="setCutiSub('rekap')">Rekap Cuti</button>
            </div>

            <template x-if="ctSub === 'jatah'">
            <div class="panel">
              <p class="panel-title">Jatah Cuti Tahunan
                <span class="count" x-text="cutiRows().length + ' karyawan'"></span>
              </p>
              <p class="hint" style="margin-bottom:14px;">
                Tiap periode punya jatahnya sendiri karena member dapat cuti baru
                setiap tahun. Kolom periode sengaja <b>dikosongkan</b> — isi sendiri
                sesuai jatah masing-masing. <b>Total Cuti</b> = jumlah keempat periode.
                <b>Terpakai</b> hanya menghitung <b>Cuti Tahunan</b> — Cuti Khusus
                tidak memotong jatah. Periode mengikuti tahun fiskal, April sampai Maret.
              </p>

              <div class="form-grid" style="margin-bottom:14px;">
                <div class="field" style="grid-column: span 2;"><label>Cari karyawan</label>
                  <input type="text" x-model="ctCari" placeholder="Ketik NIK atau nama">
                </div>
              </div>

              <p class="hint" x-show="ctError" style="color:var(--danger, #DC2626); font-weight:600; margin-bottom:10px;" x-text="ctError"></p>

              <template x-if="ctLoading">
                <p class="empty-state">Memuat data cuti...</p>
              </template>

              <template x-if="!ctLoading">
                <div class="table-wrap">
                  <table class="ct-tbl">
                    <thead>
                      <tr>
                        <th>NIK</th><th>Nama</th>
                        <template x-for="pr in CT_PERIODE" :key="'ct-h-'+pr.key">
                          <th x-text="pr.label"></th>
                        </template>
                        <th>Total Cuti</th><th>Terpakai</th><th>Sisa</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="r in cutiRows()" :key="'ct-'+r.nik">
                        <tr>
                          <td class="mono" x-text="r.nik"></td>
                          <td x-text="r.nama"></td>
                          <template x-for="pr in CT_PERIODE" :key="'ct-c-'+r.nik+'-'+pr.key">
                            <td>
                              <input type="number" min="0" step="0.5" class="ct-jatah"
                                     :disabled="!isLeaderOrAdmin()"
                                     :value="ctJatahEdit[r.nik] ? ctJatahEdit[r.nik][pr.key] : ''"
                                     @input="ctSetJatah(r.nik, pr.key, $event.target.value)">
                            </td>
                          </template>
                          <td class="mono" style="font-weight:600" x-text="ctFmt(r.total)"></td>
                          <td class="mono" x-text="ctFmt(r.terpakai)"></td>
                          <td class="mono" :style="'font-weight:600; color: var(--' + (r.sisa < 0 ? 'danger' : (r.sisa === 0 ? 'amber' : 'green')) + ')'"
                              x-text="ctFmt(r.sisa) + ' hari'"></td>
                        </tr>
                      </template>
                      <tr x-show="cutiRows().length === 0"><td :colspan="5 + CT_PERIODE.length" class="empty-state" x-text="ctCari ? 'Tidak ada karyawan yang cocok.' : 'Belum ada karyawan di master.'"></td></tr>
                    </tbody>
                  </table>
                </div>
              </template>

              <div class="form-actions" x-show="isLeaderOrAdmin()">
                <button type="button" class="btn-primary" @click="saveCuti()" :disabled="ctSaving"
                        x-text="ctSaving ? 'Menyimpan...' : 'Simpan Jatah'"></button>
                <button type="button" class="btn-secondary" @click="fetchCuti()" :disabled="ctSaving">Muat Ulang</button>
              </div>
            </div>
            </template>

            <!-- ===== REKAP CUTI =====
                 Semua inputan Izin / Sakit / Cuti / Mangkir dari SELURUH
                 user, lengkap dengan siapa yang menginput. Admin bisa
                 mengubah & menghapus dari sini. -->
            <template x-if="ctSub === 'rekap'">
            <div>
              <div class="panel">
                <p class="panel-title">Rekap Cuti
                  <span class="count" x-text="rkRows.length + ' baris'"></span>
                </p>
                <p class="hint" style="margin-bottom:14px;">
                  Menampilkan inputan semua orang. Kosongkan Bulan untuk melihat
                  satu tahun penuh.
                </p>

                <div class="form-grid" style="margin-bottom:12px;">
                  <div class="field"><label>Jenis</label>
                    <select x-model="rkJenis" @change="fetchRekap()">
                      <option value="">Semua jenis</option>
                      <option value="izin">Izin</option>
                      <option value="sakit">Sakit</option>
                      <option value="cuti">Cuti</option>
                      <option value="mangkir">Mangkir</option>
                    </select>
                  </div>
                  <div class="field"><label>Bulan</label>
                    <select x-model="rkBulan" @change="fetchRekap()">
                      <option value="">Semua bulan</option>
                      <template x-for="(nm, i) in BULAN_LABELS" :key="'rk-bl-'+i">
                        <option :value="String(i+1)" x-text="nm"></option>
                      </template>
                    </select>
                  </div>
                  <div class="field"><label>Tahun</label>
                    <select x-model.number="rkTahun" @change="fetchRekap()">
                      <template x-for="y in kwYearOptions" :key="'rk-th-'+y"><option :value="y" x-text="y"></option></template>
                    </select>
                  </div>
                  <div class="field"><label>Cari karyawan</label>
                    <input type="text" x-model="rkCari" placeholder="NIK atau nama">
                  </div>
                </div>

                <p class="hint" x-show="rkError" style="color:var(--danger, #DC2626); font-weight:600; margin-bottom:10px;" x-text="rkError"></p>

                <div class="form-actions" x-show="isLeaderOrAdmin()" style="margin-bottom:14px;">
                  <button type="button" class="btn-secondary" @click="rkHitungUlangNol()" :disabled="rkRecalcLoading">
                    <span x-text="rkRecalcLoading ? 'Menghitung ulang...' : 'Hitung Ulang Total Hari (yang 0)'"></span>
                  </button>
                  <span class="hint">Untuk baris Cuti lama yang Total Hari-nya masih 0 (mis. Ganti Hari baru ditambahkan belakangan). Hanya memproses baris sesuai filter di atas. Kalau setelah dijalankan masih ada yang 0 (ditandai merah), arahkan mouse ke angkanya untuk lihat alasannya.</span>
                </div>

                <template x-if="rkLoading"><p class="empty-state">Memuat rekap...</p></template>

                <template x-if="!rkLoading">
                  <div class="table-wrap">
                    <table>
                      <thead><tr><th>Jenis</th><th>NIK</th><th>Nama</th><th>Tanggal</th><th>Sampai</th><th>Total Hari</th><th>Jenis Cuti</th><th>Keterangan</th><th>Diinput oleh</th><th>Aksi</th></tr></thead>
                      <tbody>
                        <template x-for="r in rekapRows()" :key="'rk-'+r.id">
                          <tr>
                            <td x-text="rkLabel(r.jenis)"></td>
                            <td class="mono" x-text="r.nik"></td>
                            <td x-text="r.nama"></td>
                            <td class="mono" x-text="r.tanggal"></td>
                            <td class="mono" x-text="r.tanggal_selesai || '-'"></td>
                            <td class="mono" :style="r.jenis === 'cuti' && !r.jumlah_hari ? 'color: var(--danger, #DC2626); font-weight:600; cursor:help;' : ''"
                                :title="r.jenis === 'cuti' ? kenapaNolHari(r) : ''"
                                x-text="r.jenis === 'cuti' ? (r.jumlah_hari ?? 1) : '-'"></td>
                            <td x-text="r.jenis_cuti || '-'"></td>
                            <td x-text="r.keterangan || '-'"></td>
                            <td x-text="rkPenginput(r)"></td>
                            <td>
                              <button class="btn-secondary btn-sm" @click="editRekap(r)">Edit</button>
                              <button class="btn-secondary btn-sm" @click="hapusRekap(r)">Hapus</button>
                            </td>
                          </tr>
                        </template>
                        <tr x-show="rekapRows().length === 0"><td colspan="10" class="empty-state">Tidak ada data.</td></tr>
                      </tbody>
                    </table>
                  </div>
                </template>
              </div>

              <!-- Form ubah, muncul kalau ada baris yang sedang diedit -->
              <template x-if="rkEdit">
                <div class="panel">
                  <p class="panel-title">Ubah Data <span class="count" x-text="rkEdit.nama + ' (' + rkEdit.nik + ')'"></span></p>
                  <div class="form-grid">
                    <div class="field"><label>Jenis</label>
                      <select x-model="rkEdit.jenis">
                        <option value="izin">Izin</option>
                        <option value="sakit">Sakit</option>
                        <option value="cuti">Cuti</option>
                        <option value="mangkir">Mangkir</option>
                      </select>
                    </div>
                    <div class="field"><label x-text="rkEdit.jenis === 'cuti' ? 'Tanggal Mulai' : 'Tanggal'"></label>
                      <input type="date" x-model="rkEdit.tanggal">
                    </div>
                    <template x-if="rkEdit.jenis === 'cuti'">
                      <div class="field"><label>Tanggal Selesai</label>
                        <input type="date" x-model="rkEdit.tanggal_selesai" :min="rkEdit.tanggal">
                      </div>
                    </template>
                    <template x-if="rkEdit.jenis === 'cuti'">
                      <div class="field"><label>Total Hari</label>
                        <input type="number" min="0" step="1" x-model.number="rkEdit.jumlah_hari" placeholder="0">
                        <span class="hint">
                          Otomatis (Sabtu, Minggu, tanggal merah, ganti hari tidak dihitung): <b x-text="rkHitungHari() + ' hari'"></b>.
                          Kalau mau dihitung sesuai jumlah hari cuti sebenarnya (mis. tetap 1 hari walau jatuh Sabtu/tanggal merah), ubah angka di atas langsung, atau
                          <button type="button" class="btn-secondary btn-sm" @click="rkEdit.jumlah_hari = rkHitungHari()">Pakai Hitungan Otomatis</button>
                        </span>
                      </div>
                    </template>
                    <template x-if="rkEdit.jenis === 'cuti'">
                      <div class="field"><label>Jenis Cuti</label>
                        <select x-model="rkEdit.jenis_cuti">
                          <option value="">Pilih jenis cuti...</option>
                          <option value="Cuti Tahunan">Cuti Tahunan</option>
                          <option value="Cuti Khusus">Cuti Khusus</option>
                        </select>
                        <span class="hint" x-show="rkEdit.jenis_cuti === 'Cuti Tahunan'">Memotong jatah cuti tahunan</span>
                        <span class="hint" x-show="rkEdit.jenis_cuti === 'Cuti Khusus'">Tidak memotong jatah cuti</span>
                      </div>
                    </template>
                    <div class="field" style="grid-column: 1 / -1;"><label>Keterangan</label>
                      <input type="text" x-model="rkEdit.keterangan">
                    </div>
                  </div>
                  <div class="form-actions">
                    <button type="button" class="btn-primary" @click="simpanRekap()" :disabled="rkSaving"
                            x-text="rkSaving ? 'Menyimpan...' : 'Simpan Perubahan'"></button>
                    <button type="button" class="btn-secondary" @click="rkEdit = null" :disabled="rkSaving">Batal</button>
                  </div>
                </div>
              </template>
            </div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </main>
</div>
<script>

function baseInputPage() {
  return {
    session: null, profile: null, mobileNavOpen: false, sidebarCollapsed: true,
    theme: localStorage.getItem("theme_v1") || "light",
    msg: "", msgError: false,
        isAdmin() { return this.profile?.role === "admin"; },

    isLeaderOrAdmin() { if (!this.profile) return false; const r = (this.profile.role||"").toLowerCase(); const j = (this.profile.jabatan||"").toLowerCase(); return ["admin","leader"].includes(r) || ["admin","leader"].includes(j); },
    flash(m, isErr) {
      this.msg = m; this.msgError = !!isErr;
      setTimeout(() => { this.msg = ""; }, 4000);
    },
    async initBase() {
      this.session = await requireAuth();
      if (!this.session) return false;
      if (!await requireStaff(this.session)) return false;
      const { data } = await supabaseClient.from("profiles").select("*").eq("id", this.session.user.id).maybeSingle();
      this.profile = data;
      return true;
    },
    logout,
  };
}
function fmtNum(n) {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return "-";
  return Number(n).toLocaleString("en-US", { maximumFractionDigits: 1 });
}
// toISOString().slice(0,10) mengonversi ke UTC dulu -- WIB = UTC+7, jadi
// tengah malam lokal bisa terpotong mundur 1 hari. Ambil Y/M/D lokal saja.
function localDateStr(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// Grid kosong buat tab Productivity: 6 kolom tabel x tanggal 1-31, semua "".
// Dibuat penuh sejak awal (tidak ditambah saat diketik) supaya Alpine tidak
// kehilangan reaktivitas di sel yang belum pernah diisi.
const PV_COLS = [
  "earned_massprod", "earned_semi_massprod", "earned_non_massprod",
  "operation_massprod", "operation_semi_massprod", "operation_non_massprod",
];
function pvBlankGrid() {
  const g = {};
  for (const c of PV_COLS) {
    g[c] = {};
    for (let d = 1; d <= 31; d++) g[c][d] = "";
  }
  return g;
}

function masterDataPage() {
  return {
    ...baseInputPage(),
    fmtNum,
    // Tombol kategori Master Data -- baru ada "attendance" untuk
    // sekarang, tapi ditulis sebagai activeTab supaya gampang nambah
    // kategori Master Data lain nanti tanpa ubah struktur.
    activeTab: "attendance",
    setTab(tab) {
      this.activeTab = tab;
      // Data Productivity baru ditarik saat tabnya dibuka (bukan di init())
      // supaya halaman Master Data tidak jadi lebih lambat waktu pertama load.
      if (tab === "productivity" && this.pvLoadedKey !== this.pvYear + "-" + this.pvMonth) this.fetchProductivity();
      if (tab === "productivity" && !this.kwLoaded) { this.kwLoaded = true; this.fetchKoefisien(); this.fetchTarget(); }
      if (tab === "cuti" && !this.ctLoaded) { this.ctLoaded = true; this.fetchCuti(); }
    },
    // Sub-tombol di dalam tab Attendance: "mp" | "overtime" | "shift2" | "libur" | "ganti"
    atSub: "mp",
    // ---- Total Orang (Bulanan) ----
    // Dropdown Bulan pakai label yang sama dengan dashboard (BULAN_LABELS).
    BULAN_LABELS: ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"],
    mpForm: { bulan: new Date().getMonth() + 1, tahun: new Date().getFullYear(), total_orang: 46 },
    mpRows: [],
    // ---- Form Overtime Harian ----
    otForm: { tanggal: localDateStr(new Date()), overtime_jam: "" },
    otRows: [],
    // ---- Form Kehadiran Shift Mingguan ----
    shiftForm: { tanggal_mulai: localDateStr(new Date()), tanggal_selesai: localDateStr(new Date()), shift1_hadir: "", shift2_hadir: "", keterangan: "" },
    shiftRows: [],
    shiftEditId: null,
    // ---- Kelola Hari Libur / Tanggal Merah ----
    hariLiburRows: [], // { tanggal, keterangan } buat ditampilkan di tabel
    hariLiburForm: { tanggal: localDateStr(new Date()), keterangan: "" },
    // ---- Ganti Hari (masuk kerja pengganti) ----
    // Satu tabel dengan hari libur (hari_libur), dibedakan kolom `jenis`.
    gantiHariRows: [],
    gantiHariForm: { tanggal: localDateStr(new Date()), shift: "1", keterangan: "" },
    // ---- Absensi (grid harian 1-31, auto dari Cuti/Izin/Sakit/Mangkir +
    // Hari Libur/Ganti Hari, tapi bisa ditimpa manual per sel) ----
    absensiBulan: new Date().getMonth() + 1,
    absensiTahun: new Date().getFullYear(),
    absensiCari: "",
    absensiLoading: false,
    absensiLoadedKey: "",
    absensiKaryawan: [],   // { nik, nama, status_kerja }
    absensiLeave: [],      // baris attendance_leave yang bersinggungan dgn bulan ini
    absensiLibur: [],      // baris hari_libur (jenis libur & ganti_hari) bulan ini
    absensiManual: {},     // { "nik|tanggal": kode } -- override manual dari absensi_manual
    // ---- Riwayat Upload Shift 2 (dipakai untuk auto-isi Kehadiran Shift
    // Mingguan & menghitung ganti hari per orang; shift berubah tiap minggu
    // jadi disimpan per periode, bukan statis per NIK) ----
    karyawanList: [],         // { nik, nama } semua karyawan, buat validasi upload & template
    totalKaryawan: 0,
    shift2Periodes: [],       // { id, tanggal_mulai, tanggal_selesai, details:[{nik,nama}], nikSet:Set }
    shift2UploadForm: { tanggal_mulai: localDateStr(new Date()), tanggal_selesai: localDateStr(new Date()) },
    shift2Uploading: false,
    shift2Msg: "",
    shift2DetailOpenId: null,
    shift2AutoFilled: false,
    // ---- Form Scrap Top End (Bulanan) ----
    scrapForm: { tahun: new Date().getFullYear(), bulan: String(new Date().getMonth() + 1), scrap_value_kidr: "", total_value_kidr: "", target_rasio: "" },
    scrapRows: [],
    // ---- Form Safety / Insiden ----
    safetyForm: { tanggal: localDateStr(new Date()), kategori: "ACCIDENT", keterangan: "" },
    safetyRows: [],
    // ---- Productivity Harian (manual, gabungan semua line) ----
    // 6 baris tetap, urutannya mengikuti laporan Excel "Daily Peff".
    // `key` = nama kolom di tabel productivity_manual.
    // `label` sengaja ditulis persis seperti di Excel (Earned pakai
    // "Massprod", Operation pakai "Masspro" -- memang beda di sana).
    PV_ROWS: [
      { grup: "Earned",    key: "earned_massprod",         label: "Massprod" },
      { grup: "Earned",    key: "earned_semi_massprod",    label: "Semi massprod" },
      { grup: "Earned",    key: "earned_non_massprod",     label: "Non massprod" },
      { grup: "Operation", key: "operation_massprod",      label: "Masspro" },
      { grup: "Operation", key: "operation_semi_massprod", label: "Semi masspro" },
      { grup: "Operation", key: "operation_non_massprod",  label: "Non masspro" },
    ],
    pvMonth: new Date().getMonth() + 1,
    pvYear: new Date().getFullYear(),
    // pvGrid[nama_kolom][tanggal] = string (dibiarkan string supaya "" bisa
    // dibedakan dari 0, dan supaya user bisa ngetik koma desimal).
    // Selalu dibuat penuh 1-31 di awal (bukan ditambah saat diketik) supaya
    // reaktivitas Alpine tidak meleset di sel yang belum pernah disentuh.
    pvGrid: pvBlankGrid(),
    pvLoading: false,
    // Sel yang lagi diklik ("namakolom-tanggal"). Sel yang sedang diklik
    // menampilkan angka PENUH supaya bisa diedit; sel lain ditampilkan
    // ringkas 2 desimal biar muat di kolom. Yang disimpan selalu yang penuh.
    pvFocusKey: "",
    pvSaving: false,
    pvLoadedKey: "",   // "YYYY-M" bulan yang sedang termuat, biar tidak refetch percuma
    // ---- Koefisien (per tahun, manual) ----
    // kwValue disimpan sebagai STRING supaya angka panjang seperti
    // 0,441702442879684 tidak berubah gara-gara dibolak-balik ke Number
    // waktu diketik. Konversi ke angka cuma dilakukan pas mau disimpan.
    kwYear: new Date().getFullYear(),
    kwValue: "",
    kwRows: [],
    kwSaving: false,
    kwLoaded: false,
    kwError: "",
    // ---- Target Productivity Bulanan ----
    tgMonth: new Date().getMonth() + 1,
    tgYear: new Date().getFullYear(),
    tgValue: "",
    tgRows: [],
    tgSaving: false,
    tgError: "",
    // Pilihan Tahun buat dropdown Total Orang (Bulanan) -- 2 tahun ke
    // belakang s/d 1 tahun ke depan, cukup buat kebutuhan input.
    get tahunOptions() {
      const y = new Date().getFullYear();
      return [y - 2, y - 1, y, y + 1];
    },
    async init() {
      if (!await this.initBase()) return;
      await this.fetchMp();
      await this.fetchOt();
      await this.fetchShiftRows();
      await this.fetchHariLibur();
      await this.fetchKaryawanList();
      await this.fetchShift2Periodes();
      await this.fetchScrapRows();
      await this.fetchSafetyRows();
    },
    // ---- Total Orang (Bulanan) ----
    // Ditampilkan sebagai "Riwayat Total Orang" -- hanya baris yang
    // tanggalnya persis tanggal 1 (hasil input dari form Bulanan ini).
    // Baris lain (hasil input Overtime Harian di tanggal lain) tidak
    // ikut nongol di sini, biar nggak ketuker.
    async fetchMp() {
      const { data, error } = await supabaseClient.from("attendance_log").select("*").order("tanggal", { ascending: false }).limit(100);
      if (!error && data) this.mpRows = data.filter((r) => r.tanggal && r.tanggal.endsWith("-01"));
    },
    fmtBulanTahun(tanggal) {
      const [y, m] = tanggal.split("-");
      return `${this.BULAN_LABELS[Number(m) - 1]} ${y}`;
    },
    editMp(r) {
      const [y, m] = r.tanggal.split("-");
      this.mpForm = { bulan: Number(m), tahun: Number(y), total_orang: r.total_orang };
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    // Simpan Total Orang untuk 1 bulan penuh -- disimpan di baris
    // tanggal=1 bulan itu, lalu ikut carry-forward ke semua tanggal di
    // bulan tsb (lihat totalCarryOn() di dashboard-exhaust.html).
    // Overtime yang sudah ada di tanggal 1 itu (kalau ada) TIDAK ditimpa.
    async saveMp() {
      const f = this.mpForm;
      if (!f.bulan || !f.tahun || f.total_orang === "" || f.total_orang === null) { this.flash("Bulan, Tahun, dan Total Orang wajib diisi.", true); return; }
      const tanggal = `${f.tahun}-${String(f.bulan).padStart(2, "0")}-01`;
      const { data: existing } = await supabaseClient.from("attendance_log").select("overtime_jam").eq("tanggal", tanggal).maybeSingle();
      const payload = {
        tanggal,
        total_orang: Number(f.total_orang) || 0,
        overtime_jam: existing ? existing.overtime_jam : 0,
        updated_by: this.session.user.id,
      };
      const { error } = await supabaseClient.from("attendance_log").upsert(payload, { onConflict: "tanggal" });
      if (error) { this.flash("Gagal simpan: " + error.message, true); return; }
      this.flash(`Total Orang bulan ${this.fmtBulanTahun(tanggal)} tersimpan.`);
      await this.fetchMp();
    },
    // ---- Overtime Harian ----
    async fetchOt() {
      const { data, error } = await supabaseClient.from("attendance_log").select("*").order("tanggal", { ascending: false }).limit(100);
      if (!error && data) this.otRows = data;
    },
    editOt(r) {
      this.otForm = { tanggal: r.tanggal, overtime_jam: r.overtime_jam };
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    // Simpan OT di 1 tanggal spesifik -- TIDAK menimpa Total Orang yang
    // sudah tersimpan di tanggal itu (kalau ada baris sebelumnya).
    async saveOt() {
      const f = this.otForm;
      if (!f.tanggal) { this.flash("Tanggal wajib diisi.", true); return; }
      const { data: existing } = await supabaseClient.from("attendance_log").select("total_orang").eq("tanggal", f.tanggal).maybeSingle();
      const payload = {
        tanggal: f.tanggal,
        overtime_jam: Number(f.overtime_jam) || 0,
        total_orang: existing ? existing.total_orang : 0,
        updated_by: this.session.user.id,
      };
      const { error } = await supabaseClient.from("attendance_log").upsert(payload, { onConflict: "tanggal" });
      if (error) { this.flash("Gagal simpan: " + error.message, true); return; }
      this.flash("Overtime tersimpan.");
      await this.fetchOt();
      await this.fetchMp();
    },
    // ---- Kehadiran Shift Mingguan ----
    async fetchShiftRows() {
      const { data, error } = await supabaseClient.from("attendance_shift_weekly").select("*").order("tanggal_mulai", { ascending: false }).limit(100);
      if (!error && data) this.shiftRows = data;
    },
    resetShiftForm() {
      this.shiftForm = { tanggal_mulai: localDateStr(new Date()), tanggal_selesai: localDateStr(new Date()), shift1_hadir: "", shift2_hadir: "", keterangan: "" };
      this.shiftEditId = null;
    },
    editShift(r) {
      this.shiftForm = { tanggal_mulai: r.tanggal_mulai, tanggal_selesai: r.tanggal_selesai, shift1_hadir: r.shift1_hadir, shift2_hadir: r.shift2_hadir, keterangan: r.keterangan || "" };
      this.shiftEditId = r.id;
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    async saveShift() {
      const f = this.shiftForm;
      if (!f.tanggal_mulai || !f.tanggal_selesai) { this.flash("Tanggal Mulai dan Tanggal Selesai wajib diisi.", true); return; }
      if (f.tanggal_selesai < f.tanggal_mulai) { this.flash("Tanggal Selesai tidak boleh sebelum Tanggal Mulai.", true); return; }
      const payload = {
        tanggal_mulai: f.tanggal_mulai,
        tanggal_selesai: f.tanggal_selesai,
        shift1_hadir: Number(f.shift1_hadir) || 0,
        shift2_hadir: Number(f.shift2_hadir) || 0,
        keterangan: f.keterangan || null,
        updated_by: this.session.user.id,
      };
      let error;
      if (this.shiftEditId) {
        ({ error } = await supabaseClient.from("attendance_shift_weekly").update(payload).eq("id", this.shiftEditId));
      } else {
        ({ error } = await supabaseClient.from("attendance_shift_weekly").insert({ ...payload, created_by: this.session.user.id }));
      }
      if (error) { this.flash("Gagal simpan: " + error.message, true); return; }
      this.flash("Kehadiran Shift tersimpan.");
      this.resetShiftForm();
      await this.fetchShiftRows();
    },
    // Isi Hadir Shift 1/2 otomatis kalau Tanggal Mulai-Selesai di form ini
    // persis sama dengan salah satu periode Shift 2 yang sudah diupload
    // (panel Riwayat Upload Shift 2 di bawah). Shift 2 = jumlah orang di
    // periode itu; Shift 1 = total karyawan dikurangi jumlah Shift 2
    // (semua karyawan diasumsikan pasti Shift 1 atau Shift 2). Tetap bisa
    // diedit manual sesudahnya.
    autoFillShift() {
      const f = this.shiftForm;
      this.shift2AutoFilled = false;
      if (!f.tanggal_mulai || !f.tanggal_selesai) return;
      const match = this.shift2Periodes.find(
        (p) => p.tanggal_mulai === f.tanggal_mulai && p.tanggal_selesai === f.tanggal_selesai
      );
      if (!match) return;
      const shift2 = match.details.length;
      this.shiftForm.shift2_hadir = shift2;
      this.shiftForm.shift1_hadir = Math.max(0, this.totalKaryawan - shift2);
      this.shift2AutoFilled = true;
    },
    async deleteShift(r) {
      if (!confirm(`Hapus data Shift ${r.tanggal_mulai} - ${r.tanggal_selesai}?`)) return;
      const { error } = await supabaseClient.from("attendance_shift_weekly").delete().eq("id", r.id);
      if (error) { this.flash("Gagal hapus: " + error.message, true); return; }
      this.flash("Data Shift dihapus.");
      await this.fetchShiftRows();
    },
    // ---- Kelola Hari Libur / Tanggal Merah ----
    async fetchHariLibur() {
      const { data, error } = await supabaseClient.from("hari_libur").select("*").order("tanggal", { ascending: true });
      if (!error && data) {
        // Satu tabel, dua daftar: jenis 'ganti_hari' tampil di panel Ganti Hari,
        // sisanya (termasuk baris lama tanpa jenis) tampil sebagai hari libur.
        this.hariLiburRows = data.filter((r) => r.jenis !== "ganti_hari");
        this.gantiHariRows = data.filter((r) => r.jenis === "ganti_hari");
      }
    },
    async addHariLibur() {
      const f = this.hariLiburForm;
      if (!f.tanggal) { this.flash("Tanggal wajib diisi.", true); return; }
      const bentrok = this.gantiHariRows.find((r) => r.tanggal === f.tanggal);
      if (bentrok && !confirm(`Tanggal ${f.tanggal} sudah tercatat sebagai Ganti Hari. Ubah jadi hari libur?`)) return;
      const { error } = await supabaseClient.from("hari_libur").upsert(
        { tanggal: f.tanggal, keterangan: f.keterangan || null, jenis: "libur", created_by: this.session.user.id },
        { onConflict: "tanggal" }
      );
      if (error) { this.flash("Gagal simpan hari libur: " + error.message, true); return; }
      this.flash("Hari libur tersimpan.");
      this.hariLiburForm = { tanggal: localDateStr(new Date()), keterangan: "" };
      await this.fetchHariLibur();
    },
    // ---- Ganti Hari ----
    // "Senin".."Minggu" untuk tanggal "YYYY-MM-DD" (dibaca sebagai tanggal lokal).
    namaHari(tanggal) {
      if (!tanggal) return "-";
      return ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"][new Date(tanggal + "T00:00:00").getDay()];
    },
    async addGantiHari() {
      const f = this.gantiHariForm;
      if (!f.tanggal) { this.flash("Tanggal wajib diisi.", true); return; }
      const bentrok = this.hariLiburRows.find((r) => r.tanggal === f.tanggal);
      if (bentrok && !confirm(`Tanggal ${f.tanggal} sudah tercatat sebagai hari libur${bentrok.keterangan ? " (" + bentrok.keterangan + ")" : ""}. Ubah jadi Ganti Hari?`)) return;
      const { error } = await supabaseClient.from("hari_libur").upsert(
        { tanggal: f.tanggal, keterangan: f.keterangan || null, jenis: "ganti_hari", shift: f.shift || "1", created_by: this.session.user.id },
        { onConflict: "tanggal" }
      );
      if (error) { this.flash("Gagal simpan ganti hari: " + error.message, true); return; }
      this.flash("Ganti hari tersimpan.");
      this.gantiHariForm = { tanggal: localDateStr(new Date()), shift: "1", keterangan: "" };
      await this.fetchHariLibur();
    },
    async deleteGantiHari(r) {
      if (!confirm(`Hapus ganti hari ${r.tanggal}${r.keterangan ? " (" + r.keterangan + ")" : ""}?`)) return;
      const { error } = await supabaseClient.from("hari_libur").delete().eq("tanggal", r.tanggal);
      if (error) { this.flash("Gagal hapus: " + error.message, true); return; }
      this.flash("Ganti hari dihapus.");
      await this.fetchHariLibur();
    },
    // ================= Absensi (grid harian) =================
    fetchAbsensiIfNeeded() {
      const key = this.absensiBulan + "-" + this.absensiTahun;
      if (this.absensiLoadedKey !== key) this.fetchAbsensi();
    },
    absensiHariList() {
      const n = new Date(this.absensiTahun, this.absensiBulan, 0).getDate();
      return Array.from({ length: n }, (_, i) => i + 1);
    },
    absensiTanggal(hari) {
      return this.absensiTahun + "-" + String(this.absensiBulan).padStart(2, "0") + "-" + String(hari).padStart(2, "0");
    },
    async fetchAbsensi() {
      this.absensiLoading = true;
      try {
        const bln = this.absensiBulan, thn = this.absensiTahun;
        const awal = thn + "-" + String(bln).padStart(2, "0") + "-01";
        const akhir = this.absensiTanggal(new Date(thn, bln, 0).getDate());

        const [karRes, leaveRes, liburRes, manualRes] = await Promise.all([
          supabaseClient.from("karyawan_master").select("nik,nama,status_kerja").not("status_kerja", "is", null).order("nama"),
          // Ambil baris cuti (bisa lintas tanggal via tanggal_selesai) DAN
          // baris izin/sakit/mangkir (satu hari, tanggal_selesai kosong)
          // yang bersinggungan dengan bulan ini.
          supabaseClient.from("attendance_leave").select("nik,jenis,tanggal,tanggal_selesai")
            .lte("tanggal", akhir)
            .or(`and(tanggal_selesai.is.null,tanggal.gte.${awal}),tanggal_selesai.gte.${awal}`),
          supabaseClient.from("hari_libur").select("tanggal,jenis,shift").gte("tanggal", awal).lte("tanggal", akhir),
          supabaseClient.from("absensi_manual").select("nik,tanggal,kode").gte("tanggal", awal).lte("tanggal", akhir),
        ]);

        if (karRes.error) { this.flash("Gagal memuat karyawan: " + karRes.error.message, true); return; }
        if (leaveRes.error) { this.flash("Gagal memuat data cuti/izin: " + leaveRes.error.message, true); return; }
        if (liburRes.error) { this.flash("Gagal memuat hari libur: " + liburRes.error.message, true); return; }
        if (manualRes.error) {
          this.flash("Gagal memuat absensi manual: " + manualRes.error.message
            + (String(manualRes.error.message).toLowerCase().includes("absensi_manual")
                ? " — tabel absensi_manual belum ada. Jalankan migration_absensi.sql di Supabase SQL Editor."
                : ""), true);
          return;
        }

        this.absensiKaryawan = karRes.data || [];
        this.absensiLeave = leaveRes.data || [];
        this.absensiLibur = liburRes.data || [];
        const man = {};
        (manualRes.data || []).forEach((r) => { man[r.nik + "|" + r.tanggal] = r.kode; });
        this.absensiManual = man;
        this.absensiLoadedKey = bln + "-" + thn;
      } finally {
        this.absensiLoading = false;
      }
    },
    absensiRows() {
      const cari = (this.absensiCari || "").trim().toLowerCase();
      return this.absensiKaryawan.filter((k) =>
        !cari || String(k.nik).toLowerCase().includes(cari) || String(k.nama || "").toLowerCase().includes(cari));
    },
    // Hitungan otomatis satu sel -- persis logika yang sama dipakai trigger
    // set_jumlah_hari_cuti() / kenapaNolHari(): Minggu selalu libur, Sabtu
    // libur kecuali Ganti Hari yang cocok shift, tanggal merah libur,
    // Senin-Jumat kerja. Cuti/Izin/Sakit/Mangkir menang dari semua itu.
    absensiKodeAuto(nik, ds) {
      const leave = this.absensiLeave.find((r) => {
        if (r.nik !== nik) return false;
        if (r.jenis === "cuti") {
          const sampai = r.tanggal_selesai || r.tanggal;
          return ds >= r.tanggal && ds <= sampai;
        }
        return r.tanggal === ds;
      });
      if (leave) {
        if (leave.jenis === "cuti") return "C";
        if (leave.jenis === "izin") return "I";
        if (leave.jenis === "sakit") return "S";
        if (leave.jenis === "mangkir") return "A";
      }
      const lib = this.absensiLibur.find((r) => r.tanggal === ds);
      const dow = new Date(ds + "T00:00:00").getDay();
      if (dow === 0) return "L";
      if (dow === 6) {
        if (lib && lib.jenis === "ganti_hari" && (lib.shift === "penuh" || lib.shift === this.shiftPadaTanggal(nik, ds))) return "";
        return "L";
      }
      if (lib && lib.jenis === "libur") return "L";
      return "";
    },
    absensiKode(nik, hari) {
      const ds = this.absensiTanggal(hari);
      const key = nik + "|" + ds;
      if (Object.prototype.hasOwnProperty.call(this.absensiManual, key)) return this.absensiManual[key];
      return this.absensiKodeAuto(nik, ds);
    },
    absensiWarna(kode) {
      const map = {
        C: "background:#EFF6FF; color:#1D4ED8;",
        I: "background:#FFF7ED; color:#C2410C;",
        S: "background:#FAF5FF; color:#7E22CE;",
        A: "background:#FEF2F2; color:#DC2626;",
        L: "background:#F1F5F9; color:#64748B;",
      };
      return map[kode] || "";
    },
    // Ketik & pindah fokus (blur/Enter) -> simpan. Dikosongkan -> override
    // dihapus, sel balik ikut hitungan otomatis lagi.
