    async absensiSetKode(nik, hari, val) {
      const ds = this.absensiTanggal(hari);
      const kode = (val || "").trim().toUpperCase();
      const key = nik + "|" + ds;
      if (!kode) {
        if (Object.prototype.hasOwnProperty.call(this.absensiManual, key)) {
          const salinan = { ...this.absensiManual };
          delete salinan[key];
          this.absensiManual = salinan;
          const { error } = await supabaseClient.from("absensi_manual").delete().eq("nik", nik).eq("tanggal", ds);
          if (error) this.flash("Gagal reset ke otomatis: " + error.message, true);
        }
        return;
      }
      this.absensiManual = { ...this.absensiManual, [key]: kode };
      const { error } = await supabaseClient.from("absensi_manual")
        .upsert({ nik, tanggal: ds, kode }, { onConflict: "nik,tanggal" });
      if (error) this.flash("Gagal simpan absensi: " + error.message, true);
    },
    async absensiSetStatus(nik, val) {
      const k = this.absensiKaryawan.find((x) => x.nik === nik);
      if (k) k.status_kerja = val || null;
      const { error } = await supabaseClient.from("karyawan_master").update({ status_kerja: val || null }).eq("nik", nik);
      if (error) this.flash("Gagal simpan status: " + error.message, true);
    },
    // ---- Baris ringkasan di bawah grid (HADIR/CUTI/SAKIT/IZIN/ALFA/
    // TOTAL MP/RASIO KEHADIRAN) -- dihitung dari kode yang lagi tampil
    // di absensiRows(), bukan query terpisah, supaya selalu sinkron. ----
    absensiHitung(hari, kode) {
      return this.absensiRows().reduce((n, r) => n + (this.absensiKode(r.nik, hari) === kode ? 1 : 0), 0);
    },
    // Total MP hari itu = semua orang yang BUKAN Libur (L) -- Hadir +
    // Cuti + Sakit + Izin + Alfa. Hari Minggu/tanggal merah biasanya
    // jadi 0 karena semua orang kodenya L.
    absensiTotalMp(hari) {
      return this.absensiRows().reduce((n, r) => n + (this.absensiKode(r.nik, hari) !== "L" ? 1 : 0), 0);
    },
    absensiRasio(hari) {
      const mp = this.absensiTotalMp(hari);
      if (mp === 0) return "-";
      const hadir = this.absensiHitung(hari, "");
      return (hadir / mp * 100).toFixed(1).replace(".", ",") + "%";
    },
    // ---- Riwayat Upload Shift 2 ----
    // Shift 2 rotasi mingguan -- disimpan per PERIODE (shift2_periode +
    // shift2_periode_detail), bukan satu nilai tetap per NIK. Dipakai untuk
    // auto-isi form Kehadiran Shift Mingguan, dan (lewat trigger database,
    // migration_shift2_periode.sql) untuk menentukan shift orang pada
    // hitungan Ganti Hari -- lihat rkHitungHari() di bawah.
    async fetchKaryawanList() {
      const { data } = await supabaseClient.from("karyawan_master").select("nik,nama").order("nama");
      this.karyawanList = data || [];
      this.totalKaryawan = this.karyawanList.length;
    },
    async fetchShift2Periodes() {
      const [pRes, dRes] = await Promise.all([
        supabaseClient.from("shift2_periode").select("id,tanggal_mulai,tanggal_selesai,created_at").order("tanggal_mulai", { ascending: false }).limit(60),
        supabaseClient.from("shift2_periode_detail").select("periode_id,nik,nama"),
      ]);
      const periode = pRes.data || [];
      const detail = dRes.data || [];
      this.shift2Periodes = periode.map((p) => {
        const details = detail.filter((d) => d.periode_id === p.id).sort((a, b) => (a.nama || "").localeCompare(b.nama || ""));
        return { ...p, details, nikSet: new Set(details.map((d) => d.nik)) };
      });
    },
    // Shift NIK X pada tanggal Y ("1"/"2"/null) -- HARUS SAMA PERSIS dengan
    // public.shift_pada_tanggal() di migration_shift2_periode.sql, karena
    // dipakai buat preview hitungan sebelum benar-benar tersimpan.
    shiftPadaTanggal(nik, tanggalStr) {
      const cocok = this.shift2Periodes.filter((p) => tanggalStr >= p.tanggal_mulai && tanggalStr <= p.tanggal_selesai);
      if (cocok.length === 0) return null;
      cocok.sort((a, b) => (a.tanggal_mulai < b.tanggal_mulai ? 1 : -1));   // periode terbaru dulu
      return cocok[0].nikSet.has(nik) ? "2" : "1";
    },
    // File Excel: kolom NIK, NAMA saja -- daftar orang Shift 2 di satu periode.
    _shift2SheetFromRows(rows) {
      const data = [["NIK", "NAMA"], ...rows.map((r) => [r.nik, r.nama])];
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws["!cols"] = [{ wch: 12 }, { wch: 28 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Shift2");
      return wb;
    },
    downloadShift2Template() {
      // Template = semua karyawan (NIK, NAMA); tinggal hapus baris yang
      // BUKAN Shift 2 minggu itu, sisakan yang Shift 2, lalu upload.
      const wb = this._shift2SheetFromRows(this.karyawanList);
      XLSX.writeFile(wb, "template_shift2.xlsx");
    },
    exportShift2Periode(p) {
      const wb = this._shift2SheetFromRows(p.details);
      XLSX.writeFile(wb, `shift2_${p.tanggal_mulai}_${p.tanggal_selesai}.xlsx`);
    },
    toggleShift2Detail(p) {
      this.shift2DetailOpenId = this.shift2DetailOpenId === p.id ? null : p.id;
    },
    async deleteShift2Periode(p) {
      if (!confirm(`Hapus data Shift 2 periode ${p.tanggal_mulai} - ${p.tanggal_selesai} (${p.details.length} orang)?`)) return;
      const { error } = await supabaseClient.from("shift2_periode").delete().eq("id", p.id);
      if (error) { this.flash("Gagal hapus: " + error.message, true); return; }
      this.flash("Data Shift 2 dihapus.");
      if (this.shift2DetailOpenId === p.id) this.shift2DetailOpenId = null;
      await this.fetchShift2Periodes();
    },
    async handleShift2Upload(evt) {
      const file = evt.target.files[0];
      evt.target.value = "";   // biar bisa upload file yang sama lagi kalau perlu
      if (!file) return;
      const f = this.shift2UploadForm;
      if (!f.tanggal_mulai || !f.tanggal_selesai) { this.shift2Msg = "Isi Tanggal Mulai dan Tanggal Selesai dulu sebelum upload."; return; }
      if (f.tanggal_selesai < f.tanggal_mulai) { this.shift2Msg = "Tanggal Selesai tidak boleh sebelum Tanggal Mulai."; return; }
      this.shift2Uploading = true;
      this.shift2Msg = "";
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
        // Header diterima fleksibel: NIK/nik, NAMA/nama
        const karyawanMap = {};
        this.karyawanList.forEach((k) => { karyawanMap[String(k.nik)] = k.nama; });
        const seen = new Set();
        const details = [];
        const nikTakDikenal = [];
        for (const row of rows) {
          const nik = String(row.NIK ?? row.nik ?? row.Nik ?? "").trim();
          if (!nik) continue;   // baris kosong dilewati, tidak dianggap error
          if (seen.has(nik)) continue;   // duplikat di file, dilewati diam-diam
          seen.add(nik);
          if (!karyawanMap[nik]) { nikTakDikenal.push(nik); continue; }
          const namaFile = String(row.NAMA ?? row.nama ?? row.Nama ?? "").trim();
          details.push({ nik, nama: namaFile || karyawanMap[nik] });
        }
        if (details.length === 0) {
          this.shift2Msg = "Tidak ada NIK valid untuk disimpan. Cek lagi kolom NIK di file.";
          return;
        }
        // Upload ulang dengan tanggal persis sama = menimpa periode lama itu
        const existing = this.shift2Periodes.find((p) => p.tanggal_mulai === f.tanggal_mulai && p.tanggal_selesai === f.tanggal_selesai);
        if (existing) {
          const { error: delErr } = await supabaseClient.from("shift2_periode").delete().eq("id", existing.id);
          if (delErr) { this.shift2Msg = "Gagal menimpa data lama: " + delErr.message; return; }
        }
        const { data: periodeRow, error: perr } = await supabaseClient
          .from("shift2_periode")
          .insert({ tanggal_mulai: f.tanggal_mulai, tanggal_selesai: f.tanggal_selesai, uploaded_by: this.session.user.id })
          .select()
          .single();
        if (perr) { this.shift2Msg = "Gagal menyimpan periode: " + perr.message; return; }
        const insertRows = details.map((d) => ({ periode_id: periodeRow.id, nik: d.nik, nama: d.nama }));
        const { error: derr } = await supabaseClient.from("shift2_periode_detail").insert(insertRows);
        if (derr) { this.shift2Msg = "Gagal menyimpan daftar nama: " + derr.message; return; }
        let pesan = `${details.length} orang Shift 2 tersimpan untuk periode ${f.tanggal_mulai} - ${f.tanggal_selesai}${existing ? " (menimpa data lama periode ini)" : ""}.`;
        if (nikTakDikenal.length) pesan += ` ${nikTakDikenal.length} NIK tidak dikenal (dilewati): ${nikTakDikenal.slice(0, 5).join(", ")}${nikTakDikenal.length > 5 ? ", ..." : ""}.`;
        this.shift2Msg = pesan;
        this.flash("Data Shift 2 tersimpan.");
        await this.fetchShift2Periodes();
        this.autoFillShift();   // isi form Kehadiran Shift Mingguan kalau periodenya lagi sama
      } catch (e) {
        this.shift2Msg = "Gagal membaca file: " + e.message;
      } finally {
        this.shift2Uploading = false;
      }
    },
    async deleteHariLibur(r) {
      if (!confirm(`Hapus hari libur ${r.tanggal}${r.keterangan ? " (" + r.keterangan + ")" : ""}?`)) return;
      const { error } = await supabaseClient.from("hari_libur").delete().eq("tanggal", r.tanggal);
      if (error) { this.flash("Gagal hapus: " + error.message, true); return; }
      this.flash("Hari libur dihapus.");
      await this.fetchHariLibur();
    },
    // =====================================================
    // Productivity Harian (manual, gabungan semua line)
    // =====================================================
    // Jumlah hari di bulan yang dipilih (28/29/30/31). Tanggal 0 di bulan
    // berikutnya = tanggal terakhir bulan ini.
    get pvDays() {
      const n = new Date(this.pvYear, this.pvMonth, 0).getDate();
      return Array.from({ length: n }, (_, i) => i + 1);
    },
    pvIsSunday(d) {
      return new Date(this.pvYear, this.pvMonth - 1, d).getDay() === 0;
    },
    // Bersihkan ketikan: cuma angka + 1 pemisah desimal. Koma dibiarkan
    // apa adanya saat mengetik (kebiasaan format Indonesia/Excel), baru
    // diubah jadi titik waktu disimpan.
    pvSanitize(v) {
      let s = String(v ?? "").replace(/[^0-9.,]/g, "");
      const firstSep = s.search(/[.,]/);
      if (firstSep !== -1) {
        s = s.slice(0, firstSep + 1) + s.slice(firstSep + 1).replace(/[.,]/g, "");
      }
      return s;
    },
    // "12,5" / "12.5" -> 12.5 ; "" atau tidak valid -> null (artinya kosong)
    pvNum(v) {
      const s = String(v ?? "").trim().replace(",", ".");
      if (s === "" || s === ".") return null;
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    },
    // Total 1 baris (kolom paling kanan) -- tampilan saja, tidak disimpan.
    pvRowTotal(key) {
      let sum = 0, ada = false;
      for (const d of this.pvDays) {
        const n = this.pvNum(this.pvGrid[key]?.[d]);
        if (n !== null) { sum += n; ada = true; }
      }
      // 2 desimal, mengikuti kolom Total di laporan Excel (mis. 7.442,47).
      // Tidak pakai fmtNum() karena fmtNum dibatasi 1 desimal.
      // Baris yang belum ada isinya dibiarkan kosong (bukan "-").
      return ada ? Number(sum.toFixed(2)).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "";
    },
    // Ubah 1 sel hasil copy dari Excel jadi angka yang dipakai grid.
    // Aturan pemisah (mengikuti format Excel Indonesia):
    //  - kalau ada KOMA  -> koma = desimal, titik = pemisah ribuan
    //      "7.442,47" -> "7442,47"
    //  - kalau TIDAK ada koma -> 1 titik = desimal, >1 titik = ribuan
    //      "207.25" -> "207,25"   |   "7.442" -> "7442"
    // Karakter lain (spasi, Rp, dll) dibuang.
    pvParsePasted(raw) {
      let s = String(raw ?? "").replace(/[^0-9.,]/g, "");
      if (!s) return "";
      if (s.includes(",")) {
        const i = s.lastIndexOf(",");
        const depan = s.slice(0, i).replace(/[.,]/g, "");
        const belakang = s.slice(i + 1).replace(/[.,]/g, "");
        return belakang ? depan + "," + belakang : depan;
      }
      const titik = s.split(".").length - 1;
      if (titik === 1) {
        const [depan, belakang] = s.split(".");
        return belakang ? depan + "," + belakang : depan;
      }
      return s.replace(/\./g, "");
    },
    // Excel menaruh 2 versi di clipboard saat copy:
    //   1. text/plain -> angka SEPERTI YANG TAMPIL di layar ("22,0")
    //   2. text/html  -> tiap sel bawa atribut x:num berisi ANGKA ASLINYA
    //                    (<td x:num="21.9931428571429">22,0</td>)
    // Fungsi ini baca versi HTML-nya dan ambil x:num kalau ada, supaya angka
    // yang masuk sama persis dengan isi sel Excel -- bukan versi bulatnya.
    // Balikannya array baris x kolom, atau null kalau HTML-nya bukan tabel.
    pvParseHtmlTable(html) {
      let doc;
      try { doc = new DOMParser().parseFromString(html, "text/html"); } catch (e) { return null; }
      const trs = doc.querySelectorAll("tr");
      if (!trs.length) return null;
      const matrix = [];
      trs.forEach((tr) => {
        const baris = [];
        tr.querySelectorAll("td, th").forEach((td) => {
          // x:num = angka asli dari Excel (selalu pakai titik sebagai desimal)
          const xnum = td.getAttribute("x:num");
          if (xnum !== null && xnum !== "" && Number.isFinite(Number(xnum))) {
            // Disimpan sebagai string; titik diubah koma biar seragam dengan
            // gaya ketik manual. Notasi ilmiah (1e-7) dibiarkan apa adanya.
            baris.push(xnum.includes("e") || xnum.includes("E") ? xnum : xnum.replace(".", ","));
          } else {
            baris.push(this.pvParsePasted(td.textContent));
          }
        });
        if (baris.length) matrix.push(baris);
      });
      return matrix.length ? matrix : null;
    },
    // Tempel blok dari Excel. Sel yang lagi diklik jadi titik kiri-atas,
    // sisanya diisi ke bawah (antar baris) & ke kanan (antar tanggal).
    pvPaste(ev, rowIdx, day) {
      if (!this.isLeaderOrAdmin()) return;
      const cd = ev.clipboardData || window.clipboardData;
      if (!cd) return;
      const html = cd.getData ? cd.getData("text/html") : "";
      const text = cd.getData ? cd.getData("text") : "";
      if (!html && !text) return;
      ev.preventDefault();

      // Utamakan versi HTML (bawa angka asli). Kalau tidak ada tabelnya
      // -- misal copy dari Notepad, atau Excel versi web yang tidak kirim
      // x:num -- jatuh balik ke teks biasa yang dipisah Tab & Enter.
      let matrix = html ? this.pvParseHtmlTable(html) : null;
      let dariExcel = !!matrix;
      if (!matrix) {
        const lines = String(text).replace(/\r\n?/g, "\n").split("\n");
        while (lines.length && lines[lines.length - 1].trim() === "") lines.pop();
        matrix = lines.map((line) => line.split("\t").map((c) => this.pvParsePasted(c)));
      }

      const days = this.pvDays;
      let terisi = 0;
      matrix.forEach((baris, ri) => {
        const row = this.PV_ROWS[rowIdx + ri];
        if (!row) return;  // blok lebih panjang dari 6 baris -> sisanya diabaikan
        baris.forEach((cell, ci) => {
          const d = day + ci;
          if (!days.includes(d)) return;  // lewat tanggal terakhir bulan ini -> abaikan
          this.pvGrid[row.key][d] = cell;
          terisi++;
        });
      });
      if (terisi) {
        this.flash(terisi + " sel terisi" + (dariExcel ? " (angka asli dari Excel)" : "") + ". Jangan lupa Simpan.");
      }
    },
    // Yang ditampilkan di sel. Sedang diklik -> angka penuh apa adanya.
    // Tidak diklik -> dibulatkan 2 desimal supaya muat di kolom 46px
    // (nilai di pvGrid TIDAK ikut berubah, cuma tampilannya).
    pvCellValue(key, d) {
      const raw = this.pvGrid[key]?.[d] ?? "";
      if (this.pvFocusKey === key + "-" + d) return raw;
      const n = this.pvNum(raw);
      if (n === null) return raw;
      return n.toFixed(2).replace(".", ",");
    },
    // ---- Blok & hapus banyak sel sekaligus ----
    // pvSelA = sel awal (tempat mulai klik), pvSelB = sel akhir (tempat
    // mouse berhenti / shift+klik). Yang terpilih = kotak di antara keduanya.
    pvSelA: null,
    pvSelB: null,
    pvDrag: false,
    pvSelStart(ri, d, ev) {
      if (!this.isLeaderOrAdmin()) return;
      if (ev.shiftKey && this.pvSelA) {
        // Shift+klik: perlebar blok dari sel awal ke sel yang diklik
        this.pvSelB = { r: ri, d };
        ev.preventDefault();
        return;
      }
      this.pvSelA = { r: ri, d };
      this.pvSelB = { r: ri, d };
      this.pvDrag = true;   // klik-tahan-geser buat blok beberapa sel
    },
    pvSelEnter(ri, d) {
      if (!this.pvDrag) return;
      if (this.pvSelB && this.pvSelB.r === ri && this.pvSelB.d === d) return;
      this.pvSelB = { r: ri, d };
      // Lepas fokus dari input supaya yang ke-blok tidak jadi seleksi teks
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    },
    pvSelEnd() { this.pvDrag = false; },
    pvSelClear() { this.pvSelA = null; this.pvSelB = null; this.pvDrag = false; },
    // Batas kotak terpilih -> { r1, r2, d1, d2 } atau null
    pvSelBox() {
      if (!this.pvSelA || !this.pvSelB) return null;
      return {
        r1: Math.min(this.pvSelA.r, this.pvSelB.r), r2: Math.max(this.pvSelA.r, this.pvSelB.r),
        d1: Math.min(this.pvSelA.d, this.pvSelB.d), d2: Math.max(this.pvSelA.d, this.pvSelB.d),
      };
    },
    pvSelHas(ri, d) {
      const b = this.pvSelBox();
      return !!b && ri >= b.r1 && ri <= b.r2 && d >= b.d1 && d <= b.d2;
    },
    pvSelCount() {
      const b = this.pvSelBox();
      return b ? (b.r2 - b.r1 + 1) * (b.d2 - b.d1 + 1) : 0;
    },
    // Delete/Backspace: kalau yang ke-blok lebih dari 1 sel, hapus semuanya.
    // Kalau cuma 1 sel, dibiarkan -- supaya edit biasa di dalam sel tetap normal.
    pvSelKey(ev) {
      if (this.activeTab !== "productivity") return;
      if (ev.key !== "Delete" && ev.key !== "Backspace") return;
      if (this.pvSelCount() < 2) return;
      ev.preventDefault();
      this.pvSelDelete();
    },
    pvSelDelete() {
      if (!this.isLeaderOrAdmin()) return;
      const b = this.pvSelBox();
      if (!b) return;
      const days = this.pvDays;
      let n = 0;
      for (let ri = b.r1; ri <= b.r2; ri++) {
        const row = this.PV_ROWS[ri];
        if (!row) continue;
        for (let d = b.d1; d <= b.d2; d++) {
          if (!days.includes(d)) continue;
          if (this.pvGrid[row.key][d] !== "") n++;
          this.pvGrid[row.key][d] = "";
        }
      }
      this.flash(n + " sel dikosongkan. Tekan Simpan supaya perubahannya tersimpan.");
    },
    // Kosongkan seluruh bulan yang sedang dibuka.
    pvClearMonth() {
      if (!this.isLeaderOrAdmin()) return;
      const nm = this.BULAN_LABELS[this.pvMonth - 1] + " " + this.pvYear;
      if (!window.confirm("Kosongkan SEMUA angka di " + nm + "?\n\nData di server baru benar-benar terhapus setelah kamu menekan Simpan.")) return;
      this.pvGrid = pvBlankGrid();
      this.pvSelClear();
      this.flash("Semua sel " + nm + " dikosongkan. Tekan Simpan untuk menghapusnya di server.");
    },
    // ---- 4 baris hasil hitung di bawah grid ----
    // Semua dihitung on-the-fly dari pvGrid, TIDAK ikut disimpan ke database
    // (yang disimpan cuma 6 baris angka mentahnya).
    PV_EARNED_KEYS: ["earned_massprod", "earned_semi_massprod", "earned_non_massprod"],
    PV_OP_KEYS: ["operation_massprod", "operation_semi_massprod", "operation_non_massprod"],
    // Jumlah beberapa baris di 1 tanggal. null = semua selnya kosong, biar
    // hari yang belum diisi tidak tampil sebagai 0.
    pvSumDay(keys, d) {
      let sum = 0, ada = false;
      for (const k of keys) {
        const n = this.pvNum(this.pvGrid[k]?.[d]);
        if (n !== null) { sum += n; ada = true; }
      }
      return ada ? sum : null;
    },
    pvSumMonth(keys) {
      let sum = 0, ada = false;
      for (const d of this.pvDays) {
        const n = this.pvSumDay(keys, d);
        if (n !== null) { sum += n; ada = true; }
      }
      return ada ? sum : null;
    },
    pvEarnedDay(d) { return this.pvSumDay(this.PV_EARNED_KEYS, d); },
    pvOperationDay(d) { return this.pvSumDay(this.PV_OP_KEYS, d); },
    pvEarnedMonth() { return this.pvSumMonth(this.PV_EARNED_KEYS); },
    pvOperationMonth() { return this.pvSumMonth(this.PV_OP_KEYS); },
    // Efficiency = Total Earned / Total Operation
    pvEffDay(d) {
      const e = this.pvEarnedDay(d), o = this.pvOperationDay(d);
      if (e === null || o === null || o === 0) return null;  // bagi 0 -> dikosongkan
      return e / o;
    },
    pvEffMonth() {
      const e = this.pvEarnedMonth(), o = this.pvOperationMonth();
      if (e === null || o === null || o === 0) return null;
      return e / o;
    },
    // Productivity = Efficiency / Koefisien (tahun yang dipilih di atas).
    // Koefisien dipakai angka PENUHnya, bukan versi bulat 3 desimal.
    pvProdDay(d) {
      const eff = this.pvEffDay(d);
      const k = this.pvNum(this.kwForYear(this.pvYear));
      if (eff === null || k === null || k === 0) return null;
      return eff / k;
    },
    pvProdMonth() {
      const eff = this.pvEffMonth();
      const k = this.pvNum(this.kwForYear(this.pvYear));
      if (eff === null || k === null || k === 0) return null;
      return eff / k;
    },
    // null -> sel dibiarkan kosong (bukan "-" atau "0")
    pvFmt(n, desimal) {
      if (n === null || n === undefined || !Number.isFinite(n)) return "";
      return n.toLocaleString("en-US", { minimumFractionDigits: desimal, maximumFractionDigits: desimal });
    },
    // Khusus Productivity: tampil sebagai persen 1 desimal (mis. 110,2%),
    // mengikuti format di laporan Excel. Yang dihitung tetap angka desimalnya.
    pvFmtPct(n) {
      if (n === null || n === undefined || !Number.isFinite(n)) return "";
      return (n * 100).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
    },
    async fetchProductivity() {
      this.pvLoading = true;
      this.pvGrid = pvBlankGrid();
      this.pvSelClear();
      try {
        const lastDay = new Date(this.pvYear, this.pvMonth, 0).getDate();
        const start = localDateStr(new Date(this.pvYear, this.pvMonth - 1, 1));
        const end = localDateStr(new Date(this.pvYear, this.pvMonth - 1, lastDay));
        const { data, error } = await supabaseClient.from("productivity_manual")
          .select("*").gte("tanggal", start).lte("tanggal", end).order("tanggal");
        if (error) { this.flash("Gagal memuat productivity: " + error.message, true); return; }
        for (const row of (data || [])) {
          // row.tanggal = "YYYY-MM-DD" -- ambil tanggalnya langsung dari
          // string, jangan lewat new Date() supaya tidak bergeser karena UTC.
          const d = Number(String(row.tanggal).slice(8, 10));
          if (!d || d < 1 || d > 31) continue;
          for (const c of PV_COLS) {
            this.pvGrid[c][d] = row[c] === null || row[c] === undefined ? "" : String(row[c]);
          }
        }
        this.pvLoadedKey = this.pvYear + "-" + this.pvMonth;
      } finally {
        this.pvLoading = false;
      }
    },
    async saveProductivity() {
      if (!this.isLeaderOrAdmin()) { this.flash("Hanya admin/leader yang bisa menyimpan.", true); return; }
      this.pvSaving = true;
      try {
        const payload = [];     // tanggal yang punya minimal 1 angka -> upsert
        const kosong = [];      // tanggal yang dikosongkan semua -> hapus barisnya
        for (const d of this.pvDays) {
          const tanggal = localDateStr(new Date(this.pvYear, this.pvMonth - 1, d));
          const row = { tanggal };
          let ada = false;
          for (const c of PV_COLS) {
            const n = this.pvNum(this.pvGrid[c][d]);
            row[c] = n;
            if (n !== null) ada = true;
          }
          if (ada) payload.push(row); else kosong.push(tanggal);
        }
        if (payload.length) {
          const { error } = await supabaseClient.from("productivity_manual")
            .upsert(payload, { onConflict: "tanggal" });
          if (error) { this.flash("Gagal simpan: " + error.message, true); return; }
        }
        // Baris yang semua selnya dikosongkan ikut dihapus, supaya data di
        // server tidak menyimpan baris sisa yang isinya null semua.
        if (kosong.length) {
          const { error } = await supabaseClient.from("productivity_manual")
            .delete().in("tanggal", kosong);
          if (error) { this.flash("Gagal hapus baris kosong: " + error.message, true); return; }
        }
        this.flash("Data productivity tersimpan (" + payload.length + " tanggal).");
        await this.fetchProductivity();
      } finally {
        this.pvSaving = false;
      }
    },

    // ---- Koefisien (per tahun) ----
    // Rentang tahun dibikin lebih lebar dari tahunOptions (yang cuma
    // 2 tahun ke belakang) karena koefisien lama masih sering dilihat.
    // Sengaja BUKAN getter: kalau getter, arraynya dibuat ulang tiap kali
    // dibaca, dan <select> yang isinya dari x-for bisa kehilangan nilai
    // terpilihnya -- ini bikin tahun yang dikirim saat simpan jadi kacau.
    kwYearOptions: (() => {
      const y = new Date().getFullYear();
      const out = [];
      for (let i = y + 1; i >= y - 5; i--) out.push(i);
      return out;
    })(),
    // Tampilan 3 angka di belakang koma. Nilai aslinya TIDAK diubah --
    // ini murni buat dilihat.
    kwDisplay(v) {
      const n = this.pvNum(v);
      if (n === null) return "-";
      return n.toLocaleString("en-US", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
    },
    // Koefisien buat tahun tertentu, diambil dari kwRows yang sudah dimuat.
    // Dipakai juga oleh kolom Koefisien di atas grid Productivity.
    kwForYear(tahun) {
      const row = this.kwRows.find((r) => Number(r.tahun) === Number(tahun));
      return row ? row.nilai : null;
    },
    async fetchKoefisien() {
      const { data, error } = await supabaseClient.from("koefisien_kawat")
        .select("*").order("tahun", { ascending: false });
      if (error) {
        // Ditampilkan menetap di panel (bukan cuma flash 4 detik) supaya
        // penyebabnya kebaca -- paling sering: migration_productivity_manual.sql
        // belum dijalankan ulang, jadi tabel koefisien_kawat belum ada.
        this.kwError = "Gagal memuat koefisien: " + error.message
          + (String(error.message).toLowerCase().includes("koefisien_kawat")
              ? " — sepertinya tabel koefisien_kawat belum ada. Jalankan ulang migration_productivity_manual.sql di Supabase SQL Editor."
              : "");
        return;
      }
      this.kwError = "";
      this.kwRows = data || [];
      this.onKwYearChange();
    },
    // Ganti tahun -> tarik nilai yang sudah tersimpan buat tahun itu
    // (kalau belum ada, kolomnya dikosongkan supaya jelas belum diisi).
    onKwYearChange() {
      const nilai = this.kwForYear(this.kwYear);
      this.kwValue = nilai === null ? "" : String(nilai);
    },
    editKoefisien(r) {
      this.kwYear = Number(r.tahun);
      this.kwValue = String(r.nilai);
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    async saveKoefisien() {
      if (!this.isLeaderOrAdmin()) { this.flash("Hanya admin/leader yang bisa menyimpan.", true); return; }
      const tahun = Number(this.kwYear);
      // Tahun ikut divalidasi: kalau <select> sempat kehilangan nilainya,
      // Number() bisa menghasilkan 0/NaN dan datanya tersimpan di tahun ngawur.
      if (!Number.isInteger(tahun) || tahun < 2000 || tahun > 2100) {
        this.kwError = "Tahun tidak valid (terbaca: " + JSON.stringify(this.kwYear) + "). Pilih ulang tahunnya.";
        return;
      }
      const n = this.pvNum(this.kwValue);
      if (n === null) { this.kwError = "Koefisien wajib diisi angka."; return; }
      this.kwSaving = true;
      this.kwError = "";
      try {
        // .select() dipakai supaya baris hasil simpan ikut dikembalikan --
        // kalau RLS menolak diam-diam, data-nya kosong dan itu kebaca di sini.
        const { data, error } = await supabaseClient.from("koefisien_kawat")
          .upsert({ tahun, nilai: n }, { onConflict: "tahun" }).select();
        if (error) { this.kwError = "Gagal simpan koefisien: " + error.message; return; }
        if (!data || data.length === 0) {
          this.kwError = "Tersimpan tapi tidak ada baris yang dikembalikan — biasanya karena hak akses (role kamu harus 'admin' atau 'leader' di tabel profiles).";
          return;
        }
        await this.fetchKoefisien();
        if (this.kwForYear(tahun) === null) {
          this.kwError = "Baris tahun " + tahun + " tidak muncul setelah disimpan. Coba muat ulang halaman.";
          return;
        }
        this.flash("Koefisien " + tahun + " tersimpan.");
      } finally {
        this.kwSaving = false;
      }
    },

    // ---- Target Productivity Bulanan ----
    async fetchTarget() {
      const { data, error } = await supabaseClient.from("productivity_target")
        .select("*").order("tahun", { ascending: false }).order("bulan", { ascending: false });
      if (error) {
        this.tgError = "Gagal memuat target: " + error.message
          + (String(error.message).toLowerCase().includes("productivity_target")
              ? " — sepertinya tabel productivity_target belum ada. Jalankan ulang migration_productivity_manual.sql di Supabase SQL Editor."
              : "");
        return;
      }
      this.tgError = "";
      this.tgRows = data || [];
      this.onTgPeriodChange();
    },
    tgFor(tahun, bulan) {
      const r = this.tgRows.find((x) => Number(x.tahun) === Number(tahun) && Number(x.bulan) === Number(bulan));
      return r ? r.target : null;
    },
    tgAda() { return this.tgFor(this.tgYear, this.tgMonth) !== null; },
    onTgPeriodChange() {
      const t = this.tgFor(this.tgYear, this.tgMonth);
      this.tgValue = t === null ? "" : String(t);
    },
    editTarget(r) {
      this.tgYear = Number(r.tahun);
      this.tgMonth = Number(r.bulan);
      this.tgValue = String(r.target);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    },
    async saveTarget() {
      if (!this.isLeaderOrAdmin()) { this.flash("Hanya admin/leader yang bisa menyimpan.", true); return; }
      const tahun = Number(this.tgYear), bulan = Number(this.tgMonth);
      if (!Number.isInteger(tahun) || tahun < 2000 || tahun > 2100 || !Number.isInteger(bulan) || bulan < 1 || bulan > 12) {
        this.tgError = "Bulan/Tahun tidak valid. Pilih ulang."; return;
      }
      const n = this.pvNum(this.tgValue);
      if (n === null) { this.tgError = "Target wajib diisi angka."; return; }
      this.tgSaving = true;
      this.tgError = "";
      try {
        const { data, error } = await supabaseClient.from("productivity_target")
          .upsert({ tahun, bulan, target: n }, { onConflict: "tahun,bulan" }).select();
        if (error) { this.tgError = "Gagal simpan target: " + error.message; return; }
        if (!data || data.length === 0) {
          this.tgError = "Tersimpan tapi tidak ada baris yang dikembalikan — biasanya karena hak akses (role kamu harus 'admin' atau 'leader' di tabel profiles).";
          return;
        }
        await this.fetchTarget();
        this.flash("Target " + this.BULAN_LABELS[bulan - 1] + " " + tahun + " tersimpan.");
      } finally {
        this.tgSaving = false;
      }
    },
    async hapusTarget() {
      if (!this.isLeaderOrAdmin()) return;
      const tahun = Number(this.tgYear), bulan = Number(this.tgMonth);
      const nm = this.BULAN_LABELS[bulan - 1] + " " + tahun;
      if (!window.confirm("Hapus target " + nm + "?\n\nGrafik akan kembali memakai target 100%.")) return;
      this.tgSaving = true;
      this.tgError = "";
      try {
        const { error } = await supabaseClient.from("productivity_target")
          .delete().eq("tahun", tahun).eq("bulan", bulan);
        if (error) { this.tgError = "Gagal hapus target: " + error.message; return; }
        await this.fetchTarget();
        this.flash("Target " + nm + " dihapus.");
      } finally {
        this.tgSaving = false;
      }
    },

    // ================= TAB CUTI: jatah cuti tahunan =================
    // Tiap periode (tahun fiskal April..Maret) punya jatahnya sendiri,
    // karena member mendapat cuti baru setiap tahun. Yang disimpan HANYA
    // jatah per periode; Total, Terpakai, dan Sisa dihitung ulang tiap
    // kali ditampilkan supaya tidak pernah basi kalau ada baris cuti
    // yang diedit atau dihapus.
    //
    // `tahun` di tabel cuti_jatah = TAHUN AWAL periode.
    // Jadi periode "25-26" (Apr 2025 .. Mar 2026) disimpan sebagai 2025.
    CT_PERIODE: [
      { key: 2025, label: "25-26" },
      { key: 2026, label: "26-27" },
      { key: 2027, label: "27-28" },
      { key: 2028, label: "28-29" },
    ],
    ctCari: "",
    ctLoading: false,
    ctSaving: false,
    ctError: "",
    ctLoaded: false,
    ctKaryawan: [],
    ctJatahAwal: {},       // { nik: { tahun: jatah } } dari server
    ctJatahEdit: {},       // { nik: { tahun: jatah } } yang lagi diketik
    ctTerpakai: {},        // { nik: total hari Cuti Tahunan sepanjang periode }
    ctFmt(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "0";
      return Number.isInteger(v) ? String(v) : v.toFixed(1).replace(".", ",");
    },
    ctSetJatah(nik, tahun, val) {
      // Objek per-NIK diganti utuh supaya Alpine ikut merender ulang barisnya
      this.ctJatahEdit[nik] = { ...(this.ctJatahEdit[nik] || {}), [tahun]: val };
    },
    async fetchCuti() {
      this.ctLoading = true;
      this.ctError = "";
      try {
        const tahunList = this.CT_PERIODE.map((p) => p.key);
        // Rentang tanggal seluruh periode: 1 Apr tahun pertama s/d 31 Mar
        // setelah tahun terakhir -- karena tahun fiskal mulai bulan April.
        const mulai = tahunList[0] + "-04-01";
        const akhir = (tahunList[tahunList.length - 1] + 1) + "-03-31";

        const [karRes, jatahRes, cutiRes] = await Promise.all([
          supabaseClient.from("karyawan_master").select("nik,nama").order("nama"),
          supabaseClient.from("cuti_jatah").select("nik,tahun,jatah").in("tahun", tahunList),
          supabaseClient.from("attendance_leave").select("nik,jenis_cuti,jumlah_hari,tanggal")
            .eq("jenis", "cuti").gte("tanggal", mulai).lte("tanggal", akhir),
        ]);
        if (karRes.error) { this.ctError = "Gagal memuat karyawan: " + karRes.error.message; return; }
        if (jatahRes.error) {
          this.ctError = "Gagal memuat jatah cuti: " + jatahRes.error.message
            + (String(jatahRes.error.message).toLowerCase().includes("cuti_jatah")
                ? " — tabel cuti_jatah belum ada. Jalankan migration_cuti_jatah.sql di Supabase SQL Editor."
                : "");
          return;
        }
        if (cutiRes.error) { this.ctError = "Gagal memuat data cuti: " + cutiRes.error.message; return; }

        this.ctKaryawan = karRes.data || [];
        const awal = {};
        (jatahRes.data || []).forEach((r) => {
          awal[r.nik] = awal[r.nik] || {};
          awal[r.nik][r.tahun] = Number(r.jatah);
        });
        const edit = {};
        this.ctKaryawan.forEach((k) => {
          edit[k.nik] = {};
          tahunList.forEach((th) => {
            // Belum pernah diatur -> DIBIARKAN KOSONG, bukan diisi angka
            // bawaan. Jatah tiap orang bisa beda, jadi lebih jelas kalau
            // yang belum diisi memang terlihat kosong.
            const v = awal[k.nik] && awal[k.nik][th] !== undefined ? awal[k.nik][th] : "";
            edit[k.nik][th] = v === "" ? "" : String(v);
          });
        });
        this.ctJatahAwal = awal;
        this.ctJatahEdit = edit;

        const pakai = {};
        (cutiRes.data || []).forEach((r) => {
          if (r.jenis_cuti !== "Cuti Tahunan") return;   // hanya ini yang memotong jatah
          pakai[r.nik] = (pakai[r.nik] || 0) + Number(r.jumlah_hari ?? 1);
        });
        this.ctTerpakai = pakai;
      } finally {
        this.ctLoading = false;
      }
    },
    cutiRows() {
      const cari = (this.ctCari || "").trim().toLowerCase();
      return this.ctKaryawan
        .filter((k) => !cari || String(k.nik).toLowerCase().includes(cari) || String(k.nama || "").toLowerCase().includes(cari))
        .map((k) => {
          const baris = this.ctJatahEdit[k.nik] || {};
          const total = this.CT_PERIODE.reduce((a, p) => a + (Number(baris[p.key]) || 0), 0);
          const terpakai = Number(this.ctTerpakai[k.nik] || 0);
          return { nik: k.nik, nama: k.nama, total, terpakai, sisa: total - terpakai };
        });
    },
    async saveCuti() {
      if (!this.isLeaderOrAdmin()) { this.flash("Hanya admin/leader yang bisa menyimpan.", true); return; }
      // Cuma sel yang angkanya berubah yang dikirim, biar tidak menulis ulang
      // seluruh daftar (49 karyawan x 4 periode) tiap kali menyimpan.
      const payload = [];
      const hapus = [];      // sel yang dikosongkan padahal sebelumnya ada isinya
      for (const k of this.ctKaryawan) {
        for (const p of this.CT_PERIODE) {
          const isi = String((this.ctJatahEdit[k.nik] || {})[p.key] ?? "").trim();
          const lama = (this.ctJatahAwal[k.nik] || {})[p.key];
          if (isi === "") {
            // Dibiarkan kosong. Kalau dulu ada isinya, berarti sengaja dihapus.
            if (lama !== undefined) hapus.push({ nik: k.nik, tahun: p.key });
            continue;
          }
          const baru = Number(isi);
          if (!Number.isFinite(baru) || baru < 0) {
            this.ctError = "Jatah " + (k.nama || k.nik) + " periode " + p.label + " tidak valid."; return;
          }
          if (lama === undefined || Number(lama) !== baru) payload.push({ nik: k.nik, tahun: p.key, jatah: baru });
        }
      }
      if (!payload.length && !hapus.length) { this.flash("Tidak ada perubahan jatah."); return; }
      this.ctSaving = true;
      this.ctError = "";
      try {
        if (payload.length) {
          const { error } = await supabaseClient.from("cuti_jatah").upsert(payload, { onConflict: "nik,tahun" });
          if (error) { this.ctError = "Gagal simpan jatah: " + error.message; return; }
        }
        for (const h of hapus) {
          const { error } = await supabaseClient.from("cuti_jatah").delete().eq("nik", h.nik).eq("tahun", h.tahun);
          if (error) { this.ctError = "Gagal hapus jatah: " + error.message; return; }
        }
        this.flash(payload.length + " jatah tersimpan" + (hapus.length ? ", " + hapus.length + " dikosongkan" : "") + ".");
        await this.fetchCuti();
      } finally {
        this.ctSaving = false;
      }
    },

    // ================= REKAP CUTI =================
    // Daftar seluruh inputan Izin/Sakit/Cuti/Mangkir dari semua user,
    // untuk dilihat & diperbaiki admin. Penyaringan berat (jenis, bulan,
    // tahun) dilakukan di server; pencarian nama/NIK disaring di layar
    // supaya tidak menembak query tiap huruf.
    ctSub: "jatah",        // sub-tab aktif: "jatah" | "rekap"
    rkJenis: "",
    rkBulan: "",
    rkTahun: new Date().getFullYear(),
    rkCari: "",
    rkRows: [],
    rkProfiles: {},        // { user_id: nama } -- untuk kolom "Diinput oleh"
    rkHariLibur: [],
    rkLoading: false,
    rkSaving: false,
    rkError: "",
    rkLoaded: false,
    rkEdit: null,          // salinan baris yang sedang diubah
    setCutiSub(sub) {
      this.ctSub = sub;
      if (sub === "rekap" && !this.rkLoaded) { this.rkLoaded = true; this.fetchRekap(); }
    },
    rkLabel(j) {
      return { izin: "Izin", sakit: "Sakit", cuti: "Cuti", mangkir: "Mangkir" }[j] || j;
    },
    rkPenginput(r) {
      return this.rkProfiles[r.created_by] || "-";
    },
    async fetchRekap() {
      this.rkLoading = true;
      this.rkError = "";
      try {
        const th = Number(this.rkTahun);
        let mulai, akhir;
        if (this.rkBulan) {
          const bl = Number(this.rkBulan);
          const lastDay = new Date(th, bl, 0).getDate();
          mulai = th + "-" + String(bl).padStart(2, "0") + "-01";
          akhir = th + "-" + String(bl).padStart(2, "0") + "-" + String(lastDay).padStart(2, "0");
        } else {
          mulai = th + "-01-01";
          akhir = th + "-12-31";
        }
        let q = supabaseClient.from("attendance_leave").select("*")
          .gte("tanggal", mulai).lte("tanggal", akhir)
          .order("tanggal", { ascending: false }).limit(500);
        if (this.rkJenis) q = q.eq("jenis", this.rkJenis);

        const [rowsRes, profRes, liburRes] = await Promise.all([
          q,
          supabaseClient.from("profiles").select("id,full_name,email"),
          supabaseClient.from("hari_libur").select("tanggal,jenis,shift"),
        ]);
        if (rowsRes.error) { this.rkError = "Gagal memuat rekap: " + rowsRes.error.message; return; }
        this.rkRows = rowsRes.data || [];
        const map = {};
        (profRes.data || []).forEach((p) => { map[p.id] = p.full_name || p.email || "-"; });
        this.rkProfiles = map;
        this.rkHariLibur = liburRes.data || [];
      } finally {
        this.rkLoading = false;
      }
    },
    rekapRows() {
      const cari = (this.rkCari || "").trim().toLowerCase();
      if (!cari) return this.rkRows;
      return this.rkRows.filter((r) =>
        String(r.nik || "").toLowerCase().includes(cari) ||
        String(r.nama || "").toLowerCase().includes(cari));
    },
    editRekap(r) {
      this.rkEdit = { ...r };   // disalin, biar batal tidak mengubah tabel
      // Data lama bisa berisi Cuti Besar / Cuti Melahirkan / Cuti Lainnya,
      // yang sudah dihapus dari dropdown. Dipetakan ke Cuti Khusus supaya
      // dropdown tidak tampil kosong. Sama-sama tidak memotong jatah,
      // jadi hitungan tidak berubah.
      if (r.jenis === "cuti" && r.jenis_cuti && !["Cuti Tahunan", "Cuti Khusus"].includes(r.jenis_cuti)) {
        this.rkEdit.jenis_cuti = "Cuti Khusus";
      }
      this.rkError = "";
    },
    // Hari yang dihitung antara 2 tanggal:
    //  - Minggu: selalu tidak dihitung.
    //  - Senin-Jumat: dihitung, KECUALI tanggal merah biasa (jenis 'libur').
    //  - Sabtu: TIDAK dihitung, kecuali ada catatan Ganti Hari (jenis
    //    'ganti_hari') di tanggal itu DAN shift orangnya cocok (atau
    //    catatannya 'penuh'). Shift orang dicek PER HARI lewat
    //    shiftPadaTanggal() (Shift 2 rotasi mingguan, jadi bisa beda di
    //    minggu berbeda dalam satu rentang cuti); kalau belum tercatat,
    //    dianggap tidak dihitung (aman, tidak memotong jatah secara
    //    tidak sengaja).
    // Rumus ini harus SAMA PERSIS dengan leaveTotalHari() di
    // input-attendance.html dan trigger set_jumlah_hari_cuti() di database
    // (lihat migration_shift2_periode.sql) -- kalau salah satu diubah,
    // ubah juga yang lain supaya preview di layar tidak beda dari yang
    // benar-benar tersimpan.
    // Fungsi hitung generik -- dipakai rkHitungHari() untuk preview di form
    // Edit (pakai rkEdit), DAN rkHitungUlangNol() untuk perbaiki massal baris
    // lama yang Total Hari-nya masih 0 (mis. dulu belum ada catatan Ganti
    // Hari, sekarang sudah ada). Rumus HARUS SAMA PERSIS dengan
    // leaveTotalHari() di input-attendance.html dan trigger
    // set_jumlah_hari_cuti() di database (lihat migration_shift2_periode.sql).
    hitungHariCuti(nik, tanggalMulai, tanggalSelesai) {
      if (!tanggalMulai) return 0;
      const selesai = tanggalSelesai || tanggalMulai;
      let d = new Date(tanggalMulai + "T00:00:00");
      const akhir = new Date(selesai + "T00:00:00");
      if (akhir < d) return 0;
      let total = 0;
      while (d <= akhir) {
        const dow = d.getDay();   // 0 = Minggu, 6 = Sabtu
        const ds = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        const lib = this.rkHariLibur.find((r) => r.tanggal === ds);
        if (dow === 0) {
          // Minggu: tidak dihitung
        } else if (dow === 6) {
          if (lib && lib.jenis === "ganti_hari" && (lib.shift === "penuh" || lib.shift === this.shiftPadaTanggal(nik, ds))) total++;
        } else {
          if (!lib || lib.jenis !== "libur") total++;
        }
        d.setDate(d.getDate() + 1);
      }
      return total;
    },
    // ---- Kenapa Total Hari masih 0? ----
    // Dipakai sebagai tooltip (title) di kolom Total Hari saat nilainya 0,
    // supaya kelihatan alasannya PER TANGGAL -- bukan cuma "0" tanpa
    // penjelasan. 3 kemungkinan penyebab hari Sabtu tidak terhitung:
    //  (1) belum ada catatan Ganti Hari di tanggal itu sama sekali,
    //  (2) Ganti Hari ada tapi shift-nya tidak "Penuh" DAN shift karyawan
    //      pada tanggal itu belum diketahui (tidak ada periode Shift 2 yang
    //      mencakup tanggal itu di panel Riwayat Upload Shift 2),
    //  (3) Ganti Hari ada, shift karyawan sudah diketahui, tapi shift-nya
    //      tidak cocok dengan shift Ganti Hari (mis. Ganti Hari untuk Shift
    //      2, tapi karyawan ini Shift 1 minggu itu -- jadi memang wajar 0).
    kenapaNolHari(r) {
      if (r.jenis !== "cuti" || !r.tanggal) return "";
      const selesai = r.tanggal_selesai || r.tanggal;
      let d = new Date(r.tanggal + "T00:00:00");
      const akhir = new Date(selesai + "T00:00:00");
      if (akhir < d) return "";
      const alasan = [];
      while (d <= akhir) {
        const dow = d.getDay();
        const ds = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        const lib = this.rkHariLibur.find((x) => x.tanggal === ds);
        if (dow === 0) {
          alasan.push(ds + ": Minggu (memang tidak dihitung)");
        } else if (dow === 6) {
          if (!lib || lib.jenis !== "ganti_hari") {
            alasan.push(ds + ": Sabtu, BELUM ADA catatan Ganti Hari untuk tanggal ini -> tambahkan dulu di Attendance > Ganti Hari.");
          } else if (lib.shift !== "penuh") {
            const shiftNya = this.shiftPadaTanggal(r.nik, ds);
            if (shiftNya === null) {
              alasan.push(ds + ": Ganti Hari Shift " + lib.shift + ", tapi shift karyawan tanggal ini BELUM DIKETAHUI (tidak ada periode di Riwayat Upload Shift 2 yang mencakup tanggal ini) -> upload periode Shift 2 yang mencakup tanggal ini, atau ubah Ganti Hari ke 'Shift 1 & 2 (Penuh)'.");
            } else if (shiftNya !== lib.shift) {
              alasan.push(ds + ": Ganti Hari untuk Shift " + lib.shift + ", tapi karyawan ini Shift " + shiftNya + " pada tanggal itu -> memang tidak dihitung (sesuai aturan).");
            }
          }
        } else if (lib && lib.jenis === "libur") {
          alasan.push(ds + ": tanggal merah (" + (lib.keterangan || "libur") + ")");
        }
        d.setDate(d.getDate() + 1);
      }
      return alasan.join("\n");
    },
    rkHitungHari() {
      const e = this.rkEdit;
      if (!e || !e.tanggal) return 0;
      return this.hitungHariCuti(e.nik, e.tanggal, e.tanggal_selesai || e.tanggal);
    },
    // ---- Hitung Ulang Total Hari (yang masih 0) ----
    // Untuk baris Cuti LAMA yang Total Hari-nya 0 karena, waktu disimpan
    // dulu, belum ada catatan Ganti Hari di tanggal itu (sekarang sudah
    // ditambahkan). Hanya memproses baris yang SEDANG TAMPIL di tabel
    // (ikut filter Jenis/Bulan/Tahun/Cari di layar) -- supaya cakupannya
    // jelas dan bisa dipersempit (mis. isi Cari dengan 1 NIK dulu). Baris
    // yang hasil hitung ulangnya TETAP 0 tidak disentuh/di-update.
    rkRecalcLoading: false,
    async rkHitungUlangNol() {
      const kandidat = this.rekapRows().filter((r) => r.jenis === "cuti" && (r.jumlah_hari === 0 || r.jumlah_hari === null));
      if (kandidat.length === 0) { this.flash("Tidak ada baris Cuti dengan Total Hari = 0 pada tampilan/filter saat ini."); return; }
      if (!confirm(`Hitung ulang ${kandidat.length} baris Cuti yang Total Hari-nya 0 (pakai data Hari Libur & Ganti Hari yang berlaku sekarang)?\n\nBaris yang hasil hitungnya tetap 0 tidak akan diubah.`)) return;
      this.rkRecalcLoading = true;
      this.rkError = "";
      let berubah = 0, gagal = 0;
      try {
        for (const r of kandidat) {
          const baru = this.hitungHariCuti(r.nik, r.tanggal, r.tanggal_selesai || r.tanggal);
          if (baru > 0) {
            const { error } = await supabaseClient.from("attendance_leave").update({ jumlah_hari: baru }).eq("id", r.id);
            if (error) gagal++; else berubah++;
          }
        }
        this.flash(`Selesai: ${berubah} baris diperbarui` + (gagal ? `, ${gagal} gagal disimpan.` : "."));
        await this.fetchRekap();
      } finally {
        this.rkRecalcLoading = false;
      }
    },
    async simpanRekap() {
      const e = this.rkEdit;
      if (!e) return;
      if (!e.tanggal) { this.rkError = "Tanggal wajib diisi."; return; }
      if (e.jenis === "cuti" && !e.tanggal_selesai) { this.rkError = "Tanggal Selesai wajib diisi."; return; }
      if (e.jenis === "cuti" && e.tanggal_selesai < e.tanggal) { this.rkError = "Tanggal Selesai tidak boleh sebelum Tanggal Mulai."; return; }
      if (e.jenis === "cuti" && !e.jenis_cuti) { this.rkError = "Jenis Cuti wajib dipilih."; return; }
      if (e.jenis === "cuti" && (e.jumlah_hari === null || e.jumlah_hari === "" || e.jumlah_hari === undefined || Number(e.jumlah_hari) < 0)) {
        this.rkError = "Total Hari wajib diisi (boleh 0 kalau memang tidak dihitung, tidak boleh minus).";
        return;
      }
      this.rkSaving = true;
      this.rkError = "";
      try {
        // Kolom khusus cuti dikosongkan kalau jenisnya diubah jadi bukan cuti,
        // supaya tidak ada sisa data yang menyesatkan.
        // Total Hari (jumlah_hari) SEKARANG DIAMBIL DARI ANGKA YANG DIKETIK
        // ADMIN di field Total Hari (bisa beda dari hitungan otomatis
        // rkHitungHari(), mis. cuti jatuh di Sabtu/tanggal merah tapi admin
        // memang mau tetap dihitung 1 hari) -- BUKAN dipaksa pakai hitungan
        // otomatis lagi seperti sebelumnya.
        const payload = {
          jenis: e.jenis,
          tanggal: e.tanggal,
          tanggal_selesai: e.jenis === "cuti" ? e.tanggal_selesai : null,
          jenis_cuti: e.jenis === "cuti" ? e.jenis_cuti : null,
          jumlah_hari: e.jenis === "cuti" ? Number(e.jumlah_hari) : 1,
          keterangan: (e.keterangan || "").trim() || null,
        };
        const { error } = await supabaseClient.from("attendance_leave").update(payload).eq("id", e.id);
        if (error) { this.rkError = "Gagal simpan: " + error.message; return; }
        this.flash("Perubahan tersimpan.");
        this.rkEdit = null;
        await this.fetchRekap();
      } finally {
        this.rkSaving = false;
      }
    },
    async hapusRekap(r) {
      if (!confirm("Hapus data " + this.rkLabel(r.jenis) + " atas nama " + r.nama + " (" + r.tanggal + ")?")) return;
      const { error } = await supabaseClient.from("attendance_leave").delete().eq("id", r.id);
      if (error) { this.rkError = "Gagal hapus: " + error.message; return; }
      if (this.rkEdit && this.rkEdit.id === r.id) this.rkEdit = null;
      this.flash("Data dihapus.");
      await this.fetchRekap();
    },

    // ---- Scrap Top End (Bulanan) ----
    async fetchScrapRows() {
      const { data, error } = await supabaseClient.from("scrap_top_end").select("*")
        .order("tahun", { ascending: false }).order("bulan", { ascending: false }).limit(100);
      if (!error && data) this.scrapRows = data;
    },
    editScrap(r) {
      this.scrapForm = { tahun: r.tahun, bulan: String(r.bulan), scrap_value_kidr: r.scrap_value_kidr, total_value_kidr: r.total_value_kidr, target_rasio: r.target_rasio ?? "" };
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    async saveScrap() {
      const f = this.scrapForm;
      if (!f.tahun || !f.bulan) { this.flash("Tahun dan Bulan wajib diisi.", true); return; }
      const payload = {
        tahun: Number(f.tahun), bulan: Number(f.bulan),
        scrap_value_kidr: Number(f.scrap_value_kidr) || 0,
        total_value_kidr: Number(f.total_value_kidr) || 0,
        target_rasio: f.target_rasio === "" ? null : Number(f.target_rasio),
      };
      const { error } = await supabaseClient.from("scrap_top_end").upsert(payload, { onConflict: "tahun,bulan" });
      if (error) { this.flash("Gagal simpan: " + error.message, true); return; }
      this.flash("Data scrap tersimpan.");
      await this.fetchScrapRows();
    },
    // ---- Safety / Insiden ----
    async fetchSafetyRows() {
      const { data, error } = await supabaseClient.from("safety_log").select("*").order("tanggal", { ascending: false }).limit(100);
      if (!error && data) this.safetyRows = data;
    },
    async saveSafety() {
      const f = this.safetyForm;
      if (!f.tanggal) { this.flash("Tanggal wajib diisi.", true); return; }
      const { error } = await supabaseClient.from("safety_log").insert({
        tanggal: f.tanggal, kategori: f.kategori, keterangan: f.keterangan || null,
        created_by: this.session.user.id,
      });
      if (error) { this.flash("Gagal simpan: " + error.message, true); return; }
      this.flash("Insiden tercatat.");
      this.safetyForm.keterangan = "";
      await this.fetchSafetyRows();
    },
    async hapusSafety(id) {
      if (!confirm("Hapus catatan insiden ini?")) return;
      const { error } = await supabaseClient.from("safety_log").delete().eq("id", id);
      if (error) { this.flash("Gagal hapus: " + error.message, true); return; }
      await this.fetchSafetyRows();
    },
  };
}
</script>
</body>
</html>
