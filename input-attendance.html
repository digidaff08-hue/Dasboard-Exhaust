<style>
  /* ---------- Dekorasi latar (sama seperti halaman Mesin) ----------
     Gambar di belakang konten: gear yang berputar pelan, percikan las,
     gauge, dan siluet pabrik. Murni hiasan -- aria-hidden, dan tidak
     bisa diklik (pointer-events: none) supaya tidak mengganggu form.

     Bedanya dari halaman Mesin: warna latar & border di sini ikut
     variabel tema, jadi mode gelap tetap benar. Di halaman Mesin
     warnanya masih dipatok #f6f7fb / #b0b8cc. */
  .app-shell, .main { background: transparent !important; }
  .hub-decor {
    position: fixed; inset: 0; z-index: -1;
    overflow: hidden; pointer-events: none;
    background: #f6f7fb;
  }
  [data-theme="dark"] .hub-decor { background: var(--bg); }
  /* Panel dibuat tembus pandang supaya dekorasinya terlihat,
     bordernya dipertegas sebagai gantinya. */
  .main .panel {
    background: transparent !important;
    box-shadow: none !important;
    border: 1.5px solid color-mix(in srgb, var(--border) 70%, var(--muted)) !important;
  }
  .page-header { background: transparent !important; }

  .hub-decor .decor-gear     { position: absolute; left: -20px; top: 5%;      width: 160px; opacity: .18; animation: spinGear 24s linear infinite; }
  .hub-decor .decor-gear-sm  { position: absolute; right: -16px; bottom: 15%; width: 100px; opacity: .15; animation: spinGear 18s linear infinite reverse; }
  .hub-decor .decor-spark    { position: absolute; right: 6%; top: 6%;        width: 80px;  opacity: .18; animation: floatSpark 8s ease-in-out infinite; }
  .hub-decor .decor-gauge    { position: absolute; right: 2%; top: 35%;       width: 160px; opacity: .14; animation: floatSpark 10s ease-in-out 2s infinite; }
  .hub-decor .decor-factory  { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 480px; opacity: .12; }
  .hub-decor .decor-bolt     { position: absolute; left: 5%; bottom: 20%;     width: 60px;  opacity: .18; animation: floatSpark 12s ease-in-out 1s infinite; }

  @keyframes spinGear { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes floatSpark {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-10px) rotate(5deg); }
  }
  /* Hormati setelan "kurangi animasi" di sistem operasi pengguna */
  @media (prefers-reduced-motion: reduce) {
    .hub-decor * { animation: none !important; }
  }


  /* ===== Scoped khusus halaman Ketidakhadiran =====
     Semua kelas di-prefix .la- (leave attendance) dan tidak ada yang
     menimpa kelas global, jadi assets/style.css & halaman lain aman.

     Prinsipnya: Jenis ketidakhadiran jadi PENANDA WARNA yang dipakai
     konsisten -- di tombol pilihan, di ringkasan, dan di tabel riwayat.
     Warna di sini membawa arti, bukan hiasan, supaya operator bisa
     membaca tabel sekilas tanpa mengeja tiap barisnya. */

  /* ---------- Topbar layar kecil ----------
     assets/style.css memberi .mobile-topbar latar terang (#f4f5f7).
     Di sini ditimpa jadi hijau tua seperti topbar halaman Mesin, supaya
     tidak ada kotak putih di atas. Bedanya dengan halaman Mesin: tetap
     SATU baris (hamburger + tab), bukan dua baris dengan judul besar.

     Tombol tabnya sengaja memakai kelas .mobile-topbar-tabs supaya ikut
     gaya tombol kecil yang sudah ada di assets/style.css -- tidak ada
     ukuran atau warna tombol yang saya bikin sendiri di sini. */
  @media (max-width: 800px) {
    .mobile-topbar {
      background: #1a3c34 !important;
      border-bottom: 1px solid #2d6a5a !important;
    }
    .mobile-topbar button.hamburger {
      border-color: #2d6a5a !important;
      color: #e2e8f0 !important;
    }
    /* Aturan bawaan .mobile-topbar-tabs dibuat untuk baris kedua
       (lebar penuh + padding). Di sini cukup menempel ke kanan. */
    .mobile-topbar .mobile-topbar-tabs {
      width: auto;
      padding: 0;
      margin-left: auto;
    }
    /* Tombol tab di topbar HP: lebih kecil & satu baris. Kalau layar
       sangat sempit dan tetap tidak muat, baris ini bisa digeser ke
       samping -- tombolnya tidak pernah terpotong di tepi layar. */
    .mobile-topbar .la-mtabs {
      display: flex; flex-wrap: nowrap; gap: 5px;
      min-width: 0; flex: 1 1 auto; justify-content: flex-end;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .mobile-topbar .la-mtabs::-webkit-scrollbar { display: none; }
    .mobile-topbar .la-mtabs button {
      flex: none; white-space: nowrap;
      padding: 5px 9px !important; font-size: 12px !important;
      line-height: 1.2; border-radius: 8px;
    }
    .mobile-topbar .la-mtabs-badge {
      background: #ef4444; color: #fff; border-radius: 9px;
      padding: 0 5px; font-size: 10px; margin-left: 3px;
    }
  }
  @media (max-width: 360px) {
    .mobile-topbar .la-mtabs button { padding: 4px 7px !important; font-size: 11px !important; }
  }

  /* Field yang memakan 2 kolom di layar lebar. TIDAK boleh dipasang
     lewat inline style "grid-column: span 2", karena di layar sempit
     .form-grid berubah jadi 1 kolom -- span 2 di grid 1 kolom justru
     memaksa lahirnya kolom kedua, dan semua field jadi berdesakan. */
  .la-span2 { grid-column: span 2; }

  /* ---------- Layar HP ----------
     Form dan tabel dibuat lebih ringkas, dan tabel hasil pencarian
     ditumpuk ke bawah supaya tidak ada kolom yang terpotong. */
  @media (max-width: 640px) {
    .la-span2 { grid-column: auto; }

    /* Panel & form lebih rapat */
    .main .panel { padding: 14px; border-radius: 10px; }
    .main .panel-title { font-size: 14px; }
    .form-grid { gap: 10px; margin-bottom: 12px; }
    .field label { font-size: 11px; }
    .field input, .field select, .field textarea { padding: 8px 10px; font-size: 13.5px; }
    .la-hint { font-size: 10.5px; }
    .la-section { margin-bottom: 14px; }
    .la-section-head { font-size: 12.5px; margin-bottom: 10px; }
    .la-emp { min-height: 52px; padding: 10px; gap: 10px; }
    .la-emp-avatar { width: 32px; height: 32px; font-size: 13px; }
    .la-emp-nama { font-size: 14px; }

    /* Tabel bertanda .la-stack: tiap baris jadi satu kartu, tiap sel
       jadi satu baris "Label ....... isi". Tidak ada yang terpotong
       dan tidak perlu digeser ke samping. */
    .la-stack thead { display: none; }
    .la-stack, .la-stack tbody, .la-stack tr, .la-stack td { display: block; width: 100%; }
    .la-stack tr {
      border: 1px solid var(--border); border-radius: 10px;
      padding: 4px 10px; margin-bottom: 10px; background: var(--panel);
    }
    .la-stack tr:last-child { margin-bottom: 0; }
    .la-stack td {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; border: 0; padding: 7px 0; text-align: right;
      border-bottom: 1px dashed var(--border);
    }
    .la-stack tr td:last-child { border-bottom: 0; }
    .la-stack td::before {
      content: attr(data-label);
      font-size: 11px; color: var(--muted); font-weight: 600;
      text-align: left; flex: none;
    }
    /* Baris "Belum ada data" tidak punya data-label -- tampil biasa */
    .la-stack td.empty-state { display: block; text-align: center; }
    .la-stack td.empty-state::before { content: none; }
    /* Riwayat Cuti SENGAJA tetap tabel biasa, tidak ditumpuk seperti
       .la-stack -- isinya sering lebih dari 10 baris, dan kalau tiap
       baris jadi kartu halamannya jadi sangat panjang. Cukup dikecilkan
       supaya ketiga kolomnya muat tanpa terpotong. */
    .la-riwayat { table-layout: fixed; width: 100%; }
    .la-riwayat th, .la-riwayat td {
      font-size: 11px; padding: 6px 5px;
      white-space: normal; word-break: break-word; overflow-wrap: anywhere;
    }
    .la-riwayat th:nth-child(1), .la-riwayat td:nth-child(1) { width: 21%; }
    .la-riwayat th:nth-child(3), .la-riwayat td:nth-child(3) { width: 34%; }
    .la-riwayat td.empty-state { font-size: 12px; }

    .la-table-wrap { max-height: none; overflow: visible; }
  }

  /* ---------- Bagian form ---------- */
  .la-section { margin-bottom: 20px; }
  .la-section:last-of-type { margin-bottom: 0; }
  .la-section-head {
    font-size: 13px; font-weight: 600; color: var(--text);
    margin: 0 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ---------- Hasil pencarian NIK ----------
     Menggantikan kotak "Nama" yang dikunci. Nama bukan sesuatu yang
     diketik, jadi tidak perlu tampil sebagai kolom isian -- lebih jelas
     ditampilkan sebagai hasil pencarian. */
  .la-emp {
    display: flex; align-items: center; gap: 12px;
    min-height: 62px; padding: 12px 14px;
    border: 1px dashed var(--border); border-radius: 12px;
    background: var(--panel-2); color: var(--muted); font-size: 13px;
  }
  .la-emp.is-found { border-style: solid; border-color: var(--green); background: color-mix(in srgb, var(--green) 8%, var(--panel)); }
  .la-emp.is-miss { border-style: solid; border-color: var(--red); background: color-mix(in srgb, var(--red) 8%, var(--panel)); }
  .la-emp-avatar {
    width: 38px; height: 38px; flex: none; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--border); color: var(--muted);
    font-weight: 700; font-size: 15px;
  }
  .la-emp.is-found .la-emp-avatar { background: var(--green); color: #fff; }
  .la-emp.is-miss .la-emp-avatar { background: var(--red); color: #fff; }
  .la-emp-nama { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.25; }
  .la-emp-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---------- Kolom hitungan otomatis ---------- */
  .field input.la-computed {
    background: var(--amber-dim); color: var(--text);
    font-weight: 700; cursor: not-allowed;
  }
  .la-hint { display: block; margin-top: 5px; font-size: 11px; color: var(--muted); }

  /* ---------- Penanda jenis di tabel riwayat ---------- */
  .la-badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
  }
  .la-table-wrap { max-height: 460px; overflow: auto; }
  .la-table-wrap thead th { position: sticky; top: 0; z-index: 2; }
  .la-table-wrap tbody tr:nth-child(even) { background: var(--panel-2); }
  .la-table-wrap tbody tr:hover { background: color-mix(in srgb, var(--amber) 8%, var(--panel)); }

</style>

<script>

  })();
</script>

    <template x-if="profile">

             Ketik NIK -> Nama otomatis muncul dari master karyawan
             (tabel karyawan_master). Field Nama DIKUNCI -- tidak bisa
             diketik manual, supaya nama selalu konsisten dengan data

             tombol Simpan tidak akan jalan -- hubungi admin untuk
             menambahkan NIK tsb ke karyawan_master dulu.
             Urutan field: Jenis, NIK, Nama, lalu Tanggal (Izin/Sakit/
             Mangkir) atau Tanggal Mulai/Selesai/Total Hari/Jenis Cuti
             (Cuti). Total Hari memakai rumus hitungHariKerja(): Minggu &

             CUTI tidak langsung disimpan ke attendance_leave -- masuk dulu ke
             leave_requests (status Menunggu). Baru tercatat & memotong jatah
             setelah atasan menyetujui (proses_approval_cuti di database). -->
        <template x-if="tab === 'form'">
          <div>
        <div class="panel">
          <p class="panel-title">Form Ketidakhadiran</p>

          <div class="la-section">

                <div class="la-emp" :class="leaveNikFound ? 'is-found' : (leaveForm.nik ? 'is-miss' : '')">
                  <template x-if="leaveNikFound">
                    <div class="la-emp-avatar" x-text="(leaveForm.nama || '').trim().charAt(0).toUpperCase()"></div>
                  </template>
                  <div>
                    <template x-if="leaveNikFound">
                      <div>
                        <div class="la-emp-nama" x-text="leaveForm.nama"></div>
                        <div class="la-emp-sub" x-text="'NIK ' + leaveForm.nik"></div>
                      </div>
                    </template>
                    <template x-if="!leaveNikFound && leaveForm.nik">
                      <div>
                        <div class="la-emp-nama">NIK tidak terdaftar</div>
                        <div class="la-emp-sub">Minta admin menambahkannya ke master karyawan dulu</div>
                      </div>
                    </template>
                    <template x-if="!leaveForm.nik">
                      <div>Nama karyawan (nama terisi otomatis setelah ketik NIK)</div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="la-section">
            <p class="la-section-head" x-text="leaveForm.jenis === 'cuti' ? 'Periode cuti' : 'Kapan'"></p>
            <div class="form-grid">
              <div class="field"><label><span x-text="leaveForm.jenis === 'cuti' ? 'Tanggal Mulai' : 'Tanggal'"></span> <span class="req">*</span></label><input type="date" x-model="leaveForm.tanggal"></div>
              <template x-if="leaveForm.jenis === 'cuti'">
                <div class="field"><label>Tanggal Selesai <span class="req">*</span></label><input type="date" x-model="leaveForm.tanggal_selesai" :min="leaveForm.tanggal"></div>
              </template>
              <template x-if="leaveForm.jenis === 'cuti'">
                <div class="field">
                  <label>Total Hari</label>
                  <input type="text" class="la-computed" :value="leaveTotalHari() + ' hari'" disabled readonly>
                  <span class="la-hint">Minggu & tanggal merah tidak dihitung. Sabtu tergantung Ganti Hari &amp; shift kamu</span>
                </div>
              </template>
              <template x-if="leaveForm.jenis === 'cuti'">
                <div class="field"><label>Jenis Cuti <span class="req">*</span></label>
                  <select x-model="leaveForm.jenis_cuti">
                    <option value="">Pilih jenis cuti...</option>
                    <option value="Cuti Tahunan">Cuti Tahunan</option>
                    <option value="Cuti Khusus">Cuti Khusus</option>
                  </select>
                  <span class="la-hint" x-show="leaveForm.jenis_cuti === 'Cuti Tahunan'">Memotong jatah cuti tahunan setelah disetujui atasan</span>
                  <span class="la-hint" x-show="leaveForm.jenis_cuti === 'Cuti Khusus'">Tidak memotong jatah cuti</span>
                </div>
              </template>
            </div>
          </div>

          <div class="la-section">
            <p class="la-section-head">Keterangan</p>
            <div class="form-grid">
              <div class="field" style="grid-column: 1 / -1;">
                <label>Alasan / keterangan <span class="req">*</span></label>
                <input type="text" x-model="leaveForm.keterangan" placeholder="Tulis alasannya">
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-primary" :disabled="leaveSaving" @click="saveLeave()"
                    x-text="leaveSaving ? 'Menyimpan...' : ((leaveForm.jenis === 'cuti' && !leaveEditId) ? 'Ajukan Cuti' : 'Simpan')"></button>
            <button type="button" class="btn-secondary" x-show="leaveEditId" @click="resetLeaveForm(); clearLeaveWA()">Batal Edit</button>
          </div>

          <!-- Kotak WA muncul setelah simpan — bertahan walau di-refresh -->
          <template x-if="leaveWaPesan">
            <div style="margin-top:14px;padding:14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--green) 40%,transparent);background:color-mix(in srgb,var(--green) 8%,var(--panel));">
              <p style="font-size:13px;font-weight:700;margin-bottom:6px;" x-text="leaveWaJenis === 'cuti' ? '✅ Pengajuan cuti terkirim, menunggu persetujuan atasan' : '✅ Data tersimpan!'"></p>
              <p style="font-size:12px;color:var(--muted);margin-bottom:10px;" x-text="leaveWaJenis === 'cuti' ? 'Jatah cuti belum terpotong sampai atasan menyetujui. Kirim link approval ke atasan via WhatsApp, lalu pantau di tab Status Cuti.' : 'Kirim notifikasi ke atasan via WhatsApp.'"></p>
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                <template x-if="leaveWaTarget">
                  <button type="button" class="btn-primary btn-sm" @click="sendLeaveWA()" style="background:#25d366;font-size:13px;padding:8px 16px;">📲 Kirim WA ke Atasan</button>
                </template>
                <template x-if="!leaveWaTarget">
                  <p style="font-size:11px;color:var(--amber);margin:0;">⚠️ Nomor WA atasan belum diisi di profil.</p>
                </template>
                <button type="button" class="btn-secondary btn-sm" @click="clearLeaveWA()" style="font-size:11px;">✕ Tutup</button>
              </div>
            </div>
          </template>
        </div>

        <div class="panel">
          <p class="panel-title">Riwayat Ketidakhadiran <span class="count" x-text="leaveRows.length + ' baris'"></span></p>
          <p class="hint" style="margin-bottom:12px;">
            <span x-show="!(leaveLihatSemua &amp;&amp; isAdmin())">Yang tampil hanya data yang kamu input sendiri.</span>
            <span x-show="leaveLihatSemua &amp;&amp; isAdmin()">Menampilkan data dari semua orang.</span>
            <button type="button" class="btn-secondary btn-sm" x-show="isAdmin()" style="margin-left:8px;"
                    @click="leaveLihatSemua = !leaveLihatSemua; fetchLeaveRows()"
                    x-text="leaveLihatSemua ? 'Tampilkan punya saya saja' : 'Tampilkan semua'"></button>
          </p>
          <div class="table-wrap la-table-wrap">
            <table>
              <thead><tr><th>Jenis</th><th>NIK</th><th>Nama</th><th>Tanggal</th><th>Sampai</th><th>Total Hari</th><th>Jenis Cuti</th><th>Keterangan</th><th x-show="isAdmin()">Aksi</th></tr></thead>
              <tbody>
                <template x-for="r in leaveRows" :key="r.id">
                  <tr>
                    <td><span class="la-badge" :style="'--c: var(--' + leaveJenisWarna(r.jenis) + ')'" x-text="leaveJenisLabel(r.jenis)"></span></td>
                    <td class="mono" x-text="r.nik"></td>
                    <td x-text="r.nama"></td>
                    <td class="mono" x-text="r.tanggal"></td>
                    <td class="mono" x-text="r.jenis === 'cuti' ? (r.tanggal_selesai || r.tanggal) : '-'"></td>
                    <td class="mono" x-text="r.jenis === 'cuti' ? (r.jumlah_hari ?? 1) : '-'"></td>
                    <td x-text="r.jenis_cuti || '-'"></td>
                    <td x-text="r.keterangan || '-'"></td>
                    <td x-show="isAdmin()">
                      <button class="btn-secondary btn-sm" @click="editLeave(r)">Edit</button>
                      <button class="btn-secondary btn-sm" @click="deleteLeave(r)">Hapus</button>
                    </td>
                  </tr>
                </template>
                <tr x-show="leaveRows.length === 0"><td :colspan="isAdmin() ? 9 : 8" class="empty-state">Belum ada data.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
          </div>
        </template>

        <template x-if="tab === 'sisa'">
          <div>
        
        <div class="panel">
          <p class="panel-title">Sisa Cuti</p>
          <!-- Tidak ada kotak pencarian: data yang tampil selalu milik akun
               yang sedang login, diambil lewat profiles.nik. Admin yang perlu
               melihat karyawan lain memakai Master Data > Cuti. -->
          <p class="hint" style="margin-bottom:14px;" x-show="!nikSendiri()">
            Akunmu belum dipasangkan ke NIK, jadi sisa cutimu belum bisa
            ditampilkan. Minta admin mengisinya di tabel profiles.
          </p>

          <template x-if="sisaLoading"><p class="empty-state">Memuat sisa cuti...</p></template>

          <p class="hint" x-show="sisaError" style="color:var(--red); font-weight:600;" x-text="sisaError"></p>

          <!-- Hasil pencarian: 1 baris ringkasan per karyawan -->
          <template x-if="sisaHasil.length">
            <div>
              <div class="table-wrap la-table-wrap" style="margin-top:8px;">
                <table class="la-stack">
                  <thead><tr><th>NIK</th><th>Nama</th><th>Sisa Cuti</th><th>Cuti Terakhir</th></tr></thead>
                  <tbody>
                    <template x-for="r in sisaHasil" :key="'sh-'+r.nik">
                      <tr>
                        <td class="mono" data-label="NIK" x-text="r.nik"></td>
                        <td data-label="Nama" x-text="r.nama"></td>
                        <td data-label="Sisa Cuti">
                          <span class="la-badge" :style="'--c: var(--' + (r.sisa < 0 ? 'red' : (r.sisa === 0 ? 'amber' : 'green')) + ')'"
                                x-text="fmtHari(r.sisa) + ' hari'"></span>
                        </td>
                        <td class="mono" data-label="Cuti Terakhir" x-text="r.cutiTerakhir || '-'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <template x-if="sisaSudahCari &amp;&amp; !sisaHasil.length &amp;&amp; !sisaError &amp;&amp; !sisaLoading">
            <p class="empty-state">NIK <span class="mono" x-text="nikSendiri()"></span> tidak ada di master karyawan. Hubungi admin.</p>
          </template>
        </div>

        <!-- Riwayat cuti karyawan yang dipilih -->
        <template x-if="cutiRiwayat.length || cutiPilih">
          <div class="panel">
            <p class="panel-title">Riwayat Cuti
              <span class="count" x-text="cutiRiwayat.length + ' baris'"></span>
            </p>
            <div class="table-wrap la-table-wrap">
              <table class="la-riwayat">
                <thead><tr><th>NIK</th><th>Nama</th><th>Tanggal Cuti</th></tr></thead>
                <tbody>
                  <template x-for="r in cutiRiwayat" :key="'cr-'+r.id">
                    <tr>
                      <td class="mono" data-label="NIK" x-text="r.nik"></td>
                      <td data-label="Nama" x-text="r.nama"></td>
                      <td class="mono" data-label="Tanggal Cuti" x-text="rentangTanggal(r)"></td>
                    </tr>
                  </template>
                  <tr x-show="cutiRiwayat.length === 0"><td colspan="3" class="empty-state">Belum ada riwayat cuti.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </template>
          </div>
        </template>

        <!-- ===== TAB STATUS CUTI SAYA ===== -->
        <template x-if="tab === 'statuscuti'">
          <div>
            <div class="panel">
              <p class="panel-title">Status Pengajuan Cuti Saya <span class="count" x-text="statusCutiRows.length + ' baris'"></span></p>
              <p class="hint" style="margin-bottom:14px;">Daftar cuti yang kamu ajukan dan status persetujuannya.</p>
              <template x-if="statusCutiLoading"><p class="empty-state">Memuat data...</p></template>
              <template x-if="!statusCutiLoading && statusCutiRows.length === 0">
                <p class="empty-state">Belum ada pengajuan cuti.</p>
              </template>
              <template x-if="!statusCutiLoading && statusCutiRows.length > 0">
                <div>
                  <template x-for="r in statusCutiRows" :key="r.id">
                    <div style="border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--panel-2);">
                      <!-- Baris atas: badge jenis + badge status -->
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">
                        <span class="la-badge" :style="'--c: var(--' + ajukanJenisWarna(r.jenis) + ')'" x-text="r.jenis"></span>
                        <span class="la-badge" :style="'--c: var(--' + ajukanStatusWarna(r.status) + ')'" x-text="r.status"></span>
                      </div>
                      <!-- Detail rows -->
                      <div style="font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;">
                        <span style="color:var(--muted);">Tanggal</span>
                        <span class="mono" x-text="ajukanFmtTgl(r.tanggal_mulai, r.tanggal_selesai)"></span>
                        <span style="color:var(--muted);">Hari</span>
                        <span class="mono" x-text="ajukanHari(r) + ' hari'"></span>
                        <template x-if="r.jenis_cuti">
                          <span style="color:var(--muted);">Jenis Cuti</span>
                        </template>
                        <template x-if="r.jenis_cuti">
                          <span x-text="r.jenis_cuti"></span>
                        </template>
                        <span style="color:var(--muted);">Alasan</span>
                        <span x-text="r.alasan || '-'"></span>
                        <template x-if="r.catatan_atasan">
                          <span style="color:var(--muted);">Catatan</span>
                        </template>
                        <template x-if="r.catatan_atasan">
                          <span x-text="r.catatan_atasan"></span>
                        </template>
                        <span style="color:var(--muted);">Diajukan</span>
                        <span class="mono" x-text="fmtTgl(r.created_at?.slice(0,10))"></span>
                      </div>
                      <!-- Tombol batalkan — hanya untuk yang masih Menunggu -->
                      <template x-if="r.status === 'Menunggu'">
                        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
                          <button type="button" class="btn-secondary btn-sm" style="color:var(--red);border-color:var(--red);font-size:12px;" @click="batalkanCuti(r)">🗑 Batalkan Pengajuan</button>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- ===== TAB PERLU DISETUJUI (Foreman / Supervisor) ===== -->
        <template x-if="tab === 'approve' && canApprove">
          <div>
            <div class="panel">
              <p class="panel-title">Pengajuan yang Perlu Disetujui</p>

              <!-- Notifikasi WA ke pengaju setelah approve/tolak. Muncul kalau
                   browser memblokir jendela WA yang dibuka otomatis. -->
              <template x-if="notifPengaju">
                <div style="margin-bottom:14px;padding:14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--green) 40%,transparent);background:color-mix(in srgb,var(--green) 8%,var(--panel));">
                  <p style="font-size:13px;font-weight:700;margin-bottom:6px;" x-text="'Beri tahu ' + notifPengaju.nama + ' bahwa cutinya ' + notifPengaju.statusTeks"></p>
                  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <button type="button" class="btn-primary btn-sm" style="background:#25d366;" @click="bukaWa(notifPengaju.noWa, notifPengaju.pesan); notifPengaju = null">📲 Kirim WA ke Pengaju</button>
                    <button type="button" class="btn-secondary btn-sm" style="font-size:11px;" @click="notifPengaju = null">✕ Tutup</button>
                  </div>
                </div>
              </template>

              <template x-if="approveLoading"><p class="empty-state">Memuat data...</p></template>
              <template x-if="!approveLoading && pendingApprovals.length === 0">
                <p class="empty-state">Tidak ada pengajuan yang menunggu persetujuan kamu.</p>
              </template>
              <template x-for="r in pendingApprovals" :key="r.id">
                <div style="border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--panel-2);">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
                    <div>
                      <div style="font-weight:700;font-size:15px;" x-text="r.nama || r.pengaju?.full_name || '—'"></div>
                      <div style="font-size:12px;color:var(--muted);margin-top:3px;">
                        <span class="la-badge" :style="'--c: var(--' + ajukanJenisWarna(r.jenis) + ')'" x-text="r.jenis"></span>
                        &nbsp;<span class="mono" x-text="ajukanFmtTgl(r.tanggal_mulai, r.tanggal_selesai)"></span>
                        &nbsp;(<span x-text="ajukanHari(r)"></span> hari<span x-show="r.jenis_cuti" x-text="', ' + r.jenis_cuti"></span>)
                      </div>
                      <div x-show="r.alasan" style="font-size:12px;color:var(--muted);margin-top:4px;font-style:italic;" x-text="'Alasan: ' + r.alasan"></div>
                    </div>
                    <div style="font-size:11px;color:var(--muted);white-space:nowrap;" x-text="fmtTgl(r.tanggal_mulai)"></div>
                  </div>
                  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
                    <button type="button" class="btn-secondary btn-sm" @click="bukaApprovalLink(r)">🔗 Buka link approval</button>
                    <button type="button" class="btn-secondary btn-sm" :disabled="r._loading" @click="quickApprove(r,'tolak')" style="color:var(--red)">✕ Tolak</button>
                    <button type="button" class="btn-primary btn-sm" :disabled="r._loading" @click="quickApprove(r,'approve')">✓ Setujui</button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

      </div>
    </template>
  </main>
</div>
<script>

function baseInputPage() {
  return {
    session: null, profile: null, mobileNavOpen: false, sidebarCollapsed: true,
    theme: localStorage.getItem("theme_v1") || "light",
    msg: "", msgError: false,
        isAdmin() { return this.profile?.role === "admin"; },

    // Viewer: karyawan yang boleh buka Dashboard Exhaust + Attendance saja.
    isViewer() { return (this.profile?.role || "").toLowerCase() === "viewer"; },
    isLeaderOrAdmin() { if (!this.profile) return false; const r = (this.profile.role||"").toLowerCase(); const j = (this.profile.jabatan||"").toLowerCase(); return ["admin","leader"].includes(r) || ["admin","leader"].includes(j); },
    flash(m, isErr) {
      this.msg = m; this.msgError = !!isErr;
      setTimeout(() => { this.msg = ""; }, 4000);
    },
    async initBase() {
      this.session = await requireAuth();
      if (!this.session) return false;
      const { data } = await supabaseClient.from("profiles").select("*").eq("id", this.session.user.id).maybeSingle();
      this.profile = data;
      return true;
    },
    logout,
  };
}
// toISOString().slice(0,10) mengonversi ke UTC dulu -- WIB = UTC+7, jadi
// tengah malam lokal bisa terpotong mundur 1 hari. Ambil Y/M/D lokal saja.
function localDateStr(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function attendancePage() {
  return {
    ...baseInputPage(),
    // ---- Form Izin/Sakit/Cuti/Mangkir (per-orang) ----
    leaveForm: { tanggal: localDateStr(new Date()), tanggal_selesai: localDateStr(new Date()), jenis: "izin", nik: "", nama: "", jenis_cuti: "", keterangan: "" },
    _profileNik: "",    // NIK dari profil login — disimpan untuk reset form
    _profileNama: "",   // Nama dari profil login — disimpan untuk reset form
    leaveRows: [],
    leaveEditId: null,
    leaveNikFound: false,
    _leaveNikLookupTimer: null,
    // Daftar tanggal merah (dari tabel hari_libur) -- dipakai supaya
    // Total Hari Cuti otomatis skip tanggal itu juga. Tabel hari_libur
    // sendiri sekarang dikelola dari halaman Master Data > Attendance --
    // di sini cuma DIBACA (read-only) buat perhitungan preview.
    hariLibur: [],
    // Riwayat upload Shift 2 (read-only di sini, dikelola dari Master
    // Data > Attendance > Riwayat Upload Shift 2). Shift 2 rotasi
    // mingguan, jadi disimpan per PERIODE (tanggal_mulai-selesai), bukan
    // satu nilai tetap per NIK -- dipakai supaya Total Hari tahu apakah
    // cuti di tanggal Ganti Hari memotong jatah orang ini atau tidak,
    // PADA MINGGU tanggal cuti itu.
    shift2Periodes: [],   // { tanggal_mulai, tanggal_selesai, nikSet:Set }
    // WA notification setelah simpan — persisten via localStorage
    leaveWaPesan: null,        // pesan yang ditampilkan ke user (cuti: tanpa link)
    leaveWaPesanAtasan: null,  // pesan yang dikirim ke atasan (cuti: dengan link)
    leaveWaTarget: null,
    leaveWaJenis: null,   // 'cuti' / 'izin' / 'sakit' — untuk label kotak
    // Info atasan (cached, dipakai untuk WA notification)
    atasanInfo: null,
    // Status cuti saya (tab statuscuti)
    statusCutiRows: [],
    statusCutiLoading: false,

    // ===== STATE: Approve panel =====
    canApprove: false,
    pendingApprovals: [],
    pendingCount: 0,
    approveLoading: false,
    notifPengaju: null,   // { nama, noWa, pesan, statusTeks } -- fallback kalau pop-up WA diblokir
    leaveSaving: false,   // cegah tombol Simpan diklik dua kali

    async init() {
      if (!await this.initBase()) return;
      // Pulihkan notifikasi WA yang belum dikirim (bertahan walau refresh)
      try {
        const saved = localStorage.getItem('leaveWaState_' + this.session?.user?.id);
        if (saved) {
          const s = JSON.parse(saved);
          this.leaveWaPesan        = s.pesan        || null;
          this.leaveWaPesanAtasan  = s.pesanAtasan  || s.pesan || null;
          this.leaveWaTarget       = s.target       || null;
          this.leaveWaJenis        = s.jenis        || null;
        }
      } catch(e) {}
      // NIK & Nama otomatis dari profil yang login
      await this.prefillNikFromProfile();
      await this.fetchLeaveRows();
      await this.fetchHariLibur();
      await this.fetchShift2Periodes();
      this.initRealtime();
      // Tab Sisa Cuti langsung menampilkan milik yang sedang login,
      // tanpa perlu mengetik NIK sendiri.
      await this.muatSisaCutiSendiri();
      // Cek apakah user ini Foreman/Supervisor (bisa approve)
      await this.initApproveState();
    },
    // ---- NIK Auto-fill ----
    // Isi NIK & Nama dari profil yang sedang login. Dipanggil sekali di init().
    // Kalau profiles.nik kosong (akun belum dipasangkan), form tetap kosong
    // dan user bisa ketik manual seperti sebelumnya.
    async prefillNikFromProfile() {
      const nik = (this.profile?.nik || '').trim();
      if (!nik) return;
      // Cari nama dari karyawan_master supaya konsisten
      const { data } = await supabaseClient
        .from('karyawan_master').select('nama').eq('nik', nik).maybeSingle();
      const nama = (data && data.nama) ? data.nama : (this.profile?.full_name || '');
      if (!nama) return;
      // Simpan untuk dipakai ulang di resetLeaveForm()
      this._profileNik  = nik;
      this._profileNama = nama;
      // Isi form sekarang
      this.leaveForm.nik  = nik;
      this.leaveForm.nama = nama;
      this.leaveNikFound  = true;
    },

    // ---- Izin/Sakit/Cuti/Mangkir ----
    // Riwayat hanya menampilkan data yang DIINPUT oleh orang yang sedang
    // login (kolom created_by). Jadi si A tidak melihat catatan si B.
    // Admin bisa membuka tampilan semua lewat tombol di panel riwayat.
    leaveLihatSemua: false,
    async fetchLeaveRows() {
      let q = supabaseClient.from("attendance_leave").select("*").order("tanggal", { ascending: false }).limit(200);
      if (!(this.leaveLihatSemua && this.isAdmin())) q = q.eq("created_by", this.session.user.id);
      const { data, error } = await q;
      if (!error && data) this.leaveRows = data;
    },
    // Daftar jenis ketidakhadiran + warnanya. Satu sumber dipakai
    // dua tempat: tombol pilihan di form, dan penanda warna di tabel
    // riwayat -- supaya keduanya tidak pernah beda.
    // `warna` merujuk ke nama variabel CSS di assets/style.css
    // (--blue, --amber, --green, --red).
    LEAVE_JENIS: [
      { key: "izin",    label: "Izin",    warna: "blue"  },
      { key: "sakit",   label: "Sakit",   warna: "amber" },
      { key: "cuti",    label: "Cuti",    warna: "green" },
      { key: "mangkir", label: "Mangkir", warna: "red"   },
    ],
    // ================= REALTIME =================
    // Begitu ada orang lain menyimpan / mengubah / menghapus data,
    // halaman ini ikut menyegarkan sendiri tanpa perlu di-reload.
    // Polanya sama dengan assets/machine-page.js > initRealtime().
    _rtChannel: null,
    _rtTimers: {},
    // Beberapa perubahan bisa datang beruntun (mis. simpan banyak baris
    // sekaligus). Ditunda sebentar supaya tidak menembak query berkali-kali.
    _rtDebounce(key, fn, delayMs = 400) {
      clearTimeout(this._rtTimers[key]);
      this._rtTimers[key] = setTimeout(fn, delayMs);
    },
    initRealtime() {
      if (this._rtChannel) return;   // sudah jalan, jangan dobel subscribe
      let channel = supabaseClient.channel("rt_attendance");

      // Data ketidakhadiran berubah -> riwayat disegarkan. Kalau tab
      // Sisa Cuti sedang terbuka DAN sudah pernah mencari, hasilnya
      // ikut dihitung ulang supaya sisa cutinya tidak basi.
      channel = channel.on(
        "postgres_changes",
        { event: "*", schema: "public", table: "attendance_leave" },
        () => {
          this._rtDebounce("leave", () => this.fetchLeaveRows());
          this._rtDebounce("sisa", () => {
            if (this.tab === "sisa" && this.sisaSudahCari) this.cariSisaCuti();
          }, 700);
        }
      );

      // Jatah cuti diubah di Master Data > Cuti -> sisa cuti ikut berubah.
      channel = channel.on(
        "postgres_changes",
        { event: "*", schema: "public", table: "cuti_jatah" },
        () => {
          this._rtDebounce("sisa", () => {
            if (this.tab === "sisa" && this.sisaSudahCari) this.cariSisaCuti();
          }, 700);
        }
      );

      // Hari libur dipakai untuk menghitung Total Hari cuti.
      channel = channel.on(
        "postgres_changes",
        { event: "*", schema: "public", table: "hari_libur" },
        () => this._rtDebounce("libur", () => this.fetchHariLibur())
      );

      // Pengajuan cuti berubah (baru, disetujui, ditolak, dibatalkan) ->
      // tab Status Cuti & Perlu Disetujui ikut segar. RLS membatasi event
      // yang diterima hanya ke baris milik sendiri / yang ditujukan ke kita.
      channel = channel.on(
        "postgres_changes",
        { event: "*", schema: "public", table: "leave_requests" },
        () => {
          this._rtDebounce("lr", () => {
            if (this.tab === "statuscuti") this.loadStatusCutiSaya();
            if (this.canApprove) {
              if (this.tab === "approve") this.loadPendingApprovals();
              else this.loadPendingCount();
            }
          }, 500);
        }
      );

      this._rtChannel = channel.subscribe();
      // Tutup koneksi rapi-rapi kalau tab ditutup / pindah halaman.
      window.addEventListener("beforeunload", () => {
        if (this._rtChannel) supabaseClient.removeChannel(this._rtChannel);
      });
    },

    // ================= SISA CUTI =================
    // Tab aktif halaman ini: "form" = Form Ketidakhadiran, "sisa" = Sisa Cuti.
    // WAJIB ada -- kalau tidak, kedua <template x-if> tidak ada yang cocok
    // dan halamannya tampil kosong.
    tab: "form",
    // Halaman ini hanya untuk MELIHAT. Jatah cutinya diatur di
    // master-data.html > tab Cuti. Di sini sisa selalu dihitung ulang:
    //   Sisa = Jatah tahun berjalan - Cuti Tahunan yang sudah terpakai
    // Tidak ada kolom "sisa" yang disimpan, supaya angkanya tidak basi
    // kalau ada baris cuti yang diedit atau dihapus.
    sisaCari: "",
    sisaLoading: false,
    sisaError: "",
    sisaSudahCari: false,
    sisaHasil: [],        // hasil pencarian karyawan
    cutiPilih: null,      // karyawan yang riwayatnya sedang ditampilkan
    cutiRiwayat: [],
    JATAH_DEFAULT: 12,    // dipakai kalau karyawan belum diatur jatahnya

    // NIK milik akun yang sedang login (kolom profiles.nik, dipakai juga
    // untuk login pakai NIK). Kosong = akunnya belum dipasangkan ke NIK.
    nikSendiri() { return (this.profile && this.profile.nik) ? String(this.profile.nik).trim() : ""; },
    async muatSisaCutiSendiri() {
      const nik = this.nikSendiri();
      if (!nik) return;              // belum punya NIK -> biarkan kotak cari kosong
      this.sisaCari = nik;
      await this.cariSisaCuti();
      this.sisaMilikSendiri = true;  // menandai hasil ini punya sendiri
    },
    sisaMilikSendiri: false,
    async cariSisaCuti() {
      const cari = (this.sisaCari || "").trim();
      this.sisaError = "";
      this.sisaMilikSendiri = cari === this.nikSendiri() && cari !== "";
      if (!cari) { this.sisaError = "Ketik NIK atau nama dulu."; return; }
      this.sisaLoading = true;
      this.cutiPilih = null;
      this.cutiRiwayat = [];
      try {
        const tahun = new Date().getFullYear();
        // Cari di master karyawan: cocok kalau NIK atau namanya mengandung
        // kata yang diketik (tidak peduli huruf besar/kecil).
        const { data: kar, error: errKar } = await supabaseClient
          .from("karyawan_master").select("nik,nama")
          .or("nik.ilike.%" + cari + "%,nama.ilike.%" + cari + "%")
          .order("nama").limit(25);
        if (errKar) { this.sisaError = "Gagal mencari karyawan: " + errKar.message; return; }

        this.sisaSudahCari = true;
        const list = kar || [];
        if (!list.length) { this.sisaHasil = []; return; }
        const niks = list.map((k) => k.nik);

        const [jatahRes, cutiRes] = await Promise.all([
          supabaseClient.from("cuti_jatah").select("nik,jatah").eq("tahun", tahun).in("nik", niks),
          supabaseClient.from("attendance_leave").select("id,nik,nama,tanggal,tanggal_selesai,jenis,jenis_cuti,jumlah_hari")
            .eq("jenis", "cuti").in("nik", niks).order("tanggal", { ascending: false }),
        ]);
        if (jatahRes.error) {
          this.sisaError = "Gagal memuat jatah cuti: " + jatahRes.error.message
            + (String(jatahRes.error.message).toLowerCase().includes("cuti_jatah")
                ? " — tabel cuti_jatah belum ada. Jalankan migration_cuti_jatah.sql di Supabase SQL Editor."
                : "");
          return;
        }
        if (cutiRes.error) { this.sisaError = "Gagal memuat data cuti: " + cutiRes.error.message; return; }

        const jatahMap = {};
        (jatahRes.data || []).forEach((r) => { jatahMap[r.nik] = Number(r.jatah); });
        this._cutiSemua = cutiRes.data || [];

        this.sisaHasil = list.map((k) => {
          const punya = this._cutiSemua.filter((c) => c.nik === k.nik);
          // Hanya Cuti Tahunan yang memotong jatah, dan hanya tahun berjalan.
          // Cuti Khusus (dan data lama Besar/Melahirkan/Lainnya) TIDAK memotong.
          const terpakai = punya
            .filter((c) => c.jenis_cuti === "Cuti Tahunan" && String(c.tanggal).slice(0, 4) === String(tahun))
            .reduce((a, c) => a + Number(c.jumlah_hari ?? 1), 0);
          const jatah = jatahMap[k.nik] !== undefined ? jatahMap[k.nik] : this.JATAH_DEFAULT;
          const terakhir = punya.length ? punya[0].tanggal : null;
          return { nik: k.nik, nama: k.nama, jatah, terpakai, sisa: jatah - terpakai, cutiTerakhir: this.fmtTgl(terakhir) };
        });

        // Kalau hasilnya cuma satu orang, riwayatnya langsung dibuka --
        // itu yang paling sering dicari, tidak perlu klik lagi.
        if (this.sisaHasil.length === 1) this.pilihKaryawanCuti(this.sisaHasil[0]);
      } finally {
        this.sisaLoading = false;
      }
    },
    pilihKaryawanCuti(r) {
      this.cutiPilih = r;
      this.cutiRiwayat = (this._cutiSemua || []).filter((c) => c.nik === r.nik);
    },
    // "07/07/2026" -- untuk cuti beberapa hari ditulis rentangnya
    fmtTgl(t) {
      if (!t) return "";
      const [y, m, d] = String(t).slice(0, 10).split("-");
      return d + "/" + m + "/" + y;
    },
    rentangTanggal(r) {
      const a = this.fmtTgl(r.tanggal);
      const b = r.tanggal_selesai ? this.fmtTgl(r.tanggal_selesai) : "";
      return b && b !== a ? a + " — " + b : a;
    },
    // Angka hari: tanpa desimal kalau bulat (12), 1 desimal kalau setengah
    // hari (12,5) -- cuti setengah hari itu hal yang wajar.
    fmtHari(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "0";
      return Number.isInteger(v) ? String(v) : v.toFixed(1).replace(".", ",");
    },

    leaveJenisWarna(j) {
      const found = this.LEAVE_JENIS.find((x) => x.key === j);
      return found ? found.warna : "muted";
    },
    leaveJenisLabel(j) {
      return { izin: "Izin", sakit: "Sakit", cuti: "Cuti", mangkir: "Mangkir" }[j] || j;
    },
    // Dipanggil tiap kali user ngetik di field NIK -- di-debounce dikit
    // (300ms) supaya tidak nembak query ke Supabase tiap 1 huruf.
    onLeaveNikInput() {
      this.leaveNikFound = false;
      clearTimeout(this._leaveNikLookupTimer);
      const nik = (this.leaveForm.nik || "").trim();
      if (!nik) { this.leaveForm.nama = ""; return; }
      this._leaveNikLookupTimer = setTimeout(async () => {
        const { data } = await supabaseClient.from("karyawan_master").select("nama").eq("nik", nik).maybeSingle();
        if (data && data.nama) {
          this.leaveForm.nama = data.nama;
          this.leaveNikFound = true;
        }
      }, 300);
    },
    onLeaveJenisChange() {
      if (this.leaveForm.jenis === "cuti" && (!this.leaveForm.tanggal_selesai || this.leaveForm.tanggal_selesai < this.leaveForm.tanggal)) {
        this.leaveForm.tanggal_selesai = this.leaveForm.tanggal;
      }
    },
    // Hari yang dihitung antara 2 tanggal (inklusif tanggal mulai & selesai):
    //  - Minggu: selalu tidak dihitung.
    //  - Senin-Jumat: dihitung, KECUALI tanggal merah biasa (jenis 'libur').
    //  - Sabtu: TIDAK dihitung, kecuali ada catatan Ganti Hari (jenis
    //    'ganti_hari') di tanggal itu DAN shift orang ini cocok (atau
    //    catatannya 'penuh' -- berarti semua shift masuk). Shift orang
    //    dicek PER HARI lewat shiftPadaTanggal() (Shift 2 rotasi mingguan,
    //    NIK yang sedang diisi di form). Kalau shift-nya belum tercatat
    //    untuk minggu itu, dianggap tidak dihitung (aman, tidak memotong
    //    jatah secara tidak sengaja).
    // Ini cuma PREVIEW di layar. Angka final yang tersimpan tetap dihitung
    // ulang oleh trigger set_jumlah_hari_cuti() di database (lihat
    // migration_shift2_periode.sql) -- rumusnya harus sama persis dengan
    // di sini, dan dengan rkHitungHari() di master-data.html.
    //
    // SATU-SATUNYA rumus hitung hari di halaman ini. Dipakai oleh form
    // (leaveTotalHari), pesan WA (leaveTotalHariDari), dan tab Status /
    // Perlu Disetujui (ajukanHari, kalau jumlah_hari dari server belum ada).
    // Versi database-nya: public.hitung_hari_cuti() di
    // migration_approval_cuti_v2.sql -- rumusnya harus sama persis.
    hitungHariKerja(nik, mulai, selesai) {
      selesai = selesai || mulai;
      if (!mulai || !selesai) return 0;
      const d = new Date(String(mulai).slice(0, 10) + "T00:00:00");
      const akhir = new Date(String(selesai).slice(0, 10) + "T00:00:00");
      if (isNaN(d) || isNaN(akhir) || akhir < d) return 0;
      const nikStr = String(nik || "").trim();
      let total = 0;
      while (d <= akhir) {
        const dow = d.getDay(); // 0 = Minggu, 6 = Sabtu
        const dStr = localDateStr(d);
        const lib = this.hariLibur.find((r) => r.tanggal === dStr);
        if (dow === 0) {
          // Minggu: tidak dihitung
        } else if (dow === 6) {
          if (lib && lib.jenis === "ganti_hari" && (lib.shift === "penuh" || lib.shift === this.shiftPadaTanggal(nikStr, dStr))) total++;
        } else {
          if (!lib || lib.jenis !== "libur") total++;
        }
        d.setDate(d.getDate() + 1);
      }
      return total;
    },
    leaveTotalHari() {
      return this.hitungHariKerja(this.leaveForm.nik, this.leaveForm.tanggal, this.leaveForm.tanggal_selesai || this.leaveForm.tanggal);
    },
    // Baca daftar hari libur & ganti hari (read-only) -- pengelolaan
    // (tambah/hapus) ada di halaman Master Data > Attendance.
    async fetchHariLibur() {
      const { data, error } = await supabaseClient.from("hari_libur").select("*").order("tanggal", { ascending: true });
      if (!error && data) this.hariLibur = data;
    },
    // Baca riwayat upload Shift 2 (read-only) -- pengelolaan (upload/hapus)
    // ada di halaman Master Data > Attendance > Riwayat Upload Shift 2.
    async fetchShift2Periodes() {
      const [pRes, dRes] = await Promise.all([
        supabaseClient.from("shift2_periode").select("id,tanggal_mulai,tanggal_selesai"),
        supabaseClient.from("shift2_periode_detail").select("periode_id,nik"),
      ]);
      const periode = pRes.data || [];
      const detail = dRes.data || [];
      this.shift2Periodes = periode.map((p) => ({
        tanggal_mulai: p.tanggal_mulai,
        tanggal_selesai: p.tanggal_selesai,
        nikSet: new Set(detail.filter((d) => d.periode_id === p.id).map((d) => d.nik)),
      }));
    },
    // Shift NIK X pada tanggal Y ("1"/"2"/null) -- HARUS SAMA PERSIS dengan
    // public.shift_pada_tanggal() di migration_shift2_periode.sql dan
    // shiftPadaTanggal() di master-data.html.
    shiftPadaTanggal(nik, tanggalStr) {
      const cocok = this.shift2Periodes.filter((p) => tanggalStr >= p.tanggal_mulai && tanggalStr <= p.tanggal_selesai);
      if (cocok.length === 0) return null;
      cocok.sort((a, b) => (a.tanggal_mulai < b.tanggal_mulai ? 1 : -1));   // periode terbaru dulu
      return cocok[0].nikSet.has(nik) ? "2" : "1";
    },
    resetLeaveForm() {
      // Prefill ulang NIK & Nama dari profil yang login (sudah di-cache di _profileNik/_profileNama)
      const nik  = this._profileNik  || '';
      const nama = this._profileNama || '';
      this.leaveForm = { tanggal: localDateStr(new Date()), tanggal_selesai: localDateStr(new Date()), jenis: "izin", nik, nama, jenis_cuti: "", keterangan: "" };
      this.leaveEditId   = null;
      this.leaveNikFound = !!nik;
      // leaveWaPesan & leaveWaTarget TIDAK direset di sini supaya kotak WA
      // tetap muncul setelah form dikosongkan. Dibersihkan di awal saveLeave()
      // atau saat user menekan "Batal Edit".
    },
    clearLeaveWA() {
      this.leaveWaPesan       = null;
      this.leaveWaPesanAtasan = null;
      this.leaveWaTarget      = null;
      this.leaveWaJenis       = null;
      try { localStorage.removeItem('leaveWaState_' + this.session?.user?.id); } catch(e) {}
    },
    editLeave(r) {
      // Data lama bisa berisi Cuti Besar / Cuti Melahirkan / Cuti Lainnya.
      // Pilihan itu sudah dihapus dari dropdown, jadi kalau dibiarkan
      // dropdown-nya tampil kosong. Semuanya dulu juga tidak memotong
      // jatah, jadi dipetakan ke Cuti Khusus (hasil hitungan tidak berubah).
      let jenisCuti = r.jenis_cuti || "";
      if (r.jenis === "cuti" && jenisCuti && !["Cuti Tahunan", "Cuti Khusus"].includes(jenisCuti)) jenisCuti = "Cuti Khusus";
      this.leaveForm = { tanggal: r.tanggal, tanggal_selesai: r.tanggal_selesai || r.tanggal, jenis: r.jenis, nik: r.nik, nama: r.nama, jenis_cuti: jenisCuti, keterangan: r.keterangan || "" };
      this.leaveEditId = r.id;
      this.leaveNikFound = true;
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    async saveLeave() {
      this.leaveWaPesan       = null;
      this.leaveWaPesanAtasan = null;
      this.leaveWaTarget      = null;
      const f = this.leaveForm;
      const nik = (f.nik || "").trim();
      const nama = (f.nama || "").trim();
      const keterangan = (f.keterangan || "").trim();
      // Semua kolom wajib diisi. Dicek satu per satu supaya pesannya
      // menyebut kolom mana yang kurang, bukan sekadar "ada yang kosong".
      if (!f.jenis) { this.flash("Jenis wajib dipilih.", true); return; }
      if (!nik) { this.flash("NIK wajib diisi.", true); return; }
      if (!this.leaveNikFound || !nama) { this.flash("NIK tidak terdaftar di master karyawan. Hubungi admin untuk menambahkannya.", true); return; }
      if (!f.tanggal) { this.flash(f.jenis === "cuti" ? "Tanggal Mulai wajib diisi." : "Tanggal wajib diisi.", true); return; }
      if (f.jenis === "cuti" && !f.tanggal_selesai) { this.flash("Tanggal Selesai wajib diisi.", true); return; }
      if (f.jenis === "cuti" && !f.jenis_cuti) { this.flash("Jenis Cuti wajib dipilih.", true); return; }
      if (!keterangan) { this.flash("Keterangan wajib diisi.", true); return; }

      const tanggalSelesai = f.jenis === "cuti" ? f.tanggal_selesai : null;
      if (f.jenis === "cuti" && tanggalSelesai < f.tanggal) { this.flash("Tanggal Selesai tidak boleh sebelum Tanggal Mulai.", true); return; }

      // ---- CUTI BARU: masuk leave_requests dulu, BUKAN attendance_leave ----
      // Data cuti baru tercatat (dan jatah terpotong) setelah atasan
      // menyetujui -- proses_approval_cuti() di database yang menyalinnya
      // ke attendance_leave. Ditolak / dibatalkan = tidak pernah tercatat.
      // Edit baris cuti yang SUDAH tercatat (admin) tetap langsung ke
      // attendance_leave seperti sebelumnya.
      if (f.jenis === "cuti" && !this.leaveEditId) {
        const hari = this.leaveTotalHari();
        if (hari <= 0) { this.flash("Tidak ada hari kerja di rentang tanggal ini (Minggu / tanggal merah). Periksa tanggalnya.", true); return; }

        this.leaveSaving = true;
        let req, error;
        try {
          ({ data: req, error } = await supabaseClient.from("leave_requests").insert({
            user_id: this.session.user.id,
            jenis: "Cuti",
            tanggal_mulai: f.tanggal,
            tanggal_selesai: tanggalSelesai,
            alasan: keterangan,
            nik, nama,
            jenis_cuti: f.jenis_cuti,
            jumlah_hari: hari,   // hanya perkiraan -- server menghitung ulang
            // atasan_id sengaja TIDAK dikirim: ditentukan server (get_atasan_id)
          }).select("id,token,jumlah_hari").single());
        } finally {
          this.leaveSaving = false;
        }
        if (error || !req) { this.flash("Gagal mengajukan cuti: " + (error?.message || "tidak ada respon"), true); return; }

        this.flash("Pengajuan cuti terkirim. Jatah cuti baru terpotong setelah disetujui atasan.");
        const snapF = { ...f };
        this.resetLeaveForm();
        await this.generateLeaveWA(snapF, nik, nama, keterangan, { token: req.token, hari: req.jumlah_hari ?? hari });
        if (this.leaveWaTarget) this.sendLeaveWA();
        return;
      }

      const payload = {
        tanggal: f.tanggal, tanggal_selesai: tanggalSelesai, nik, nama, jenis: f.jenis,
        jenis_cuti: f.jenis === "cuti" ? f.jenis_cuti : null,
        keterangan,
        updated_by: this.session.user.id,
      };
      this.leaveSaving = true;
      let error;
      try {
        if (this.leaveEditId) {
          ({ error } = await supabaseClient.from("attendance_leave").update(payload).eq("id", this.leaveEditId));
        } else {
          ({ error } = await supabaseClient.from("attendance_leave").insert({ ...payload, created_by: this.session.user.id }));
        }
      } finally {
        this.leaveSaving = false;
      }
      if (error) { this.flash("Gagal simpan: " + error.message, true); return; }
      this.flash("Data tersimpan.");

      // Snapshot sebelum form direset
      const isBaruBukanEdit = !this.leaveEditId;
      const snapJenis = f.jenis, snapF = { ...f };

      this.resetLeaveForm();
      await this.fetchLeaveRows();

      // Izin / Sakit baru: kirim pemberitahuan ke atasan (tanpa approval)
      if (isBaruBukanEdit && ['izin','sakit'].includes(snapJenis)) {
        await this.generateLeaveWA(snapF, nik, nama, keterangan);
        if (this.leaveWaTarget) this.sendLeaveWA();
      }
    },

    // Susun pesan WA ke atasan. Untuk cuti, `opts.token` adalah token
    // pengajuan yang sudah dibuat di saveLeave() -- fungsi ini TIDAK lagi
    // membuat baris leave_requests sendiri.
    async generateLeaveWA(f, nik, nama, keterangan, opts = {}) {
      const jenis = f.jenis; // 'cuti' / 'izin' / 'sakit'

      if (!this.atasanInfo) await this.muatAtasanInfo();

      const namaKu = nama || this.profile?.full_name || 'Karyawan';
      const tglMulai = this.fmtTgl(f.tanggal);
      const tglSelesai = f.tanggal_selesai ? this.fmtTgl(f.tanggal_selesai) : tglMulai;
      const tglStr = tglMulai === tglSelesai ? tglMulai : tglMulai + ' – ' + tglSelesai;
      const hari = opts.hari ?? this.leaveTotalHariDari(f.tanggal, f.tanggal_selesai || f.tanggal, nik);
      const alasanTeks = keterangan ? '\nAlasan: ' + keterangan : '';
      const jenisLabel = { cuti:'Cuti', izin:'Izin', sakit:'Sakit' }[jenis] || jenis;

      const pesanDasar =
        '📋 *' + (jenis === 'cuti' ? 'Pengajuan Cuti' : 'Pemberitahuan ' + jenisLabel) + '*\n\n' +
        'Nama: *' + namaKu + '* (NIK ' + nik + ')\n' +
        'Tanggal: *' + tglStr + '* (' + hari + ' hari)' +
        (jenis === 'cuti' && f.jenis_cuti ? '\nJenis: ' + f.jenis_cuti : '') +
        alasanTeks;

      let pesan;
      if (jenis === 'cuti') {
        const approvalLink = opts.token
          ? '\n\n👆 *Ketuk link di bawah untuk approve/tolak* (login dengan akun atasan):\n' +
            window.location.origin + '/approval-cuti.html?token=' + opts.token
          : '';
        pesan = pesanDasar + '\n\n_Status: menunggu persetujuan atasan_';   // ditampilkan ke pengaju
        this.leaveWaPesanAtasan = pesanDasar + approvalLink;                  // dikirim ke atasan
      } else {
        pesan = pesanDasar + '\n\n_(Tidak memerlukan persetujuan)_';
        this.leaveWaPesanAtasan = pesan;
      }

      this.leaveWaPesan  = pesan;
      this.leaveWaJenis  = jenis;
      this.leaveWaTarget = this.atasanInfo?.no_wa || null;

      // Simpan ke localStorage supaya tidak hilang kalau refresh
      try {
        localStorage.setItem('leaveWaState_' + this.session.user.id, JSON.stringify({
          pesan:       this.leaveWaPesan,
          pesanAtasan: this.leaveWaPesanAtasan,
          target:      this.leaveWaTarget,
          jenis:       this.leaveWaJenis,
        }));
      } catch(e) {}
    },

    // Versi tanpa akses ke this.leaveForm -- rumusnya SAMA dengan form
    // (termasuk cek shift untuk Sabtu Ganti Hari).
    leaveTotalHariDari(mulai, selesai, nik) {
      return this.hitungHariKerja(nik ?? this.leaveForm.nik, mulai, selesai);
    },

    // Ambil info atasan (id, nama, no WA) sekali, lalu di-cache
    async muatAtasanInfo() {
      try {
        const { data: atasanId, error } = await supabaseClient.rpc('get_atasan_id', { p_user_id: this.session.user.id });
        if (!error && atasanId) {
          const { data: ap } = await supabaseClient.from('profiles').select('id,full_name,no_wa').eq('id', atasanId).maybeSingle();
          this.atasanInfo = ap || null;
        } else {
          this.atasanInfo = null;
        }
      } catch(e) { this.atasanInfo = null; }
    },

    // Buka WhatsApp ke nomor tertentu. Mengembalikan false kalau pop-up
    // diblokir browser (biasanya karena dipanggil setelah await).
    bukaWa(noWa, pesan) {
      let no = String(noWa || '').replace(/\D/g, '');
      if (!no) return false;
      if (no.startsWith('0')) no = '62' + no.slice(1);
      const w = window.open('https://wa.me/' + no + '?text=' + encodeURIComponent(pesan), '_blank');
      return !!w;
    },
    sendLeaveWA() {
      if (!this.leaveWaTarget || !this.leaveWaPesanAtasan) return;
      // Kalau pop-up diblokir, kotak WA dibiarkan supaya user bisa klik tombolnya.
      if (this.bukaWa(this.leaveWaTarget, this.leaveWaPesanAtasan)) {
        setTimeout(() => this.clearLeaveWA(), 1500);
      }
    },
    async deleteLeave(r) {
      if (!confirm(`Hapus data ${this.leaveJenisLabel(r.jenis)} atas nama ${r.nama} (${r.tanggal})?`)) return;
      const { error } = await supabaseClient.from("attendance_leave").delete().eq("id", r.id);
      if (error) { this.flash("Gagal hapus: " + error.message, true); return; }
      this.flash("Data dihapus.");
      await this.fetchLeaveRows();
    },

    // ===== STATUS CUTI SAYA =====
    async loadStatusCutiSaya() {
      this.statusCutiLoading = true;
      try {
        const { data, error } = await supabaseClient
          .from('leave_requests')
          .select('id,jenis,jenis_cuti,nik,jumlah_hari,tanggal_mulai,tanggal_selesai,alasan,status,catatan_atasan,created_at,approved_at')
          .eq('user_id', this.session.user.id)
          .order('created_at', { ascending: false })
          .limit(50);
        if (error) throw error;
        this.statusCutiRows = data || [];
      } catch(e) {
        this.flash('Gagal memuat status cuti: ' + (e.message || e), true);
        this.statusCutiRows = [];
      } finally {
        this.statusCutiLoading = false;
      }
    },
    async batalkanCuti(r) {
      if (!confirm('Batalkan pengajuan cuti tanggal ' + this.ajukanFmtTgl(r.tanggal_mulai, r.tanggal_selesai) + '?')) return;
      const { error } = await supabaseClient
        .from('leave_requests')
        .delete()
        .eq('id', r.id)
        .eq('user_id', this.session.user.id)
        .eq('status', 'Menunggu');  // double-check: hanya boleh hapus yg masih Menunggu
      if (error) { this.flash('Gagal batalkan: ' + error.message, true); return; }
      this.flash('Pengajuan dibatalkan.');
      await this.loadStatusCutiSaya();
    },

    // ===== INIT STATE APPROVE =====
    async initApproveState() {
      const jabUpper = ((this.profile?.jabatan) || '').toUpperCase();
      // Foreman & Supervisor bisa melihat tab "Perlu Disetujui"
      this.canApprove = ['FOREMAN','SUPERVISOR'].includes(jabUpper);
      if (this.canApprove) await this.loadPendingCount();

      // Cache info atasan (dipakai untuk WA notification setelah simpan cuti)
      await this.muatAtasanInfo();
    },

    ajukanJenisWarna(j) {
      return { Izin:'blue', Sakit:'amber', Cuti:'green', Alfa:'red' }[j] || 'muted';
    },
    ajukanStatusWarna(s) {
      return { Menunggu:'amber', Disetujui:'green', Ditolak:'red' }[s] || 'muted';
    },
    ajukanFmtTgl(mulai, selesai) {
      if (!mulai) return '—';
      const f = (t) => { const [y,m,d] = t.split('-'); return d+'/'+m+'/'+y; };
      return mulai === selesai ? f(mulai) : f(mulai) + ' – ' + f(selesai);
    },
    // Jumlah hari sebuah pengajuan. Utamakan angka dari server
    // (leave_requests.jumlah_hari, dihitung hitung_hari_cuti()); pengajuan
    // lama yang belum punya angka itu dihitung dengan rumus yang sama.
    ajukanHari(r) {
      if (!r) return 0;
      if (r.jumlah_hari !== null && r.jumlah_hari !== undefined) return r.jumlah_hari;
      const nik = r.nik || (r.user_id === this.session?.user?.id ? this.nikSendiri() : '');
      return this.hitungHariKerja(nik, r.tanggal_mulai, r.tanggal_selesai);
    },

    // ===== APPROVE PANEL =====
    async loadPendingCount() {
      const { count } = await supabaseClient.from('leave_requests')
        .select('*', { count: 'exact', head: true })
        .eq('atasan_id', this.session.user.id).eq('status', 'Menunggu');
      this.pendingCount = count || 0;
    },
    async loadPendingApprovals() {
      this.approveLoading = true;
      const { data } = await supabaseClient.from('leave_requests')
        .select('*, pengaju:user_id(full_name, no_wa)')
        .eq('atasan_id', this.session.user.id).eq('status', 'Menunggu')
        .order('created_at', { ascending: false });
      this.pendingApprovals = (data || []).map(r => ({ ...r, _loading: false }));
      this.pendingCount = this.pendingApprovals.length;
      this.approveLoading = false;
    },
    bukaApprovalLink(r) {
      window.open(window.location.origin + '/approval-cuti.html?token=' + r.token, '_blank');
    },
    async quickApprove(r, action) {
      const isApprove = action === 'approve';
      const nama = r.nama || r.pengaju?.full_name || 'Karyawan';
      const tglStr = this.ajukanFmtTgl(r.tanggal_mulai, r.tanggal_selesai);

      // Catatan opsional. Batal di dialog = batal memproses.
      const catatan = prompt(
        (isApprove ? 'Setujui' : 'Tolak') + ' cuti ' + nama + ' (' + tglStr + ', ' + this.ajukanHari(r) + ' hari)?\n\n' +
        'Catatan untuk pengaju (opsional):', '');
      if (catatan === null) return;

      r._loading = true;
      const { data, error } = await supabaseClient.rpc('proses_approval_cuti', {
        p_token: r.token, p_action: action, p_catatan: catatan.trim() || null,
      });
      r._loading = false;
      if (error || !data?.ok) { this.flash(data?.pesan || error?.message || 'Gagal', true); return; }
      this.flash(data.pesan);
      this.pendingApprovals = this.pendingApprovals.filter(x => x.id !== r.id);
      this.pendingCount = this.pendingApprovals.length;

      // Beri tahu pengaju -- DISETUJUI maupun DITOLAK
      const noWa = r.pengaju?.no_wa;
      if (!noWa) {
        this.flash(data.pesan + ' Nomor WA ' + nama + ' belum diisi di profil, notifikasi tidak bisa dikirim.', true);
        return;
      }
      const pesan = this.pesanHasilApproval({
        nama, jenis: r.jenis, tglStr,
        hari: data.jumlah_hari ?? this.ajukanHari(r),
        isApprove, catatan: catatan.trim(),
      });
      if (!this.bukaWa(noWa, pesan)) {
        // Pop-up diblokir -> tampilkan tombol kirim manual
        this.notifPengaju = { nama, noWa, pesan, statusTeks: isApprove ? 'disetujui' : 'ditolak' };
      }
    },

    // Pesan WA ke pengaju setelah diproses. Formatnya sama dengan yang
    // dikirim dari approval-cuti.html.
    pesanHasilApproval({ nama, jenis, tglStr, hari, isApprove, catatan }) {
      return (isApprove ? '✅' : '❌') + ' *Pemberitahuan ' + jenis + '*\n\n' +
        'Halo ' + nama + ',\n\n' +
        'Permohonan ' + jenis + ' Anda untuk tanggal *' + tglStr + '* (' + hari + ' hari) telah *' + (isApprove ? 'DISETUJUI' : 'DITOLAK') + '*.' +
        (isApprove ? '\nCuti sudah tercatat dan memotong jatah sesuai jenisnya.' : '\nJatah cuti Anda tidak terpotong.') +
        (catatan ? '\n📝 Catatan: ' + catatan : '') +
        '\n\n_(Pesan otomatis dari Sistem Cuti)_';
    },
  };
}
</script>
