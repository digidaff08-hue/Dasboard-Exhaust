<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi & Pengajuan Cuti</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js" defer></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #263347;
      --border: #334155;
      --text: #f1f5f9;
      --sub: #94a3b8;
      --orange: #f97316;
      --orange-dim: #f9731622;
      --green: #22c55e;
      --green-dim: #22c55e22;
      --red: #ef4444;
      --red-dim: #ef444422;
      --blue: #3b82f6;
      --blue-dim: #3b82f622;
      --yellow: #eab308;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ---- SIDEBAR ---- */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform .25s;
    }
    .sidebar.hidden { transform: translateX(-220px); }
    .sb-logo {
      padding: 18px 16px 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--orange);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sb-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .sb-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px;
      font-size: 0.875rem;
      color: var(--sub);
      text-decoration: none;
      border-radius: 8px;
      margin: 2px 8px;
      transition: background .15s, color .15s;
    }
    .sb-link:hover { background: var(--surface2); color: var(--text); }
    .sb-link.active { background: var(--orange-dim); color: var(--orange); }
    .sb-ico { width: 18px; height: 18px; flex-shrink: 0; }
    .sb-footer {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }
    .sb-user {
      padding: 8px 10px;
      font-size: 0.8rem;
      color: var(--sub);
    }
    .sb-user strong { display: block; color: var(--text); font-size: 0.875rem; }

    /* ---- MAIN ---- */
    .main {
      margin-left: 220px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      position: sticky; top: 0; z-index: 90;
    }
    .topbar-title { font-weight: 700; font-size: 1rem; }
    .content { padding: 20px; max-width: 780px; margin: 0 auto; width: 100%; }

    /* ---- TABS ---- */
    .tab-bar {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 9px 12px;
      background: transparent;
      border: none; border-radius: 7px;
      color: var(--sub);
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .tab-btn.active { background: var(--orange); color: #fff; }

    /* ---- CARD ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 0.95rem; font-weight: 700;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }

    /* ---- FORM ---- */
    .form-row { margin-bottom: 14px; }
    .form-label { font-size: 0.8rem; color: var(--sub); margin-bottom: 5px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    select, input[type="date"], input[type="text"], textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color .2s;
      appearance: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--orange); }
    textarea { resize: vertical; min-height: 72px; }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .15s;
      margin-top: 4px;
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-wa {
      width: 100%;
      padding: 12px;
      background: #25d366;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .15s;
      margin-top: 10px;
    }
    .btn-wa:hover { opacity: 0.9; }

    /* ---- BADGE ---- */
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-menunggu  { background: #92400e33; color: var(--yellow); }
    .badge-disetujui { background: var(--green-dim); color: var(--green); }
    .badge-ditolak   { background: var(--red-dim); color: var(--red); }
    .badge-izin    { background: var(--blue-dim); color: var(--blue); }
    .badge-sakit   { background: #7c3aed33; color: #c084fc; }
    .badge-cuti    { background: var(--green-dim); color: var(--green); }
    .badge-alfa    { background: var(--red-dim); color: #f87171; }

    /* ---- LIST ITEM ---- */
    .req-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      background: var(--bg);
    }
    .req-item-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 8px;
      gap: 8px;
    }
    .req-item-name { font-weight: 700; font-size: 0.9rem; }
    .req-item-sub  { font-size: 0.8rem; color: var(--sub); margin-top: 2px; }
    .req-item-tgl  { font-size: 0.8rem; color: var(--sub); text-align: right; flex-shrink: 0; }
    .req-catatan   { font-size: 0.8rem; color: var(--sub); font-style: italic; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }

    /* ---- APPROVE PANEL ---- */
    .approve-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      background: var(--bg);
    }
    .approve-item-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 10px;
    }
    .approve-item-name { font-weight: 700; font-size: 0.9rem; }
    .approve-item-detail { font-size: 0.82rem; color: var(--sub); margin-top: 3px; }
    .approve-item-alasan { font-size: 0.82rem; color: var(--sub); font-style: italic; margin-top: 6px; }
    .approve-btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-small {
      flex: 1; padding: 8px;
      border: none; border-radius: 7px;
      font-size: 0.82rem; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: opacity .15s;
    }
    .btn-small:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm-approve { background: var(--green); color: #fff; }
    .btn-sm-tolak   { background: var(--red); color: #fff; }
    .btn-sm-wa      { background: #25d366; color: #fff; }

    /* ---- EMPTY & LOADING ---- */
    .empty { text-align: center; padding: 32px 0; color: var(--sub); font-size: 0.875rem; }
    .loading-bar {
      width: 100%; height: 4px; background: var(--border); border-radius: 2px;
      overflow: hidden; margin-bottom: 16px;
    }
    .loading-bar-inner {
      height: 100%; width: 40%; background: var(--orange);
      border-radius: 2px;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* ---- TOAST ---- */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid var(--border);
      padding: 12px 20px; border-radius: 10px;
      font-size: 0.875rem; font-weight: 600;
      z-index: 999;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 24px #00000055;
      animation: fadeUp .3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    .toast.green { border-color: var(--green); color: var(--green); }
    .toast.red   { border-color: var(--red);   color: var(--red); }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 680px) {
      .sidebar { transform: translateX(-220px); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .form-row-2 { grid-template-columns: 1fr; }
    }
    .hamburger {
      background: none; border: none; color: var(--text);
      cursor: pointer; padding: 4px; display: none;
    }
    @media (max-width: 680px) { .hamburger { display: block; } }
  </style>
</head>
<body x-data="app()" x-init="init()">

  <!-- Toast -->
  <template x-if="toast.show">
    <div class="toast" :class="toast.type" x-text="toast.msg"></div>
  </template>

  <!-- Sidebar -->
  <nav class="sidebar" :class="sidebarOpen ? 'open' : ''">
    <div class="sb-logo">
      <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Exhaust System
    </div>
    <div class="sb-nav">
      <a href="dashboard-exhaust.html" class="sb-link">
        <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>
      <a href="input-attendance.html" class="sb-link active">
        <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Absensi
      </a>
    </div>
    <div class="sb-footer">
      <div class="sb-user">
        <strong x-text="profile.full_name || 'Memuat...'"></strong>
        <span x-text="(profile.jabatan || profile.role || '').toUpperCase()"></span>
      </div>
      <a href="login.html" class="sb-link" style="margin-top:4px" @click.prevent="logout()">
        <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Keluar
      </a>
    </div>
  </nav>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="hamburger" @click="sidebarOpen = !sidebarOpen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">Absensi & Pengajuan Cuti</span>
    </div>

    <div class="content">
      <template x-if="loading">
        <div class="loading-bar"><div class="loading-bar-inner"></div></div>
      </template>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn" :class="tab==='ajukan' && 'active'" @click="tab='ajukan'">📋 Ajukan</button>
        <button class="tab-btn" :class="tab==='riwayat' && 'active'" @click="tab='riwayat'; loadMyRequests()">📄 Riwayat Saya</button>
        <template x-if="canApprove">
          <button class="tab-btn" :class="tab==='approve' && 'active'" @click="tab='approve'; loadPendingApprovals()">
            ✅ Perlu Disetujui
            <template x-if="pendingCount > 0">
              <span style="background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:0.72rem;margin-left:4px" x-text="pendingCount"></span>
            </template>
          </button>
        </template>
      </div>

      <!-- ===== TAB AJUKAN ===== -->
      <div x-show="tab === 'ajukan'">
        <div class="card">
          <div class="card-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Form Pengajuan
          </div>

          <!-- Jenis -->
          <div class="form-row">
            <div class="form-label">Jenis Pengajuan *</div>
            <select x-model="form.jenis">
              <option value="">-- Pilih jenis --</option>
              <option value="Izin">Izin</option>
              <option value="Sakit">Sakit</option>
              <option value="Cuti">Cuti</option>
              <template x-if="canInputAlfa">
                <option value="Alfa">Alfa (input untuk bawahan)</option>
              </template>
            </select>
          </div>

          <!-- Nama karyawan (hanya untuk Alfa) -->
          <template x-if="form.jenis === 'Alfa'">
            <div class="form-row">
              <div class="form-label">Nama Karyawan *</div>
              <select x-model="form.target_user_id">
                <option value="">-- Pilih karyawan --</option>
                <template x-for="u in bawahanList" :key="u.id">
                  <option :value="u.id" x-text="u.full_name"></option>
                </template>
              </select>
            </div>
          </template>

          <!-- Tanggal -->
          <div class="form-row-2">
            <div>
              <div class="form-label">Tanggal Mulai *</div>
              <input type="date" x-model="form.tanggal_mulai">
            </div>
            <div>
              <div class="form-label">Tanggal Selesai *</div>
              <input type="date" x-model="form.tanggal_selesai">
            </div>
          </div>

          <!-- Alasan -->
          <div class="form-row">
            <div class="form-label">Alasan / Keterangan</div>
            <textarea x-model="form.alasan" placeholder="Isi alasan jika ada..."></textarea>
          </div>

          <!-- Info atasan -->
          <template x-if="atasanInfo && form.jenis && form.jenis !== 'Alfa'">
            <div style="background:var(--blue-dim);border:1px solid var(--blue)44;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:0.82rem;color:var(--sub)">
              📬 Pengajuan akan dikirim ke: <strong x-text="atasanInfo.full_name" style="color:var(--text)"></strong>
              <template x-if="!atasanInfo.no_wa">
                <span style="color:var(--yellow)"> ⚠️ Nomor WA belum diisi</span>
              </template>
            </div>
          </template>

          <!-- Submit -->
          <button class="btn-submit" :disabled="submitting" @click="submitAjukan()">
            <template x-if="submitting">
              <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="10" opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"/></svg>
            </template>
            <span x-text="submitting ? 'Menyimpan...' : 'Kirim Pengajuan'"></span>
          </button>

          <!-- WA preview setelah submit -->
          <template x-if="waPesan">
            <div style="margin-top:14px">
              <div style="font-size:0.8rem;color:var(--sub);margin-bottom:6px">📱 Tekan tombol di bawah untuk kirim notifikasi ke atasan via WhatsApp:</div>
              <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:0.82rem;color:var(--sub);white-space:pre-wrap;margin-bottom:8px" x-text="waPesan"></div>
              <button class="btn-wa" @click="sendWA()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 0C5.373 0 0 5.373 0 12.004c0 2.117.554 4.102 1.524 5.831L.054 23.5l5.818-1.528A11.95 11.95 0 0012.004 24C18.627 24 24 18.627 24 12.004 24 5.373 18.627 0 12.004 0zm0 21.818a9.81 9.81 0 01-5.001-1.366l-.359-.213-3.723.977.993-3.63-.234-.374A9.817 9.817 0 012.18 12.004c0-5.422 4.411-9.832 9.824-9.832 5.414 0 9.823 4.41 9.823 9.832 0 5.422-4.409 9.814-9.823 9.814z"/></svg>
                Kirim WA ke Atasan
              </button>
            </div>
          </template>
        </div>
      </div>

      <!-- ===== TAB RIWAYAT ===== -->
      <div x-show="tab === 'riwayat'">
        <div class="card">
          <div class="card-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Riwayat Pengajuan Saya
          </div>

          <template x-if="loadingRequests">
            <div class="loading-bar"><div class="loading-bar-inner"></div></div>
          </template>

          <template x-if="!loadingRequests && myRequests.length === 0">
            <div class="empty">Belum ada pengajuan</div>
          </template>

          <template x-for="r in myRequests" :key="r.id">
            <div class="req-item">
              <div class="req-item-header">
                <div>
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                    <span class="badge" :class="'badge-'+r.jenis.toLowerCase()" x-text="r.jenis"></span>
                    <span class="badge" :class="'badge-'+r.status.toLowerCase()" x-text="r.status"></span>
                  </div>
                  <div class="req-item-sub" x-text="fmtTgl(r.tanggal_mulai, r.tanggal_selesai) + ' · ' + hitungHari(r.tanggal_mulai, r.tanggal_selesai) + ' hari'"></div>
                </div>
                <div class="req-item-tgl" x-text="fmtDatetime(r.created_at)"></div>
              </div>
              <template x-if="r.alasan">
                <div class="req-catatan" x-text="'Alasan: ' + r.alasan"></div>
              </template>
              <template x-if="r.catatan_atasan">
                <div class="req-catatan" x-text="'Catatan atasan: ' + r.catatan_atasan"></div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- ===== TAB APPROVE ===== -->
      <div x-show="tab === 'approve'" x-cloak>
        <div class="card">
          <div class="card-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Pengajuan Perlu Disetujui
          </div>

          <template x-if="loadingApprovals">
            <div class="loading-bar"><div class="loading-bar-inner"></div></div>
          </template>

          <template x-if="!loadingApprovals && pendingApprovals.length === 0">
            <div class="empty">Tidak ada pengajuan yang menunggu persetujuan Anda</div>
          </template>

          <template x-for="r in pendingApprovals" :key="r.id">
            <div class="approve-item">
              <div class="approve-item-top">
                <div>
                  <div class="approve-item-name" x-text="r.pengaju?.full_name || '—'"></div>
                  <div class="approve-item-detail">
                    <span class="badge" :class="'badge-'+r.jenis.toLowerCase()" x-text="r.jenis"></span>
                    &nbsp;<span x-text="fmtTgl(r.tanggal_mulai, r.tanggal_selesai)"></span>
                    &nbsp;(<span x-text="hitungHari(r.tanggal_mulai, r.tanggal_selesai)"></span> hari)
                  </div>
                </div>
                <div class="req-item-tgl" x-text="fmtDatetime(r.created_at)"></div>
              </div>
              <template x-if="r.alasan">
                <div class="approve-item-alasan" x-text="'Alasan: ' + r.alasan"></div>
              </template>

              <!-- Approve via link WA (buka approval-cuti.html) -->
              <div class="approve-btn-row">
                <button class="btn-small btn-sm-wa" @click="openApprovalLink(r)">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 0C5.373 0 0 5.373 0 12.004c0 2.117.554 4.102 1.524 5.831L.054 23.5l5.818-1.528A11.95 11.95 0 0012.004 24C18.627 24 24 18.627 24 12.004 24 5.373 18.627 0 12.004 0zm0 21.818a9.81 9.81 0 01-5.001-1.366l-.359-.213-3.723.977.993-3.63-.234-.374A9.817 9.817 0 012.18 12.004c0-5.422 4.411-9.832 9.824-9.832 5.414 0 9.823 4.41 9.823 9.832 0 5.422-4.409 9.814-9.823 9.814z"/></svg>
                  Buka via WA / Link
                </button>
                <button class="btn-small btn-sm-tolak" :disabled="r._loading" @click="quickAction(r, 'tolak')">
                  ✕ Tolak
                </button>
                <button class="btn-small btn-sm-approve" :disabled="r._loading" @click="quickAction(r, 'approve')">
                  ✓ Setujui
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>

    </div><!-- /content -->
  </div><!-- /main -->

<script>
const SUPABASE_URL = "https://ugrbunhudqhycgjlkwha.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6TV-ESdlX9EQ5HdrEFPIyg_as3XTP_c";
// URL hosting approval-cuti.html (sesuaikan dengan URL deploy kamu)
const APPROVAL_BASE_URL = window.location.origin + '/approval-cuti.html';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function app() {
  return {
    // --- state ---
    loading: true,
    sidebarOpen: false,
    tab: 'ajukan',
    profile: {},
    session: null,
    canApprove: false,    // foreman atau supervisor (bisa approve)
    canInputAlfa: false,  // leader, foreman, supervisor
    atasanInfo: null,
    bawahanList: [],

    // form
    form: { jenis: '', tanggal_mulai: '', tanggal_selesai: '', alasan: '', target_user_id: '' },
    submitting: false,
    waPesan: null,
    waTarget: null,

    // riwayat
    myRequests: [],
    loadingRequests: false,

    // approve
    pendingApprovals: [],
    pendingCount: 0,
    loadingApprovals: false,

    // toast
    toast: { show: false, msg: '', type: '' },

    // --- init ---
    async init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      this.session = session;

      const { data: prof } = await sb
        .from('profiles')
        .select('full_name, role, jabatan, no_wa')
        .eq('id', session.user.id)
        .maybeSingle();

      this.profile = prof || {};
      this.loading = false;

      const jabUpper = (prof?.jabatan || '').toUpperCase();
      const role     = (prof?.role || '').toLowerCase();

      // Guest tidak boleh di sini
      if (role === 'guest') { window.location.href = 'dashboard-exhaust.html'; return; }

      // Siapa yang bisa approve (foreman = approve operator/leader, supervisor = approve foreman)
      this.canApprove = ['FOREMAN','SUPERVISOR'].includes(jabUpper);

      // Siapa yang bisa input Alfa
      this.canInputAlfa = ['FOREMAN','SUPERVISOR','LEADER'].includes(jabUpper);

      // Cari atasan untuk notifikasi WA
      await this.loadAtasan();

      // Jika bisa approve, hitung pending
      if (this.canApprove) await this.loadPendingCount();

      // Jika input Alfa, load bawahan list
      if (this.canInputAlfa) await this.loadBawahan();
    },

    async loadAtasan() {
      const { data } = await sb.rpc('get_atasan_id', { p_user_id: this.session.user.id });
      if (!data) { this.atasanInfo = null; return; }
      const { data: prof } = await sb
        .from('profiles').select('id, full_name, no_wa').eq('id', data).maybeSingle();
      this.atasanInfo = prof || null;
    },

    async loadBawahan() {
      const jabUpper = (this.profile.jabatan || '').toUpperCase();
      let targetJab = [];
      if (jabUpper === 'FOREMAN')    targetJab = ['LEADER','OPERATOR','operator'];
      if (jabUpper === 'SUPERVISOR') targetJab = ['LEADER','OPERATOR','operator','FOREMAN'];

      const { data } = await sb
        .from('profiles')
        .select('id, full_name, jabatan')
        .in('jabatan', targetJab);
      this.bawahanList = data || [];
    },

    async loadPendingCount() {
      const { count } = await sb
        .from('leave_requests')
        .select('*', { count: 'exact', head: true })
        .eq('atasan_id', this.session.user.id)
        .eq('status', 'Menunggu');
      this.pendingCount = count || 0;
    },

    // --- submit pengajuan ---
    async submitAjukan() {
      if (!this.form.jenis) { this.showToast('Pilih jenis pengajuan', 'red'); return; }
      if (!this.form.tanggal_mulai || !this.form.tanggal_selesai) {
        this.showToast('Isi tanggal mulai dan selesai', 'red'); return;
      }
      if (this.form.tanggal_selesai < this.form.tanggal_mulai) {
        this.showToast('Tanggal selesai tidak boleh sebelum mulai', 'red'); return;
      }
      if (this.form.jenis === 'Alfa' && !this.form.target_user_id) {
        this.showToast('Pilih nama karyawan untuk Alfa', 'red'); return;
      }

      this.submitting = true;
      this.waPesan = null;

      const userId = this.form.jenis === 'Alfa'
        ? this.form.target_user_id
        : this.session.user.id;

      // Cari atasan untuk user yang diajukan
      const { data: atasanId } = await sb.rpc('get_atasan_id', { p_user_id: userId });

      const { data, error } = await sb.from('leave_requests').insert({
        user_id:        userId,
        jenis:          this.form.jenis,
        tanggal_mulai:  this.form.tanggal_mulai,
        tanggal_selesai:this.form.tanggal_selesai,
        alasan:         this.form.alasan || null,
        atasan_id:      atasanId || null
      }).select('token').single();

      this.submitting = false;

      if (error) {
        this.showToast('Gagal menyimpan: ' + error.message, 'red');
        return;
      }

      // Siapkan pesan WA untuk atasan
      if (atasanId) {
        const { data: atasanProf } = await sb
          .from('profiles').select('full_name, no_wa').eq('id', atasanId).maybeSingle();

        if (atasanProf?.no_wa) {
          const nama = this.profile.full_name || 'Karyawan';
          const jenis = this.form.jenis;
          const tglStr = this.form.tanggal_mulai === this.form.tanggal_selesai
            ? this.fmtDate(this.form.tanggal_mulai)
            : this.fmtDate(this.form.tanggal_mulai) + ' s/d ' + this.fmtDate(this.form.tanggal_selesai);
          const hari = this.hitungHari(this.form.tanggal_mulai, this.form.tanggal_selesai);
          const alasan = this.form.alasan ? '\n📝 Alasan: ' + this.form.alasan : '';
          const approvalLink = APPROVAL_BASE_URL + '?token=' + data.token;

          this.waPesan =
            `📋 *Pengajuan ${jenis} Baru*\n\n` +
            `Dari: *${nama}*\n` +
            `Tanggal: *${tglStr}* (${hari} hari)` + alasan + '\n\n' +
            `Klik link berikut untuk menyetujui atau menolak:\n${approvalLink}`;
          this.waTarget = atasanProf.no_wa;
        }
      }

      // Reset form
      this.form = { jenis: '', tanggal_mulai: '', tanggal_selesai: '', alasan: '', target_user_id: '' };
      this.showToast('Pengajuan berhasil disimpan!', 'green');
    },

    sendWA() {
      if (!this.waTarget || !this.waPesan) return;
      const no = this.waTarget.replace(/\D/g, '');
      window.open('https://wa.me/' + no + '?text=' + encodeURIComponent(this.waPesan), '_blank');
    },

    // --- riwayat ---
    async loadMyRequests() {
      this.loadingRequests = true;
      const { data } = await sb
        .from('leave_requests')
        .select('*')
        .eq('user_id', this.session.user.id)
        .order('created_at', { ascending: false })
        .limit(50);
      this.myRequests = data || [];
      this.loadingRequests = false;
    },

    // --- approve panel ---
    async loadPendingApprovals() {
      this.loadingApprovals = true;
      const { data } = await sb
        .from('leave_requests')
        .select('*, pengaju:user_id(full_name, no_wa)')
        .eq('atasan_id', this.session.user.id)
        .eq('status', 'Menunggu')
        .order('created_at', { ascending: false });
      this.pendingApprovals = (data || []).map(r => ({ ...r, _loading: false }));
      this.pendingCount = this.pendingApprovals.length;
      this.loadingApprovals = false;
    },

    openApprovalLink(r) {
      window.open(APPROVAL_BASE_URL + '?token=' + r.token, '_blank');
    },

    async quickAction(r, action) {
      r._loading = true;
      const { data, error } = await sb.rpc('proses_approval_cuti', {
        p_token:  r.token,
        p_action: action,
        p_catatan: null
      });
      r._loading = false;

      if (error || !data?.ok) {
        this.showToast(data?.pesan || error?.message || 'Gagal', 'red');
        return;
      }

      this.showToast(data.pesan, 'green');

      // Hapus dari list
      this.pendingApprovals = this.pendingApprovals.filter(x => x.id !== r.id);
      this.pendingCount = this.pendingApprovals.length;

      // Kirim WA balik ke pengaju jika disetujui
      if (action === 'approve' && r.pengaju?.no_wa) {
        const nama  = r.pengaju.full_name || 'Karyawan';
        const tglStr = r.tanggal_mulai === r.tanggal_selesai
          ? this.fmtDate(r.tanggal_mulai)
          : this.fmtDate(r.tanggal_mulai) + ' s/d ' + this.fmtDate(r.tanggal_selesai);
        const pesan =
          `✅ *${r.jenis} Disetujui*\n\nHalo ${nama},\nPermohonan ${r.jenis} Anda untuk tanggal *${tglStr}* telah *DISETUJUI*.\n_(Pesan otomatis)_`;
        const no = r.pengaju.no_wa.replace(/\D/g, '');
        window.open('https://wa.me/' + no + '?text=' + encodeURIComponent(pesan), '_blank');
      }
    },

    // --- helpers ---
    fmtDate(d) {
      if (!d) return '—';
      return new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
    },
    fmtTgl(mulai, selesai) {
      if (mulai === selesai) return this.fmtDate(mulai);
      return this.fmtDate(mulai) + ' – ' + this.fmtDate(selesai);
    },
    fmtDatetime(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    },
    hitungHari(mulai, selesai) {
      return Math.round((new Date(selesai) - new Date(mulai)) / 86400000) + 1;
    },
    showToast(msg, type = 'green') {
      this.toast = { show: true, msg, type };
      setTimeout(() => { this.toast.show = false; }, 3000);
    },
    async logout() {
      await sb.auth.signOut();
      window.location.href = 'login.html';
    }
  };
}
</script>

<style>
  [x-cloak] { display: none !important; }
  .spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
